<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ZYLO</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button{
  border:0;
  background:none;
  color:#fff;
  cursor:pointer;
}

/* =========================
   APP
========================= */

#app{
  width:100%;
  height:100dvh;
  position:relative;
  background:#000;
  overflow:hidden;
}

/* =========================
   TOP BAR
========================= */

.top-bar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:82px;
  z-index:100;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding-bottom:16px;
  pointer-events:none;
}

.top-tabs{
  display:flex;
  align-items:center;
  gap:42px;
  font-size:22px;
  font-weight:500;
  height:48px;
}

.top-tab{
  position:relative;
  color:#bdbdbd;
  padding:8px 0;
  pointer-events:auto;
}

.top-tab.active{
  color:#fff;
  font-weight:700;
}

.top-tab.active::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-8px;
  height:4px;
  border-radius:3px;
  background:#fff;
}

.search-button{
  position:absolute;
  right:20px;
  bottom:14px;
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(30,30,30,.85);
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:auto;
}

.search-icon{
  width:25px;
  height:25px;
  border:3px solid #fff;
  border-radius:50%;
  position:relative;
}

.search-icon::after{
  content:"";
  position:absolute;
  width:11px;
  height:3px;
  background:#fff;
  right:-8px;
  bottom:-5px;
  transform:rotate(48deg);
  border-radius:3px;
}

/* =========================
   VIDEO FEED
========================= */

.video-feed{
  position:absolute;
  inset:0;
  overflow-y:auto;
  overflow-x:hidden;
  scroll-snap-type:y mandatory;
  scrollbar-width:none;
}

.video-feed::-webkit-scrollbar{
  display:none;
}

.video-card{
  width:100%;
  height:100dvh;
  position:relative;
  scroll-snap-align:start;
  overflow:hidden;
  background:#000;
}

/* VIDEO */

.video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

/* Dark gradient */

.video-card::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.15) 0%,
      transparent 35%,
      transparent 55%,
      rgba(0,0,0,.25) 72%,
      rgba(0,0,0,.9) 100%
    );
}

/* =========================
   RIGHT ACTIONS
========================= */

.actions{
  position:absolute;
  z-index:20;
  right:16px;
  bottom:142px;

  width:72px;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:20px;
}

/* each action */

.action{
  width:64px;
  min-height:66px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  color:#fff;
  text-shadow:0 1px 5px rgba(0,0,0,.7);
}

.action-icon{
  width:48px;
  height:48px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:42px;
  line-height:1;

  transition:
    transform .15s ease,
    color .15s ease;
}

.action:active .action-icon{
  transform:scale(.82);
}

.action-count{
  margin-top:4px;
  font-size:14px;
  font-weight:600;
}

.action-label{
  margin-top:5px;
  font-size:14px;
  font-weight:500;
}

/* PROFILE */

.profile-action{
  margin-bottom:2px;
}

.avatar{
  width:58px;
  height:58px;
  border-radius:50%;

  border:2px solid #fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:32px;

  background:#222;

  position:relative;
}

.follow-plus{
  position:absolute;

  width:25px;
  height:25px;

  right:-4px;
  bottom:-7px;

  border-radius:50%;

  background:#fe2c55;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:22px;
  font-weight:bold;

  border:2px solid #000;
}

/* LIKE */

.like-icon{
  font-size:48px;
}

.like-icon.active{
  color:#fe2c55;
}

/* COMMENT */

.comment-icon{
  width:47px;
  height:39px;

  border:4px solid #fff;
  border-radius:50%;

  position:relative;

  font-size:0;
}

.comment-icon::after{
  content:"";
  position:absolute;

  left:5px;
  bottom:-10px;

  width:15px;
  height:15px;

  background:#fff;

  clip-path:polygon(0 0,100% 0,0 100%);
}

/* SAVE */

.save-icon{
  width:34px;
  height:43px;

  border:3px solid #fff;
  border-bottom:0;

  position:relative;

  border-radius:3px 3px 0 0;
}

.save-icon::after{
  content:"";

  position:absolute;

  left:2px;
  right:2px;
  bottom:-10px;

  height:18px;

  background:#fff;

  clip-path:polygon(
    0 0,
    100% 0,
    100% 100%,
    50% 62%,
    0 100%
  );
}

.save-icon.active{
  background:#fff;
}

.save-icon.active::after{
  background:#fff;
}

/* SHARE */

.share-icon{
  position:relative;
  width:46px;
  height:44px;
}

.share-icon::before{
  content:"";

  position:absolute;

  width:34px;
  height:25px;

  right:1px;
  top:5px;

  background:#fff;

  clip-path:polygon(
    0 45%,
    100% 0,
    70% 100%,
    52% 58%,
    0 45%
  );
}

/* MUSIC */

.music-disc{
  width:68px;
  height:68px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #050505 0 30%,
      #303030 31% 34%,
      #111 35% 55%,
      #303030 56% 58%,
      #111 59%
    );

  border:3px solid #333;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:0 0 0 2px rgba(255,255,255,.05);

  animation:spin 5s linear infinite;
}

.music-note{
  font-size:29px;
}

@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

/* =========================
   VIDEO INFO
========================= */

.video-info{
  position:absolute;
  z-index:15;

  left:28px;
  right:100px;

  bottom:112px;

  text-shadow:0 2px 5px rgba(0,0,0,.8);
}

.username{
  font-size:21px;
  font-weight:700;
  margin-bottom:12px;
}

.verified{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  width:18px;
  height:18px;

  margin-left:4px;

  background:#20c7ed;
  color:#fff;

  border-radius:50%;

  font-size:12px;
  text-shadow:none;
}

.caption{
  font-size:18px;
  line-height:1.45;
  margin-bottom:7px;
}

.hashtags{
  color:#fff;
  font-size:17px;
  line-height:1.4;
  margin-bottom:10px;
}

.sound-row{
  display:flex;
  align-items:center;
  gap:8px;

  font-size:16px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.sound-note{
  font-size:20px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  z-index:100;

  left:0;
  right:0;
  bottom:0;

  height:82px;

  background:#000;

  border-top:1px solid #222;

  display:flex;
  align-items:center;
  justify-content:space-around;
}

.nav-item{
  width:20%;
  height:75px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:5px;

  font-size:13px;
}

.nav-icon{
  width:30px;
  height:30px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:28px;
}

.nav-label{
  font-size:13px;
}

.nav-item.active{
  font-weight:700;
}

/* CREATE BUTTON */

.create-button{
  width:72px;
  height:48px;

  border-radius:13px;

  background:#fff;
  color:#000;

  position:relative;

  font-size:34px;
  font-weight:300;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
    -5px 0 0 #19e8e8,
    5px 0 0 #fe2c55;
}

.create-button:active{
  transform:scale(.94);
}

/* =========================
   CREATE SCREEN
========================= */

.create-screen{
  position:fixed;
  z-index:500;

  inset:0;

  background:#000;

  display:none;

  overflow-y:auto;
}

.create-screen.open{
  display:block;
}

.create-header{
  height:80px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-bottom:1px solid #222;

  position:sticky;
  top:0;

  background:#000;

  z-index:10;
}

.create-header h2{
  font-size:26px;
}

.close-button{
  position:absolute;
  left:20px;

  width:52px;
  height:52px;

  border-radius:50%;

  background:#222;

  font-size:34px;
}

.editor{
  padding:18px 18px 40px;
}

.preview-box{
  width:100%;
  height:380px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#111;

  border-radius:14px;

  overflow:hidden;
}

.preview-video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

.input-box{
  width:100%;

  margin-top:16px;

  padding:16px;

  border-radius:14px;

  background:#1b1b1b;

  color:#fff;

  border:1px solid #282828;

  font-size:18px;
}

textarea.input-box{
  height:150px;
  resize:none;
}

.post-row{
  display:flex;
  gap:12px;

  margin-top:18px;
}

.draft-btn,
.post-btn{
  flex:1;

  height:56px;

  border-radius:13px;

  font-size:18px;
  font-weight:700;
}

.draft-btn{
  background:#2b2b2b;
}

.post-btn{
  background:#fe2c55;
}

.post-btn:disabled{
  opacity:.5;
}

.upload-status{
  text-align:center;
  margin-top:15px;
  color:#aaa;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .top-bar{
    height:75px;
  }

  .top-tabs{
    gap:30px;
    font-size:20px;
  }

  .search-button{
    right:14px;
    width:50px;
    height:50px;
  }

  .actions{
    right:9px;
    bottom:145px;
    gap:14px;
  }

  .action{
    width:60px;
    min-height:62px;
  }

  .action-icon{
    width:45px;
    height:45px;
  }

  .avatar{
    width:56px;
    height:56px;
  }

  .video-info{
    left:28px;
    right:92px;
    bottom:108px;
  }

  .username{
    font-size:20px;
  }

  .caption{
    font-size:17px;
  }

  .hashtags{
    font-size:16px;
  }

  .sound-row{
    font-size:15px;
  }

  .music-disc{
    width:62px;
    height:62px;
  }

  .bottom-nav{
    height:78px;
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- TOP -->
  <header class="top-bar">

    <div class="top-tabs">

      <button class="top-tab">
        LIVE
      </button>

      <button class="top-tab">
        Following
      </button>

      <button class="top-tab active">
        For You
      </button>

    </div>

    <button class="search-button" onclick="searchVideos()">
      <span class="search-icon"></span>
    </button>

  </header>


  <!-- FEED -->
  <main class="video-feed" id="videoFeed">

    <section class="video-card">

      <!-- VIDEO -->
      <video
        class="video"
        src="uploads/video1.mp4"
        loop
        muted
        playsinline
        preload="metadata"
      ></video>


      <!-- RIGHT ACTIONS -->
      <div class="actions">

        <!-- PROFILE -->
        <button class="action profile-action"
                onclick="followCreator(this)">

          <div class="avatar">
            Z

            <span class="follow-plus">+</span>
          </div>

          <span class="action-label follow-text">
            Follow
          </span>

        </button>


        <!-- LIKE -->
        <button class="action"
                onclick="likeVideo(this)">

          <div class="action-icon like-icon">
            ♡
          </div>

          <span class="action-count like-count">
            0
          </span>

        </button>


        <!-- COMMENT -->
        <button class="action"
                onclick="openComments()">

          <div class="comment-icon"></div>

          <span class="action-count">
            0
          </span>

        </button>


        <!-- SAVE -->
        <button class="action"
                onclick="saveVideo(this)">

          <div class="action-icon">
            <span class="save-icon"></span>
          </div>

          <span class="action-label save-text">
            Save
          </span>

        </button>


        <!-- SHARE -->
        <button class="action"
                onclick="shareVideo()">

          <div class="action-icon">
            <span class="share-icon"></span>
          </div>

          <span class="action-label">
            Share
          </span>

        </button>


        <!-- MUSIC -->
        <button class="action"
                onclick="toggleMusic(this)">

          <div class="music-disc">
            <span class="music-note">
              ♪
            </span>
          </div>

        </button>

      </div>


      <!-- VIDEO INFO -->
      <div class="video-info">

        <div class="username">
          @zylo_creator

          <span class="verified">
            ✓
          </span>
        </div>

        <div class="caption">
          Welcome to ZYLO 🌎
          <br>
          Create • Connect • Grow
        </div>

        <div class="hashtags">
          #ZYLO #Create #Connect #Grow #ForYou
        </div>

        <div class="sound-row">

          <span class="sound-note">
            ♪
          </span>

          <span>
            Original sound - ZYLO
          </span>

        </div>

      </div>

    </section>

  </main>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <button class="nav-item active"
            onclick="goHome()">

      <div class="nav-icon">
        🏠
      </div>

      <div class="nav-label">
        Home
      </div>

    </button>


    <button class="nav-item"
            onclick="openDiscover()">

      <div class="nav-icon">
        🔍
      </div>

      <div class="nav-label">
        Discover
      </div>

    </button>


    <button class="nav-item"
            onclick="openCreate()">

      <div class="create-button">
        +
      </div>

    </button>


    <button class="nav-item"
            onclick="openInbox()">

      <div class="nav-icon">
        💬
      </div>

      <div class="nav-label">
        Inbox
      </div>

    </button>


    <button class="nav-item"
            onclick="openProfile()">

      <div class="nav-icon">
        👤
      </div>

      <div class="nav-label">
        Profile
      </div>

    </button>

  </nav>


  <!-- CREATE -->
  <section class="create-screen" id="createScreen">

    <div class="create-header">

      <button class="close-button"
              onclick="closeCreate()">
        ×
      </button>

      <h2>
        Create
      </h2>

    </div>


    <div class="editor">

      <div class="preview-box">

        <video
          id="previewVideo"
          class="preview-video"
          controls
          playsinline
        ></video>

      </div>


      <textarea
        id="captionInput"
        class="input-box"
        maxlength="2200"
        placeholder="Write a caption..."
      ></textarea>


      <input
        id="hashtagInput"
        class="input-box"
        placeholder="Add hashtags #ZYLO #ForYou"
      >


      <select
        id="privacyInput"
        class="input-box">

        <option value="public">
          Everyone
        </option>

        <option value="friends">
          Friends
        </option>

        <option value="private">
          Only me
        </option>

      </select>


      <div class="post-row">

        <button
          class="draft-btn"
          onclick="saveDraft()">
          Draft
        </button>

        <button
          id="postButton"
          class="post-btn"
          onclick="postVideo()"
          disabled>
          Post
        </button>

      </div>


      <div
        id="uploadStatus"
        class="upload-status">
      </div>

    </div>

  </section>


  <!-- HIDDEN INPUT -->
  <input
    type="file"
    id="videoInput"
    accept="video/*"
    style="display:none"
  >

</div>


<script>

const BACKEND_URL =
  "https://zylo-backend-ec5c.onrender.com";

let selectedVideo = null;


/* =========================
   VIDEO AUTOPLAY
========================= */

const videos =
  document.querySelectorAll(".video");

const observer =
  new IntersectionObserver(
    entries => {

      entries.forEach(entry => {

        const video = entry.target;

        if(entry.isIntersecting){

          video.play().catch(() => {});

        }else{

          video.pause();

        }

      });

    },
    {
      threshold:.65
    }
  );


videos.forEach(video => {

  observer.observe(video);

});


/* =========================
   LIKE
========================= */

function likeVideo(button){

  const icon =
    button.querySelector(".like-icon");

  const count =
    button.querySelector(".like-count");

  let number =
    Number(count.textContent);

  if(icon.classList.contains("active")){

    icon.classList.remove("active");

    icon.textContent = "♡";

    number--;

  }else{

    icon.classList.add("active");

    icon.textContent = "♥";

    number++;

  }

  count.textContent = number;

}


/* =========================
   SAVE
========================= */

function saveVideo(button){

  const icon =
    button.querySelector(".save-icon");

  const text =
    button.querySelector(".save-text");

  if(icon.classList.contains("active")){

    icon.classList.remove("active");

    text.textContent = "Save";

  }else{

    icon.classList.add("active");

    text.textContent = "Saved";

  }

}


/* =========================
   FOLLOW
========================= */

function followCreator(button){

  const plus =
    button.querySelector(".follow-plus");

  const text =
    button.querySelector(".follow-text");

  if(text.textContent === "Follow"){

    text.textContent = "Following";

    plus.textContent = "✓";

  }else{

    text.textContent = "Follow";

    plus.textContent = "+";

  }

}


/* =========================
   SHARE
========================= */

async function shareVideo(){

  if(navigator.share){

    try{

      await navigator.share({
        title:"ZYLO",
        text:"Check out this video on ZYLO"
      });

    }catch(error){}

  }else{

    alert("Share feature coming soon");

  }

}


/* =========================
   COMMENTS
========================= */

function openComments(){

  alert("Comments will be available soon.");

}


/* =========================
   MUSIC
========================= */

function toggleMusic(){

  alert("Sound options coming soon.");

}


/* =========================
   SEARCH
========================= */

function searchVideos(){

  alert("ZYLO Search coming soon.");

}


/* =========================
   CREATE
========================= */

function openCreate(){

  document
    .getElementById("createScreen")
    .classList.add("open");

}


function closeCreate(){

  document
    .getElementById("createScreen")
    .classList.remove("open");

}


/* =========================
   SELECT VIDEO
========================= */

function openGallery(){

  document
    .getElementById("videoInput")
    .click();

}


document
  .getElementById("videoInput")
  .addEventListener(
    "change",
    function(){

      const file =
        this.files[0];

      if(!file) return;

      if(!file.type.startsWith("video/")){

        alert("শুধু ভিডিও নির্বাচন করুন");

        return;

      }

      selectedVideo = file;

      const preview =
        document.getElementById("previewVideo");

      preview.src =
        URL.createObjectURL(file);

      preview.load();

      document
        .getElementById("postButton")
        .disabled = false;

      document
        .getElementById("uploadStatus")
        .textContent =
        "ভিডিও পোস্ট করার জন্য প্রস্তুত";

    }
  );


/* =========================
   POST VIDEO
========================= */

async function postVideo(){

  if(!selectedVideo){

    alert("প্রথমে একটি ভিডিও নির্বাচন করুন");

    return;

  }

  const button =
    document.getElementById("postButton");

  const status =
    document.getElementById("uploadStatus");

  const caption =
    document
      .getElementById("captionInput")
      .value
      .trim();

  const hashtags =
    document
      .getElementById("hashtagInput")
      .value
      .trim();

  const privacy =
    document
      .getElementById("privacyInput")
      .value;


  button.disabled = true;

  status.textContent =
    "ভিডিও আপলোড হচ্ছে...";


  try{

    const formData =
      new FormData();

    formData.append(
      "video",
      selectedVideo
    );

    formData.append(
      "caption",
      caption
    );

    formData.append(
      "hashtags",
      hashtags
    );

    formData.append(
      "privacy",
      privacy
    );


    const controller =
      new AbortController();

    const timeout =
      setTimeout(
        () => controller.abort(),
        120000
      );


    const response =
      await fetch(
        BACKEND_URL + "/api/upload",
        {
          method:"POST",
          body:formData,
          signal:controller.signal
        }
      );


    clearTimeout(timeout);


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.message ||
        "Upload failed"
      );

    }


    status.textContent =
      "ভিডিও সফলভাবে পোস্ট হয়েছে!";


    /* ADD TO FEED */

    addVideoToFeed(
      data.video.url,
      caption,
      hashtags
    );


    localStorage.setItem(
      "zyloLastVideo",
      JSON.stringify({
        url:data.video.url,
        caption:caption,
        hashtags:hashtags
      })
    );


    setTimeout(
      () => {

        closeCreate();

        button.disabled = false;

        selectedVideo = null;

        document
          .getElementById("videoInput")
          .value = "";

      },
      800
    );


  }catch(error){

    if(error.name === "AbortError"){

      status.textContent =
        "আপলোডে বেশি সময় লাগছে। আবার চেষ্টা করুন।";

    }else{

      status.textContent =
        "আপলোড ব্যর্থ: " +
        error.message;

    }

    button.disabled = false;

  }

}


/* =========================
   ADD VIDEO TO FEED
========================= */

function addVideoToFeed(
  url,
  caption,
  hashtags
){

  const feed =
    document.getElementById("videoFeed");


  const card =
    document.createElement("section");

  card.className =
    "video-card";


  const video =
    document.createElement("video");

  video.className =
    "video";

  video.src =
    url;

  video.loop = true;

  video.muted = true;

  video.playsInline = true;

  video.preload = "metadata";


  card.appendChild(video);


  card.insertAdjacentHTML(
    "beforeend",
    `

    <div class="actions">

      <button class="action profile-action">

        <div class="avatar">
          Z
          <span class="follow-plus">+</span>
        </div>

        <span class="action-label follow-text">
          Follow
        </span>

      </button>


      <button class="action"
              onclick="likeVideo(this)">

        <div class="action-icon like-icon">
          ♡
        </div>

        <span class="action-count like-count">
          0
        </span>

      </button>


      <button class="action"
              onclick="openComments()">

        <div class="comment-icon"></div>

        <span class="action-count">
          0
        </span>

      </button>


      <button class="action"
              onclick="saveVideo(this)">

        <div class="action-icon">
          <span class="save-icon"></span>
        </div>

        <span class="action-label save-text">
          Save
        </span>

      </button>


      <button class="action"
              onclick="shareVideo()">

        <div class="action-icon">
          <span class="share-icon"></span>
        </div>

        <span class="action-label">
          Share
        </span>

      </button>


      <button class="action">

        <div class="music-disc">
          <span class="music-note">
            ♪
          </span>
        </div>

      </button>

    </div>


    <div class="video-info">

      <div class="username">
        @zylo_creator
        <span class="verified">✓</span>
      </div>

      <div class="caption">
        ${escapeHTML(caption || "Welcome to ZYLO 🌎")}
      </div>

      <div class="hashtags">
        ${escapeHTML(
          hashtags ||
          "#ZYLO #Create #Connect #Grow #ForYou"
        )}
      </div>

      <div class="sound-row">

        <span class="sound-note">
          ♪
        </span>

        <span>
          Original sound - ZYLO
        </span>

      </div>

    </div>

    `
  );


  feed.prepend(card);


  observer.observe(video);


  video.play().catch(() => {});


  feed.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   SECURITY
========================= */

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/* =========================
   DRAFT
========================= */

function saveDraft(){

  const caption =
    document
      .getElementById("captionInput")
      .value;

  localStorage.setItem(
    "zyloDraft",
    caption
  );

  alert("Draft saved");

}

/* =========================
   LOAD SAVED VIDEO
========================= */

window.addEventListener(
  "load",
  () => {

    const saved =
      localStorage.getItem(
        "zyloLastVideo"
      );

    if(!saved) return;

    try{

      const data =
        JSON.parse(saved);

      if(data.url){

        addVideoToFeed(
          data.url,
          data.caption || "",
          data.hashtags || ""
        );

      }

    }catch(error){}

  }
);

</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>ZYLO</title>

  <link rel="stylesheet" href="style.css" />

  <style>
    /* =========================
       CREATE SCREEN
    ========================= */

    .create-screen {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: none;
      flex-direction: column;
      background: #000;
      color: #fff;
    }

    .create-screen.show {
      display: flex;
    }

    .create-header {
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }

    .create-header h2 {
      font-size: 19px;
      margin: 0;
    }

    .create-close {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: #222;
      color: #fff;
      font-size: 27px;
      cursor: pointer;
    }

    .create-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .create-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      max-width: 500px;
      margin: 25px auto;
    }

    .create-option {
      min-height: 145px;
      border: 1px solid #333;
      border-radius: 16px;
      background: #151515;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .create-option:active {
      transform: scale(.97);
    }

    .create-option-icon {
      font-size: 42px;
    }

    .camera-area {
      display: none;
      max-width: 500px;
      margin: 0 auto;
    }

    .camera-area.show {
      display: block;
    }

    #cameraPreview {
      width: 100%;
      height: 58vh;
      object-fit: cover;
      border-radius: 16px;
      background: #111;
    }

    .camera-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      margin-top: 18px;
    }

    .record-button {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 6px solid #fff;
      background: #fe2c55;
      cursor: pointer;
    }

    .record-button.recording {
      background: #fff;
      border-color: #fe2c55;
    }

    .camera-secondary {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid #555;
      background: #222;
      color: #fff;
      font-size: 22px;
    }

    .video-editor {
      display: none;
      max-width: 500px;
      margin: 0 auto;
    }

    .video-editor.show {
      display: block;
    }

    #previewVideo {
      width: 100%;
      max-height: 55vh;
      object-fit: contain;
      border-radius: 16px;
      background: #111;
    }

    .editor-form {
      margin-top: 18px;
    }

    .caption-input {
      width: 100%;
      min-height: 95px;
      resize: none;
      padding: 14px;
      border: 1px solid #444;
      border-radius: 12px;
      outline: none;
      background: #181818;
      color: #fff;
      font-size: 16px;
      font-family: Arial, sans-serif;
    }

    .caption-input::placeholder {
      color: #999;
    }

    .sound-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      background: #181818;
    }

    .sound-row span {
      font-size: 15px;
    }

    .sound-select {
      margin-left: auto;
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .post-button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #fe2c55;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .post-button:disabled {
      opacity: .5;
    }

    .back-create {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: 1px solid #444;
      border-radius: 12px;
      background: transparent;
      color: #fff;
      font-size: 15px;
    }

    #galleryInput {
      display: none;
    }

    .upload-progress {
      display: none;
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
      color: #ccc;
    }

    .upload-progress.show {
      display: block;
    }

    @media (max-width: 600px) {
      .create-options {
        margin-top: 15px;
      }

      .create-option {
        min-height: 130px;
      }

      #cameraPreview {
        height: 58vh;
      }
    }
  </style>
</head>

  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    const BACKEND_URL =
      "https://zylo-backend-ec5c.onrender.com";


    /* =========================
       ELEMENTS
    ========================== */

    const videoFeed =
      document.getElementById("videoFeed");

    const createScreen =
      document.getElementById("createScreen");

    const createOptions =
      document.getElementById("createOptions");

    const cameraArea =
      document.getElementById("cameraArea");

    const videoEditor =
      document.getElementById("videoEditor");

    const openCreate =
      document.getElementById("openCreate");

    const closeCreate =
      document.getElementById("closeCreate");

    const cameraButton =
      document.getElementById("cameraButton");

    const galleryButton =
      document.getElementById("galleryButton");

    const galleryInput =
      document.getElementById("galleryInput");

    const cameraPreview =
      document.getElementById("cameraPreview");

    const previewVideo =
      document.getElementById("previewVideo");

    const recordButton =
      document.getElementById("recordButton");

    const cameraBack =
      document.getElementById("cameraBack");

    const switchCamera =
      document.getElementById("switchCamera");

    const cameraStatus =
      document.getElementById("cameraStatus");

    const captionInput =
      document.getElementById("captionInput");

    const soundSelect =
      document.getElementById("soundSelect");

    const postButton =
      document.getElementById("postButton");

    const backCreate =
      document.getElementById("backCreate");

    const uploadProgress =
      document.getElementById("uploadProgress");


    let cameraStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];

    let selectedVideoFile = null;
    let cameraFacing = "user";


    /* =========================
       OPEN CREATE
    ========================= */

    openCreate.addEventListener("click", () => {

      createScreen.classList.add("show");

      createOptions.style.display = "grid";
      cameraArea.classList.remove("show");
      videoEditor.classList.remove("show");

      stopCamera();

    });


    /* =========================
       CLOSE CREATE
    ========================= */

    closeCreate.addEventListener("click", () => {

      createScreen.classList.remove("show");

      stopCamera();

      if (previewVideo.src) {
        URL.revokeObjectURL(previewVideo.src);
        previewVideo.removeAttribute("src");
        previewVideo.load();
      }

    });


    /* =========================
       GALLERY
    ========================= */

    galleryButton.addEventListener("click", () => {

      galleryInput.click();

    });


    galleryInput.addEventListener("change", (event) => {

      const file = event.target.files[0];

      if (!file) {
        return;
      }


      if (!file.type.startsWith("video/")) {

        alert("শুধু ভিডিও নির্বাচন করুন");

        galleryInput.value = "";

        return;
      }


      const maxSize =
        200 * 1024 * 1024;


      if (file.size > maxSize) {

        alert(
          "ভিডিও সর্বোচ্চ 200 MB হতে পারবে"
        );

        galleryInput.value = "";

        return;
      }


      selectedVideoFile = file;

      showVideoEditor(file);

    });


    /* =========================
       SHOW VIDEO EDITOR
    ========================= */

    function showVideoEditor(file) {

      stopCamera();

      createOptions.style.display = "none";

      cameraArea.classList.remove("show");

      videoEditor.classList.add("show");


      const videoURL =
        URL.createObjectURL(file);

      previewVideo.src = videoURL;

      previewVideo.load();

      previewVideo.play().catch(() => {});


      captionInput.value = "";

      soundSelect.value =
        "Original sound - ZYLO";

    }


    /* =========================
       CAMERA
    ========================= */

    cameraButton.addEventListener(
      "click",
      startCamera
    );


    async function startCamera() {

      try {

        createOptions.style.display =
          "none";

        videoEditor.classList.remove("show");

        cameraArea.classList.add("show");


        stopCamera();


        cameraStream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: cameraFacing,
              width: {
                ideal: 1080
              },
              height: {
                ideal: 1920
              }
            },

            audio: true

          });


        cameraPreview.srcObject =
          cameraStream;


        cameraStatus.textContent =
          "Tap the red button to record";

      } catch (error) {

        console.error(error);

        alert(
          "Camera চালু করা যায়নি। Browser permission দিন।"
        );

        backToCreateOptions();

      }

    }


    /* =========================
       RECORD VIDEO
    ========================= */

    recordButton.addEventListener(
      "click",
      () => {

        if (
          mediaRecorder &&
          mediaRecorder.state === "recording"
        ) {

          stopRecording();

        } else {

          startRecording();

        }

      }
    );


    function startRecording() {

      if (!cameraStream) {
        return;
      }


      recordedChunks = [];


      let options = {
        mimeType: "video/webm"
      };


      if (
        !MediaRecorder.isTypeSupported(
          "video/webm"
        )
      ) {

        options = {};

      }


      mediaRecorder =
        new MediaRecorder(
          cameraStream,
          options
        );


      mediaRecorder.ondataavailable =
        (event) => {

          if (event.data.size > 0) {

            recordedChunks.push(
              event.data
            );

          }

        };


      mediaRecorder.onstop =
        () => {

          const blob =
            new Blob(
              recordedChunks,
              {
                type:
                  "video/webm"
              }
            );


          selectedVideoFile =
            new File(
              [blob],
              "zylo-camera-video.webm",
              {
                type:
                  "video/webm"
              }
            );


          showVideoEditor(
            selectedVideoFile
          );

        };


      mediaRecorder.start();


      recordButton.classList.add(
        "recording"
      );


      cameraStatus.textContent =
        "Recording... Tap again to stop";

    }


    function stopRecording() {

      if (
        mediaRecorder &&
        mediaRecorder.state === "recording"
      ) {

        mediaRecorder.stop();

      }


      recordButton.classList.remove(
        "recording"
      );

    }


    /* =========================
       CAMERA SWITCH
    ========================= */

    switchCamera.addEventListener(
      "click",
      async () => {

        cameraFacing =
          cameraFacing === "user"
            ? "environment"
            : "user";

        await startCamera();

      }
    );


    /* =========================
       CAMERA BACK
    ========================= */

    cameraBack.addEventListener(
      "click",
      () => {

        stopCamera();

        backToCreateOptions();

      }
    );


    function backToCreateOptions() {

      createOptions.style.display =
        "grid";

      cameraArea.classList.remove(
        "show"
      );

      videoEditor.classList.remove(
        "show"
      );

    }


    /* =========================
       STOP CAMERA
    ========================= */

    function stopCamera() {

      if (cameraStream) {

        cameraStream
          .getTracks()
          .forEach(
            track => track.stop()
          );

        cameraStream = null;

      }

      cameraPreview.srcObject = null;

    }


    /* =========================
       BACK / CHANGE VIDEO
    ========================= */

    backCreate.addEventListener(
      "click",
      () => {

        selectedVideoFile = null;

        if (previewVideo.src) {

          URL.revokeObjectURL(
            previewVideo.src
          );

        }

        previewVideo.removeAttribute(
          "src"
        );

        previewVideo.load();

        galleryInput.value = "";

        backToCreateOptions();

      }
    );


    /* =========================
       POST VIDEO
    ========================= */

    postButton.addEventListener(
      "click",
      async () => {

        if (!selectedVideoFile) {

          alert(
            "আগে একটি ভিডিও নির্বাচন করুন"
          );

          return;
        }


        postButton.disabled = true;

        uploadProgress.classList.add(
          "show"
        );


        const caption =
          captionInput.value.trim();


        const sound =
          soundSelect.value;


        const formData =
          new FormData();


        formData.append(
          "video",
          selectedVideoFile
        );


        try {

          const response =
            await fetch(
              BACKEND_URL +
              "/api/upload",
              {
                method: "POST",
                body: formData
              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.message ||
              "Upload failed"
            );

          }


          if (
            data.success &&
            data.video
          ) {

            addVideoToFeed(
              data.video.url,
              caption,
              sound
            );


            alert(
              "ভিডিও সফলভাবে পোস্ট হয়েছে 🎉"
            );


            createScreen.classList.remove(
              "show"
            );


            resetCreateScreen();

          } else {

            throw new Error(
              "ভিডিও আপলোড করা যায়নি"
            );

          }

        } catch (error) {

          console.error(error);

          alert(
            "Upload error: " +
            error.message
          );

        } finally {

          postButton.disabled = false;

          uploadProgress.classList.remove(
            "show"
          );

        }

      }
    );


    /* =========================
       ADD VIDEO TO FEED
    ========================= */

    function addVideoToFeed(
      videoURL,
      caption,
      sound
    ) {

      const card =
        document.createElement(
          "section"
        );


      card.className =
        "video-card";


      card.innerHTML = `

        <video
          class="video"
          src="${videoURL}"
          loop
          muted
          playsinline
          autoplay
        ></video>

        <div class="video-gradient"></div>

        <div class="video-info">

          <div class="username">
            @zylo_creator
          </div>

          <div class="caption">
            ${escapeHTML(
              caption ||
              "Welcome to ZYLO 🌎"
            )}
          </div>

          <div class="music">
            ♪ ${escapeHTML(sound)}
          </div>

        </div>

        <div class="right-actions">

          <button class="action-btn profile-action">

            <div class="avatar">
              Z
            </div>

            <span class="follow-plus">
              +
            </span>

          </button>

          <button class="action-btn like-btn">

            <svg viewBox="0 0 24 24">
              <path d="M20.8 8.9c0 5.5-8.8 10.1-8.8 10.1S3.2 14.4 3.2 8.9A4.9 4.9 0 0 1 8.1 4c1.6 0 3 .8 3.9 2 0.9-1.2 2.3-2 3.9-2a4.9 4.9 0 0 1 4.9 4.9Z"/>
            </svg>

            <span class="count">
              0
            </span>

          </button>

          <button class="action-btn comment-btn">

            <svg viewBox="0 0 24 24">
              <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H8l-4 3v-5.5A7.5 7.5 0 1 1 20 11.5Z"/>
              <circle cx="8" cy="11.5" r=".7"/>
              <circle cx="12" cy="11.5" r=".7"/>
              <circle cx="16" cy="11.5" r=".7"/>
            </svg>

            <span class="count">
              0
            </span>

          </button>

          <button class="action-btn save-btn">

            <svg viewBox="0 0 24 24">
              <path d="M6 3h12v18l-6-4-6 4V3Z"/>
            </svg>

            <span class="count">
              0
            </span>

          </button>

          <button class="action-btn share-btn">

            <svg viewBox="0 0 24 24">
              <path d="M22 2 11 13"/>
              <path d="m22 2-7 20-4-9-9-4Z"/>
            </svg>

            <span>
              Share
            </span>

          </button>

          <button class="action-btn sound-btn">

            <svg viewBox="0 0 24 24">
              <path d="M4 9v6h4l5 4V5L8 9H4Z"/>
              <path d="M16 9a4 4 0 0 1 0 6"/>
            </svg>

          </button>

        </div>

      `;


      videoFeed.prepend(card);


      setupCardEvents(card);


      videoFeed.scrollTo({
        top: 0,
        behavior: "smooth"
      });


      const video =
        card.querySelector(".video");


      video.play().catch(() => {});

    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }


    /* =========================
       RESET CREATE
    ========================= */

    function resetCreateScreen() {

      stopCamera();

      selectedVideoFile = null;

      recordedChunks = [];

      galleryInput.value = "";

      captionInput.value = "";

      createOptions.style.display =
        "grid";

      cameraArea.classList.remove(
        "show"
      );

      videoEditor.classList.remove(
        "show"
      );

      if (previewVideo.src) {

        URL.revokeObjectURL(
          previewVideo.src
        );

      }

      previewVideo.removeAttribute(
        "src"
      );

      previewVideo.load();

    }


    /* =========================
       LIKE / SAVE / FOLLOW
    ========================= */

    function setupCardEvents(card) {

      const like =
        card.querySelector(
          ".like-btn"
        );

      const save =
        card.querySelector(
          ".save-btn"
        );

      const follow =
        card.querySelector(
          ".profile-action"
        );


      like.addEventListener(
        "click",
        () => {

          like.classList.toggle(
            "active"
          );

          const count =
            like.querySelector(
              ".count"
            );

          count.textContent =
            like.classList.contains(
              "active"
            )
              ? "1"
              : "0";

        }
      );


      save.addEventListener(
        "click",
        () => {

          save.classList.toggle(
            "active"
          );

          const count =
            save.querySelector(
              ".count"
            );

          count.textContent =
            save.classList.contains(
              "active"
            )
              ? "1"
              : "0";

        }
      );


      follow.addEventListener(
        "click",
        () => {

          follow.classList.toggle(
            "following"
          );

          const plus =
            follow.querySelector(
              ".follow-plus"
            );

          plus.textContent =
            follow.classList.contains(
              "following"
            )
              ? "✓"
              : "+";

        }
      );


      const sound =
        card.querySelector(
          ".sound-btn"
        );


      const video =
        card.querySelector(
          ".video"
        );


      sound.addEventListener(
        "click",
        () => {

          video.muted =
            !video.muted;

          sound.classList.toggle(
            "active",
            !video.muted
          );

        }
      );


      const share =
        card.querySelector(
          ".share-btn"
        );


      share.addEventListener(
        "click",
        async () => {

          try {

            if (
              navigator.share
            ) {

              await navigator.share({
                title: "ZYLO",
                text: "Watch this video on ZYLO",
                url: location.href
              });

            } else {

              await navigator.clipboard.writeText(
                location.href
              );

              alert(
                "Link copied"
              );

            }

          } catch (error) {}

        }
      );

    }


    /* =========================
       EXISTING CARDS
    ========================= */

    document
      .querySelectorAll(
        ".video-card"
      )
      .forEach(
        setupCardEvents
      );


    /* =========================
       AUTO PLAY / PAUSE
    ========================= */

    const observer =
      new IntersectionObserver(
        entries => {

          entries.forEach(
            entry => {

              const video =
                entry.target.querySelector(
                  ".video"
                );

              if (!video) {
                return;
              }


              if (
                entry.isIntersecting &&
                entry.intersectionRatio >= 0.65
              ) {

                video.play().catch(
                  () => {}
                );

              } else {

                video.pause();

              }

            }
          );

        },
        {
          threshold: [
            0.65
          ]
        }
      );


    document
      .querySelectorAll(
        ".video-card"
      )
      .forEach(
        card =>
          observer.observe(card)
      );


    /* =========================
       INITIALIZE
    ========================= */

    document
      .querySelectorAll(
        ".video-card"
      )
      .forEach(
        card => {

          const video =
            card.querySelector(
              ".video"
            );

          if (video) {

            video.play().catch(
              () => {}
            );

          }

        }
      );


    /* =========================
       SEARCH BUTTON
    ========================= */

    document
      .getElementById(
        "searchButton"
      )
      .addEventListener(
        "click",
        () => {

          alert(
            "ZYLO Search — Coming Soon"
          );

        }
      );

  </script>

</body>
</html>

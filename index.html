<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>ZYLO — Create • Connect • Grow</title>

<link rel="stylesheet" href="style.css">

<style>
/* =====================================================
   ZYLO — FINAL TIKTOK STYLE FRONTEND
   ===================================================== */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}

button,
input,
textarea,
select {
  font-family: inherit;
}

button {
  border: 0;
  outline: 0;
}

/* =====================================================
   APP
   ===================================================== */

#app {
  width: 100%;
  height: 100%;
  background: #000;
}

/* =====================================================
   FEED
   ===================================================== */

#feed {
  position: fixed;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  scroll-snap-type: y mandatory;
  background: #000;
  z-index: 1;
}

.video-card {
  position: relative;
  width: 100%;
  height: 100dvh;
  min-height: 100vh;
  background: #000;
  scroll-snap-align: start;
  overflow: hidden;
}

/* Video */

.video-card video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
}

/* Gradient */

.video-card::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.40),
      transparent 20%,
      transparent 60%,
      rgba(0,0,0,.35) 100%
    );
  z-index: 3;
}

/* =====================================================
   TOP BAR
   ===================================================== */

.top-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;

  height: 72px;

  z-index: 100;

  display: flex;
  align-items: center;
  justify-content: center;

  pointer-events: none;
}

.tabs {
  display: flex;
  align-items: center;
  gap: 34px;
}

.tab {
  position: relative;

  color: rgba(255,255,255,.75);
  background: transparent;

  font-size: 18px;
  font-weight: 400;

  padding: 12px 0;

  pointer-events: auto;
}

.tab.active {
  color: #fff;
  font-weight: 700;
}

.tab.active::after {
  content: "";

  position: absolute;
  left: 0;
  right: 0;
  bottom: -2px;

  height: 5px;

  border-radius: 10px;

  background: #fff;
}

/* Search */

.search-button {
  position: absolute;
  right: 16px;
  top: 18px;

  width: 58px;
  height: 58px;

  border-radius: 50%;

  background: rgba(30,30,30,.9);

  display: flex;
  align-items: center;
  justify-content: center;

  pointer-events: auto;
}

.search-icon {
  width: 30px;
  height: 30px;

  border: 4px solid #fff;
  border-radius: 50%;

  position: relative;
}

.search-icon::after {
  content: "";

  position: absolute;

  width: 15px;
  height: 4px;

  background: #fff;

  right: -12px;
  bottom: -6px;

  transform: rotate(48deg);

  border-radius: 4px;
}

/* =====================================================
   RIGHT ACTIONS
   ===================================================== */

.video-actions {
  position: absolute !important;

  right: 10px !important;
  top: 43% !important;

  transform: none !important;

  width: 60px !important;

  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;

  gap: 9px !important;

  z-index: 30 !important;
}

.action {
  width: 54px;
  min-height: 48px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  color: #fff;
  background: transparent;

  padding: 0;
  margin: 0;
}

.action svg {
  width: 31px;
  height: 31px;

  fill: none;
  stroke: #fff;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.action .count,
.action .label {
  margin-top: 3px;

  color: #fff;

  font-size: 11px;
  line-height: 13px;

  text-align: center;
}

.profile-action {
  min-height: 76px;
}

.profile-avatar {
  width: 52px;
  height: 52px;

  border: 2px solid #fff;
  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 32px;
  font-weight: 400;

  position: relative;
}

.follow-plus {
  position: absolute;

  right: -7px;
  bottom: -5px;

  width: 24px;
  height: 24px;

  border-radius: 50%;

  background: #ff1744;
  border: 2px solid #fff;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 18px;
  font-weight: 700;
}

.like-button.liked svg {
  fill: #fff;
}

/* =====================================================
   MUSIC DISC
   ===================================================== */

.music-disc {
  position: absolute !important;

  right: 10px !important;
  bottom: 88px !important;

  width: 54px !important;
  height: 54px !important;

  border-radius: 50% !important;

  background:
    radial-gradient(
      circle,
      #111 30%,
      #222 31%,
      #111 36%,
      #222 40%,
      #111 44%,
      #222 48%,
      #111 52%
    ) !important;

  border: 2px solid #333 !important;

  z-index: 40 !important;

  display: flex !important;
  align-items: center !important;
  justify-content: center !important;

  color: #fff !important;
}

.music-disc span {
  font-size: 24px;
  color: #fff;
}

/* =====================================================
   VIDEO INFORMATION
   ===================================================== */

.video-info {
  position: absolute;

  left: 24px;
  right: 85px;
  bottom: 112px;

  z-index: 20;

  color: #fff;
}

.creator {
  display: flex;
  align-items: center;
  gap: 7px;

  font-size: 21px;
  font-weight: 700;

  margin-bottom: 20px;
}

.verified {
  width: 20px;
  height: 20px;

  border-radius: 50%;

  background: #20bce8;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  font-size: 13px;
  font-weight: 700;
}

.caption {
  font-size: 20px;
  line-height: 1.35;

  margin-bottom: 8px;
}

.hashtags {
  color: #20c9ff;

  font-size: 17px;
  line-height: 1.5;

  margin-bottom: 13px;
}

.sound {
  display: flex;
  align-items: center;
  gap: 8px;

  font-size: 16px;
}

.sound-icon {
  font-size: 19px;
}

/* =====================================================
   BOTTOM NAV
   ===================================================== */

.bottom-nav {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  height: 82px;

  background: #000;

  border-top: 1px solid rgba(255,255,255,.15);

  z-index: 200;

  display: grid;
  grid-template-columns: 1fr 1fr 1.25fr 1fr 1fr;

  align-items: center;
}

.nav-button {
  height: 100%;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 5px;

  background: transparent;
  color: #fff;
}

.nav-icon {
  width: 28px;
  height: 28px;

  stroke: #fff;
  fill: none;

  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.nav-label {
  font-size: 12px;
  color: #fff;
}

/* Create */

.create-button {
  position: relative;

  width: 68px;
  height: 48px;

  margin: auto;

  border-radius: 14px;

  background: #fff;

  color: #000;

  font-size: 31px;
  font-weight: 400;

  display: flex;
  align-items: center;
  justify-content: center;

  box-shadow:
    -7px 0 0 #20e6e6,
    7px 0 0 #ff1f64;
}

.create-button span {
  transform: translateY(-1px);
}

/* =====================================================
   CREATE SCREEN
   ===================================================== */

#createScreen {
  position: fixed;

  inset: 0;

  background: #000;

  z-index: 500;

  display: none;

  flex-direction: column;
}

#createScreen.open {
  display: flex;
}

.create-header {
  height: 58px;

  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 16px;

  border-bottom: 1px solid #222;
}

.create-title {
  font-size: 19px;
  font-weight: 700;
}

.close-create {
  width: 40px;
  height: 40px;

  background: transparent;
  color: #fff;

  font-size: 31px;
}

.create-content {
  flex: 1;

  overflow-y: auto;

  padding: 16px 16px 30px;
}

/* Select area */

.select-video-box {
  width: 100%;
  min-height: 260px;

  border: 1px dashed #555;
  border-radius: 12px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  margin-bottom: 18px;

  overflow: hidden;
}

.select-video-box.has-video {
  border-style: solid;
}

.gallery-icon {
  font-size: 48px;
  margin-bottom: 10px;
}

.select-text {
  font-size: 17px;
  margin-bottom: 12px;
}

.gallery-button {
  padding: 11px 22px;

  background: #fff;
  color: #000;

  border-radius: 7px;

  font-size: 15px;
  font-weight: 700;
}

.preview-video {
  display: none;

  width: 100%;
  max-height: 420px;

  object-fit: contain;

  background: #111;
}

.select-video-box.has-video .preview-video {
  display: block;
}

.select-video-box.has-video .gallery-icon,
.select-video-box.has-video .select-text {
  display: none;
}

/* Inputs */

.form-label {
  display: block;

  margin: 13px 0 7px;

  color: #aaa;

  font-size: 13px;
}

.caption-input,
.hashtag-input,
.privacy-select {
  width: 100%;

  border: 1px solid #333;
  border-radius: 8px;

  background: #151515;
  color: #fff;

  padding: 12px;

  font-size: 15px;

  outline: none;
}

.caption-input {
  min-height: 85px;
  resize: vertical;
}

.hashtag-input {
  height: 45px;
}

.privacy-select {
  height: 45px;
}

/* Settings */

.setting-row {
  min-height: 54px;

  border-bottom: 1px solid #222;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.setting-title {
  font-size: 15px;
}

.setting-sub {
  color: #888;
  font-size: 12px;
  margin-top: 3px;
}

/* Toggle */

.toggle {
  position: relative;

  width: 44px;
  height: 25px;

  border-radius: 20px;

  background: #444;
}

.toggle.active {
  background: #20c9ff;
}

.toggle::after {
  content: "";

  position: absolute;

  top: 3px;
  left: 3px;

  width: 19px;
  height: 19px;

  border-radius: 50%;

  background: #fff;

  transition: .2s;
}

.toggle.active::after {
  left: 22px;
}

/* Create bottom */

.create-footer {
  flex-shrink: 0;

  min-height: 72px;

  padding: 10px 16px;

  border-top: 1px solid #222;

  display: flex;
  gap: 10px;
}

.draft-button,
.post-button {
  flex: 1;

  height: 48px;

  border-radius: 8px;

  font-size: 16px;
  font-weight: 700;
}

.draft-button {
  background: #222;
  color: #fff;
}

.post-button {
  background: #fff;
  color: #000;
}

.post-button:disabled {
  opacity: .4;
}

.upload-status {
  position: fixed;

  left: 15px;
  right: 15px;
  bottom: 90px;

  padding: 12px;

  border-radius: 8px;

  background: rgba(20,20,20,.95);

  color: #fff;

  text-align: center;

  font-size: 14px;

  display: none;

  z-index: 700;
}

.upload-status.show {
  display: block;
}

/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 600px) {

  .tabs {
    gap: 30px;
  }

  .tab {
    font-size: 18px;
  }

  .search-button {
    right: 10px;
    top: 19px;

    width: 58px;
    height: 58px;
  }

  .video-actions {
    right: 7px !important;
    top: 43% !important;
    gap: 8px !important;
  }

  .action {
    width: 50px;
  }

  .profile-avatar {
    width: 50px;
    height: 50px;
  }

  .video-info {
    left: 24px;
    right: 82px;
    bottom: 105px;
  }

  .creator {
    font-size: 20px;
  }

  .caption {
    font-size: 18px;
  }

  .hashtags {
    font-size: 16px;
  }

  .music-disc {
    right: 7px !important;
    bottom: 87px !important;
  }
}
</style>
</head>

<body>

<div id="app">

<!-- ===================================================
     FEED
     =================================================== -->

<main id="feed">

  <section class="video-card">

    <video
      class="video"
      src="uploads/video1.mp4"
      loop
      muted
      playsinline
      preload="metadata"
    ></video>

    <!-- TOP -->

    <div class="top-bar">

      <div class="tabs">

        <button class="tab">
          LIVE
        </button>

        <button class="tab">
          Following
        </button>

        <button class="tab active">
          For You
        </button>

      </div>

      <button
        class="search-button"
        aria-label="Search"
      >
        <span class="search-icon"></span>
      </button>

    </div>


    <!-- RIGHT ACTIONS -->

    <div class="video-actions">

      <!-- PROFILE -->

      <button class="action profile-action follow-button">

        <div class="profile-avatar">
          Z

          <span class="follow-plus">
            +
          </span>
        </div>

        <span class="label">
          Follow
        </span>

      </button>


      <!-- LIKE -->

      <button class="action like-button">

        <svg viewBox="0 0 24 24">
          <path d="M20.8 8.8c0 5.5-8.8 10.2-8.8 10.2S3.2 14.3 3.2 8.8A4.8 4.8 0 0 1 8 4c1.6 0 3.1.8 4 2 0.9-1.2 2.4-2 4-2a4.8 4.8 0 0 1 4.8 4.8Z"/>
        </svg>

        <span class="count">
          0
        </span>

      </button>


      <!-- COMMENT -->

      <button class="action">

        <svg viewBox="0 0 24 24">
          <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H7l-4 3v-10.5A7.5 7.5 0 0 1 10.5 4h2A7.5 7.5 0 0 1 20 11.5Z"/>
        </svg>

        <span class="count">
          0
        </span>

      </button>


      <!-- SAVE -->

      <button class="action save-button">

        <svg viewBox="0 0 24 24">
          <path d="M6 4h12v17l-6-4-6 4V4Z"/>
        </svg>

        <span class="label">
          Save
        </span>

      </button>


      <!-- SHARE -->

      <button class="action share-button">

        <svg viewBox="0 0 24 24">
          <path d="m21 3-7.5 18-3.5-7-7-3.5L21 3Z"/>
          <path d="M21 3 10 14"/>
        </svg>

        <span class="label">
          Share
        </span>

      </button>

    </div>


    <!-- MUSIC -->

    <button class="music-disc">
      <span>♪</span>
    </button>


    <!-- VIDEO INFO -->

    <div class="video-info">

      <div class="creator">
        @zylo_creator

        <span class="verified">
          ✓
        </span>
      </div>

      <div class="caption">
        Welcome to ZYLO 🌎
      </div>

      <div class="caption">
        Create • Connect • Grow
      </div>

      <div class="hashtags">
        #ZYLO #Create #Connect #Grow #ForYou
      </div>

      <div class="sound">
        <span class="sound-icon">
          ♪
        </span>

        <span>
          Original sound - ZYLO
        </span>
      </div>

    </div>

  </section>

</main>


<!-- ===================================================
     BOTTOM NAV
     =================================================== -->

<nav class="bottom-nav">

  <!-- HOME -->

  <button class="nav-button">

    <svg class="nav-icon" viewBox="0 0 24 24">
      <path d="M3 11 12 3l9 8v10h-6v-6H9v6H3Z"/>
    </svg>

    <span class="nav-label">
      Home
    </span>

  </button>


  <!-- DISCOVER -->

  <button class="nav-button">

    <svg class="nav-icon" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7"/>
      <path d="m16.5 16.5 4 4"/>
    </svg>

    <span class="nav-label">
      Discover
    </span>

  </button>


  <!-- CREATE -->

  <button
    class="nav-button"
    id="openCreate"
  >

    <span class="create-button">
      <span>+</span>
    </span>

  </button>


  <!-- INBOX -->

  <button class="nav-button">

    <svg class="nav-icon" viewBox="0 0 24 24">
      <path d="M4 5h16v12H4Z"/>
      <path d="M4 14h5l1.5 2h3L15 14h5"/>
    </svg>

    <span class="nav-label">
      Inbox
    </span>

  </button>


  <!-- PROFILE -->

  <button class="nav-button">

    <svg class="nav-icon" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21c.7-4 3.3-6 8-6s7.3 2 8 6"/>
    </svg>

    <span class="nav-label">
      Profile
    </span>

  </button>

</nav>


<!-- ===================================================
     CREATE SCREEN
     =================================================== -->

<section id="createScreen">

  <header class="create-header">

    <button
      class="close-create"
      id="closeCreate"
    >
      ×
    </button>

    <div class="create-title">
      Create
    </div>

    <div style="width:40px;"></div>

  </header>


  <div class="create-content">

    <!-- VIDEO SELECT -->

    <div
      class="select-video-box"
      id="selectVideoBox"
    >

      <div class="gallery-icon">
        ▣
      </div>

      <div class="select-text">
        Select a video
      </div>

      <button
        class="gallery-button"
        id="chooseVideo"
      >
        Choose from Gallery
      </button>

      <video
        id="previewVideo"
        class="preview-video"
        controls
        playsinline
      ></video>

    </div>


    <!-- CAPTION -->

    <label class="form-label">
      Caption
    </label>

    <textarea
      id="captionInput"
      class="caption-input"
      maxlength="2200"
      placeholder="Describe your video..."
    ></textarea>


    <!-- HASHTAGS -->

    <label class="form-label">
      Hashtags
    </label>

    <input
      id="hashtagInput"
      class="hashtag-input"
      type="text"
      placeholder="Add hashtags #ZYLO #ForYou"
    >


    <!-- SOUND -->

    <label class="form-label">
      Sound
    </label>

    <div class="setting-row">

      <div>
        <div class="setting-title">
          ♪ Original sound - ZYLO
        </div>

        <div class="setting-sub">
          Your uploaded video sound
        </div>
      </div>

      <span>
        ›
      </span>

    </div>


    <!-- PRIVACY -->

    <label class="form-label">
      Who can view this video
    </label>

    <select
      id="privacyInput"
      class="privacy-select"
    >

      <option value="Everyone">
        Everyone
      </option>

      <option value="Friends">
        Friends
      </option>

      <option value="Only me">
        Only me
      </option>

    </select>


    <!-- COMMENTS -->

    <div class="setting-row">

      <div>

        <div class="setting-title">
          Allow comments
        </div>

      </div>

      <button
        class="toggle active"
        data-toggle="comments"
      ></button>

    </div>


    <!-- DOWNLOADS -->

    <div class="setting-row">

      <div>

        <div class="setting-title">
          Allow downloads
        </div>

      </div>

      <button
        class="toggle"
        data-toggle="downloads"
      ></button>

    </div>

  </div>


  <!-- CREATE FOOTER -->

  <footer class="create-footer">

    <button
      class="draft-button"
      id="draftButton"
    >
      Draft
    </button>

    <button
      class="post-button"
      id="postButton"
      disabled
    >
      Post
    </button>

  </footer>

</section>


<!-- ===================================================
     HIDDEN FILE INPUT
     =================================================== -->

<input
  type="file"
  id="videoInput"
  accept="video/*"
  hidden
>


<!-- ===================================================
     UPLOAD STATUS
     =================================================== -->

<div
  id="uploadStatus"
  class="upload-status"
></div>


</div>


<script>

/* =====================================================
   ZYLO CONFIG
   ===================================================== */

const BACKEND_URL =
  "https://zylo-backend-ec5c.onrender.com";


/* =====================================================
   ELEMENTS
   ===================================================== */

const feed =
  document.getElementById("feed");

const createScreen =
  document.getElementById("createScreen");

const openCreate =
  document.getElementById("openCreate");

const closeCreate =
  document.getElementById("closeCreate");

const chooseVideo =
  document.getElementById("chooseVideo");

const videoInput =
  document.getElementById("videoInput");

const previewVideo =
  document.getElementById("previewVideo");

const selectVideoBox =
  document.getElementById("selectVideoBox");

const captionInput =
  document.getElementById("captionInput");

const hashtagInput =
  document.getElementById("hashtagInput");

const privacyInput =
  document.getElementById("privacyInput");

const postButton =
  document.getElementById("postButton");

const uploadStatus =
  document.getElementById("uploadStatus");


/* =====================================================
   CREATE SCREEN
   ===================================================== */

openCreate.addEventListener("click", () => {

  createScreen.classList.add("open");

  document.body.style.overflow = "hidden";

});


closeCreate.addEventListener("click", () => {

  createScreen.classList.remove("open");

  document.body.style.overflow = "hidden";

});


/* =====================================================
   CHOOSE VIDEO
   ===================================================== */

chooseVideo.addEventListener("click", () => {

  videoInput.click();

});


/* =====================================================
   VIDEO SELECTED
   ===================================================== */

let selectedVideo = null;
let selectedVideoURL = null;

videoInput.addEventListener("change", () => {

  const file = videoInput.files[0];

  if (!file) {
    return;
  }

  if (!file.type.startsWith("video/")) {

    alert("শুধু ভিডিও ফাইল নির্বাচন করুন।");

    videoInput.value = "";

    return;
  }

  selectedVideo = file;

  if (selectedVideoURL) {
    URL.revokeObjectURL(selectedVideoURL);
  }

  selectedVideoURL =
    URL.createObjectURL(file);

  previewVideo.src =
    selectedVideoURL;

  selectVideoBox.classList.add("has-video");

  postButton.disabled = false;

});


/* =====================================================
   TOGGLE SETTINGS
   ===================================================== */

document.querySelectorAll(".toggle")
  .forEach(toggle => {

    toggle.addEventListener("click", () => {

      toggle.classList.toggle("active");

/* =====================================================
   STATUS
   ===================================================== */

function showStatus(message) {

  uploadStatus.textContent =
    message;

  uploadStatus.classList.add("show");

}


function hideStatus() {

  uploadStatus.classList.remove("show");

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value) {

  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =====================================================

/* =====================================================
   POST VIDEO
   ===================================================== */

postButton.addEventListener("click", async () => {

  if (!selectedVideo) {

    alert("প্রথমে একটি ভিডিও নির্বাচন করুন।");

    return;

  }

  postButton.disabled = true;

  showStatus(
    "ভিডিও আপলোড হচ্ছে... অপেক্ষা করুন"
  );


  try {

    const formData =
      new FormData();

    formData.append(
      "video",
      selectedVideo
    );


    const response =
      await fetch(
        BACKEND_URL + "/api/upload",
        {
          method: "POST",
          body: formData
        }
      );


    const data =
      await response.json();


    if (!response.ok || !data.success) {

      throw new Error(
        data.message ||
        "ভিডিও আপলোড ব্যর্থ হয়েছে"
      );

    }


    const uploadedURL =
      data.video.url;


    /* Caption */

    const caption =
      captionInput.value.trim() ||
      "Welcome to ZYLO 🌎";


    /* Hashtags */

    const hashtags =
      hashtagInput.value.trim() ||
      "#ZYLO #Create #Connect #Grow #ForYou";


    /* Save browser data */

    localStorage.setItem(
      "zyloLastVideo",
      uploadedURL
    );

    localStorage.setItem(
      "zyloLastCaption",
      caption
    );

    localStorage.setItem(
      "zyloLastHashtags",
      hashtags
    );


    /* Create feed card */

    const newCard =
      createVideoCard(
        uploadedURL,
        caption,
        hashtags
      );


    feed.prepend(newCard);


    /* Close create screen */

    createScreen.classList.remove("open");


    /* Reset */

    videoInput.value = "";

    selectedVideo = null;

    if (selectedVideoURL) {

      URL.revokeObjectURL(
        selectedVideoURL
      );

      selectedVideoURL = null;

    }

    previewVideo.removeAttribute("src");

    previewVideo.load();

    selectVideoBox.classList.remove(
      "has-video"
    );

    captionInput.value = "";

    hashtagInput.value = "";

    postButton.disabled = true;


    /* Scroll to new video */

    feed.scrollTo({
      top: 0,
      behavior: "instant"
    });


    showStatus(
      "ভিডিও সফলভাবে পোস্ট হয়েছে ✓"
    );


    setTimeout(() => {

      hideStatus();

    }, 2500);


    setupVideoObserver();


  } catch (error) {

    console.error(error);

    showStatus(
      "আপলোড ব্যর্থ: " +
      error.message
    );

    postButton.disabled = false;

  }

});


/* =====================================================
   VIDEO AUTOPLAY / PAUSE
   ===================================================== */

let videoObserver = null;

function setupVideoObserver() {

  if (videoObserver) {

    videoObserver.disconnect();

  }


  videoObserver =
    new IntersectionObserver(
      entries => {

        entries.forEach(entry => {

          const video =
            entry.target;

          if (entry.isIntersecting) {

            video.play()
              .catch(() => {});

          } else {

            video.pause();

          }

        });

      },
      {
        threshold: 0.65
      }
    );


  document
    .querySelectorAll(".video-card video")
    .forEach(video => {

      videoObserver.observe(video);

    });

}


setupVideoObserver();


/* =====================================================
   TAP VIDEO = PLAY / PAUSE
   ===================================================== */

document.addEventListener(
  "click",
  event => {

    const video =
      event.target.closest(
        ".video-card video"
      );

    if (!video) {
      return;
    }

    if (video.paused) {

      video.play()
        .catch(() => {});

    } else {

      video.pause();

    }

  }
);


/* =====================================================
   LIKE
   ===================================================== */

document.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        ".like-button"
      );

    if (!button) {
      return;
    }


    button.classList.toggle("liked");


    const count =
      button.querySelector(".count");


    if (
      button.classList.contains("liked")
    ) {

      count.textContent = "1";

    } else {

      count.textContent = "0";

    }

  }
);


/* =====================================================
   SAVE
   ===================================================== */

document.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        ".save-button"
      );

    if (!button) {
      return;
    }


    const label =
      button.querySelector(".label");


    if (button.dataset.saved === "1") {

      button.dataset.saved = "0";

      label.textContent = "Save";

    } else {

      button.dataset.saved = "1";

      label.textContent = "Saved";

    }

  }
);


/* =====================================================
   SHARE
   ===================================================== */

document.addEventListener(
  "click",
  async event => {

    const button =
      event.target.closest(
        ".share-button"
      );

    if (!button) {
      return;
    }


    const url =
      window.location.href;


    try {

      if (
        navigator.share
      ) {

        await navigator.share({
          title: "ZYLO",
          text: "Check out this video on ZYLO",
          url: url
        });

      } else {

        await navigator.clipboard.writeText(
          url
        );

        alert(
          "ভিডিও লিংক কপি হয়েছে।"
        );

      }

    } catch (error) {

      console.log(error);

    }

  }
);


/* =====================================================
   LOAD LAST UPLOADED VIDEO
   ===================================================== */

const lastVideo =
  localStorage.getItem(
    "zyloLastVideo"
  );

const lastCaption =
  localStorage.getItem(
    "zyloLastCaption"
  );

const lastHashtags =
  localStorage.getItem(
    "zyloLastHashtags"
  );


if (lastVideo) {

  const savedCard =
    createVideoCard(
      lastVideo,
      lastCaption ||
        "Welcome to ZYLO 🌎",
      lastHashtags ||
        "#ZYLO #Create #Connect #Grow #ForYou"
    );

  feed.prepend(savedCard);

  setupVideoObserver();

}

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ZYLO</title>

<link rel="stylesheet" href="style.css">

<style>

/* ================================
   ZYLO FULL SCREEN FEED
================================ */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

button{
  -webkit-tap-highlight-color:transparent;
}

/* ================================
   TOP
================================ */

.top-bar{
  position:fixed;
  top:0;
  left:0;
  right:0;

  height:76px;

  z-index:100;

  display:flex;
  align-items:center;
  justify-content:center;

  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.75),
    transparent
  );
}

.top-tabs{
  display:flex;
  align-items:center;
  gap:28px;
}

.top-tab{
  border:0;
  background:transparent;
  color:#aaa;

  font-size:18px;
  font-weight:500;

  padding:10px 3px;
}

.top-tab.active{
  color:#fff;
  font-weight:700;

  border-bottom:4px solid #fff;
}

/* SEARCH */

.search-btn{
  position:absolute;
  right:16px;
  top:14px;

  width:54px;
  height:54px;

  border:0;
  border-radius:50%;

  background:rgba(40,40,40,.85);
  color:#fff;

  font-size:32px;
}

/* ================================
   FEED
================================ */

.video-feed{
  position:absolute;

  top:0;
  left:0;

  width:100%;
  height:100%;

  overflow-y:auto;

  scroll-snap-type:y mandatory;

  scrollbar-width:none;
}

.video-feed::-webkit-scrollbar{
  display:none;
}

.video-card{
  position:relative;

  width:100%;
  height:100vh;

  scroll-snap-align:start;

  background:#000;

  overflow:hidden;
}

/* VIDEO */

.video{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  background:#000;
}

/* OVERLAY */

.video-overlay{
  position:absolute;

  inset:0;

  pointer-events:none;

  background:

    linear-gradient(
      to top,
      rgba(0,0,0,.85) 0%,
      rgba(0,0,0,.35) 22%,
      transparent 50%
    );
}

/* ================================
   RIGHT SIDE
================================ */

.video-actions{

  position:absolute;

  right:12px;

  bottom:145px;

  width:70px;

  z-index:30;

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:10px;
}

/* PROFILE */

.profile-action{
  position:relative;

  width:58px;
  height:58px;

  border-radius:50%;

  border:2px solid #fff;

  background:#222;

  display:flex;

  align-items:center;
  justify-content:center;

  color:#fff;

  font-size:26px;

  margin-bottom:12px;
}

.follow-plus{

  position:absolute;

  bottom:-9px;
  right:14px;

  width:25px;
  height:25px;

  border-radius:50%;

  background:#ff3158;

  color:#fff;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:20px;

  font-weight:bold;
}

/* ACTION */

.action-button{

  width:58px;
  height:58px;

  border:0;
  background:transparent;

  color:#fff;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:38px;

  text-shadow:
    0 2px 5px rgba(0,0,0,.8);
}

.action-count{

  margin-top:-9px;

  font-size:14px;

  color:#fff;

  text-shadow:
    0 2px 4px #000;

  min-height:18px;
}

/* SAVE */

.save-button{
  font-size:36px;
}

/* SOUND */

.sound-button{

  width:58px;
  height:58px;

  border-radius:50%;

  background:#222;

  border:3px solid #555;

  font-size:30px;

  display:flex;

  align-items:center;
  justify-content:center;

  margin-top:10px;
}

/* ================================
   VIDEO INFORMATION
================================ */

.video-info{

  position:absolute;

  left:20px;

  right:95px;

  bottom:145px;

  z-index:20;

  max-width:calc(100% - 120px);

  text-shadow:
    0 2px 5px rgba(0,0,0,.8);
}

.username{

  font-size:19px;

  font-weight:700;

  margin-bottom:9px;
}

.caption{

  font-size:17px;

  line-height:1.4;

  margin-bottom:7px;
}

.hashtags{

  color:#fff;

  font-size:15px;

  line-height:1.35;

  margin-bottom:8px;
}

.music{

  font-size:15px;

  color:#eee;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

/* ================================
   BOTTOM NAV
================================ */

.bottom-nav{

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  height:78px;

  z-index:200;

  display:flex;

  align-items:center;

  justify-content:space-around;

  background:rgba(0,0,0,.94);

  border-top:1px solid #222;
}

.nav-button{

  width:20%;

  height:70px;

  border:0;

  background:transparent;

  color:#fff;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:3px;

  font-size:13px;
}

.nav-icon{
  font-size:25px;
}

.nav-button.active{
  color:#fff;
}

/* CREATE */

.upload-button{

  width:64px;

  height:48px;

  border-radius:15px;

  background:#fff;

  color:#000;

  font-size:34px;

  font-weight:300;

  box-shadow:
    -4px 0 0 #00f2ea,
    4px 0 0 #ff0050;
}

/* ================================
   CREATE SCREEN
================================ */

.create-screen{

  position:fixed;

  inset:0;

  z-index:500;

  display:none;

  flex-direction:column;

  background:#000;

  overflow-y:auto;
}

.create-screen.show{
  display:flex;
}

.create-header{

  position:sticky;

  top:0;

  height:72px;

  min-height:72px;

  z-index:20;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#000;

  border-bottom:1px solid #222;
}

.create-header h2{
  margin:0;
  font-size:25px;
}

.create-close{

  position:absolute;

  left:18px;

  width:52px;
  height:52px;

  border:0;

  border-radius:50%;

  background:#222;

  color:#fff;

  font-size:38px;
}

/* ================================
   CREATE OPTIONS
================================ */

.create-options{

  display:flex;

  justify-content:center;

  gap:15px;

  padding:50px 20px;
}

.create-option{

  width:150px;
  height:100px;

  border:1px solid #333;

  border-radius:18px;

  background:#181818;

  color:#fff;

  font-size:17px;
}

/* ================================
   EDITOR
================================ */

.editor{

  display:none;

  padding:20px 32px 120px;
}

.editor.show{
  display:block;
}

.preview-box{

  width:100%;

  background:#111;

  border-radius:18px;

  overflow:hidden;

  margin-bottom:16px;
}

.preview-video{

  width:100%;

  max-height:300px;

  display:block;

  background:#000;
}

/* CAPTION */

.caption-box{

  position:relative;

  background:#181818;

  border-radius:20px;

  margin-bottom:14px;
}

#captionInput{

  width:100%;

  min-height:150px;

  padding:24px;

  border:0;

  outline:0;

  resize:none;

  background:transparent;

  color:#fff;

  font-size:19px;
}

.char-count{

  position:absolute;

  right:20px;

  bottom:15px;

  color:#888;

  font-size:14px;
}

/* HASHTAG */

#hashtagInput{

  width:100%;

  height:65px;

  border:0;

  outline:0;

  border-radius:18px;

  background:#181818;

  color:#fff;

  padding:0 24px;

  font-size:18px;

  margin-bottom:14px;
}

/* SOUND */

.sound-row{

  width:100%;

  min-height:72px;

  display:flex;

  align-items:center;

  padding:0 22px;

  border-radius:18px;

  background:#181818;

  margin-bottom:14px;

  font-size:25px;
}

.sound-name{

  margin-left:14px;

  font-size:17px;
}

.sound-arrow{

  margin-left:auto;

  color:#aaa;

  font-size:28px;
}

/* SETTINGS */

.settings-box{

  background:#181818;

  border-radius:20px;

  overflow:hidden;

  margin-bottom:16px;
}

.privacy-row{

  width:100%;

  height:72px;

  border:0;

  background:transparent;

  color:#fff;

  padding:0 24px;

  font-size:17px;

  outline:none;
}

.setting-row{

  min-height:68px;

  display:flex;

  align-items:center;

  padding:0 24px;

  border-top:1px solid #292929;

  font-size:17px;
}

.setting-row span:first-child{
  flex:1;
}

/* TOGGLE */

.toggle{

  position:relative;

  width:54px;
  height:32px;

  border:0;

  border-radius:20px;

  background:#555;
}

.toggle-circle{

  position:absolute;

  top:4px;
  left:4px;

  width:24px;
  height:24px;

  border-radius:50%;

  background:#fff;

  transition:.2s;
}

.toggle.on{
  background:#ff3158;
}

.toggle.on .toggle-circle{
  left:26px;
}

/* CHOOSE */

.choose-again{

  width:100%;

  height:52px;

  border:1px solid #444;

  border-radius:14px;

  background:#111;

  color:#fff;

  font-size:16px;

  margin-bottom:12px;
}

/* STATUS */

.upload-status{

  min-height:30px;

  text-align:center;

  padding:6px;

  color:#ddd;

  font-size:15px;
}

.upload-status.success{
  color:#42e66b;
}

.upload-status.error{
  color:#ff526b;
}

/* POST */

.post-buttons{

  display:flex;

  gap:16px;

  position:sticky;

  bottom:0;

  padding:10px 0;

  background:#000;
}

.draft-btn,
.post-btn{

  flex:1;

  height:60px;

  border:0;

  border-radius:18px;

  font-size:20px;

  font-weight:bold;
}

.draft-btn{

  background:#292929;

  color:#fff;
}

.post-btn{

  background:#ff3158;

  color:#fff;
}

.post-btn:disabled{
  opacity:.45;
}

/* ================================
   MOBILE
================================ */

@media(max-width:600px){

  .top-tabs{
    gap:22px;
  }

  .top-tab{
    font-size:17px;
  }

  .video-actions{
    right:7px;
    bottom:135px;
  }

  .video-info{
    left:18px;
    right:90px;
    bottom:135px;
  }

  .username{
    font-size:18px;
  }

  .caption{
    font-size:16px;
  }

  .hashtags{
    font-size:14px;
  }

  .music{
    font-size:14px;
  }

}

</style>
</head>

<body>


<!-- ================================
     TOP BAR
================================ -->

<header class="top-bar">

  <div class="top-tabs">

    <button class="top-tab">
      LIVE
    </button>

    <button class="top-tab">
      Following
    </button>

    <button class="top-tab active">
      For You
    </button>

  </div>

  <button
    class="search-btn"
    onclick="openSearch()">

    ⌕

  </button>

</header>


<!-- ================================
     VIDEO FEED
================================ -->

<main
  class="video-feed"
  id="videoFeed">


<section class="video-card">

  <video
    class="video"
    src="uploads/video1.mp4"
    loop
    muted
    playsinline
    preload="metadata">
  </video>

  <div class="video-overlay"></div>


  <!-- VIDEO INFO -->

  <div class="video-info">

    <div class="username">
      @zylo_creator
    </div>

    <div class="caption">
      Welcome to ZYLO 🌎
      <br>
      Create • Connect • Grow
    </div>

    <div class="hashtags">
      #ZYLO #Create #Connect #Grow #ForYou
    </div>

    <div class="music">
      ♪ Original sound - ZYLO
    </div>

  </div>


  <!-- RIGHT SIDE -->

  <div class="video-actions">

    <button
      class="profile-action">

      Z

      <span class="follow-plus">
        +
      </span>

    </button>


    <button
      class="action-button"
      onclick="likeVideo(this)">

      ♡

    </button>

    <span class="action-count">
      0
    </span>


    <button
      class="action-button">

      💬

    </button>

    <span class="action-count">
      0
    </span>


    <!-- SAVE -->

    <button
      class="action-button save-button"
      onclick="saveVideo(this)">

      ♡

    </button>

    <span class="action-count">
      Save
    </span>


    <!-- SHARE -->

    <button
      class="action-button">

      ↗

    </button>

    <span class="action-count">
      Share
    </span>


    <!-- SOUND -->

    <button
      class="sound-button">

      ♪

    </button>

  </div>

</section>


</main>


<!-- ================================
     BOTTOM NAV
================================ -->

<nav class="bottom-nav">

  <button class="nav-button active">

    <span class="nav-icon">
      🏠
    </span>

    <span>
      Home
    </span>

  </button>


  <button class="nav-button">

    <span class="nav-icon">
      🔍
    </span>

    <span>
      Discover
    </span>

  </button>


  <button
    class="nav-button upload-button"
    onclick="openCreate()">

    +

  </button>


  <button class="nav-button">

    <span class="nav-icon">
      💬
    </span>

    <span>
      Inbox
    </span>

  </button>


  <button class="nav-button">

    <span class="nav-icon">
      👤
    </span>

    <span>
      Profile
    </span>

  </button>

</nav>


<!-- ================================
     CREATE SCREEN
================================ -->

<section
  class="create-screen"
  id="createScreen">


  <div class="create-header">

    <button
      class="create-close"
      onclick="closeCreate()">

      ×

    </button>

    <h2>
      Create
    </h2>

  </div>


  <!-- OPTIONS -->

  <div
    class="create-options"
    id="createOptions">

    <button
      class="create-option"
      onclick="openCamera()">

      📹 Camera

    </button>

    <button
      class="create-option"
      onclick="openGallery()">

      🖼️ Upload

    </button>

  </div>


  <!-- EDITOR -->

  <div
    class="editor"
    id="editor">


    <div class="preview-box">

      <video
        id="previewVideo"
        class="preview-video"
        controls
        playsinline>
      </video>

    </div>


    <!-- CAPTION -->

    <div class="caption-box">

      <textarea
        id="captionInput"
        maxlength="2200"
        placeholder="Write a caption..."
        oninput="updateCharCount()"></textarea>

      <div
        class="char-count"
        id="charCount">

        0/2200

      </div>

    </div>


    <!-- HASHTAG -->

    <input
      id="hashtagInput"
      type="text"
      maxlength="300"
      placeholder="Add hashtags #ZYLO #ForYou">


    <!-- SOUND -->

    <div class="sound-row">

      🎵

      <span class="sound-name">
        Original sound - ZYLO
      </span>

      <span class="sound-arrow">
        ›
      </span>

    </div>


    <!-- SETTINGS -->

    <div class="settings-box">

      <select
        id="privacySelect"
        class="privacy-row">

        <option value="public">
          🌎 Everyone
        </option>

        <option value="friends">
          👥 Friends
        </option>

        <option value="private">
          🔒 Only me
        </option>

      </select>


      <div class="setting-row">

        <span>
          Allow comments
        </span>

        <button
          id="commentsToggle"
          class="toggle on"
          onclick="toggleSetting('commentsToggle')">

          <span class="toggle-circle"></span>

        </button>

      </div>


      <div class="setting-row">

        <span>
          Allow downloads
        </span>

        <button
          id="downloadsToggle"
          class="toggle"
          onclick="toggleSetting('downloadsToggle')">

          <span class="toggle-circle"></span>

        </button>

      </div>

    </div>


    <button
      class="choose-again"
      onclick="openGallery()">

      Choose another video

    </button>


    <div
      class="upload-status"
      id="uploadStatus">
    </div>


    <div class="post-buttons">

      <button
        class="draft-btn"
        onclick="saveDraft()">

        Draft

      </button>


      <button
        id="postButton"
        class="post-btn"
        onclick="postVideo()"
        disabled>

        Post

      </button>

    </div>

  </div>

</section>


<!-- FILE -->

<input
  id="videoInput"
  type="file"
  accept="video/*"
  style="display:none">


<script>

/* ================================
   BACKEND
================================ */

const BACKEND_URL =
"https://zylo-backend-ec5c.onrender.com";


/* ================================
   ELEMENTS
================================ */

const createScreen =
document.getElementById("createScreen");

const createOptions =
document.getElementById("createOptions");

const editor =
document.getElementById("editor");

const videoInput =
document.getElementById("videoInput");

const previewVideo =
document.getElementById("previewVideo");

const captionInput =
document.getElementById("captionInput");

const hashtagInput =
document.getElementById("hashtagInput");

const privacySelect =
document.getElementById("privacySelect");

const postButton =
document.getElementById("postButton");

const uploadStatus =
document.getElementById("uploadStatus");

const charCount =
document.getElementById("charCount");

const videoFeed =
document.getElementById("videoFeed");


let selectedVideo = null;

let previewURL = null;


/* ================================
   CREATE
================================ */

function openCreate(){

  createScreen.classList.add("show");

  createOptions.style.display="flex";

  editor.classList.remove("show");

  resetUploadState();

}


function closeCreate(){

  createScreen.classList.remove("show");

  if(previewURL){

    URL.revokeObjectURL(previewURL);

    previewURL=null;

  }

  previewVideo.removeAttribute("src");

  previewVideo.load();

  selectedVideo=null;

  videoInput.value="";

}


/* ================================
   CAMERA
================================ */

function openCamera(){

  videoInput.setAttribute(
    "capture",
    "environment"
  );

  videoInput.click();

}


/* ================================
   GALLERY
================================ */

function openGallery(){

  videoInput.removeAttribute(
    "capture"
  );

  videoInput.click();

}


/* ================================
   VIDEO SELECT
================================ */

videoInput.addEventListener(
"change",
function(){

  const file=this.files &&
              this.files[0];

  if(!file){
    return;
  }


  if(!file.type.startsWith("video/")){

    showError(
      "শুধু ভিডিও নির্বাচন করুন।"
    );

    return;

  }


  const maxSize =
    200 * 1024 * 1024;


  if(file.size > maxSize){

    showError(
      "ভিডিও সর্বোচ্চ 200 MB হতে পারবে।"
    );

    return;

  }


  selectedVideo=file;


  if(previewURL){

    URL.revokeObjectURL(
      previewURL
    );

  }


  previewURL =
    URL.createObjectURL(file);


  previewVideo.src =
    previewURL;

  previewVideo.load();


  createOptions.style.display=
    "none";

  editor.classList.add("show");


  resetStatus();

  postButton.disabled=false;

});


/* ================================
   CHARACTER COUNT
================================ */

function updateCharCount(){

  charCount.textContent =
    captionInput.value.length +
    "/2200";

}


/* ================================
   TOGGLE
================================ */

function toggleSetting(id){

  document
    .getElementById(id)
    .classList.toggle("on");

}


/* ================================
   RESET
================================ */

function resetUploadState(){

  selectedVideo=null;

  captionInput.value="";

  hashtagInput.value="";

  privacySelect.value="public";

  charCount.textContent=
    "0/2200";

  document
    .getElementById("commentsToggle")
    .classList.add("on");

  document
    .getElementById("downloadsToggle")
    .classList.remove("on");

  resetStatus();

  postButton.disabled=true;

}


function resetStatus(){

  uploadStatus.textContent="";

  uploadStatus.className=
    "upload-status";

}


function showError(message){

  uploadStatus.textContent=
    message;

  uploadStatus.className=
    "upload-status error";

}


/* ================================
   POST
================================ */

async function postVideo(){

  if(!selectedVideo){

    showError(
      "প্রথমে একটি ভিডিও নির্বাচন করুন।"
    );

    return;

  }


  postButton.disabled=true;

  uploadStatus.textContent=
    "সার্ভার প্রস্তুত হচ্ছে...";


  const caption =
    captionInput.value.trim();

  const hashtags =
    hashtagInput.value.trim();

  const privacy =
    privacySelect.value;

  const allowComments =
    document
    .getElementById("commentsToggle")
    .classList.contains("on");

  const allowDownloads =
    document
    .getElementById("downloadsToggle")
    .classList.contains("on");


  try{


    /* WAKE SERVER */

    try{

      await fetch(
        BACKEND_URL + "/",
        {
          method:"GET",
          cache:"no-store"
        }
      );

    }catch(e){

      console.log(e);

    }


    uploadStatus.textContent=
      "ভিডিও আপলোড হচ্ছে...";


    /* FORM */

    const formData =
      new FormData();


    formData.append(
      "video",
      selectedVideo
    );

    formData.append(
      "caption",
      caption
    );

    formData.append(
      "hashtags",
      hashtags
    );

    formData.append(
      "privacy",
      privacy
    );

    formData.append(
      "allowComments",
      allowComments
    );

    formData.append(
      "allowDownloads",
      allowDownloads
    );


    /* TIMEOUT */

    const controller =
      new AbortController();


    const timeout =
      setTimeout(
        ()=>{
          controller.abort();
        },
        120000
      );


    let response;


    try{

      response =
        await fetch(
          BACKEND_URL +
          "/api/upload",
          {
            method:"POST",
            body:formData,
            signal:controller.signal
          }
        );

    }finally{

      clearTimeout(timeout);

    }


    const contentType =
      response.headers.get(
        "content-type"
      ) || "";


    if(
      !contentType.includes(
        "application/json"
      )
    ){

      const text =
        await response.text();

      throw new Error(
        text ||
        "Server response পাওয়া যায়নি।"
      );

    }


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.message ||
        "ভিডিও আপলোড ব্যর্থ হয়েছে।"
      );

    }


    /* SUCCESS */

    uploadStatus.className=
      "upload-status success";

    uploadStatus.textContent=
      "ভিডিও সফলভাবে পোস্ট হয়েছে!";


    if(
      data.video &&
      data.video.url
    ){

      addVideoToFeed(
        data.video.url,
        caption,
        hashtags
      );


      localStorage.setItem(
        "zyloLastVideo",
        JSON.stringify({

          url:data.video.url,

          caption:caption,

          hashtags:hashtags,

          privacy:privacy,

          allowComments:
            allowComments,

          allowDownloads:
            allowDownloads,

          createdAt:
            new Date().toISOString()

        })
      );

    }


    setTimeout(
      ()=>{
        closeCreate();
      },
      1000
    );


  }catch(error){

    console.error(error);


    if(
      error.name ===
      "AbortError"
    ){

      showError(
        "আপলোডে বেশি সময় লাগছে। আবার চেষ্টা করুন।"
      );

    }else{

      showError(
        "আপলোড ব্যর্থ: " +
        (
          error.message ||
          "অজানা সমস্যা"
        )
      );

    }


    postButton.disabled=false;

  }

}


/* ================================
   ADD VIDEO
================================ */

function addVideoToFeed(
  url,
  caption,
  hashtags
){

  const section =
    document.createElement(
      "section"
    );

  section.className=
    "video-card";


  section.innerHTML=`

    <video
      class="video"
      src="${escapeAttribute(url)}"
      loop
      muted
      playsinline
      preload="metadata">
    </video>

    <div class="video-overlay"></div>

    <div class="video-info">

      <div class="username">
        @zylo_creator
      </div>

      <div class="caption">
        ${escapeHTML(caption)}
      </div>

      ${
        hashtags
        ?
        `<div class="hashtags">
          ${escapeHTML(hashtags)}
        </div>`
        :
        ""
      }

      <div class="music">
        ♪ Original sound - ZYLO
      </div>

    </div>


    <div class="video-actions">

      <button
        class="profile-action">
        Z

        <span class="follow-plus">
          +
        </span>
      </button>


      <button
        class="action-button"
        onclick="likeVideo(this)">
        ♡
      </button>

      <span class="action-count">
        0
      </span>


      <button
        class="action-button">
        💬
      </button>

      <span class="action-count">
        0
      </span>


      <button
        class="action-button save-button"
        onclick="saveVideo(this)">
        ♡
      </button>

      <span class="action-count">
        Save
      </span>


      <button
        class="action-button">
        ↗
      </button>

      <span class="action-count">
        Share
      </span>


      <button
        class="sound-button">
        ♪
      </button>

    </div>

  `;


  videoFeed.prepend(section);


  const newVideo =
    section.querySelector(
      ".video"
    );


  setupVideoObserver(
    newVideo
  );


  videoFeed.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ================================
   LIKE
================================ */

function likeVideo(button){

  const count =
    button.parentElement
    .querySelector(
      ".action-count"
    );


  let value =
    parseInt(
      count.textContent
    ) || 0;


  if(
    button.dataset.liked ===
    "true"
  ){

    button.textContent="♡";

    button.dataset.liked=
      "false";

    value=Math.max(
      0,
      value-1
    );

  }else{

    button.textContent="♥";

    button.dataset.liked=
      "true";

    value++;

  }


  count.textContent=value;

}


/* ================================
   SAVE
================================ */

function saveVideo(button){

  if(
    button.dataset.saved ===
    "true"
  ){

    button.textContent="♡";

    button.dataset.saved=
      "false";

  }else{

    button.textContent="🔖";

    button.dataset.saved=
      "true";

  }

}


/* ================================
   SECURITY
================================ */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

  return String(value)
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ================================
   AUTOPLAY
================================ */

const videoObserver =
new IntersectionObserver(
entries=>{

  entries.forEach(
    entry=>{

      const video =
        entry.target;


      if(entry.isIntersecting){

        video.play()
        .catch(
          ()=>{}
        );

      }else{

        video.pause();

      }

    }
  );

},
{
  threshold:.65
});


function setupVideoObserver(video){

  videoObserver.observe(video);

}


document
.querySelectorAll(".video")
.forEach(
  video=>{
    setupVideoObserver(video);
  }
);


/* ================================
   SEARCH
================================ */

function openSearch(){

  const query =
    prompt(
      "ZYLO Search"
    );


  if(
    query &&
    query.trim()
  ){

    alert(
      "আপনি সার্চ করেছেন: " +
      query.trim()
    );

  }

}


/* ================================
   DRAFT
================================ */

function saveDraft(){

  const draft={

    caption:
      captionInput.value,

    hashtags:
      hashtagInput.value,

    privacy:
      privacySelect.value,

    savedAt:
      new Date().toISOString()

  };


  localStorage.setItem(
    "zyloDraft",
    JSON.stringify(draft)
  );


  uploadStatus.className=
    "upload-status success";

  uploadStatus.textContent=
    "Draft সংরক্ষণ হয়েছে।";

}


/* ================================
   INIT
================================ */

window.addEventListener(
  "load",
  ()=>{
    updateCharCount();
  }
);

</script>

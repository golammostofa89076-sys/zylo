<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>ZYLO</title>

<style>

/* =========================================
   RESET
========================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}

body{
  position:fixed;
  inset:0;
}


/* =========================================
   APP
========================================= */

#app{
  position:fixed;
  inset:0;
  width:100%;
  height:100dvh;
  background:#000;
  overflow:hidden;
}


/* =========================================
   FEED
========================================= */

#feed{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  overflow-y:auto;
  overflow-x:hidden;

  scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;

  background:#000;
}

#feed::-webkit-scrollbar{
  display:none;
}


/* =========================================
   VIDEO CARD
========================================= */

.video-card{
  position:relative;

  width:100%;
  height:100dvh;
  min-height:100dvh;

  background:#000;

  scroll-snap-align:start;
  scroll-snap-stop:always;

  overflow:hidden;
}


/* =========================================
   FULL SCREEN VIDEO
========================================= */

.video-card video{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;
  object-position:center center;

  background:#000;

  z-index:1;
}


/* =========================================
   VIDEO DARK GRADIENT
========================================= */

.video-card::after{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.35),
      transparent 20%,
      transparent 60%,
      rgba(0,0,0,.78) 100%
    );

  z-index:2;
}


/* =========================================
   VIDEO ERROR
========================================= */

.video-error{
  position:absolute;

  left:30px;
  right:30px;

  top:50%;

  transform:translateY(-50%);

  text-align:center;

  z-index:5;

  color:#fff;

  display:none;
}

.video-error strong{
  display:block;

  font-size:24px;

  margin-bottom:10px;
}

.video-error span{
  display:block;

  color:#aaa;

  font-size:16px;

  line-height:1.5;
}


/* =========================================
   TOP BAR
========================================= */

.top-bar{
  position:absolute;

  top:0;
  left:0;
  right:0;

  height:90px;

  display:flex;
  align-items:flex-end;
  justify-content:center;

  padding-bottom:15px;

  z-index:20;
}

.tabs{
  display:flex;

  align-items:center;
  justify-content:center;

  gap:30px;
}

.tab{
  border:0;

  background:none;

  color:rgba(255,255,255,.65);

  font-size:20px;

  font-weight:500;

  padding:6px 0;

  position:relative;
}

.tab.active{
  color:#fff;

  font-weight:700;
}

.tab.active::after{
  content:"";

  position:absolute;

  left:0;
  right:0;

  bottom:-7px;

  height:4px;

  border-radius:5px;

  background:#fff;
}


/* =========================================
   SEARCH
========================================= */

.search-button{
  position:absolute;

  top:18px;
  right:12px;

  width:52px;
  height:52px;

  border-radius:50%;

  background:rgba(30,30,30,.9);

  display:flex;

  align-items:center;
  justify-content:center;

  border:0;

  z-index:30;
}

.search-icon{
  position:relative;

  width:25px;
  height:25px;

  border:4px solid #fff;

  border-radius:50%;
}

.search-icon::after{
  content:"";

  position:absolute;

  width:13px;
  height:4px;

  background:#fff;

  right:-10px;
  bottom:-5px;

  transform:rotate(48deg);

  border-radius:3px;
}


/* =========================================
   RIGHT ACTIONS
========================================= */

.video-actions{
  position:absolute;

  right:8px;
  top:50%;

  transform:translateY(-18%);

  width:65px;

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:10px;

  z-index:15;
}

.action{
  width:58px;
  min-height:58px;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  color:#fff;

  background:none;

  border:0;

  padding:0;
}

.action-label{
  margin-top:4px;

  color:#fff;

  font-size:13px;

  line-height:15px;

  white-space:nowrap;
}


/* =========================================
   PROFILE
========================================= */

.profile-action{
  margin-bottom:4px;
}

.avatar{
  width:57px;
  height:57px;

  border-radius:50%;

  border:2px solid #fff;

  display:flex;

  align-items:center;
  justify-content:center;

  background:#000;

  font-size:33px;

  position:relative;
}

.plus{
  position:absolute;

  right:-6px;
  bottom:-5px;

  width:25px;
  height:25px;

  border-radius:50%;

  display:flex;

  align-items:center;
  justify-content:center;

  background:#ff1760;

  border:2px solid #fff;

  font-size:18px;

  font-weight:bold;
}


/* =========================================
   ACTION ICON
========================================= */

.action-icon{
  width:38px;
  height:38px;

  display:flex;

  align-items:center;
  justify-content:center;

  color:#fff;

  font-size:35px;

  line-height:1;
}


/* HEART */

.heart-icon{
  font-size:40px;

  font-family:Arial,sans-serif;
}


/* =========================================
   COMMENT
========================================= */

.comment-icon{
  width:34px;
  height:28px;

  border:3px solid #fff;

  border-radius:7px;

  position:relative;
}

.comment-icon::after{
  content:"";

  position:absolute;

  left:3px;
  bottom:-8px;

  width:10px;
  height:10px;

  border-left:3px solid #fff;

  transform:skew(-25deg);
}


/* =========================================
   BOOKMARK
========================================= */

.bookmark-icon{
  width:29px;
  height:37px;

  border:3px solid #fff;

  border-bottom:0;

  position:relative;
}

.bookmark-icon::after{
  content:"";

  position:absolute;

  left:3px;
  right:3px;

  bottom:-6px;

  height:12px;

  background:#000;

  border-left:3px solid #fff;
  border-bottom:3px solid #fff;

  transform:rotate(-45deg);
}


/* =========================================
   SHARE
========================================= */

.share-icon{
  width:0;
  height:0;

  border-top:15px solid transparent;
  border-bottom:15px solid transparent;

  border-left:34px solid #fff;

  transform:rotate(-18deg);
}


/* =========================================
   MUSIC
========================================= */

.music-button{
  width:55px;
  height:55px;

  border-radius:50%;

  background:#111;

  border:2px solid rgba(255,255,255,.35);

  display:flex;

  align-items:center;
  justify-content:center;

  margin-top:2px;

  box-shadow:
    0 0 0 5px rgba(255,255,255,.04),
    0 0 0 9px rgba(255,255,255,.03);

  color:#fff;
}

.music-note{
  font-size:27px;
}


/* =========================================
   VIDEO INFO
========================================= */

.video-info{
  position:absolute;

  left:22px;
  right:92px;

  bottom:88px;

  z-index:10;

  color:#fff;
}

.username{
  display:flex;

  align-items:center;

  gap:7px;

  font-size:21px;

  font-weight:700;

  margin-bottom:12px;
}

.verified{
  width:29px;
  height:29px;

  border-radius:50%;

  background:#22c7e8;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:18px;

  font-weight:bold;
}

.caption{
  font-size:19px;

  line-height:1.35;

  margin-bottom:8px;
}

.tagline{
  font-size:18px;

  margin-bottom:10px;
}

.hashtags{
  color:#25c7ed;

  font-size:16px;

  line-height:1.45;

  margin-bottom:12px;
}

.sound{
  display:flex;

  align-items:center;

  gap:8px;

  font-size:16px;

  white-space:nowrap;
}

.sound-note{
  font-size:21px;
}


/* =========================================
   BOTTOM NAV
========================================= */

.bottom-nav{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:76px;

  background:#000;

  border-top:1px solid rgba(255,255,255,.12);

  display:flex;

  align-items:center;

  justify-content:space-around;

  z-index:50;
}

.nav-item{
  width:20%;

  height:100%;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  color:#fff;

  background:none;

  border:0;

  gap:5px;

  font-size:13px;
}

.nav-icon{
  width:29px;
  height:29px;

  display:flex;

  align-items:center;
  justify-content:center;

  color:#fff;
}


/* HOME */

.home-icon{
  width:27px;
  height:24px;

  border:3px solid #fff;

  border-top:0;

  position:relative;
}

.home-icon::before{
  content:"";

  position:absolute;

  width:19px;
  height:19px;

  border-left:3px solid #fff;
  border-top:3px solid #fff;

  transform:rotate(45deg);

  left:1px;
  top:-9px;
}


/* DISCOVER */

.nav-search{
  position:relative;

  width:25px;
  height:25px;

  border:3px solid #fff;

  border-radius:50%;
}

.nav-search::after{
  content:"";

  position:absolute;

  width:11px;
  height:3px;

  background:#fff;

  right:-8px;
  bottom:-5px;

  transform:rotate(45deg);

  border-radius:2px;
}


/* INBOX */

.inbox-icon{
  width:28px;
  height:23px;

  border:3px solid #fff;

  position:relative;
}

.inbox-icon::after{
  content:"";

  position:absolute;

  left:5px;
  right:5px;
  bottom:3px;

  height:7px;

  border-bottom:3px solid #fff;

  transform:skewY(-15deg);
}


/* PROFILE */

.profile-icon{
  position:relative;

  width:29px;
  height:30px;
}

.profile-icon::before{
  content:"";

  position:absolute;

  width:13px;
  height:13px;

  border:3px solid #fff;

  border-radius:50%;

  top:0;
  left:5px;
}

.profile-icon::after{
  content:"";

  position:absolute;

  width:25px;
  height:13px;

  border:3px solid #fff;

  border-bottom:0;

  border-radius:20px 20px 0 0;

  left:0;
  bottom:0;
}


/* =========================================
   CREATE BUTTON
========================================= */

.create-wrap{
  width:20%;

  display:flex;

  align-items:center;
  justify-content:center;
}

.create-button{
  position:relative;

  width:70px;
  height:46px;

  background:#fff;

  border-radius:12px;

  color:#000;

  font-size:31px;

  display:flex;

  align-items:center;
  justify-content:center;

  border:0;
}

.create-button::before{
  content:"";

  position:absolute;

  left:-8px;
  top:0;

  width:16px;
  height:46px;

  background:#20d9e5;

  border-radius:12px 0 0 12px;

  z-index:-1;
}

.create-button::after{
  content:"";

  position:absolute;

  right:-8px;
  top:0;

  width:16px;
  height:46px;

  background:#ff1760;

  border-radius:0 12px 12px 0;

  z-index:-1;
}


/* =========================================
   CREATE SCREEN
========================================= */

#createScreen{
  position:fixed;

  inset:0;

  background:#000;

  z-index:200;

  display:none;

  overflow-y:auto;
}

#createScreen.open{
  display:block;
}

.create-header{
  height:60px;

  display:flex;

  align-items:center;
  justify-content:space-between;

  padding:0 18px;

  border-bottom:1px solid #222;

  font-size:20px;

  font-weight:bold;
}

.close-create{
  font-size:30px;

  color:#fff;

  background:none;

  border:0;
}

.create-content{
  padding:20px;
}

.upload-box{
  width:100%;
  height:230px;

  border:2px dashed #555;

  border-radius:15px;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:12px;

  margin-bottom:20px;
}

.upload-icon{
  font-size:55px;
}

.upload-text{
  font-size:18px;
}

.file-input{
  display:none;
}

.preview{
  width:100%;

  max-height:420px;

  border-radius:14px;

  object-fit:contain;

  background:#111;

  display:none;
}

.caption-input{
  width:100%;

  min-height:100px;

  background:#111;

  color:#fff;

  border:1px solid #333;

  border-radius:12px;

  padding:14px;

  font-size:17px;

  resize:none;

  margin-top:15px;
}

.post-button{
  width:100%;

  height:52px;

  margin-top:15px;

  background:#fff;

  color:#000;

  border:0;

  border-radius:10px;

  font-size:18px;

  font-weight:bold;
}

.post-button:disabled{
  opacity:.6;
}

.status{
  text-align:center;

  margin-top:15px;

  color:#aaa;

  line-height:1.5;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

  .tabs{
    gap:27px;
  }

  .tab{
    font-size:19px;
  }

  .search-button{
    width:50px;
    height:50px;

    top:12px;
    right:9px;
  }

  .video-actions{
    right:6px;
    top:51%;

    gap:9px;
  }

  .avatar{
    width:55px;
    height:55px;

    font-size:31px;
  }

  .action-icon{
    font-size:31px;
  }

  .heart-icon{
    font-size:37px;
  }

  .action-label{
    font-size:12px;
  }

  .music-button{
    width:55px;
    height:55px;
  }

  .video-info{
    left:22px;
    right:92px;
    bottom:87px;
  }

  .username{
    font-size:20px;
  }

  .caption{
    font-size:19px;
  }

  .tagline{
    font-size:18px;
  }

  .hashtags{
    font-size:16px;
  }

  .sound{
    font-size:16px;
  }

  .bottom-nav{
    height:76px;
  }

}

</style>

</head>


<body>


<div id="app">


<!-- =====================================
     VIDEO FEED
===================================== -->

<main id="feed">


<section
  class="video-card"
  data-video-id="demo-video">


  <!-- VIDEO -->

  <video
    class="video"
    src="https://zylo-backend-ec5c.onrender.com/uploads/video1.mp4"

  <!-- VIDEO ERROR -->

  <div class="video-error">

  <!-- TOP -->

  <div class="top-bar">

      <span class="bookmark-icon"></span>

      <span class="action-label save-label">

    <button class="action share-button">

      <span class="share-icon"></span>

  <!-- DISCOVER -->

  <div class="create-wrap">

</div>


<!-- =====================================
     CREATE / UPLOAD SCREEN
===================================== -->

<div id="createScreen">


  <div class="create-header">

    <button
      id="closeCreate"
      class="close-create">

      ×

    </button>


    <span>
      Create
    </span>


    <span style="width:30px;"></span>

  </div>


  <div class="create-content">


    <label
      class="upload-box"
      for="videoInput">

      <div class="upload-icon">
        ＋
      </div>

      <div class="upload-text">
        Choose a video
      </div>

    </label>


    <input
      id="videoInput"
      class="file-input"
      type="file"
      accept="video/*">


    <video
      id="previewVideo"
      class="preview"
      controls
      playsinline>
    </video>


    <textarea
      id="captionInput"
      class="caption-input"
      placeholder="Write a caption...">
    </textarea>

      id="postButton"
      class="post-button">

      Post

    </button>


    <div
      id="uploadStatus"
      class="status">
    </div>


  </div>

<script>

/* =========================================
   ZYLO CONFIG
========================================= */

const BACKEND_URL =
  "https://zylo-backend-ec5c.onrender.com";


/* =========================================
   ELEMENTS
========================================= */

const feed =
  document.getElementById("feed");

const createButton =
  document.getElementById("createButton");

const createScreen =
  document.getElementById("createScreen");

const closeCreate =
  document.getElementById("closeCreate");

const videoInput =
  document.getElementById("videoInput");

const previewVideo =
  document.getElementById("previewVideo");

const captionInput =
  document.getElementById("captionInput");

const postButton =
  document.getElementById("postButton");

const uploadStatus =
  document.getElementById("uploadStatus");


/* =========================================
   CREATE SCREEN
========================================= */

createButton.addEventListener(
  "click",
  () => {

    createScreen.classList.add("open");

  }
);


closeCreate.addEventListener(
  "click",
  () => {

    createScreen.classList.remove("open");

  }
);


/* =========================================
   SELECT VIDEO
========================================= */

let selectedVideo = null;

videoInput.addEventListener(
  "change",
  () => {

    const file =
      videoInput.files[0];

    if(!file){

      return;

    }

    selectedVideo =
      file;

    const url =
      URL.createObjectURL(file);

    previewVideo.src =
      url;

    previewVideo.style.display =
      "block";

    uploadStatus.textContent =
      "ভিডিও প্রস্তুত। Post চাপুন।";

  }
);


/* =========================================
   VIDEO ERROR HANDLER
========================================= */

function setupVideoError(card){

  const video =
    card.querySelector("video");

  const error =
    card.querySelector(".video-error");

  if(!video || !error){

    return;

  }

  video.addEventListener(
    "error",
    () => {

      error.style.display =
        "block";

    }
  );

  video.addEventListener(
    "loadeddata",
    () => {

      error.style.display =
        "none";

    }
  );

}


/* =========================================
   VIDEO SETUP
========================================= */

function setupVideo(card){

  const video =
    card.querySelector("video");

  if(!video){

    return;

  }

  setupVideoError(card);


  /* TAP VIDEO = PLAY / PAUSE */

  video.addEventListener(
    "click",
    () => {

      if(video.paused){

        video.play().catch(()=>{});

      }else{

        video.pause();

      }

    }
  );


  /* OBSERVE CARD */

  observer.observe(card);

}

/* =========================================
   HTML ESCAPE
========================================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================
   INTERSECTION OBSERVER
========================================= */

const observer =
  new IntersectionObserver(
    entries => {

      entries.forEach(
        entry => {

          const video =
            entry.target.querySelector(
              "video"
            );

          if(!video){

            return;

          }


          if(
            entry.isIntersecting &&
            entry.intersectionRatio >= 0.65
          ){

            /* Pause all other videos */

            document
              .querySelectorAll(
                "#feed video"
              )
              .forEach(
                otherVideo => {

                  if(
                    otherVideo !== video
                  ){

                    otherVideo.pause();

                  }

                }
              );


            /* Play current */

            video
              .play()
              .catch(()=>{});


          }else{

            video.pause();

          }

        }
      );

    },
    {
      threshold:[0.65]
    }
  );


/* =========================================
   INITIAL VIDEOS
========================================= */

document
  .querySelectorAll(".video-card")
  .forEach(
    card => {

      setupVideo(card);

    }
  );


/* =========================================
   LIKE
========================================= */

document.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        ".like-button"
      );

    if(!button){

      return;

    }

    const count =
      button.querySelector(
        ".like-count"
      );

    const heart =
      button.querySelector(
        ".heart-icon"
      );

    let number =
      Number(count.textContent) || 0;

    const liked =
      button.dataset.liked === "true";


    if(liked){

      number--;

      button.dataset.liked =
        "false";

      heart.textContent =
        "♡";

    }else{

      number++;

      button.dataset.liked =
        "true";

      heart.textContent =
        "♥";

    }


    count.textContent =
      Math.max(0,number);

  }
);


/* =========================================
   SAVE
========================================= */

document.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        ".save-button"
      );

    if(!button){

      return;

    }

    const label =
      button.querySelector(
        ".save-label"
      );


    const saved =
      button.dataset.saved === "true";


    if(saved){

      button.dataset.saved =
        "false";

      label.textContent =
        "Save";

    }else{

      button.dataset.saved =
        "true";

      label.textContent =
        "Saved ✓";

    }

  }
);


/* =========================================
   SHARE
========================================= */

document.addEventListener(
  "click",
  async event => {

    const button =
      event.target.closest(
        ".share-button"
      );

    if(!button){

      return;

    }


    try{

      if(
        navigator.share
      ){

        await navigator.share({

          title:"ZYLO",

          text:
            "Watch this video on ZYLO",

          url:
            window.location.href

        });

      }else{

        await navigator.clipboard.writeText(
          window.location.href
        );

        alert(
          "ZYLO link copied!"
        );

      }

    }catch(error){

      console.log(
        "Share cancelled"
      );

    }

  }
);


/* =========================================
   UPLOAD VIDEO
========================================= */

postButton.addEventListener(
  "click",
  async () => {

    if(!selectedVideo){

      uploadStatus.textContent =
        "আগে একটি ভিডিও নির্বাচন করুন।";

      return;

    }


    postButton.disabled =
      true;

    postButton.textContent =
      "Uploading...";


    uploadStatus.textContent =
      "ভিডিও আপলোড হচ্ছে...";


    try{

      const formData =
        new FormData();


      formData.append(
        "video",
        selectedVideo
      );


      const response =
        await fetch(
          BACKEND_URL +
          "/api/upload",
          {
            method:"POST",
            body:formData
          }
        );


      const data =
        await response.json();


      if(
        !response.ok ||
        !data.success
      ){

        throw new Error(
          data.message ||
          "Upload failed"
        );

      }


      /* VIDEO DATA */

      const uploadedVideo =
        data.video;


      /* SAVE */

      localStorage.setItem(
        "zylo_last_video",
        JSON.stringify(
          uploadedVideo
        )
      );


      /* ADD TO FEED */

      addVideoToFeed(
        uploadedVideo.url,
        captionInput.value
      );


      uploadStatus.textContent =
        "ভিডিও সফলভাবে আপলোড হয়েছে ✓";


      postButton.textContent =
        "Posted ✓";


      setTimeout(
        () => {

          createScreen
            .classList
            .remove("open");


          postButton.disabled =
            false;


          postButton.textContent =
            "Post";


          uploadStatus.textContent =
            "";


          captionInput.value =
            "";


          videoInput.value =
            "";


          previewVideo.src =
            "";


          previewVideo.style.display =
            "none";


          selectedVideo =
            null;

        },
        1200
      );


    }catch(error){

      console.error(error);


      uploadStatus.textContent =
        "আপলোড ব্যর্থ হয়েছে: " +
        error.message;


      postButton.disabled =
        false;


      postButton.textContent =
        "Post";

    }

  }
);

<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ZYLO</title>

<link rel="stylesheet" href="style.css">

<style>

/* =====================================================
   ZYLO BASE
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial, sans-serif;
  overflow:hidden;
}

button,
input,
textarea,
select{
  font-family:inherit;
}


/* =====================================================
   TOP BAR
===================================================== */

.top-bar{
  position:fixed;
  top:0;
  left:0;
  right:0;

  height:78px;

  z-index:100;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.75),
      rgba(0,0,0,0)
    );
}

.top-tabs{
  display:flex;
  align-items:center;
  gap:27px;
}

.top-tab{
  border:0;
  background:transparent;

  color:#aaa;

  font-size:18px;
  font-weight:500;

  padding:12px 3px;
}

.top-tab.active{
  color:#fff;
  font-weight:700;

  border-bottom:4px solid #fff;
}

.search-btn{
  position:absolute;

  top:14px;
  right:14px;

  width:58px;
  height:58px;

  border:0;
  border-radius:50%;

  background:rgba(38,38,38,.9);

  color:#fff;

  font-size:34px;

  display:flex;
  align-items:center;
  justify-content:center;
}


/* =====================================================
   VIDEO FEED
===================================================== */

.video-feed{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  overflow-y:auto;

  scroll-snap-type:y mandatory;

  scrollbar-width:none;
}

.video-feed::-webkit-scrollbar{
  display:none;
}

.video-card{
  position:relative;

  width:100%;
  height:100vh;

  min-height:100vh;

  scroll-snap-align:start;

  overflow:hidden;

  background:#000;
}

.video{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  background:#000;
}

.video-overlay{
  position:absolute;

  inset:0;

  pointer-events:none;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,.88) 0%,
      rgba(0,0,0,.48) 18%,
      rgba(0,0,0,.08) 45%,
      rgba(0,0,0,0) 65%
    );
}


/* =====================================================
   PROFESSIONAL RIGHT ACTIONS
===================================================== */

.video-actions{

  position:absolute;

  right:10px;
  bottom:140px;

  width:70px;

  z-index:50;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:1px;

  user-select:none;
}


/* PROFILE */

.zylo-profile{

  position:relative;

  width:58px;
  height:58px;

  margin-bottom:12px;

  padding:0;

  border-radius:50%;

  border:2px solid #fff;

  background:#262626;

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
    0 3px 12px rgba(0,0,0,.65);
}

.profile-letter{

  font-size:28px;
  font-weight:700;

  line-height:1;
}

.follow-plus{

  position:absolute;

  right:0;
  bottom:-8px;

  width:26px;
  height:26px;

  border-radius:50%;

  border:2px solid #000;

  background:#ff2d55;

  color:#fff;

  font-size:19px;
  font-weight:700;

  display:flex;
  align-items:center;
  justify-content:center;
}


/* ACTION BUTTON */

.zylo-action{

  width:60px;
  height:52px;

  margin:0;
  padding:0;

  border:0;

  background:transparent;

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  filter:
    drop-shadow(
      0 2px 5px rgba(0,0,0,.9)
    );
}

.action-icon{

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:39px;

  line-height:1;

  transition:
    transform .15s ease,
    color .15s ease;
}

.zylo-action:active .action-icon{
  transform:scale(.82);
}


/* LIKE */

.like-action[data-liked="true"]
.action-icon{

  color:#ff2d55;

  transform:scale(1.05);
}


/* COMMENT */

.comment-icon{
  font-size:31px;
}


/* SAVE */

.save-action .action-icon{
  font-size:34px;
}

.save-action[data-saved="true"]
.action-icon{

  color:#ffd84d;

  transform:scale(1.05);
}


/* SHARE */

.share-action .action-icon{

  font-size:39px;
  font-weight:300;
}


/* COUNTS */

.action-number{

  min-height:18px;

  margin-top:-3px;
  margin-bottom:5px;

  color:#fff;

  font-size:14px;
  font-weight:500;

  text-shadow:
    0 2px 5px rgba(0,0,0,.9);
}


/* LABEL */

.action-label{

  min-height:18px;

  margin-top:-3px;
  margin-bottom:7px;

  color:#fff;

  font-size:13px;
  font-weight:500;

  text-shadow:
    0 2px 5px rgba(0,0,0,.9);
}


/* SOUND */

.zylo-sound{

  width:58px;
  height:58px;

  margin-top:7px;

  padding:0;

  border-radius:50%;

  border:2px solid rgba(255,255,255,.28);

  background:
    radial-gradient(
      circle at center,
      #333 0%,
      #1b1b1b 65%,
      #111 100%
    );

  color:#fff;

  font-size:31px;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
    0 4px 14px rgba(0,0,0,.7);
}

.zylo-sound span{
  display:block;
}


/* =====================================================
   VIDEO INFORMATION
===================================================== */

.video-info{

  position:absolute;

  left:20px;

  right:95px;

  bottom:140px;

  z-index:40;

  max-width:
    calc(100% - 115px);

  text-shadow:
    0 2px 5px rgba(0,0,0,.9);
}

.username{

  margin-bottom:8px;

  font-size:19px;
  font-weight:700;
}

.caption{

  margin-bottom:7px;

  font-size:17px;
  line-height:1.4;

  word-break:break-word;
}

.hashtags{

  margin-bottom:8px;

  font-size:15px;
  line-height:1.35;

  word-break:break-word;
}

.music{

  color:#eee;

  font-size:15px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


/* =====================================================
   BOTTOM NAVIGATION
===================================================== */

.bottom-nav{

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  height:80px;

  z-index:200;

  display:flex;
  align-items:center;
  justify-content:space-around;

  background:rgba(0,0,0,.96);

  border-top:1px solid #222;
}

.nav-button{

  width:20%;
  height:75px;

  padding:3px 0;

  border:0;

  background:transparent;

  color:#fff;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:3px;

  font-size:13px;
}

.nav-icon{
  font-size:25px;
  line-height:1;
}

.nav-button.active{
  color:#fff;
}


/* CREATE BUTTON */

.upload-button{

  width:65px;
  height:50px;

  border-radius:16px;

  background:#fff;

  color:#000;

  font-size:35px;
  font-weight:400;

  box-shadow:
    -4px 0 0 #00f2ea,
    4px 0 0 #ff0050;
}


/* =====================================================
   CREATE SCREEN
===================================================== */

.create-screen{

  position:fixed;

  inset:0;

  z-index:500;

  display:none;
  flex-direction:column;

  background:#000;

  overflow-y:auto;
}

.create-screen.show{
  display:flex;
}


/* HEADER */

.create-header{

  position:sticky;

  top:0;

  height:72px;
  min-height:72px;

  z-index:20;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#000;

  border-bottom:1px solid #222;
}

.create-header h2{

  margin:0;

  font-size:25px;
}

.create-close{

  position:absolute;

  left:18px;

  width:52px;
  height:52px;

  padding:0;

  border:0;
  border-radius:50%;

  background:#242424;

  color:#fff;

  font-size:38px;

  display:flex;
  align-items:center;
  justify-content:center;
}


/* =====================================================
   CREATE OPTIONS
===================================================== */

.create-options{

  display:flex;

  align-items:center;
  justify-content:center;

  gap:15px;

  padding:50px 20px;
}

.create-option{

  width:150px;
  height:100px;

  border:1px solid #333;

  border-radius:18px;

  background:#181818;

  color:#fff;

  font-size:17px;
}


/* =====================================================
   EDITOR
===================================================== */

.editor{

  display:none;

  padding:
    20px
    32px
    120px;
}

.editor.show{
  display:block;
}


/* PREVIEW */

.preview-box{

  width:100%;

  margin-bottom:16px;

  overflow:hidden;

  border-radius:18px;

  background:#111;
}

.preview-video{

  display:block;

  width:100%;

  max-height:310px;

  background:#000;
}


/* CAPTION */

.caption-box{

  position:relative;

  width:100%;

  margin-bottom:14px;

  border-radius:20px;

  background:#181818;
}

#captionInput{

  width:100%;

  min-height:150px;

  padding:24px;

  padding-bottom:42px;

  border:0;
  outline:0;

  resize:none;

  background:transparent;

  color:#fff;

  font-size:19px;
}

#captionInput::placeholder{
  color:#888;
}

.char-count{

  position:absolute;

  right:20px;
  bottom:15px;

  color:#888;

  font-size:14px;
}


/* HASHTAGS */

#hashtagInput{

  width:100%;
  height:65px;

  margin-bottom:14px;

  padding:0 24px;

  border:0;
  outline:0;

  border-radius:18px;

  background:#181818;

  color:#fff;

  font-size:18px;
}

#hashtagInput::placeholder{
  color:#888;
}


/* SOUND ROW */

.sound-row{

  width:100%;
  min-height:72px;

  margin-bottom:14px;
  padding:0 22px;

  border-radius:18px;

  background:#181818;

  display:flex;
  align-items:center;

  font-size:25px;
}

.sound-name{

  margin-left:14px;

  color:#fff;

  font-size:17px;
}

.sound-arrow{

  margin-left:auto;

  color:#aaa;

  font-size:29px;
}


/* =====================================================
   SETTINGS
===================================================== */

.settings-box{

  width:100%;

  margin-bottom:15px;

  overflow:hidden;

  border-radius:20px;

  background:#181818;
}

.privacy-row{

  width:100%;
  height:72px;

  padding:0 24px;

  border:0;
  outline:0;

  background:transparent;

  color:#fff;

  font-size:17px;
}

.privacy-row option{
  background:#181818;
  color:#fff;
}

.setting-row{

  min-height:68px;

  padding:0 24px;

  border-top:1px solid #292929;

  display:flex;
  align-items:center;

  font-size:17px;
}

.setting-row span:first-child{
  flex:1;
}


/* TOGGLE */

.toggle{

  position:relative;

  width:54px;
  height:32px;

  padding:0;

  border:0;
  border-radius:20px;

  background:#555;
}

.toggle-circle{

  position:absolute;

  top:4px;
  left:4px;

  width:24px;
  height:24px;

  border-radius:50%;

  background:#fff;

  transition:.2s;
}

.toggle.on{
  background:#ff3158;
}

.toggle.on .toggle-circle{
  left:26px;
}


/* CHOOSE AGAIN */

.choose-again{

  width:100%;
  height:52px;

  margin-bottom:12px;

  border:1px solid #444;

  border-radius:14px;

  background:#111;

  color:#fff;

  font-size:16px;
}


/* STATUS */

.upload-status{

  min-height:30px;

  padding:7px;

  text-align:center;

  color:#ddd;

  font-size:15px;
}

.upload-status.success{
  color:#43e36b;
}

.upload-status.error{
  color:#ff526b;
}


/* POST BUTTONS */

.post-buttons{

  display:flex;

  gap:16px;

  padding:10px 0;

  background:#000;
}

.draft-btn,
.post-btn{

  flex:1;

  height:60px;

  border:0;

  border-radius:18px;

  font-size:20px;

  font-weight:700;
}

.draft-btn{

  background:#292929;

  color:#fff;
}

.post-btn{

  background:#ff3158;

  color:#fff;
}

.post-btn:disabled{
  opacity:.45;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .top-tabs{
    gap:21px;
  }

  .top-tab{
    font-size:17px;
  }

  .search-btn{
    width:56px;
    height:56px;
  }

  .video-actions{

    right:6px;
    bottom:137px;

    width:69px;
  }

  .zylo-profile{

    width:56px;
    height:56px;
  }

  .zylo-action{

    width:56px;
    height:50px;
  }

  .action-icon{
    font-size:37px;
  }

  .comment-icon{
    font-size:30px;
  }

  .zylo-sound{

    width:56px;
    height:56px;
  }

  .video-info{

    left:18px;
    right:88px;

    bottom:137px;

    max-width:
      calc(100% - 108px);
  }

  .username{
    font-size:18px;
  }

  .caption{
    font-size:16px;
  }

  .hashtags{
    font-size:14px;
  }

  .music{
    font-size:14px;
  }

  .editor{
    padding-left:20px;
    padding-right:20px;
  }

}


/* SMALL SCREEN */

@media(max-height:700px){

  .video-actions{
    bottom:122px;
  }

  .video-info{
    bottom:122px;
  }

  .bottom-nav{
    height:72px;
  }

}

</style>
</head>


<body>


<!-- =====================================================
     TOP BAR
===================================================== -->

<header class="top-bar">

  <div class="top-tabs">

    <button class="top-tab">
      LIVE
    </button>

    <button class="top-tab">
      Following
    </button>

    <button class="top-tab active">
      For You
    </button>

  </div>


  <button
    class="search-btn"
    onclick="openSearch()">

    ⌕

  </button>

</header>



<!-- =====================================================
     VIDEO FEED
===================================================== -->

<main
  class="video-feed"
  id="videoFeed">


  <!-- DEFAULT VIDEO -->

  <section class="video-card">

    <video
      class="video"
      src="uploads/video1.mp4"
      loop
      muted
      playsinline
      preload="metadata">
    </video>


    <div class="video-overlay"></div>


    <!-- INFORMATION -->

    <div class="video-info">

      <div class="username">
        @zylo_creator
      </div>


      <div class="caption">
        Welcome to ZYLO 🌎
        <br>
        Create • Connect • Grow
      </div>


      <div class="hashtags">
        #ZYLO #Create #Connect #Grow #ForYou
      </div>


      <div class="music">
        ♪ Original sound - ZYLO
      </div>

    </div>



    <!-- =================================================
         RIGHT SIDE ACTIONS
    ================================================= -->

    <div class="video-actions">


      <!-- PROFILE -->

      <button
        class="zylo-profile">

        <span class="profile-letter">
          Z
        </span>

        <span class="follow-plus">
          +
        </span>

      </button>



      <!-- LIKE -->

      <button
        class="zylo-action like-action"
        onclick="likeVideo(this)">

        <span class="action-icon">
          ♡
        </span>

      </button>

      <span class="action-number">
        0
      </span>



      <!-- COMMENT -->

      <button
        class="zylo-action"
        onclick="openComments()">

        <span class="action-icon comment-icon">
          💬
        </span>

      </button>

      <span class="action-number">
        0
      </span>



      <!-- SAVE -->

      <button
        class="zylo-action save-action"
        onclick="saveVideo(this)">

        <span class="action-icon">
          🔖
        </span>

      </button>

      <span class="action-label">
        Save
      </span>



      <!-- SHARE -->

      <button
        class="zylo-action share-action"
        onclick="shareVideo()">

        <span class="action-icon">
          ↗
        </span>

      </button>

      <span class="action-label">
        Share
      </span>



      <!-- SOUND -->

      <button
        class="zylo-sound"
        onclick="toggleSound(this)">

        <span>
          ♪
        </span>

      </button>


    </div>

  </section>


</main>



<!-- =====================================================
     BOTTOM NAVIGATION
===================================================== -->

<nav class="bottom-nav">


  <button
    class="nav-button active">

    <span class="nav-icon">
      🏠
    </span>

    <span>
      Home
    </span>

  </button>



  <button
    class="nav-button">

    <span class="nav-icon">
      🔍
    </span>

    <span>
      Discover
    </span>

  </button>



  <button
    class="nav-button upload-button"
    onclick="openCreate()">

    +

  </button>



  <button
    class="nav-button">

    <span class="nav-icon">
      💬
    </span>

    <span>
      Inbox
    </span>

  </button>



  <button
    class="nav-button">

    <span class="nav-icon">
      👤
    </span>

    <span>
      Profile
    </span>

  </button>


</nav>



<!-- =====================================================
     CREATE SCREEN
===================================================== -->

<section
  class="create-screen"
  id="createScreen">


  <div class="create-header">

    <button
      class="create-close"
      onclick="closeCreate()">

      ×

    </button>


    <h2>
      Create
    </h2>

  </div>



  <!-- CREATE OPTIONS -->

  <div
    class="create-options"
    id="createOptions">


    <button
      class="create-option"
      onclick="openCamera()">

      📹 Camera

    </button>


    <button
      class="create-option"
      onclick="openGallery()">

      🖼️ Upload

    </button>


  </div>



  <!-- =================================================
       VIDEO EDITOR
  ================================================= -->

  <div
    class="editor"
    id="editor">


    <!-- PREVIEW -->

    <div class="preview-box">

      <video
        id="previewVideo"
        class="preview-video"
        controls
        playsinline>
      </video>

    </div>



    <!-- CAPTION -->

    <div class="caption-box">

      <textarea
        id="captionInput"
        maxlength="2200"
        placeholder="Write a caption..."
        oninput="updateCharCount()"></textarea>


      <div
        class="char-count"
        id="charCount">

        0/2200

      </div>

    </div>



    <!-- HASHTAGS -->

    <input
      id="hashtagInput"
      type="text"
      maxlength="300"
      placeholder="Add hashtags #ZYLO #ForYou">



    <!-- SOUND -->

    <div class="sound-row">

      🎵

      <span class="sound-name">
        Original sound - ZYLO
      </span>

      <span class="sound-arrow">
        ›
      </span>

    </div>



    <!-- SETTINGS -->

    <div class="settings-box">


      <select
        id="privacySelect"
        class="privacy-row">

        <option value="public">
          🌎 Everyone
        </option>

        <option value="friends">
          👥 Friends
        </option>

        <option value="private">
          🔒 Only me
        </option>

      </select>



      <!-- COMMENTS -->

      <div class="setting-row">

        <span>
          Allow comments
        </span>


        <button
          id="commentsToggle"
          class="toggle on"
          onclick="toggleSetting('commentsToggle')">

          <span class="toggle-circle"></span>

        </button>

      </div>



      <!-- DOWNLOADS -->

      <div class="setting-row">

        <span>
          Allow downloads
        </span>


        <button
          id="downloadsToggle"
          class="toggle"
          onclick="toggleSetting('downloadsToggle')">

          <span class="toggle-circle"></span>

        </button>

      </div>


    </div>



    <!-- CHOOSE ANOTHER -->

    <button
      class="choose-again"
      onclick="openGallery()">

      Choose another video

    </button>



    <!-- STATUS -->

    <div
      class="upload-status"
      id="uploadStatus">
    </div>



    <!-- BUTTONS -->

    <div class="post-buttons">


      <button
        class="draft-btn"
        onclick="saveDraft()">

        Draft

      </button>


      <button
        id="postButton"
        class="post-btn"
        onclick="postVideo()"
        disabled>

        Post

      </button>


    </div>


  </div>

</section>



<!-- VIDEO FILE INPUT -->

<input
  id="videoInput"
  type="file"
  accept="video/*"
  style="display:none">



<script>

/* =====================================================
   BACKEND
===================================================== */

const BACKEND_URL =
  "https://zylo-backend-ec5c.onrender.com";


/* =====================================================
   ELEMENTS
===================================================== */

const createScreen =
  document.getElementById("createScreen");

const createOptions =
  document.getElementById("createOptions");

const editor =
  document.getElementById("editor");

const videoInput =
  document.getElementById("videoInput");

const previewVideo =
  document.getElementById("previewVideo");

const captionInput =
  document.getElementById("captionInput");

const hashtagInput =
  document.getElementById("hashtagInput");

const privacySelect =
  document.getElementById("privacySelect");

const postButton =
  document.getElementById("postButton");

const uploadStatus =
  document.getElementById("uploadStatus");

const charCount =
  document.getElementById("charCount");

const videoFeed =
  document.getElementById("videoFeed");


let selectedVideo = null;

let previewURL = null;


/* =====================================================
   CREATE
===================================================== */

function openCreate(){

  createScreen.classList.add("show");

  createOptions.style.display = "flex";

  editor.classList.remove("show");

  resetUploadState();

}


function closeCreate(){

  createScreen.classList.remove("show");


  if(previewURL){

    URL.revokeObjectURL(previewURL);

    previewURL = null;

  }


  previewVideo.pause();

  previewVideo.removeAttribute("src");

  previewVideo.load();


  selectedVideo = null;

  videoInput.value = "";

}


/* =====================================================
   CAMERA
===================================================== */

function openCamera(){

  videoInput.setAttribute(
    "capture",
    "environment"
  );

  videoInput.click();

}


/* =====================================================
   GALLERY
===================================================== */

function openGallery(){

  videoInput.removeAttribute(
    "capture"
  );

  videoInput.click();

}


/* =====================================================
   VIDEO SELECT
===================================================== */

videoInput.addEventListener(
  "change",
  function(){

    const file =
      this.files &&
      this.files[0];


    if(!file){
      return;
    }


    if(!file.type.startsWith("video/")){

      showError(
        "শুধু ভিডিও ফাইল নির্বাচন করুন।"
      );

      return;

    }


    const maxSize =
      200 * 1024 * 1024;


    if(file.size > maxSize){

      showError(
        "ভিডিও সর্বোচ্চ 200 MB হতে পারবে।"
      );

      return;

    }


    selectedVideo = file;


    if(previewURL){

      URL.revokeObjectURL(
        previewURL
      );

    }


    previewURL =
      URL.createObjectURL(file);


    previewVideo.src =
      previewURL;


    previewVideo.load();


    createOptions.style.display =
      "none";


    editor.classList.add("show");


    resetStatus();


    postButton.disabled = false;

  }
);


/* =====================================================
   CHARACTER COUNT
===================================================== */

function updateCharCount(){

  charCount.textContent =
    captionInput.value.length +
    "/2200";

}


/* =====================================================
   TOGGLES
===================================================== */

function toggleSetting(id){

  const element =
    document.getElementById(id);

  element.classList.toggle("on");

}


/* =====================================================
   RESET
===================================================== */

function resetUploadState(){

  selectedVideo = null;

  captionInput.value = "";

  hashtagInput.value = "";

  privacySelect.value = "public";


  charCount.textContent =
    "0/2200";


  document
    .getElementById("commentsToggle")
    .classList.add("on");


  document
    .getElementById("downloadsToggle")
    .classList.remove("on");


  resetStatus();


  postButton.disabled = true;

}


function resetStatus(){

  uploadStatus.textContent = "";

  uploadStatus.className =
    "upload-status";

}


function showError(message){

  uploadStatus.textContent =
    message;

  uploadStatus.className =
    "upload-status error";

}


/* =====================================================
   POST / UPLOAD
===================================================== */

async function postVideo(){

  if(!selectedVideo){

    showError(
      "প্রথমে একটি ভিডিও নির্বাচন করুন।"
    );

    return;

  }


  postButton.disabled = true;


  uploadStatus.className =
    "upload-status";


  uploadStatus.textContent =
    "সার্ভার প্রস্তুত হচ্ছে...";


  const caption =
    captionInput.value.trim();


  const hashtags =
    hashtagInput.value.trim();


  const privacy =
    privacySelect.value;


  const allowComments =
    document
      .getElementById("commentsToggle")
      .classList
      .contains("on");


  const allowDownloads =
    document
      .getElementById("downloadsToggle")
      .classList
      .contains("on");


  try{


    /* WAKE BACKEND */

    try{

      await fetch(
        BACKEND_URL + "/",
        {
          method:"GET",
          cache:"no-store"
        }
      );

    }catch(error){

      console.log(
        "Backend wake error:",
        error
      );

    }


    uploadStatus.textContent =
      "ভিডিও আপলোড হচ্ছে...";


    /* FORM DATA */

    const formData =
      new FormData();


    formData.append(
      "video",
      selectedVideo
    );


    formData.append(
      "caption",
      caption
    );


    formData.append(
      "hashtags",
      hashtags
    );


    formData.append(
      "privacy",
      privacy
    );


    formData.append(
      "allowComments",
      String(allowComments)
    );


    formData.append(
      "allowDownloads",
      String(allowDownloads)
    );


    /* TIMEOUT */

    const controller =
      new AbortController();


    const timeout =
      setTimeout(
        function(){

          controller.abort();

        },
        120000
      );


    let response;


    try{

      response =
        await fetch(

          BACKEND_URL +
          "/api/upload",

          {
            method:"POST",

            body:formData,

            signal:
              controller.signal
          }

        );

    }finally{

      clearTimeout(timeout);

    }


    /* RESPONSE */

    const contentType =
      response.headers.get(
        "content-type"
      ) || "";


    if(
      !contentType.includes(
        "application/json"
      )
    ){

      const text =
        await response.text();


      throw new Error(
        text ||
        "সার্ভার থেকে সঠিক উত্তর পাওয়া যায়নি।"
      );

    }


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.message ||
        "ভিডিও আপলোড ব্যর্থ হয়েছে।"
      );

    }


    /* SUCCESS */

    uploadStatus.className =
      "upload-status success";


    uploadStatus.textContent =
      "ভিডিও সফলভাবে পোস্ট হয়েছে!";


    if(
      data.video &&
      data.video.url
    ){

      addVideoToFeed(
        data.video.url,
        caption,
        hashtags
      );


      localStorage.setItem(
        "zyloLastVideo",

        JSON.stringify({

          url:
            data.video.url,

          caption:
            caption,

          hashtags:
            hashtags,

          privacy:
            privacy,

          allowComments:
            allowComments,

          allowDownloads:
            allowDownloads,

          createdAt:
            new Date().toISOString()

        })
      );

    }


    setTimeout(
      function(){

        closeCreate();

      },
      1000
    );


  }catch(error){

    console.error(error);


    if(
      error.name ===
      "AbortError"
    ){

      showError(
        "আপলোডে বেশি সময় লাগছে। আবার চেষ্টা করুন।"
      );

    }else{

      showError(
        "আপলোড ব্যর্থ: " +
        (
          error.message ||
          "অজানা সমস্যা"
        )
      );

    }


    postButton.disabled = false;

  }

}


/* =====================================================
   ADD UPLOADED VIDEO TO FEED
===================================================== */

function addVideoToFeed(
  url,
  caption,
  hashtags
){

  const section =
    document.createElement(
      "section"
    );


  section.className =
    "video-card";


  section.innerHTML = `

    <video
      class="video"
      src="${escapeAttribute(url)}"
      loop
      muted
      playsinline
      preload="metadata">
    </video>


    <div class="video-overlay"></div>


    <div class="video-info">

      <div class="username">
        @zylo_creator
      </div>


      <div class="caption">
        ${escapeHTML(caption)}
      </div>


      ${
        hashtags
        ?
        `
        <div class="hashtags">
          ${escapeHTML(hashtags)}
        </div>
        `
        :
        ""
      }


      <div class="music">
        ♪ Original sound - ZYLO
      </div>

    </div>


    <div class="video-actions">


      <button class="zylo-profile">

        <span class="profile-letter">
          Z
        </span>

        <span class="follow-plus">
          +
        </span>

      </button>


      <button
        class="zylo-action like-action"
        onclick="likeVideo(this)">

        <span class="action-icon">
          ♡
        </span>

      </button>


      <span class="action-number">
        0
      </span>


      <button
        class="zylo-action"
        onclick="openComments()">

        <span class="action-icon comment-icon">
          💬
        </span>

      </button>


      <span class="action-number">
        0
      </span>


      <button
        class="zylo-action save-action"
        onclick="saveVideo(this)">

        <span class="action-icon">
          🔖
        </span>

      </button>


      <span class="action-label">
        Save
      </span>


      <button
        class="zylo-action share-action"
        onclick="shareVideo()">

        <span class="action-icon">
          ↗
        </span>

      </button>


      <span class="action-label">
        Share
      </span>


      <button
        class="zylo-sound"
        onclick="toggleSound(this)">

        <span>
          ♪
        </span>

      </button>


    </div>

  `;


  videoFeed.prepend(section);


  const newVideo =
    section.querySelector(
      ".video"
    );


  setupVideoObserver(
    newVideo
  );


  videoFeed.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* =====================================================
   LIKE
===================================================== */

function likeVideo(button){

  const card =
    button.closest(
      ".video-card"
    );


  const count =
    button.parentElement
      .querySelector(
        ".action-number"
      );


  let value =
    parseInt(
      count.textContent
    ) || 0;


  if(
    button.dataset.liked ===
    "true"
  ){

    button.dataset.liked =
      "false";


    button.querySelector(
      ".action-icon"
    ).textContent =
      "♡";


    value =
      Math.max(
        0,
        value - 1
      );

  }else{

    button.dataset.liked =
      "true";


    button.querySelector(
      ".action-icon"
    ).textContent =
      "♥";


    value++;

  }


  count.textContent =
    value;

}


/* =====================================================
   SAVE
===================================================== */

function saveVideo(button){

  if(
    button.dataset.saved ===
    "true"
  ){

    button.dataset.saved =
      "false";


    button.querySelector(
      ".action-icon"
    ).textContent =
      "🔖";

  }else{

    button.dataset.saved =
      "true";


    button.querySelector(
      ".action-icon"
    ).textContent =
      "🔖";

  }

}


/* =====================================================
   SOUND
===================================================== */

function toggleSound(button){

  const card =
    button.closest(
      ".video-card"
    );


  const video =
    card.querySelector(
      ".video"
    );


  if(video.muted){

    video.muted = false;

    button.querySelector(
      "span"
    ).textContent =
      "🔊";

  }else{

    video.muted = true;

    button.querySelector(
      "span"
    ).textContent =
      "♪";

  }

}


/* =====================================================
   SHARE
===================================================== */

async function shareVideo(){

  const shareData = {

    title:
      "ZYLO",

    text:
      "Watch this video on ZYLO",

    url:
      window.location.href

  };


  try{

    if(
      navigator.share
    ){

      await navigator.share(
        shareData
      );

    }else{

      await navigator.clipboard.writeText(
        window.location.href
      );


      alert(
        "ZYLO লিংক কপি হয়েছে।"
      );

    }

  }catch(error){

    console.log(
      "Share cancelled"
    );

  }

}

/* =====================================================
   SECURITY
===================================================== */

function escapeHTML(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(value){

  return String(value)

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   VIDEO AUTOPLAY
===================================================== */

const videoObserver =
  new IntersectionObserver(

    function(entries){

      entries.forEach(
        function(entry){

          const video =
            entry.target;


          if(
            entry.isIntersecting
          ){

            video.play()
              .catch(
                function(){}
              );

          }else{

            video.pause();

          }

        }
      );

    },

    {
      threshold:.65
    }

  );


function setupVideoObserver(video){

  videoObserver.observe(
    video
  );

}


document
  .querySelectorAll(
    ".video"
  )
  .forEach(
    function(video){

      setupVideoObserver(
        video
      );

    }
  );


/* =====================================================
   PAGE LOAD
===================================================== */

window.addEventListener(
  "load",
  function(){

    updateCharCount();

  }
);

</script>

<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>ZYLO</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main id="feed">

    <!-- VIDEO 1 -->
    <section class="video-item">

      <video
        class="video"
        src="https://raw.githubusercontent.com/golammostofa89076-sys/zylo/main/backend/uploads/video1.mp4"
        loop
        muted
        playsinline
        preload="auto">
      </video>

      <!-- Right buttons -->
      <div class="right-buttons">

        <button class="action-btn like-btn">
          ❤️
          <span>0</span>
        </button>

        <button class="action-btn">
          💬
          <span>0</span>
        </button>

        <button class="action-btn">
          ↗️
          <span>Share</span>
        </button>

      </div>

      <!-- Bottom information -->
      <div class="video-info">

        <h3>@zylo_creator</h3>

        <p>
          Welcome to ZYLO 🌍
        </p>

        <p class="music">
          🎵 Original sound
        </p>

      </div>

      <!-- Play/Pause -->
      <div class="play-icon">▶</div>

    </section>


    <!-- নিচের ভিডিও যোগ করতে চাইলে একই structure ব্যবহার করবেন -->

  </main>


  <!-- Bottom navigation -->
  <nav class="bottom-nav">

    <button>⌂<span>Home</span></button>

    <button>🔍<span>Discover</span></button>

    <button class="upload-btn">＋</button>

    <button>💬<span>Inbox</span></button>

    <button>👤<span>Profile</span></button>

  </nav>


  <script src="script.js"></script>

</body>
</html>

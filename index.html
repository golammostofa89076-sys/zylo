<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>ZYLO</title>

  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    /* =========================
       TOP BAR
    ========================= */

    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      z-index: 50;

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(
        to bottom,
        rgba(0,0,0,.75),
        transparent
      );
    }

    .top-tabs {
      display: flex;
      gap: 22px;
      align-items: center;
    }

    .top-tab {
      border: 0;
      background: transparent;
      color: #aaa;
      font-size: 15px;
      font-weight: 600;
      padding: 8px;
    }

    .top-tab.active {
      color: #fff;
    }

    .search-btn {
      position: absolute;
      right: 16px;
      top: 18px;

      width: 38px;
      height: 38px;

      border: 0;
      border-radius: 50%;

      background: rgba(255,255,255,.12);
      color: #fff;

      font-size: 23px;
    }

    /* =========================
       FEED
    ========================= */

    .video-feed {
      width: 100vw;
      height: 100vh;

      overflow-y: auto;
      scroll-snap-type: y mandatory;

      scrollbar-width: none;
    }

    .video-feed::-webkit-scrollbar {
      display: none;
    }

    .video-card {
      position: relative;

      width: 100vw;
      height: 100vh;

      scroll-snap-align: start;

      background: #000;
      overflow: hidden;
    }

    .video {
      width: 100%;
      height: 100%;

      object-fit: cover;

      background: #000;
    }

    .video-overlay {
      position: absolute;
      inset: 0;

      pointer-events: none;

      background: linear-gradient(
        to top,
        rgba(0,0,0,.8),
        transparent 45%
      );
    }

    /* =========================
       VIDEO INFO
    ========================= */

    .video-info {
      position: absolute;

      left: 16px;
      bottom: 92px;

      max-width: 72%;

      z-index: 10;
    }

    .username {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .caption {
      font-size: 16px;
      line-height: 1.4;
    }

    .music {
      margin-top: 8px;
      font-size: 14px;
      color: #ddd;
    }

    /* =========================
       RIGHT ACTIONS
    ========================= */

    .video-actions {
      position: absolute;

      right: 12px;
      bottom: 105px;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 18px;

      z-index: 20;
    }

    .action-button {
      width: 48px;
      height: 48px;

      border: 0;
      border-radius: 50%;

      background: rgba(0,0,0,.35);
      color: #fff;

      font-size: 24px;
    }

    .action-count {
      font-size: 12px;
      margin-top: -13px;
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      height: 72px;

      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: space-around;

      background: rgba(0,0,0,.88);
    }

    .nav-button {
      border: 0;
      background: transparent;
      color: #fff;

      font-size: 12px;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .upload-button {
      width: 58px;
      height: 38px;

      border-radius: 12px;

      background: #fff;
      color: #000;

      font-size: 28px;
      line-height: 1;
    }

    /* =========================
       CREATE SCREEN
    ========================= */

    .create-screen {
      position: fixed;

      inset: 0;

      z-index: 500;

      display: none;
      flex-direction: column;

      background: #000;

      overflow-y: auto;
    }

    .create-screen.show {
      display: flex;
    }

    .create-header {
      height: 70px;
      min-height: 70px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-bottom: 1px solid #222;

      position: sticky;
      top: 0;

      background: #000;

      z-index: 10;
    }

    .create-header h2 {
      margin: 0;
      font-size: 24px;
    }

    .create-close {
      position: absolute;

      left: 18px;

      width: 48px;
      height: 48px;

      border: 0;
      border-radius: 50%;

      background: #222;
      color: #fff;

      font-size: 38px;
      line-height: 1;
    }

    /* =========================
       CREATE OPTIONS
    ========================= */

    .create-options {
      display: flex;
      justify-content: center;
      gap: 16px;

      padding: 40px 20px;
    }

    .create-option {
      width: 150px;
      height: 100px;

      border: 1px solid #333;
      border-radius: 18px;

      background: #181818;
      color: #fff;

      font-size: 17px;
    }

    /* =========================
       EDITOR
    ========================= */

    .editor {
      display: none;

      padding: 0 32px 130px;
    }

    .editor.show {
      display: block;
    }

    .preview-box {
      width: 100%;

      background: #111;

      border-radius: 15px;

      overflow: hidden;

      margin-bottom: 18px;
    }

    .preview-video {
      display: block;

      width: 100%;

      max-height: 300px;

      background: #000;
    }

    /* =========================
       CAPTION
    ========================= */

    .caption-box {
      position: relative;

      background: #181818;

      border-radius: 20px;

      margin-bottom: 14px;
    }

    #captionInput {
      width: 100%;
      min-height: 155px;

      padding: 25px;

      border: 0;
      outline: none;

      resize: none;

      background: transparent;
      color: #fff;

      font-size: 19px;
    }

    #captionInput::placeholder {
      color: #888;
    }

    .char-count {
      position: absolute;

      right: 20px;
      bottom: 18px;

      color: #888;

      font-size: 14px;
    }

    /* =========================
       HASHTAGS
    ========================= */

    #hashtagInput {
      width: 100%;

      height: 70px;

      padding: 0 25px;

      border: 0;
      outline: none;

      border-radius: 18px;

      background: #181818;
      color: #fff;

      font-size: 18px;

      margin-bottom: 14px;
    }

    #hashtagInput::placeholder {
      color: #888;
    }

    /* =========================
       SOUND
    ========================= */

    .sound-row {
      width: 100%;

      min-height: 75px;

      display: flex;
      align-items: center;

      padding: 0 25px;

      background: #181818;

      border-radius: 18px;

      margin-bottom: 14px;

      font-size: 25px;
    }

    .sound-name {
      margin-left: 15px;

      font-size: 17px;
      font-weight: 600;
    }

    .sound-arrow {
      margin-left: auto;

      font-size: 28px;
      color: #aaa;
    }

    /* =========================
       SETTINGS
    ========================= */

    .settings-box {
      background: #181818;

      border-radius: 20px;

      overflow: hidden;

      margin-bottom: 18px;
    }

    .privacy-row {
      width: 100%;

      min-height: 75px;

      border: 0;

      padding: 0 25px;

      background: transparent;
      color: #fff;

      font-size: 17px;

      outline: none;
    }

    .setting-row {
      min-height: 70px;

      display: flex;
      align-items: center;

      padding: 0 25px;

      border-top: 1px solid #292929;

      font-size: 17px;
    }

    .setting-row span:first-child {
      flex: 1;
    }

    /* =========================
       TOGGLE
    ========================= */

    .toggle {
      position: relative;

      width: 54px;
      height: 32px;

      border: 0;
      border-radius: 20px;

      background: #555;
    }

    .toggle-circle {
      position: absolute;

      top: 4px;
      left: 4px;

      width: 24px;
      height: 24px;

      border-radius: 50%;

      background: #fff;

      transition: .2s;
    }

    .toggle.on {
      background: #ff3158;
    }

    .toggle.on .toggle-circle {
      left: 26px;
    }

    /* =========================
       CHOOSE AGAIN
    ========================= */

    .choose-again {
      width: 100%;

      height: 52px;

      border: 1px solid #444;

      border-radius: 14px;

      background: #111;

      color: #fff;

      font-size: 16px;

      margin-bottom: 16px;
    }

    /* =========================
       POST BUTTONS
    ========================= */

    .post-buttons {
      display: flex;
      gap: 16px;

      position: sticky;
      bottom: 0;

      padding: 12px 0;

      background: #000;

      z-index: 20;
    }

    .draft-btn,
    .post-btn {
      flex: 1;

      height: 62px;

      border: 0;

      border-radius: 18px;

      font-size: 20px;
      font-weight: bold;
    }

    .draft-btn {
      background: #292929;
      color: #fff;
    }

    .post-btn {
      background: #ff3158;
      color: #fff;
    }

    .post-btn:disabled {
      opacity: .45;
    }

    /* =========================
       STATUS
    ========================= */

    .upload-status {
      text-align: center;

      min-height: 30px;

      padding: 8px;

      color: #ddd;

      font-size: 16px;
    }

    .upload-status.success {
      color: #50e36c;
    }

    .upload-status.error {
      color: #ff5b6e;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .editor {
        padding-left: 32px;
        padding-right: 32px;
      }

      .preview-video {
        max-height: 280px;
      }

      .create-header h2 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       TOP BAR
  ========================= -->

  <header class="top-bar">

    <div class="top-tabs">

      <button class="top-tab">
        LIVE
      </button>

      <button class="top-tab">
        Following
      </button>

      <button class="top-tab active">
        For You
      </button>

    </div>

    <button
      class="search-btn"
      onclick="openSearch()">
      ⌕
    </button>

  </header>


  <!-- =========================
       VIDEO FEED
  ========================= -->

  <main
    class="video-feed"
    id="videoFeed">

    <section class="video-card">

      <video
        class="video"
        src="uploads/video1.mp4"
        loop
        muted
        playsinline
        preload="metadata">
      </video>

      <div class="video-overlay"></div>

      <div class="video-info">

        <div class="username">
          @zylo_creator
        </div>

        <div class="caption">
          Welcome to ZYLO 🌎
          <br>
          Create • Connect • Grow
        </div>

        <div class="music">
          ♪ Original sound - ZYLO
        </div>

      </div>

      <div class="video-actions">

        <button
          class="action-button"
          onclick="likeVideo(this)">
          ♡
        </button>

        <span class="action-count">
          0
        </span>

        <button
          class="action-button">
          💬
        </button>

        <span class="action-count">
          0
        </span>

        <button
          class="action-button">
          ↗
        </button>

        <span class="action-count">
          Share
        </span>

      </div>

    </section>

  </main>


  <!-- =========================
       BOTTOM NAV
  ========================= -->

  <nav class="bottom-nav">

    <button
      class="nav-button">
      🏠
      <span>Home</span>
    </button>

    <button
      class="nav-button">
      🔍
      <span>Discover</span>
    </button>

    <button
      class="nav-button upload-button"
      onclick="openCreate()">
      +
    </button>

    <button
      class="nav-button">
      💬
      <span>Inbox</span>
    </button>

    <button
      class="nav-button">
      👤
      <span>Profile</span>
    </button>

  </nav>


  <!-- =========================
       CREATE SCREEN
  ========================= -->

  <section
    class="create-screen"
    id="createScreen">

    <div class="create-header">

      <button
        class="create-close"
        onclick="closeCreate()">
        ×
      </button>

      <h2>
        Create
      </h2>

    </div>


    <!-- CREATE OPTIONS -->

    <div
      class="create-options"
      id="createOptions">

      <button
        class="create-option"
        onclick="openCamera()">
        📹 Camera
      </button>

      <button
        class="create-option"
        onclick="openGallery()">
        🖼️ Upload
      </button>

    </div>


    <!-- EDITOR -->

    <div
      class="editor"
      id="editor">

      <!-- VIDEO PREVIEW -->

      <div class="preview-box">

        <video
          id="previewVideo"
          class="preview-video"
          controls
          playsinline>
        </video>

      </div>


      <!-- CAPTION -->

      <div class="caption-box">

        <textarea
          id="captionInput"
          maxlength="2200"
          placeholder="Write a caption..."
          oninput="updateCharCount()"></textarea>

        <div
          class="char-count"
          id="charCount">
          0/2200
        </div>

      </div>


      <!-- HASHTAGS -->

      <input
        id="hashtagInput"
        type="text"
        maxlength="300"
        placeholder="Add hashtags #ZYLO #ForYou">


      <!-- SOUND -->

      <div class="sound-row">

        <span>
          🎵
        </span>

        <span class="sound-name">
          Original sound - ZYLO
        </span>

        <span class="sound-arrow">
          ›
        </span>

      </div>


      <!-- SETTINGS -->

      <div class="settings-box">

        <select
          id="privacySelect"
          class="privacy-row">

          <option value="public">
            🌎 Everyone
          </option>

          <option value="friends">
            👥 Friends
          </option>

          <option value="private">
            🔒 Only me
          </option>

        </select>


        <div class="setting-row">

          <span>
            Allow comments
          </span>

          <button
            id="commentsToggle"
            class="toggle on"
            onclick="toggleSetting('commentsToggle')">

            <span class="toggle-circle"></span>

          </button>

        </div>


        <div class="setting-row">

          <span>
            Allow downloads
          </span>

          <button
            id="downloadsToggle"
            class="toggle"
            onclick="toggleSetting('downloadsToggle')">

            <span class="toggle-circle"></span>

          </button>

        </div>

      </div>


      <!-- CHOOSE ANOTHER -->

      <button
        class="choose-again"
        onclick="openGallery()">

        Choose another video

      </button>


      <!-- STATUS -->

      <div
        class="upload-status"
        id="uploadStatus">
      </div>


      <!-- BUTTONS -->

      <div class="post-buttons">

        <button
          class="draft-btn"
          onclick="saveDraft()">

          Draft

        </button>

        <button
          id="postButton"
          class="post-btn"
          onclick="postVideo()">

          Post

        </button>

      </div>

    </div>

  </section>


  <!-- HIDDEN FILE INPUT -->

  <input
    id="videoInput"
    type="file"
    accept="video/*"
    style="display:none">


  <script>

    /* ==========================================
       ZYLO BACKEND
    ========================================== */

    const BACKEND_URL =
      "https://zylo-backend-ec5c.onrender.com";


    /* ==========================================
       ELEMENTS
    ========================================== */

    const createScreen =
      document.getElementById("createScreen");

    const createOptions =
      document.getElementById("createOptions");

    const editor =
      document.getElementById("editor");

    const videoInput =
      document.getElementById("videoInput");

    const previewVideo =
      document.getElementById("previewVideo");

    const captionInput =
      document.getElementById("captionInput");

    const hashtagInput =
      document.getElementById("hashtagInput");

    const privacySelect =
      document.getElementById("privacySelect");

    const postButton =
      document.getElementById("postButton");

    const uploadStatus =
      document.getElementById("uploadStatus");

    const charCount =
      document.getElementById("charCount");

    const videoFeed =
      document.getElementById("videoFeed");


    let selectedVideo = null;

    let previewURL = null;


    /* ==========================================
       OPEN CREATE
    ========================================== */

    function openCreate() {

      createScreen.classList.add("show");

      createOptions.style.display = "flex";

      editor.classList.remove("show");

      resetUploadState();

    }


    /* ==========================================
       CLOSE CREATE
    ========================================== */

    function closeCreate() {

      createScreen.classList.remove("show");

      if (previewURL) {

        URL.revokeObjectURL(previewURL);

        previewURL = null;

      }

      previewVideo.removeAttribute("src");

      previewVideo.load();

      selectedVideo = null;

      videoInput.value = "";

    }


    /* ==========================================
       CAMERA
    ========================================== */

    function openCamera() {

      videoInput.setAttribute(
        "capture",
        "environment"
      );

      videoInput.click();

    }


    /* ==========================================
       GALLERY
    ========================================== */

    function openGallery() {

      videoInput.removeAttribute(
        "capture"
      );

      videoInput.click();

    }


    /* ==========================================
       VIDEO SELECT
    ========================================== */

    videoInput.addEventListener(
      "change",
      function () {

        const file =
          this.files && this.files[0];

        if (!file) {
          return;
        }


        /* Only video */

        if (!file.type.startsWith("video/")) {

          showError(
            "শুধু ভিডিও ফাইল নির্বাচন করুন।"
          );

          this.value = "";

          return;

        }


        /* 200 MB limit */

        const maxSize =
          200 * 1024 * 1024;

        if (file.size > maxSize) {

          showError(
            "ভিডিও সর্বোচ্চ 200 MB হতে পারবে।"
          );

          this.value = "";

          return;

        }


        selectedVideo = file;


        if (previewURL) {

          URL.revokeObjectURL(
            previewURL
          );

        }


        previewURL =
          URL.createObjectURL(file);


        previewVideo.src =
          previewURL;


        previewVideo.load();


        createOptions.style.display =
          "none";

        editor.classList.add("show");


        resetStatus();


        postButton.disabled = false;

      }
    );


    /* ==========================================
       CHARACTER COUNT
    ========================================== */

    function updateCharCount() {

      const length =
        captionInput.value.length;

      charCount.textContent =
        length + "/2200";

    }


    /* ==========================================
       TOGGLE
    ========================================== */

    function toggleSetting(id) {

      const element =
        document.getElementById(id);

      element.classList.toggle("on");

    }


    /* ==========================================
       RESET STATE
    ========================================== */

    function resetUploadState() {

      selectedVideo = null;

      captionInput.value = "";

      hashtagInput.value = "";

      privacySelect.value = "public";

      charCount.textContent = "0/2200";

      document
        .getElementById("commentsToggle")
        .classList.add("on");

      document
        .getElementById("downloadsToggle")
        .classList.remove("on");

      resetStatus();

      postButton.disabled = true;

    }


    function resetStatus() {

      uploadStatus.textContent = "";

      uploadStatus.className =
        "upload-status";

    }


    function showError(message) {

      uploadStatus.textContent =
        message;

      uploadStatus.className =
        "upload-status error";

    }


    /* ==========================================
       POST VIDEO
    ========================================== */

    async function postVideo() {

      if (!selectedVideo) {

        showError(
          "প্রথমে একটি ভিডিও নির্বাচন করুন।"
        );

        return;

      }


      if (postButton.disabled) {

        return;

      }


      const caption =
        captionInput.value.trim();

      const hashtags =
        hashtagInput.value.trim();

      const privacy =
        privacySelect.value;


      const allowComments =
        document
          .getElementById("commentsToggle")
          .classList.contains("on");


      const allowDownloads =
        document
          .getElementById("downloadsToggle")
          .classList.contains("on");


      /* Disable */

      postButton.disabled = true;

      uploadStatus.className =
        "upload-status";

      uploadStatus.textContent =
        "সার্ভার প্রস্তুত হচ্ছে...";


      try {

        /* ======================================
           STEP 1
           WAKE UP RENDER SERVER
        ====================================== */

        try {

          await fetch(
            BACKEND_URL + "/",
            {
              method: "GET",
              cache: "no-store"
            }
          );

        } catch (wakeError) {

          console.log(
            "Server wake request:",
            wakeError
          );

        }


        uploadStatus.textContent =
          "ভিডিও আপলোড হচ্ছে...";


        /* ======================================
           STEP 2
           FORM DATA
        ====================================== */

        const formData =
          new FormData();


        formData.append(
          "video",
          selectedVideo
        );


        formData.append(
          "caption",
          caption
        );


        formData.append(
          "hashtags",
          hashtags
        );


        formData.append(
          "privacy",
          privacy
        );


        formData.append(
          "allowComments",
          allowComments
        );


        formData.append(
          "allowDownloads",
          allowDownloads
        );


        /* ======================================
           STEP 3
           ABORT CONTROLLER
        ====================================== */

        const controller =
          new AbortController();


        const timeout =
          setTimeout(
            function () {

              controller.abort();

            },
            120000
          );


        /* ======================================
           STEP 4
           UPLOAD
        ====================================== */

        let response;


        try {

          response =
            await fetch(
              BACKEND_URL +
              "/api/upload",
              {
                method: "POST",

                body: formData,

                signal:
                  controller.signal
              }
            );

        } finally {

          clearTimeout(timeout);

        }


        /* ======================================
           STEP 5
           RESPONSE
        ====================================== */

        let data = null;

        const contentType =
          response.headers.get(
            "content-type"
          ) || "";


        if (
          contentType.includes(
            "application/json"
          )
        ) {

          data =
            await response.json();

        } else {

          const text =
            await response.text();

          throw new Error(
            text ||
            "Server থেকে সঠিক response পাওয়া যায়নি।"
          );

        }


        if (
          !response.ok ||
          !data ||
          !data.success
        ) {

          throw new Error(
            data && data.message
              ? data.message
              : "ভিডিও আপলোড ব্যর্থ হয়েছে।"
          );

        }


        /* ======================================
           STEP 6
           SUCCESS
        ====================================== */

        uploadStatus.className =
          "upload-status success";

        uploadStatus.textContent =
          "ভিডিও সফলভাবে পোস্ট হয়েছে!";


        /* Add to feed */

        if (
          data.video &&
          data.video.url
        ) {

          addVideoToFeed(
            data.video.url,
            caption,
            hashtags
          );


          /* Save local record */

          localStorage.setItem(
            "zyloLastVideo",
            JSON.stringify({

              url:
                data.video.url,

              caption:
                caption,

              hashtags:
                hashtags,

              privacy:
                privacy,

              allowComments:
                allowComments,

              allowDownloads:
                allowDownloads,

              createdAt:
                new Date().toISOString()

            })
          );

        }


        /* ======================================
           STEP 7
           CLOSE AFTER SUCCESS
        ====================================== */

        setTimeout(
          function () {

            closeCreate();

          },
          1000
        );


      } catch (error) {

        console.error(
          "ZYLO Upload Error:",
          error
        );


        if (
          error.name ===
          "AbortError"
        ) {

          showError(
            "আপলোডে বেশি সময় লাগছে। আবার Post করুন।"
          );

        } else {

          showError(
            "আপলোড ব্যর্থ: " +
            (
              error.message ||
              "অজানা সমস্যা"
            )
          );

        }


        postButton.disabled = false;

      }

    }


    /* ==========================================
       ADD VIDEO TO FEED
    ========================================== */

    function addVideoToFeed(
      videoURL,
      caption,
      hashtags
    ) {

      const section =
        document.createElement(
          "section"
        );

      section.className =
        "video-card";


      const safeCaption =
        escapeHTML(
          caption ||
          ""
        );


      const safeHashtags =
        escapeHTML(
          hashtags ||
          ""
        );


      section.innerHTML = `

        <video
          class="video"
          src="${escapeAttribute(videoURL)}"
          loop
          muted
          playsinline
          preload="metadata">
        </video>

        <div class="video-overlay"></div>

        <div class="video-info">

          <div class="username">
            @zylo_creator
          </div>

          <div class="caption">
            ${safeCaption}
            ${
              safeHashtags
                ? "<br>" +
                  safeHashtags
                : ""
            }
          </div>

          <div class="music">
            ♪ Original sound - ZYLO
          </div>

        </div>

        <div class="video-actions">

          <button
            class="action-button"
            onclick="likeVideo(this)">
            ♡
          </button>

          <span class="action-count">
            0
          </span>

          <button
            class="action-button">
            💬
          </button>

          <span class="action-count">
            0
          </span>

          <button
            class="action-button">
            ↗
          </button>

          <span class="action-count">
            Share
          </span>

        </div>
      `;


      videoFeed.prepend(section);


      const newVideo =
        section.querySelector(
          "video"
        );


      setupVideoObserver(
        newVideo
      );


      videoFeed.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* ==========================================
       HTML SECURITY
    ========================================== */

    function escapeHTML(value) {

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    function escapeAttribute(value) {

      return String(value)
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* ==========================================
       LIKE
    ========================================== */

    function likeVideo(button) {

      const count =
        button.parentElement
          .querySelector(
            ".action-count"
          );


      const current =
        parseInt(
          count.textContent
        ) || 0;


      if (
        button.dataset.liked ===
        "true"
      ) {

        button.textContent = "♡";

        button.dataset.liked =
          "false";

        count.textContent =
          Math.max(
            0,
            current - 1
          );

      } else {

        button.textContent = "♥";

        button.dataset.liked =
          "true";

        count.textContent =
          current + 1;

      }

    }


    /* ==========================================
       VIDEO AUTO PLAY / PAUSE
    ========================================== */

    const videoObserver =
      new IntersectionObserver(
        function(entries) {

          entries.forEach(
            function(entry) {

              const video =
                entry.target;


              if (
                entry.isIntersecting
              ) {

                video.play()
                  .catch(
                    function() {}
                  );

              } else {

                video.pause();

              }

            }
          );

        },
        {
          threshold: 0.65
        }
      );


    function setupVideoObserver(
      video
    ) {

      videoObserver.observe(
        video
      );

    }


    document
      .querySelectorAll(".video")
      .forEach(
        function(video) {

          setupVideoObserver(
            video
          );

        }
      );


    /* ==========================================
       SEARCH
    ========================================== */

    function openSearch() {

      const query =
        prompt(
          "ZYLO Search"
        );


      if (
        query &&
        query.trim()
      ) {

        alert(
          "আপনি সার্চ করেছেন: " +
          query.trim()
        );

      }

    }


    /* ==========================================
       DRAFT
    ========================================== */

    function saveDraft() {

      const draft = {

        caption:
          captionInput.value,

        hashtags:
          hashtagInput.value,

        privacy:
          privacySelect.value,

        savedAt:
          new Date().toISOString()

      };


      localStorage.setItem(
        "zyloDraft",
        JSON.stringify(draft)
      );


      uploadStatus.className =
        "upload-status success";

      uploadStatus.textContent =
        "Draft সংরক্ষণ হয়েছে।";

    }


    /* ==========================================
       LOAD SAVED DATA
    ========================================== */

    window.addEventListener(
      "load",
      function() {

        updateCharCount();

      }
    );

  </script>

</body>

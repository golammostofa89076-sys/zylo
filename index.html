<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>ZYLO</title>

  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
    }

    /* =========================
       TOP NAVIGATION
    ========================== */

    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 72px;
      z-index: 50;

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(
        to bottom,
        rgba(0,0,0,.72),
        rgba(0,0,0,0)
      );
    }

    .top-tabs {
      display: flex;
      align-items: center;
      gap: 34px;
      height: 100%;
    }

    .top-tab {
      position: relative;
      border: 0;
      outline: none;
      background: none;
      color: rgba(255,255,255,.72);
      font-size: 18px;
      font-weight: 500;
      padding: 24px 0 16px;
    }

    .top-tab.active {
      color: #fff;
      font-weight: 700;
    }

    .top-tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 7px;
      height: 3px;
      background: #fff;
      border-radius: 5px;
    }

    .search-button {
      position: absolute;
      right: 20px;
      top: 17px;

      width: 52px;
      height: 52px;

      border: 0;
      border-radius: 50%;
      background: rgba(35,35,35,.94);
      color: #fff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 31px;
      cursor: pointer;
    }

    /* =========================
       VIDEO FEED
    ========================== */

    .video-feed {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      overflow-y: auto;
      overflow-x: hidden;

      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      background: #000;
    }

    .video-feed::-webkit-scrollbar {
      display: none;
    }

    .video-card {
      position: relative;

      width: 100%;
      height: 100dvh;
      min-height: 100vh;

      scroll-snap-align: start;
      overflow: hidden;

      background: #000;
    }

    .video {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      background: #000;
    }

    /* dark overlay */
    .video-card::after {
      content: "";
      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,.15),
          transparent 25%,
          transparent 55%,
          rgba(0,0,0,.38) 100%
        );
    }

    /* =========================
       RIGHT SIDE ACTIONS
    ========================== */

    .right-actions {
      position: absolute;

      right: 15px;
      bottom: 145px;

      width: 72px;

      z-index: 20;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 18px;
    }

    .action {
      width: 70px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      color: #fff;
      text-align: center;

      cursor: pointer;
      user-select: none;
    }

    .action-icon {
      width: 56px;
      height: 56px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 42px;
      line-height: 1;

      color: #fff;

      filter:
        drop-shadow(0 2px 3px rgba(0,0,0,.7));
    }

    .action-label {
      margin-top: 6px;

      font-size: 14px;
      line-height: 18px;

      color: #fff;
      text-shadow: 0 1px 3px #000;
    }

    .action-count {
      margin-top: 5px;

      font-size: 14px;
      line-height: 18px;

      color: #fff;
      text-shadow: 0 1px 3px #000;
    }

    /* Profile */

    .profile-action {
      margin-bottom: 2px;
    }

    .profile-avatar {
      position: relative;

      width: 62px;
      height: 62px;

      border: 3px solid #fff;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #222;

      font-size: 34px;
      font-weight: 400;

      box-shadow: 0 2px 7px rgba(0,0,0,.6);
    }

    .follow-plus {
      position: absolute;

      bottom: -8px;
      left: 50%;

      transform: translateX(-50%);

      width: 25px;
      height: 25px;

      border-radius: 50%;

      background: #fe2c55;
      color: #fff;

      border: 2px solid #000;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 19px;
      font-weight: 700;
    }

    /* Like */

    .like-icon {
      font-size: 48px;
    }

    .like-icon.liked {
      color: #fe2c55;
    }

    /* Comment */

    .comment-icon {
      font-size: 45px;
    }

    /* Save */

    .save-icon {
      font-size: 45px;
    }

    .save-icon.saved {
      color: #ffd700;
    }

    /* Share */

    .share-icon {
      font-size: 45px;
    }

    /* Music */

    .music-disc {
      position: relative;

      width: 64px;
      height: 64px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle,
          #151515 0 25%,
          #2d2d2d 26% 29%,
          #111 30% 40%,
          #3a3a3a 41% 43%,
          #111 44% 53%,
          #333 54% 56%,
          #111 57% 100%
        );

      border: 2px solid #333;

      animation: rotateDisc 5s linear infinite;

      box-shadow:
        0 0 0 2px #111,
        0 2px 8px rgba(0,0,0,.8);
    }

    .music-disc::before {
      content: "";

      position: absolute;

      width: 28px;
      height: 28px;

      border-radius: 50%;

      background: #000;
      border: 1px solid #555;
    }

    .music-note {
      position: relative;
      z-index: 2;

      font-size: 25px;
    }

    @keyframes rotateDisc {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       VIDEO INFORMATION
    ========================== */

    .video-info {
      position: absolute;

      left: 18px;
      right: 100px;
      bottom: 145px;

      z-index: 20;

      color: #fff;

      text-shadow:
        0 1px 3px rgba(0,0,0,.9),
        0 2px 5px rgba(0,0,0,.7);
    }

    .username {
      font-size: 20px;
      font-weight: 700;

      margin-bottom: 12px;
    }

    .verified {
      display: inline-flex;

      width: 18px;
      height: 18px;

      align-items: center;
      justify-content: center;

      margin-left: 4px;

      border-radius: 50%;

      background: #20d5ec;
      color: #fff;

      font-size: 12px;
      font-weight: 900;

      vertical-align: 2px;
    }

    .caption {
      font-size: 17px;
      line-height: 25px;

      margin-bottom: 7px;

      max-width: 92%;
    }

    .hashtags {
      color: #20d5ec;

      font-size: 16px;
      line-height: 23px;

      margin-bottom: 8px;
    }

    .music-text {
      display: flex;
      align-items: center;
      gap: 8px;

      font-size: 15px;
      line-height: 22px;

      max-width: 90%;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .music-small-note {
      font-size: 20px;
    }

    /* =========================
       BOTTOM NAV
    ========================== */

    .bottom-nav {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      height: 78px;

      z-index: 100;

      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;

      background: rgba(0,0,0,.96);

      border-top: 1px solid rgba(255,255,255,.12);

      padding-bottom: env(safe-area-inset-bottom);
    }

    .nav-button {
      height: 70px;

      border: 0;
      outline: none;

      background: transparent;
      color: #fff;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 3px;

      font-size: 12px;

      cursor: pointer;
    }

    .nav-icon {
      font-size: 28px;
      line-height: 30px;
    }

    .nav-label {
      font-size: 12px;
    }

    /* Create button */

    .upload-button {
      position: relative;

      width: 66px;
      height: 44px;

      margin: auto;

      border-radius: 12px;

      background: #fff;
      color: #000;

      font-size: 31px;
      font-weight: 400;

      box-shadow:
        -5px 0 0 #20d5ec,
        5px 0 0 #fe2c55;
    }

    .upload-button .nav-icon {
      font-size: 34px;
      line-height: 40px;
    }

    /* =========================
       CREATE SCREEN
    ========================== */

    .create-screen {
      position: fixed;
      inset: 0;

      z-index: 500;

      display: none;
      flex-direction: column;

      background: #000;

      overflow-y: auto;
    }

    .create-screen.show {
      display: flex;
    }

    .create-header {
      position: sticky;
      top: 0;

      height: 70px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-bottom: 1px solid #222;

      background: #000;

      z-index: 5;
    }

    .create-header h2 {
      margin: 0;

      font-size: 25px;
    }

    .create-close {
      position: absolute;

      left: 18px;

      width: 50px;
      height: 50px;

      border: 0;
      border-radius: 50%;

      background: #222;
      color: #fff;

      font-size: 38px;
      line-height: 1;

      cursor: pointer;
    }

    .create-options {
      display: flex;

      justify-content: center;
      gap: 15px;

      padding: 30px 20px;
    }

    .create-option {
      flex: 1;

      max-width: 180px;

      padding: 18px 12px;

      border: 1px solid #444;
      border-radius: 12px;

      background: #1b1b1b;
      color: #fff;

      font-size: 16px;
    }

    .editor {
      display: none;

      padding: 15px 18px 100px;
    }

    .editor.show {
      display: block;
    }

    .preview-box {
      width: 100%;
      max-width: 420px;

      margin: 0 auto 20px;

      background: #111;

      border-radius: 10px;
      overflow: hidden;
    }

    .preview-video {
      display: block;

      width: 100%;
      max-height: 55vh;

      background: #000;

      object-fit: contain;
    }

    .caption-input,
    .hashtag-input {
      width: 100%;

      border: 1px solid #2e2e2e;
      outline: none;

      border-radius: 16px;

      background: #191919;
      color: #fff;

      padding: 16px;

      font-size: 17px;

      margin-bottom: 12px;
    }

    .caption-input {
      min-height: 120px;
      resize: none;
    }

    .hashtag-input {
      height: 55px;
    }

    .sound-row,
    .privacy-row {
      width: 100%;

      min-height: 58px;

      margin-bottom: 12px;

      border: 0;
      border-radius: 15px;

      background: #191919;
      color: #fff;

      padding: 0 16px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      font-size: 16px;
    }

    .privacy-row {
      appearance: none;
    }

    .settings-box {
      background: #191919;

      border-radius: 15px;

      overflow: hidden;

      margin-bottom: 14px;
    }

    .setting-row {
      min-height: 58px;

      padding: 0 16px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid #303030;

      font-size: 16px;
    }

    .setting-row:last-child {
      border-bottom: 0;
    }

    .switch {
      position: relative;

      width: 52px;
      height: 30px;

      border-radius: 30px;

      background: #555;

      cursor: pointer;
    }

    .switch::after {
      content: "";

      position: absolute;

      top: 3px;
      left: 3px;

      width: 24px;
      height: 24px;

      border-radius: 50%;

      background: #fff;

      transition: .2s;
    }

    .switch.on {
      background: #fe2c55;
    }

    .switch.on::after {
      left: 25px;
    }

    .choose-again {
      width: 100%;

      height: 50px;

      border: 1px solid #444;
      border-radius: 12px;

      background: #181818;
      color: #fff;

      margin-bottom: 14px;
    }

    .post-area {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 12px;
    }

    .draft-btn,
    .post-btn {
      height: 54px;

      border: 0;
      border-radius: 14px;

      font-size: 17px;
      font-weight: 700;
    }

    .draft-btn {
      background: #2a2a2a;
      color: #fff;
    }

    .post-btn {
      background: #fe2c55;
      color: #fff;
    }

    .post-btn:disabled {
      opacity: .45;
    }

    .upload-status {
      min-height: 25px;

      margin: 10px 0;

      text-align: center;

      font-size: 14px;
      color: #ccc;
    }

    #videoInput {
      display: none;
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {

      .top-bar {
        height: 68px;
      }

      .top-tabs {
        gap: 27px;
      }

      .top-tab {
        font-size: 17px;
      }

      .search-button {
        right: 10px;
        top: 15px;

        width: 52px;
        height: 52px;
      }

      .right-actions {
        right: 9px;
        bottom: 132px;

        width: 66px;

        gap: 15px;
      }

      .action {
        width: 66px;
      }

      .action-icon {
        width: 54px;
        height: 54px;

        font-size: 39px;
      }

      .profile-avatar {
        width: 60px;
        height: 60px;

        font-size: 32px;
      }

      .follow-plus {
        width: 25px;
        height: 25px;
      }

      .action-label,
      .action-count {
        font-size: 13px;
      }

      .video-info {
        left: 18px;
        right: 90px;
        bottom: 132px;
      }

      .username {
        font-size: 19px;
      }

      .caption {
        font-size: 16px;
        line-height: 23px;
      }

      .hashtags {
        font-size: 15px;
      }

      .music-text {
        font-size: 14px;
      }

      .bottom-nav {
        height: 72px;
      }

      .nav-icon {
        font-size: 26px;
      }

      .upload-button {
        width: 65px;
        height: 43px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       TOP
  ========================== -->

  <header class="top-bar">

    <div class="top-tabs">

      <button class="top-tab">
        LIVE
      </button>

      <button class="top-tab">
        Following
      </button>

      <button class="top-tab active">
        For You
      </button>

    </div>

    <button class="search-button" onclick="openSearch()">
      ⌕
    </button>

  </header>


  <!-- =========================
       VIDEO FEED
  ========================== -->

  <main class="video-feed" id="videoFeed">

    <section class="video-card">

      <video
        class="video"
        src="uploads/video1.mp4"
        loop
        muted
        playsinline
        preload="metadata">
      </video>


      <!-- RIGHT ACTIONS -->

      <div class="right-actions">

        <!-- PROFILE -->

        <div class="action profile-action"
             onclick="openProfile()">

          <div class="profile-avatar">

            Z

            <span class="follow-plus">
              +
            </span>

          </div>

          <div class="action-label">
            Follow
          </div>

        </div>


        <!-- LIKE -->

        <div class="action"
             onclick="toggleLike(this)">

          <div class="action-icon like-icon">
            ♡
          </div>

          <div class="action-count">
            0
          </div>

        </div>


        <!-- COMMENT -->

        <div class="action"
             onclick="openComments()">

          <div class="action-icon comment-icon">
            💬
          </div>

          <div class="action-count">
            0
          </div>

        </div>


        <!-- SAVE -->

        <div class="action"
             onclick="toggleSave(this)">

          <div class="action-icon save-icon">
            ♡
          </div>

          <div class="action-label">
            Save
          </div>

        </div>


        <!-- SHARE -->

        <div class="action"
             onclick="shareVideo()">

          <div class="action-icon share-icon">
            ↗
          </div>

          <div class="action-label">
            Share
          </div>

        </div>


        <!-- MUSIC -->

        <div class="action">

          <div class="music-disc">

            <span class="music-note">
              ♪
            </span>

          </div>

        </div>

      </div>


      <!-- VIDEO INFO -->

      <div class="video-info">

        <div class="username">

          @zylo_creator

          <span class="verified">
            ✓
          </span>

        </div>

        <div class="caption">

          Welcome to ZYLO 🌎
          <br>

          Create • Connect • Grow

        </div>

        <div class="hashtags">

          #ZYLO #Create #Connect #Grow #ForYou

        </div>

        <div class="music-text">

          <span class="music-small-note">
            ♫
          </span>

          Original sound - ZYLO

        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       BOTTOM NAV
  ========================== -->

  <nav class="bottom-nav">

    <button class="nav-button"
            onclick="goHome()">

      <span class="nav-icon">
        🏠
      </span>

      <span class="nav-label">
        Home
      </span>

    </button>


    <button class="nav-button"
            onclick="openDiscover()">

      <span class="nav-icon">
        ⌕
      </span>

      <span class="nav-label">
        Discover
      </span>

    </button>


    <button class="nav-button upload-button"
            onclick="openCreate()">

      <span class="nav-icon">
        +
      </span>

    </button>


    <button class="nav-button"
            onclick="openInbox()">

      <span class="nav-icon">
        💬
      </span>

      <span class="nav-label">
        Inbox
      </span>

    </button>


    <button class="nav-button"
            onclick="openProfile()">

      <span class="nav-icon">
        👤
      </span>

      <span class="nav-label">
        Profile
      </span>

    </button>

  </nav>


  <!-- =========================
       CREATE SCREEN
  ========================== -->

  <section class="create-screen"
           id="createScreen">

    <div class="create-header">

      <button class="create-close"
              onclick="closeCreate()">
        ×
      </button>

      <h2>
        Create
      </h2>

    </div>


    <!-- CREATE OPTIONS -->

    <div id="createOptions"
         class="create-options">

      <button class="create-option"
              onclick="openCamera()">

        📹 Camera

      </button>

      <button class="create-option"
              onclick="openGallery()">

        🖼️ Upload

      </button>

    </div>


    <!-- EDITOR -->

    <div class="editor"
         id="editor">


      <!-- PREVIEW -->

      <div class="preview-box">

        <video
          id="previewVideo"
          class="preview-video"
          controls
          playsinline>
        </video>

      </div>


      <!-- CAPTION -->

      <textarea
        id="captionInput"
        class="caption-input"
        maxlength="2200"
        placeholder="Write a caption...">
      </textarea>


      <!-- HASHTAGS -->

      <input
        id="hashtagInput"
        class="hashtag-input"
        maxlength="500"
        placeholder="Add hashtags #ZYLO #ForYou">


      <!-- SOUND -->

      <div class="sound-row">

        <span>
          🎵 Sound
        </span>

        <span>
          Original sound - ZYLO →
        </span>

      </div>


      <!-- PRIVACY -->

      <select
        id="privacySelect"
        class="privacy-row">

        <option value="public">
          Everyone can watch
        </option>

        <option value="friends">
          Friends
        </option>

        <option value="private">
          Only me
        </option>

      </select>


      <!-- SETTINGS -->

      <div class="settings-box">

        <div class="setting-row">

          <span>
            Allow comments
          </span>

          <span
            id="commentsSwitch"
            class="switch on"
            onclick="toggleSwitch(this)">
          </span>

        </div>


        <div class="setting-row">

          <span>
            Allow downloads
          </span>

          <span
            id="downloadsSwitch"
            class="switch"
            onclick="toggleSwitch(this)">
          </span>

        </div>

      </div>


      <!-- CHANGE VIDEO -->

      <button
        class="choose-again"
        onclick="openGallery()">

        Choose another video

      </button>


      <!-- STATUS -->

      <div
        id="uploadStatus"
        class="upload-status">
      </div>


      <!-- POST BUTTONS -->

      <div class="post-area">

        <button
          class="draft-btn"
          onclick="saveDraft()">

          Draft

        </button>

        <button
          id="postButton"
          class="post-btn"
          onclick="postVideo()"
          disabled>

          Post

        </button>

      </div>

    </div>

  </section>


  <!-- VIDEO INPUT -->

  <input
    id="videoInput"
    type="file"
    accept="video/*">


  <script>

    /* =========================
       BACKEND
    ========================== */

    const BACKEND_URL =
      "https://zylo-backend-ec5c.onrender.com";


    /* =========================
       ELEMENTS
    ========================== */

    const createScreen =
      document.getElementById("createScreen");

    const createOptions =
      document.getElementById("createOptions");

    const editor =
      document.getElementById("editor");

    const videoInput =
      document.getElementById("videoInput");

    const previewVideo =
      document.getElementById("previewVideo");

    const captionInput =
      document.getElementById("captionInput");

    const hashtagInput =
      document.getElementById("hashtagInput");

    const privacySelect =
      document.getElementById("privacySelect");

    const postButton =
      document.getElementById("postButton");

    const uploadStatus =
      document.getElementById("uploadStatus");


    let selectedVideo = null;


    /* =========================
       CREATE
    ========================== */

    function openCreate() {

      createScreen.classList.add("show");

      createOptions.style.display = "flex";

      editor.classList.remove("show");

      uploadStatus.textContent = "";

    }


    function closeCreate() {

      createScreen.classList.remove("show");

      previewVideo.pause();

      previewVideo.removeAttribute("src");

      previewVideo.load();

      selectedVideo = null;

      videoInput.value = "";

      postButton.disabled = true;

      uploadStatus.textContent = "";

    }


    /* =========================
       CAMERA
    ========================== */

    function openCamera() {

      videoInput.setAttribute(
        "capture",
        "environment"
      );

      videoInput.click();

    }


    /* =========================
       GALLERY
    ========================== */

    function openGallery() {

      videoInput.removeAttribute(
        "capture"
      );

      videoInput.click();

    }


    /* =========================
       FILE SELECTED
    ========================== */

    videoInput.addEventListener(
      "change",
      function () {

        const file =
          this.files && this.files[0];

        if (!file) {
          return;
        }


        if (!file.type.startsWith("video/")) {

          uploadStatus.textContent =
            "শুধু ভিডিও ফাইল নির্বাচন করুন।";

          return;

        }


        selectedVideo = file;


        const videoURL =
          URL.createObjectURL(file);

        previewVideo.src =
          videoURL;


        createOptions.style.display =
          "none";

        editor.classList.add("show");


        postButton.disabled =
          false;


        uploadStatus.textContent =
          "ভিডিও প্রস্তুত। Post চাপুন।";

      }
    );


    /* =========================
       SWITCH
    ========================== */

    function toggleSwitch(element) {

      element.classList.toggle("on");

    }


    /* =========================
       POST VIDEO
    ========================== */

    async function postVideo() {

      if (!selectedVideo) {

        uploadStatus.textContent =
          "আগে একটি ভিডিও নির্বাচন করুন।";

        return;

      }


      postButton.disabled =
        true;

      uploadStatus.textContent =
        "ভিডিও আপলোড হচ্ছে...";


      try {

        const formData =
          new FormData();


        formData.append(
          "video",
          selectedVideo
        );


        formData.append(
          "caption",
          captionInput.value.trim()
        );


        formData.append(
          "hashtags",
          hashtagInput.value.trim()
        );


        formData.append(
          "privacy",
          privacySelect.value
        );


        formData.append(
          "allowComments",
          document
            .getElementById("commentsSwitch")
            .classList.contains("on")
        );


        formData.append(
          "allowDownloads",
          document
            .getElementById("downloadsSwitch")
            .classList.contains("on")
        );


        const controller =
          new AbortController();


        const timeout =
          setTimeout(
            () => controller.abort(),
            120000
          );


        const response =
          await fetch(
            BACKEND_URL +
            "/api/upload",
            {
              method: "POST",
              body: formData,
              signal: controller.signal
            }
          );


        clearTimeout(timeout);


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(
            data.message ||
            "Upload failed"
          );

        }


        /* Add video to feed */

        addVideoToFeed(
          data.video.url,
          captionInput.value.trim(),
          hashtagInput.value.trim()
        );


        /* Save locally */

        localStorage.setItem(
          "zyloLastVideo",
          JSON.stringify({
            url: data.video.url,
            caption:
              captionInput.value.trim(),
            hashtags:
              hashtagInput.value.trim()
          })
        );


        uploadStatus.textContent =
          "ভিডিও সফলভাবে পোস্ট হয়েছে!";


        setTimeout(
          () => {

            closeCreate();

            window.scrollTo({
              top: 0,
              behavior: "smooth"
            });

          },
          800
        );


      } catch (error) {

        console.error(error);


        if (
          error.name ===
          "AbortError"
        ) {

          uploadStatus.textContent =
            "আপলোডে বেশি সময় লাগছে। আবার চেষ্টা করুন।";

        } else {

          uploadStatus.textContent =
            "আপলোড ব্যর্থ: " +
            error.message;

        }


        postButton.disabled =
          false;

      }

    }


    /* =========================
       ADD VIDEO TO FEED
    ========================== */

    function addVideoToFeed(
      url,
      caption,
      hashtags
    ) {

      const feed =
        document.getElementById(
          "videoFeed"
        );


      const card =
        document.createElement(
          "section"
        );


      card.className =
        "video-card";


      card.innerHTML = `

        <video
          class="video"
          src="${escapeHTML(url)}"
          loop
          muted
          playsinline
          preload="metadata">
        </video>


        <div class="right-actions">

          <div class="action profile-action">

            <div class="profile-avatar">

              Z

              <span class="follow-plus">
                +
              </span>

            </div>

            <div class="action-label">
              Follow
            </div>

          </div>


          <div
            class="action"
            onclick="toggleLike(this)">

            <div class="action-icon like-icon">
              ♡
            </div>

            <div class="action-count">
              0
            </div>

          </div>


          <div class="action">

            <div class="action-icon comment-icon">
              💬
            </div>

            <div class="action-count">
              0
            </div>

          </div>


          <div
            class="action"
            onclick="toggleSave(this)">

            <div class="action-icon save-icon">
              ♡
            </div>

            <div class="action-label">
              Save
            </div>

          </div>


          <div
            class="action"
            onclick="shareVideo()">

            <div class="action-icon share-icon">
              ↗
            </div>

            <div class="action-label">
              Share
            </div>

          </div>


          <div class="action">

            <div class="music-disc">

              <span class="music-note">
                ♪
              </span>

            </div>

          </div>

        </div>


        <div class="video-info">

          <div class="username">

            @zylo_creator

            <span class="verified">
              ✓
            </span>

          </div>


          <div class="caption">
            ${escapeHTML(caption || "Welcome to ZYLO 🌎")}
          </div>


          <div class="hashtags">
            ${escapeHTML(
              hashtags ||
              "#ZYLO #ForYou"
            )}
          </div>


          <div class="music-text">

            <span class="music-small-note">
              ♫
            </span>

            Original sound - ZYLO

          </div>

        </div>

      `;


      feed.prepend(card);


      setupVideoObserver();

    }


    /* =========================
       VIDEO AUTOPLAY
    ========================== */

    function setupVideoObserver() {

      const videos =
        document.querySelectorAll(
          ".video"
        );


      const observer =
        new IntersectionObserver(
          entries => {

            entries.forEach(
              entry => {

                const video =
                  entry.target;


                if (
                  entry.isIntersecting &&
                  entry.intersectionRatio >= .65
                ) {

                  video.play()
                    .catch(() => {});

                } else {

                  video.pause();

                }

              }
            );

          },
          {
            threshold: [
              .25,
              .65,
              .9
            ]
          }
        );


      videos.forEach(
        video => {

          observer.observe(video);

        }
      );

    }


    setupVideoObserver();


    /* =========================
       LIKE
    ========================== */

    function toggleLike(action) {

      const icon =
        action.querySelector(
          ".like-icon"
        );

      const count =
        action.querySelector(
          ".action-count"
        );


      const liked =
        icon.classList.toggle(
          "liked"
        );


      icon.textContent =
        liked ? "♥" : "♡";


      count.textContent =
        liked ? "1" : "0";

    }


    /* =========================
       SAVE
    ========================== */

    function toggleSave(action) {

      const icon =
        action.querySelector(
          ".save-icon"
        );


      const saved =
        icon.classList.toggle(
          "saved"
        );


      icon.textContent =
        saved ? "🔖" : "♡";

    }


    /* =========================
       SHARE
    ========================== */

    async function shareVideo() {

      const shareData = {

        title: "ZYLO",

        text:
          "Check out this video on ZYLO 🌎",

        url:
          window.location.href

      };


      try {

        if (
          navigator.share
        ) {

          await navigator.share(
            shareData
          );

        } else {

          await navigator.clipboard.writeText(
            window.location.href
          );

          alert(
            "ভিডিওর লিংক কপি হয়েছে।"
          );

        }

      } catch (error) {

        console.log(
          "Share cancelled"
        );

      }

    }

    }


    /* =========================
       DRAFT
    ========================== */

    function saveDraft() {

      if (!selectedVideo) {

        alert(
          "আগে একটি ভিডিও নির্বাচন করুন।"
        );

        return;

      }


      localStorage.setItem(
        "zyloDraft",
        JSON.stringify({
          caption:
            captionInput.value,
          hashtags:
            hashtagInput.value,
          privacy:
            privacySelect.value
        })
      );


      uploadStatus.textContent =
        "Draft সংরক্ষণ হয়েছে।";

    }


    /* =========================
       SECURITY
    ========================== */

    function escapeHTML(value) {

      return String(value || "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }

  </script>

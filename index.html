<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ZYLO</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button{
  border:0;
  outline:0;
  background:none;
  color:#fff;
  padding:0;
  margin:0;
}

#app{
  width:100%;
  height:100%;
  position:relative;
  background:#000;
}

/* =========================
   FEED
========================= */

#feed{
  width:100%;
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;
  scroll-snap-type:y mandatory;
  scrollbar-width:none;
}

#feed::-webkit-scrollbar{
  display:none;
}

.video-card{
  width:100%;
  height:100dvh;
  min-height:100vh;
  position:relative;
  scroll-snap-align:start;
  overflow:hidden;
  background:#000;
}

.video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

/* =========================
   TOP BAR
========================= */

.top-bar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:90px;
  z-index:50;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding-bottom:18px;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.65),
    transparent
  );
}

.tabs{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:38px;
}

.tab{
  position:relative;
  font-size:19px;
  color:#aaa;
  cursor:pointer;
  padding:5px 0;
}

.tab.active{
  color:#fff;
  font-weight:700;
}

.tab.active::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-12px;
  height:5px;
  border-radius:10px;
  background:#fff;
}

/* Search */

.search-button{
  position:absolute;
  right:28px;
  top:18px;
  width:62px;
  height:62px;
  border-radius:50%;
  background:rgba(35,35,35,.92);
  display:flex;
  align-items:center;
  justify-content:center;
}

.search-button svg{
  width:38px;
  height:38px;
  stroke:#fff;
  stroke-width:3;
  fill:none;
}

/* =========================
   RIGHT ACTIONS
========================= */

.video-actions{
  position:absolute;
  z-index:40;
  right:13px;
  top:50%;
  transform:translateY(-24%);
  width:70px;

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}

/* every button */

.action{
  width:64px;
  min-height:58px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  color:#fff;
  cursor:pointer;
}

.action svg{
  width:38px;
  height:38px;
  stroke:#fff;
  stroke-width:2.7;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.action .count,
.action .label{
  margin-top:4px;
  font-size:13px;
  line-height:16px;
  color:#fff;
}

/* Profile */

.profile-action{
  min-height:86px;
}

.avatar{
  width:58px;
  height:58px;
  border:2px solid #fff;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:31px;
  font-weight:400;
  color:#fff;
  position:relative;
}

.follow-plus{
  position:absolute;
  right:-7px;
  bottom:-5px;

  width:26px;
  height:26px;

  border-radius:50%;
  background:#ff174f;
  border:2px solid #fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:21px;
  font-weight:bold;
  line-height:1;
}

.follow-text{
  margin-top:5px;
  font-size:13px;
}

/* liked */

.like-button.liked svg{
  fill:#ff2b55;
  stroke:#ff2b55;
}

/* saved */

.save-button.saved svg{
  fill:#fff;
}

/* =========================
   MUSIC BUTTON
========================= */

.music-button{
  position:absolute;
  z-index:45;

  right:16px;
  bottom:92px;

  width:58px;
  height:58px;

  border-radius:50%;
  background:#111;

  border:2px solid #333;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
    0 0 0 5px rgba(255,255,255,.04),
    0 0 0 9px rgba(255,255,255,.025);
}

.music-button svg{
  width:27px;
  height:27px;
  stroke:#fff;
  fill:none;
  stroke-width:2.2;
}

/* =========================
   VIDEO INFORMATION
========================= */

.video-info{
  position:absolute;
  z-index:30;

  left:25px;
  right:90px;
  bottom:91px;

  color:#fff;
}

.username{
  display:flex;
  align-items:center;
  gap:7px;

  font-size:21px;
  font-weight:700;
  margin-bottom:25px;
}

.verified{
  width:28px;
  height:28px;
  border-radius:50%;
  background:#20c8ed;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  font-size:17px;
  font-weight:bold;
}

.caption{
  font-size:19px;
  margin-bottom:10px;
}

.tagline{
  font-size:19px;
  margin-bottom:20px;
}

.hashtags{
  font-size:17px;
  line-height:25px;
  color:#25c8ed;
  margin-bottom:20px;
}

.sound-row{
  display:flex;
  align-items:center;
  gap:8px;

  font-size:16px;
}

.sound-icon{
  font-size:20px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:absolute;
  z-index:100;

  left:0;
  right:0;
  bottom:0;

  height:78px;

  background:#000;
  border-top:1px solid #222;

  display:grid;
  grid-template-columns:1fr 1fr 1.25fr 1fr 1fr;
  align-items:center;
}

.nav-item{
  height:78px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:4px;

  color:#fff;
  font-size:13px;
}

.nav-item svg{
  width:30px;
  height:30px;

  stroke:#fff;
  fill:none;
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.nav-item.active{
  font-weight:700;
}

/* Create button */

.create-wrap{
  display:flex;
  justify-content:center;
  align-items:center;
}

.create-button{
  position:relative;

  width:72px;
  height:52px;

  background:#fff;
  color:#000;

  border-radius:14px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:31px;
  font-weight:400;

  box-shadow:
    -7px 0 0 #22d9df,
    7px 0 0 #ff1d61;
}

.create-button span{
  position:relative;
  z-index:2;
}

/* =========================
   CREATE SCREEN
========================= */

#createScreen{
  display:none;
  position:absolute;
  inset:0;
  z-index:200;
  background:#000;
}

.create-header{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  border-bottom:1px solid #222;
}

.create-title{
  font-size:20px;
  font-weight:700;
}

.close-create{
  position:absolute;
  left:18px;
  font-size:31px;
}

.create-content{
  padding:18px;
  height:calc(100% - 65px);
  overflow-y:auto;
}

.preview-box{
  width:100%;
  height:320px;
  background:#111;
  border-radius:12px;
  overflow:hidden;
}

#previewVideo{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

.select-video{
  margin-top:15px;
  width:100%;
  padding:14px;
  border:1px solid #444;
  border-radius:10px;
  text-align:center;
  font-size:16px;
}

.caption-input{
  width:100%;
  margin-top:15px;
  min-height:90px;
  padding:13px;

  background:#111;
  color:#fff;

  border:1px solid #333;
  border-radius:10px;

  resize:none;
  font-size:16px;
}

.settings-row{
  padding:17px 4px;
  border-bottom:1px solid #222;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.settings-title{
  font-size:15px;
}

.settings-sub{
  color:#999;
  font-size:13px;
  margin-top:4px;
}

.post-area{
  display:flex;
  gap:12px;
  margin-top:20px;
}

.post-btn,
.draft-btn{
  flex:1;
  padding:14px;
  border-radius:10px;
  font-size:16px;
  font-weight:700;
}

.post-btn{
  background:#fff;
  color:#000;
}

.draft-btn{
  border:1px solid #555;
}

#uploadStatus{
  text-align:center;
  margin-top:12px;
  font-size:14px;
  color:#aaa;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .top-bar{
    height:88px;
    padding-bottom:17px;
  }

  .tabs{
    gap:31px;
  }

  .tab{
    font-size:18px;
  }

  .search-button{
    right:18px;
    top:16px;
    width:60px;
    height:60px;
  }

  .video-actions{
    right:8px;
    top:51%;
    transform:translateY(-20%);
    gap:16px;
  }

  .action{
    width:62px;
    min-height:54px;
  }

  .action svg{
    width:36px;
    height:36px;
  }

  .avatar{
    width:56px;
    height:56px;
    font-size:30px;
  }

  .follow-plus{
    width:25px;
    height:25px;
  }

  .action .count,
  .action .label,
  .follow-text{
    font-size:12px;
  }

  .music-button{
    right:11px;
    bottom:88px;
    width:55px;
    height:55px;
  }

  .video-info{
    left:25px;
    right:85px;
    bottom:88px;
  }

  .username{
    font-size:20px;
    margin-bottom:23px;
  }

  .verified{
    width:27px;
    height:27px;
  }

  .caption,
  .tagline{
    font-size:18px;
  }

  .hashtags{
    font-size:16px;
    line-height:25px;
  }

  .sound-row{
    font-size:16px;
  }

  .bottom-nav{
    height:76px;
  }

  .nav-item{
    height:76px;
    font-size:12px;
  }

  .nav-item svg{
    width:29px;
    height:29px;
  }

  .create-button{
    width:68px;
    height:50px;
    border-radius:13px;
    font-size:30px;
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- =========================
       FEED
  ========================= -->

  <main id="feed">

    <section class="video-card">

      <video
        class="video"
        src="uploads/video1.mp4"
        loop
        muted
        playsinline
        preload="metadata">
      </video>

      <!-- TOP -->

      <div class="top-bar">

        <div class="tabs">

          <button class="tab">LIVE</button>

          <button class="tab">Following</button>

          <button class="tab active">For You</button>

        </div>

        <button class="search-button" aria-label="Search">

          <svg viewBox="0 0 48 48">
            <circle cx="21" cy="21" r="13"></circle>
            <line x1="31" y1="31" x2="42" y2="42"></line>

           RIGHT ACTIONS
      ========================= -->

      <div class="video-actions">

        <!-- PROFILE -->

            Z

          </div>

          <span class="follow-text">Follow</span>

        </button>


        <!-- LIKE -->

        <button class="action like-button">

          <svg viewBox="0 0 48 48">
            <path d="M24 40
                     C22 38 8 29 8 18
                     C8 11 13 7 19 7
                     C22 7 24 9 24 12
                     C24 9 27 7 30 7
                     C36 7 40 11 40 18
                     C40 29 26 38 24 40Z">
            </path>
          </svg>

          <span class="count">0</span>

        </button>


        <!-- COMMENT -->

        <button class="action">

          <svg viewBox="0 0 48 48">
            <path d="M8 9
                     H40
                     V31
                     H25
                     L16 39
                     V31
                     H8
                     Z">
            </path>
          </svg>

          <span class="count">0</span>

        <!-- SAVE -->

          <svg viewBox="0 0 48 48">

          </svg>

          <span class="label">Save</span>

        </button>


        <!-- SHARE -->

        <button class="action">

          <svg viewBox="0 0 48 48">
            <path d="M7 24
                     L40 7

                     L23 29

            </path>

            <line x1="23" y1="29" x2="40" y2="7"></line>
          </svg>

          <span class="label">Share</span>

        </button>

      </div>


      <!-- MUSIC -->

      <button class="music-button">

        <svg viewBox="0 0 48 48">

          <path d="M29 9
                   V31
                   C29 35 25 38 21 38
                   C17 38 14 36 14 33
                   C14 30 17 28 21 28
                   C24 28 26 29 29 31">
          </path>

          <line x1="29" y1="9" x2="38" y2="7"></line>

      <!-- =========================
           VIDEO INFO
      ========================= -->

      <div class="video-info">

        <div class="username">

          <span class="verified">✓</span>

        </div>

        <div class="caption">
          Welcome to ZYLO 🌎
        </div>

        <div class="tagline">

        </div>

        <div class="hashtags">

        </div>

        <div class="sound-row">

          <span class="sound-icon">♪</span>

          <span>Original sound - ZYLO</span>

    </section>

  </main>


  <!-- =========================

  ========================= -->

  <nav class="bottom-nav">

    <!-- HOME -->

    <button class="nav-item active">

      <svg viewBox="0 0 48 48">
        <path d="M6 22
                 L24 7
                 L42 22
                 V42
                 H29
                 V29
                 H19
                 V42
                 H6
                 Z">
        </path>
      </svg>

      <span>Home</span>

    </button>


    <!-- DISCOVER -->

    <button class="nav-item">

      <svg viewBox="0 0 48 48">
        <circle cx="21" cy="21" r="13"></circle>
        <line x1="31" y1="31" x2="42" y2="42"></line>
      </svg>

      <span>Discover</span>

    </button>


    <!-- CREATE -->

    <button class="nav-item create-wrap">

      <span class="create-button">
        <span>+</span>
      </span>

    </button>


    <!-- INBOX -->

    <button class="nav-item">

      <svg viewBox="0 0 48 48">
        <path d="M7 10
                 H41
                 V38
                 H7
                 Z">
        </path>

        <path d="M7 28
                 H17
                 L21 33
                 H27
                 L31 28
                 H41">
        </path>
      </svg>

      <span>Inbox</span>

    </button>


    <!-- PROFILE -->

    <button class="nav-item">

      <svg viewBox="0 0 48 48">
        <circle cx="24" cy="15" r="8"></circle>

        <path d="M9 42
                 C10 31 16 27 24 27
                 C32 27 38 31 39 42">
        </path>

  <!-- =========================
       CREATE SCREEN
  ========================= -->

  <section id="createScreen">

    <header class="create-header">

      <button class="close-create" id="closeCreate">
        ×
      </button>

      <div class="create-title">
        Create
      </div>

    </header>


    <div class="create-content">

      <div class="preview-box">

        <video
          id="previewVideo"
          controls
          playsinline>
        </video>

      </div>


      <input
        type="file"
        id="videoInput"
        accept="video/*"
        hidden>


      <button
        class="select-video"
        id="selectVideo">
        Choose video
      </button>


      <textarea
        id="captionInput"
        class="caption-input"
        maxlength="2200"
        placeholder="Add a caption...">
      </textarea>


      <div class="settings-row">

        <div>
          <div class="settings-title">
            Sound
          </div>

          <div class="settings-sub">
            Original sound - ZYLO
          </div>
        </div>

        <span>›</span>

      </div>


      <div class="settings-row">

        <div>
          <div class="settings-title">
            Who can view this video
          </div>

          <div class="settings-sub">
            Everyone
          </div>
        </div>

        <span>›</span>

      </div>


      <div class="settings-row">

        <div>
          <div class="settings-title">
            Allow comments
          </div>
        </div>

        <span>ON</span>

      </div>


      <div class="settings-row">

        <div>
          <div class="settings-title">
            Allow downloads
          </div>
        </div>

        <span>OFF</span>

      </div>


      <div class="post-area">

        <button class="draft-btn">
          Draft
        </button>

        <button
          class="post-btn"
          id="postButton">
          Post
        </button>

      </div>


      <div id="uploadStatus"></div>

    </div>

<script>

/* =========================
   ELEMENTS
========================= */

const feed = document.getElementById("feed");

const videos = document.querySelectorAll(".video");

const createButton =
  document.querySelector(".create-button");

const createScreen =
  document.getElementById("createScreen");

const closeCreate =
  document.getElementById("closeCreate");

const videoInput =
  document.getElementById("videoInput");

const selectVideo =
  document.getElementById("selectVideo");

const previewVideo =
  document.getElementById("previewVideo");

const postButton =
  document.getElementById("postButton");

const captionInput =
  document.getElementById("captionInput");

const uploadStatus =
  document.getElementById("uploadStatus");


/* =========================
   VIDEO AUTOPLAY
========================= */

const observer =
new IntersectionObserver(
  entries => {

    entries.forEach(entry => {

      const video =
        entry.target;

      if(entry.isIntersecting){

        video.play().catch(() => {});

      }else{

        video.pause();

      }

    });

  },
  {
    threshold:0.65
  }
);


videos.forEach(video => {

  observer.observe(video);

});


/* =========================
   CREATE SCREEN
========================= */

createButton.addEventListener(
  "click",
  () => {

    createScreen.style.display =
      "block";

  }
);


closeCreate.addEventListener(
  "click",
  () => {

    createScreen.style.display =
      "none";

    previewVideo.pause();

  }
);


/* =========================
   SELECT VIDEO
========================= */

selectVideo.addEventListener(
  "click",
  () => {

    videoInput.click();

  }
);


videoInput.addEventListener(
  "change",
  () => {

    const file =
      videoInput.files[0];

    if(!file){
      return;
    }

    const url =
      URL.createObjectURL(file);

    previewVideo.src = url;

    previewVideo.load();

    uploadStatus.textContent =
      "ভিডিও প্রস্তুত। Post চাপুন।";

  }
);


/* =========================
   LIKE
========================= */

document.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        ".like-button"
      );

    if(!button){
      return;
    }

    button.classList.toggle(
      "liked"
    );

  }
);


/* =========================
   SAVE
========================= */

document.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        ".save-button"
      );

    if(!button){
      return;
    }

    button.classList.toggle(
      "saved"
    );

    const label =
      button.querySelector(
        ".label"
      );

    if(button.classList.contains("saved")){

      label.textContent =
        "Saved";

    }else{

      label.textContent =
        "Save";

    }

  }
);


/* =========================
   POST / UPLOAD
========================= */

postButton.addEventListener(
  "click",
  async () => {

    const file =
      videoInput.files[0];

    if(!file){

      uploadStatus.textContent =
        "আগে একটি ভিডিও নির্বাচন করুন।";

      return;

    }

    postButton.disabled = true;

    uploadStatus.textContent =
      "ভিডিও আপলোড হচ্ছে...";

    const formData =
      new FormData();

    formData.append(
      "video",
      file
    );


    try{

      const response =
        await fetch(
          "https://zylo-backend-ec5c.onrender.com/api/upload",
          {
            method:"POST",
            body:formData
          }
        );


      const data =
        await response.json();


      if(!response.ok){

        throw new Error(
          data.message ||
          "Upload failed"
        );

      }


      uploadStatus.textContent =
        "ভিডিও সফলভাবে আপলোড হয়েছে ✓";


      /* Save latest video */

      localStorage.setItem(
        "zylo_last_video",
        data.video.url
      );

      localStorage.setItem(
        "zylo_last_caption",
        captionInput.value
      );


      /* Add uploaded video to feed */

      addUploadedVideo(
        data.video.url,
        captionInput.value
      );


      setTimeout(
        () => {

          createScreen.style.display =
            "none";

          postButton.disabled =
            false;

        },
        800
      );


    }catch(error){

      console.error(error);

      uploadStatus.textContent =
        "আপলোড করা যায়নি: " +
        error.message;

      postButton.disabled =
        false;

    }

  }
);

/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

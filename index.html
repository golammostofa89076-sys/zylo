            <path d="M8 11.5h.01"/>
            <path d="M12 11.5h.01"/>
            <path d="M16 11.5h.01"/>

          </svg>

          <span class="count">0</span>

        <!-- SAVE -->
        <button class="action-btn save-btn">

  <!-- UPLOAD MODAL -->

<script>

/* =====================================
   VIDEO AUTO PLAY / PAUSE
===================================== */

const videoFeed = document.getElementById("videoFeed");

let videos = document.querySelectorAll(".video");

const observer = new IntersectionObserver(
  (entries) => {

    entries.forEach((entry) => {

      const video = entry.target;

      if (entry.isIntersecting) {

        videos.forEach((otherVideo) => {

          if (otherVideo !== video) {
            otherVideo.pause();
          }

        });

        video.play().catch(() => {});

      } else {

        video.pause();

      }

    });

  },
  {
    threshold: 0.7
  }
);


videos.forEach((video) => {

  observer.observe(video);

  video.addEventListener("click", () => {

    if (video.paused) {

      video.play().catch(() => {});

    } else {

      video.pause();

    }

  });

});


/* =====================================
   LIKE
===================================== */

function setupLike(button) {

  button.addEventListener("click", () => {

    const count = button.querySelector(".count");

    let number = Number(count.textContent) || 0;

    if (button.classList.contains("active")) {

      button.classList.remove("active");

      number--;

    } else {

      button.classList.add("active");

      number++;

    }

    count.textContent = number;

  });

}


document.querySelectorAll(".like-btn")
.forEach(setupLike);


/* =====================================
   SAVE
===================================== */

function setupSave(button) {

  button.addEventListener("click", () => {

    const count = button.querySelector(".count");

    let number = Number(count.textContent) || 0;

    if (button.classList.contains("active")) {

      button.classList.remove("active");

      number--;

    } else {

      button.classList.add("active");

      number++;

    }

    count.textContent = number;

  });

}


document.querySelectorAll(".save-btn")
.forEach(setupSave);


/* =====================================
   FOLLOW
===================================== */

function setupFollow(button) {

  button.addEventListener("click", () => {

    button.classList.toggle("following");

    const plus =
      button.querySelector(".follow-plus");

    if (button.classList.contains("following")) {

      plus.textContent = "✓";

    } else {

      plus.textContent = "+";

    }

  });

}


document.querySelectorAll(".profile-action")
.forEach(setupFollow);


/* =====================================
   COMMENT
===================================== */

function setupComment(button) {

  button.addEventListener("click", () => {

    const text =
      prompt("Write a comment:");

    if (text && text.trim()) {

      const count =
        button.querySelector(".count");

      let number =
        Number(count.textContent) || 0;

      count.textContent =
        number + 1;

    }

  });

}


document.querySelectorAll(".comment-btn")
.forEach(setupComment);


/* =====================================
   SHARE
===================================== */

function setupShare(button) {

  button.addEventListener("click", async () => {

    const shareData = {

      title: "ZYLO",

      text: "Check out this video on ZYLO!",

      url: window.location.href

    };


    try {

      if (navigator.share) {

        await navigator.share(shareData);

      } else {

        await navigator.clipboard.writeText(
          window.location.href
        );

        alert("Link copied!");

      }

    } catch (error) {

      console.log("Share cancelled");

    }

  });

}


document.querySelectorAll(".share-btn")
.forEach(setupShare);


/* =====================================
   SOUND
===================================== */

function setupSound(button) {

  button.addEventListener("click", () => {

    const card =
      button.closest(".video-card");

    const video =
      card.querySelector(".video");

    video.muted = !video.muted;

    button.classList.toggle("active");

  });

}


document.querySelectorAll(".sound-btn")
.forEach(setupSound);


/* =====================================
   UPLOAD MODAL
===================================== */

const uploadModal =
  document.getElementById("uploadModal");

const openUpload =
  document.getElementById("openUpload");

const closeUpload =
  document.getElementById("closeUpload");

const videoInput =
  document.getElementById("videoInput");

const uploadBtn =
  document.getElementById("uploadBtn");

const uploadStatus =
  document.getElementById("uploadStatus");


/* Open */

openUpload.addEventListener("click", () => {

  uploadModal.classList.add("show");

});


/* Close */

closeUpload.addEventListener("click", () => {

  uploadModal.classList.remove("show");

});


/* Close outside */

uploadModal.addEventListener("click", (event) => {

  if (event.target === uploadModal) {

    uploadModal.classList.remove("show");

  }

});


/* =====================================
   VIDEO UPLOAD
   RENDER BACKEND
===================================== */

uploadBtn.addEventListener("click", async () => {

  const file =
    videoInput.files[0];


  /* No file */

  if (!file) {

    uploadStatus.textContent =
      "আগে একটি ভিডিও নির্বাচন করুন।";

    return;

  }


  /* Check video */

  if (!file.type.startsWith("video/")) {

    uploadStatus.textContent =
      "শুধু ভিডিও ফাইল নির্বাচন করুন।";

    return;

  }


  /* Maximum 200 MB */

  if (file.size > 200 * 1024 * 1024) {

    uploadStatus.textContent =
      "ভিডিও 200 MB-এর মধ্যে হতে হবে।";

    return;

  }


  /* Form */

  const formData =
    new FormData();

  formData.append(
    "video",
    file
  );


  uploadBtn.disabled = true;

  uploadBtn.textContent =
    "Uploading...";

  uploadStatus.textContent =
    "ভিডিও আপলোড হচ্ছে...";


  try {

    /*
      ZYLO Render Backend
    */

    const response = await fetch(
      "https://zylo-backend-ec5c.onrender.com/api/upload",
      {
        method: "POST",
        body: formData
      }
    );


    const data =
      await response.json();


    if (!response.ok || !data.success) {

      throw new Error(
        data.message ||
        "Upload failed"
      );

    }


    /* Add uploaded video */

    addVideoToFeed(
      data.video.url
    );


    uploadStatus.textContent =
      "ভিডিও সফলভাবে আপলোড হয়েছে!";


    videoInput.value = "";


    setTimeout(() => {

      uploadModal.classList.remove("show");

      uploadStatus.textContent = "";

    }, 1200);


  } catch (error) {

    console.error(error);

    uploadStatus.textContent =
      "আপলোড ব্যর্থ হয়েছে: " +
      error.message;

  }


  uploadBtn.disabled = false;

  uploadBtn.textContent =
    "Upload Video";

});


/* =====================================
   ADD NEW VIDEO
===================================== */

function addVideoToFeed(videoUrl) {

  const card =
    document.createElement("section");

  card.className =
    "video-card";


  card.innerHTML = `

    <video
      class="video"
      src="${videoUrl}"
      loop
      muted
      playsinline
      preload="metadata">
    </video>

    <div class="video-gradient"></div>


    <div class="video-info">

      <div class="username">
        @zylo_creator
      </div>

      <div class="caption">
        New video on ZYLO 🚀
      </div>

      <div class="music">
        ♫ Original sound — ZYLO
      </div>

    </div>


    <div class="right-actions">


      <button class="action-btn profile-action">

        <div class="avatar">
          Z
        </div>

        <span class="follow-plus">
          +
        </span>

      </button>


      <button class="action-btn like-btn">

        <svg viewBox="0 0 24 24">

          <path d="M20.8 8.7c0 5.5-8.8 10.3-8.8 10.3S3.2 14.2 3.2 8.7A4.7 4.7 0 0 1 12 6.3a4.7 4.7 0 0 1 8.8 2.4Z"/>

        </svg>

        <span class="count">
          0
        </span>

      </button>


      <button class="action-btn comment-btn">

        <svg viewBox="0 0 24 24">

          <path d="M20 11.5a8 8 0 0 1-8 8 8.8 8.8 0 0 1-3.8-.9L4 20l1.3-3.5A8 8 0 1 1 20 11.5Z"/>

          <path d="M8 11.5h.01"/>
          <path d="M12 11.5h.01"/>
          <path d="M16 11.5h.01"/>

        </svg>

        <span class="count">
          0
        </span>

      </button>


      <button class="action-btn save-btn">

        <svg viewBox="0 0 24 24">

          <path d="M6 3.5h12v17l-6-3.5-6 3.5v-17Z"/>

        </svg>

        <span class="count">
          0
        </span>

      </button>


      <button class="action-btn share-btn">

        <svg viewBox="0 0 24 24">

          <path d="M12 16V4"/>

          <path d="m7 9 5-5 5 5"/>

          <path d="M5 13v6.5h14V13"/>

        </svg>

        <span class="count">
          Share
        </span>

      </button>


      <button class="action-btn sound-btn">

        <svg viewBox="0 0 24 24">

          <path d="M4 10v4h4l5 4V6l-5 4H4Z"/>

          <path d="M17 9a4 4 0 0 1 0 6"/>

          <path d="M19.5 6.5a7.5 7.5 0 0 1 0 11"/>

        </svg>

      </button>


    </div>
  `;


  videoFeed.prepend(card);


  /* New video */

  const video =
    card.querySelector(".video");


  observer.observe(video);


  /* Buttons */

  setupLike(
    card.querySelector(".like-btn")
  );

  setupSave(
    card.querySelector(".save-btn")
  );

  setupFollow(
    card.querySelector(".profile-action")
  );

  setupComment(
    card.querySelector(".comment-btn")
  );

  setupShare(
    card.querySelector(".share-btn")
  );

  setupSound(
    card.querySelector(".sound-btn")
  );


  video.addEventListener("click", () => {

    if (video.paused) {

      video.play().catch(() => {});

    } else {

      video.pause();

    }

  });


  /* Play */

  video.play().catch(() => {});

}

</script>

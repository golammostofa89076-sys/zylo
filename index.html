<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZYLO</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* Create screen */
    .create-screen {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: #000;
      color: #fff;
      display: none;
      overflow-y: auto;
    }

    .create-screen.show {
      display: block;
    }

    .create-header {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: sticky;
      top: 0;
      z-index: 10;
      background: #000;
      border-bottom: 1px solid #222;
    }

    .create-header h2 {
      font-size: 24px;
    }

    .create-close {
      position: absolute;
      left: 18px;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: #222;
      color: #fff;
      font-size: 30px;
    }

    .create-options {
      display: flex;
      gap: 18px;
      padding: 32px 20px 20px;
    }

    .create-option {
      flex: 1;
      min-height: 210px;
      border: 1px solid #333;
      border-radius: 22px;
      background: #161616;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 20px;
    }

    .create-option .emoji {
      font-size: 55px;
    }

    .create-option small {
      font-size: 15px;
      color: #aaa;
    }

    .editor {
      display: none;
      padding: 20px;
    }

    .editor.show {
      display: block;
    }

    .preview-box {
      width: 100%;
      max-width: 430px;
      height: 480px;
      margin: 0 auto 20px;
      background: #111;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
    }

    .preview-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .caption-input {
      width: 100%;
      min-height: 100px;
      resize: none;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 18px;
      background: #171717;
      color: #fff;
      font-size: 17px;
      outline: none;
      margin-bottom: 14px;
    }

    .caption-input::placeholder {
      color: #888;
    }

    .sound-row {
      width: 100%;
      padding: 18px;
      border-radius: 15px;
      background: #171717;
      border: 1px solid #292929;
      margin-bottom: 18px;
      font-size: 16px;
    }

    .privacy-row {
      width: 100%;
      padding: 16px;
      border-radius: 15px;
      background: #171717;
      border: 1px solid #292929;
      color: #fff;
      margin-bottom: 18px;
      font-size: 16px;
    }

    .post-btn {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: #fe2c55;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
    }

    .post-btn:disabled {
      opacity: .5;
    }

    .upload-status {
      text-align: center;
      margin: 14px 0;
      min-height: 22px;
      color: #fff;
    }

    .choose-again {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #171717;
      color: #fff;
      font-size: 16px;
    }

    /* Feed uploaded video */
    .new-video-card {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      scroll-snap-align: start;
      overflow: hidden;
      background: #000;
    }

    .new-video-card video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .new-video-info {
      position: absolute;
      left: 16px;
      right: 90px;
      bottom: 115px;
      z-index: 20;
      text-shadow: 0 2px 6px #000;
    }

    .new-video-info .user {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .new-video-info .caption {
      font-size: 16px;
      line-height: 1.4;
      margin-bottom: 8px;
      white-space: pre-wrap;
    }

    .new-video-info .sound {
      font-size: 14px;
    }

    .new-actions {
      position: absolute;
      right: 12px;
      bottom: 100px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 17px;
    }

    .new-actions button {
      width: 52px;
      min-height: 52px;
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 2px 5px #000);
    }

    .new-actions span {
      font-size: 12px;
      margin-top: 2px;
    }

    @media (max-width:600px) {
      .create-options {
        padding: 30px 18px;
      }

      .create-option {
        min-height: 190px;
      }

      .preview-box {
        height: 460px;
      }

      .new-video-info {
        left: 14px;
        bottom: 105px;
      }

      .new-actions {
        right: 8px;
        bottom: 90px;
      }
    }
  </style>
</head>

<body>

  <!-- TOP BAR -->
  <header class="top-bar">
    <div class="top-tabs">
      <button class="top-tab">LIVE</button>
      <button class="top-tab">Following</button>
      <button class="top-tab active">For You</button>
    </div>

    <button
      onclick="openSearch()"
      style="
        position:absolute;
        right:18px;
        top:13px;
        background:none;
        border:0;
        color:white;
        font-size:32px;
      "
    >⌕</button>
  </header>


  <!-- VIDEO FEED -->
  <main class="video-feed" id="videoFeed">

    <!-- DEFAULT VIDEO -->
    <section class="video-card">

      <video
        class="video"
        src="uploads/video1.mp4"
        loop
        muted
        playsinline
      ></video>

      <div class="video-gradient"></div>

      <div class="video-info">
        <div class="username">@zylo_creator</div>

        <div class="caption">
          Welcome to ZYLO 🌎
          <br>
          Create • Connect • Grow
        </div>

        <div class="music">
          ♪ Original sound - ZYLO
        </div>
      </div>

      <div class="right-actions">

        <button class="action-btn">
          <div class="avatar">Z</div>
          <div class="follow-plus">+</div>
        </button>

        <button class="action-btn like-btn">
          ♡
          <span class="count">0</span>
        </button>

        <button class="action-btn">
          💬
          <span class="count">0</span>
        </button>

        <button class="action-btn save-btn">
          ♧
          <span class="count">0</span>
        </button>

        <button class="action-btn">
          ↗
          <span>Share</span>
        </button>

      </div>
    </section>

  </main>


  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">

    <button class="nav-button active">
      <span style="font-size:26px">⌂</span>
      Home
    </button>

    <button class="nav-button" onclick="openSearch()">
      <span style="font-size:28px">⌕</span>
      Search
    </button>

    <button
      class="nav-button upload-button"
      onclick="openCreate()"
    >
      <span style="font-size:30px">+</span>
    </button>

    <button class="nav-button">
      <span style="font-size:24px">▱</span>
      Inbox
    </button>

    <button class="nav-button">
      <span style="font-size:25px">♙</span>
      Profile
    </button>

  </nav>


  <!-- CREATE SCREEN -->
  <section class="create-screen" id="createScreen">

    <div class="create-header">
      <button class="create-close" onclick="closeCreate()">×</button>
      <h2>Create</h2>
    </div>


    <!-- CAMERA / UPLOAD -->
    <div id="createOptions" class="create-options">

      <button
        class="create-option"
        onclick="openCamera()"
      >
        <div class="emoji">📹</div>
        <div>Camera</div>
        <small>Record video</small>
      </button>


      <button
        class="create-option"
        onclick="openGallery()"
      >
        <div class="emoji">🖼️</div>
        <div>Upload</div>
        <small>From gallery</small>
      </button>

    </div>


    <!-- EDITOR -->
    <div class="editor" id="editor">

      <div class="preview-box">
        <video
          id="previewVideo"
          class="preview-video"
          controls
          playsinline
        ></video>
      </div>


      <textarea
        id="captionInput"
        class="caption-input"
        maxlength="2200"
        placeholder="Write a caption..."
      ></textarea>


      <div class="sound-row">
        🎵 &nbsp; Sound
        <span style="float:right">
          Original sound - ZYLO
        </span>
      </div>


      <select id="privacySelect" class="privacy-row">
        <option value="public">🌎 Everyone can watch</option>
        <option value="friends">👥 Friends</option>
        <option value="private">🔒 Only me</option>
      </select>


      <button
        class="choose-again"
        onclick="openGallery()"
      >
        Choose another video
      </button>


      <div
        id="uploadStatus"
        class="upload-status"
      ></div>


      <button
        id="postButton"
        class="post-btn"
        onclick="postVideo()"
      >
        Post
      </button>

    </div>

  </section>


  <!-- HIDDEN FILE INPUT -->
  <input
    id="videoInput"
    type="file"
    accept="video/*"
    style="display:none"
  >


  <script>

    const BACKEND_URL =
      "https://zylo-backend-ec5c.onrender.com";

    const videoInput =
      document.getElementById("videoInput");

    const previewVideo =
      document.getElementById("previewVideo");

    const editor =
      document.getElementById("editor");

    const createOptions =
      document.getElementById("createOptions");

    const createScreen =
      document.getElementById("createScreen");

    const captionInput =
      document.getElementById("captionInput");

    const postButton =
      document.getElementById("postButton");

    const uploadStatus =
      document.getElementById("uploadStatus");

    let selectedVideo = null;


    /* OPEN CREATE */

    function openCreate() {
      createScreen.classList.add("show");

      editor.classList.remove("show");
      createOptions.style.display = "flex";

      selectedVideo = null;
      videoInput.value = "";
      previewVideo.removeAttribute("src");
      previewVideo.load();

      captionInput.value = "";
      uploadStatus.textContent = "";
      postButton.disabled = false;
    }


    /* CLOSE CREATE */

    function closeCreate() {
      createScreen.classList.remove("show");

      if (previewVideo.src) {
        URL.revokeObjectURL(previewVideo.src);
      }
    }


    /* GALLERY */

    function openGallery() {
      videoInput.click();
    }


    /* CAMERA */

    function openCamera() {

      videoInput.setAttribute(
        "capture",
        "environment"
      );

      videoInput.click();

      setTimeout(() => {
        videoInput.removeAttribute("capture");
      }, 1000);
    }


    /* FILE SELECTED */

    videoInput.addEventListener(
      "change",
      function () {

        const file = this.files[0];

        if (!file) return;


        /* VIDEO CHECK */

        if (!file.type.startsWith("video/")) {

          alert("শুধু ভিডিও নির্বাচন করুন।");

          videoInput.value = "";

          return;
        }


        /* SIZE CHECK */

        if (
          file.size >
          200 * 1024 * 1024
        ) {

          alert(
            "ভিডিও সর্বোচ্চ 200 MB হতে পারবে।"
          );

          videoInput.value = "";

          return;
        }


        selectedVideo = file;


        /* PREVIEW */

        if (previewVideo.src) {
          URL.revokeObjectURL(
            previewVideo.src
          );
        }

        const localURL =
          URL.createObjectURL(file);

        previewVideo.src = localURL;

        previewVideo.load();


        /* SHOW EDITOR */

        createOptions.style.display =
          "none";

        editor.classList.add("show");

        uploadStatus.textContent =
          "ভিডিও প্রস্তুত। এখন Caption লিখে Post করুন।";

      }
    );


    /* POST VIDEO */

    async function postVideo() {

      if (!selectedVideo) {

        alert(
          "প্রথমে একটি ভিডিও নির্বাচন করুন।"
        );

        return;
      }


      const caption =
        captionInput.value.trim();


      /* DISABLE */

      postButton.disabled = true;

      uploadStatus.textContent =
        "ভিডিও আপলোড হচ্ছে...";


      try {

        const formData =
          new FormData();

        formData.append(
          "video",
          selectedVideo
        );


        /* SEND TO BACKEND */

        const response =
          await fetch(
            BACKEND_URL +
            "/api/upload",
            {
              method: "POST",
              body: formData
            }
          );


        const data =
          await response.json();


        if (!response.ok || !data.success) {

          throw new Error(
            data.message ||
            "Upload failed"
          );

        }


        /* ADD VIDEO TO FEED */

        addVideoToFeed(
          data.video.url,
          caption
        );


        /* SAVE LOCAL INFO */

        localStorage.setItem(
          "zyloLastVideo",
          JSON.stringify({
            url: data.video.url,
            caption: caption
          })
        );


        uploadStatus.textContent =
          "ভিডিও সফলভাবে পোস্ট হয়েছে!";


        /* CLOSE CREATE */

        setTimeout(() => {

          closeCreate();

          document
            .getElementById("videoFeed")
            .scrollTo({
              top: 0,
              behavior: "smooth"
            });

        }, 700);


      } catch (error) {

        console.error(error);

        uploadStatus.textContent =
          "আপলোড ব্যর্থ হয়েছে: " +
          error.message;

        postButton.disabled = false;
      }
    }


    /* ADD UPLOADED VIDEO TO FEED */

    function addVideoToFeed(
      videoURL,
      caption
    ) {

      const card =
        document.createElement("section");

      card.className =
        "new-video-card";


      card.innerHTML = `

        <video
          src="${videoURL}"
          loop
          muted
          playsinline
          autoplay
        ></video>

        <div class="video-gradient"></div>


        <div class="new-video-info">

          <div class="user">
            @zylo_creator
          </div>

          <div class="caption">
            ${escapeHTML(
              caption ||
              "Welcome to ZYLO 🌎"
            )}
          </div>

          <div class="sound">
            ♪ Original sound - ZYLO
          </div>

        </div>


        <div class="new-actions">

          <button>
            <div class="avatar">Z</div>
            <span>+</span>
          </button>

          <button
            onclick="toggleLike(this)"
          >
            ♡
            <span>0</span>
          </button>

          <button>
            💬
            <span>0</span>
          </button>

          <button>
            ♧
            <span>0</span>
          </button>

          <button>
            ↗
            <span>Share</span>
          </button>

        </div>
      `;


      const feed =
        document.getElementById(
          "videoFeed"
        );


      feed.prepend(card);


      setupVideoObserver();

    }


    /* HTML SAFE */

    function escapeHTML(text) {

      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* LIKE */

    function toggleLike(button) {

      const number =
        button.querySelector("span");

      let count =
        parseInt(
          number.textContent
        ) || 0;


      if (button.classList.contains("liked")) {

        button.classList.remove("liked");

        count--;

        button.firstChild.textContent =
          "♡";

      } else {

        button.classList.add("liked");

        count++;

        button.firstChild.textContent =
          "♥";
      }


      number.textContent =
        count;
    }


    /* SEARCH */

    function openSearch() {

      alert(
        "ZYLO Search খুব শীঘ্রই চালু হবে।"
      );
    }


    /* AUTOPLAY */

    let videoObserver;


    function setupVideoObserver() {

      if (videoObserver) {
        videoObserver.disconnect();
      }


      videoObserver =
        new IntersectionObserver(
          entries => {

            entries.forEach(
              entry => {

                const video =
                  entry.target;

                if (
                  entry.isIntersecting
                ) {

                  video.play()
                    .catch(() => {});

                } else {

                  video.pause();
                }

              }
            );

          },
          {
            threshold: 0.65
          }
        );


      document
        .querySelectorAll(
          ".video-card video, .new-video-card video"
        )
        .forEach(video => {

          videoObserver.observe(
            video
          );

        });

    }


    /* INITIALIZE */

    setupVideoObserver();


    /* RESTORE LAST UPLOAD */

    window.addEventListener(
      "load",
      function () {

        const saved =
          localStorage.getItem(
            "zyloLastVideo"
          );

        if (!saved) return;

        try {

          const data =
            JSON.parse(saved);

          if (data.url) {

            addVideoToFeed(
              data.url,
              data.caption
            );

          }

        } catch (e) {

          console.log(e);

        }

      }
    );

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>ZYLO — Create • Connect • Grow</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<div class="app">

    <!-- ================= TOP BAR ================= -->
    <header class="top-bar">

        <div class="top-tabs">

            <button class="top-tab live-tab">
                LIVE
            </button>

            <button class="top-tab">
                Following
            </button>

            <button class="top-tab active">
                For You
            </button>

        </div>

        <button class="search-btn" aria-label="Search">

            <svg viewBox="0 0 24 24">
                <circle cx="10.8" cy="10.8" r="6.8"></circle>
                <path d="M16 16L21 21"></path>
            </svg>

        </button>

    </header>


    <!-- ================= VIDEO FEED ================= -->
    <main class="video-feed">


        <!-- ================= VIDEO 1 ================= -->
        <section class="video-page">

            <video
                class="video-player"
                src="./backend/uploads/video1.mp4"
                loop
                muted
                playsinline
                preload="metadata">
            </video>


            <!-- FULLSCREEN -->
            <button
                class="fullscreen-btn"
                aria-label="Fullscreen">

                <svg viewBox="0 0 24 24">

                    <path d="M8 3H3v5"></path>
                    <path d="M16 3h5v5"></path>

                    <path d="M3 16v5h5"></path>
                    <path d="M21 16v5h-5"></path>

                </svg>

            </button>


            <!-- ================= RIGHT ACTIONS ================= -->
            <div class="right-actions">


                <!-- PROFILE -->
                <button
                    class="profile-action"
                    aria-label="Profile">

                    <span class="profile-circle">
                        Z
                    </span>

                    <span class="follow-badge">
                        +
                    </span>

                </button>


                <!-- LIKE -->
                <button
                    class="action-btn like-btn"
                    aria-label="Like">

                    <svg viewBox="0 0 24 24">
                        <path d="M12 21S4 16 2.5 10.5C1.4 6.4 4.2 3 7.8 3c2 0 3.5 1.1 4.2 2.7C12.7 4.1 14.2 3 16.2 3c3.6 0 6.4 3.4 5.3 7.5C20 16 12 21 12 21Z"></path>
                    </svg>

                    <span class="action-count">
                        0
                    </span>

                </button>


                <!-- COMMENT -->
                <button
                    class="action-btn"
                    aria-label="Comments">

                    <svg viewBox="0 0 24 24">

                        <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H8l-4 3v-6.2A7.5 7.5 0 0 1 4.5 5.5 7.5 7.5 0 0 1 12 3h1a7 7 0 0 1 7 8.5Z"></path>

                    </svg>

                    <span class="action-count">
                        0
                    </span>

                </button>


                <!-- SAVE -->
                <button
                    class="action-btn save-btn"
                    aria-label="Save">

                    <svg viewBox="0 0 24 24">

                        <path d="M6 3h12v18l-6-4-6 4V3Z"></path>

                    </svg>

                    <span class="action-text">
                        Save
                    </span>

                </button>


                <!-- SHARE -->
                <button
                    class="action-btn share-btn"
                    aria-label="Share">

                    <svg viewBox="0 0 24 24">

                        <path d="M21 3 10 14"></path>
                        <path d="m21 3-7 18-4-7-7-4 18-7Z"></path>

                    </svg>

                    <span class="action-text">
                        Share
                    </span>

                </button>


                <!-- MUSIC -->
                <button
                    class="music-btn"
                    aria-label="Music">

                    <span class="music-disc">

                        <svg viewBox="0 0 24 24">

                            <path d="M9 18V6l10-2v12"></path>
                            <circle cx="6" cy="18" r="3"></circle>
                            <circle cx="16" cy="16" r="3"></circle>

                        </svg>

                    </span>

                </button>

            </div>


            <!-- ================= VIDEO INFO ================= -->
            <div class="video-info">

                <div class="username">
                    @zylo_creator
                    <span class="verified">✓</span>
                </div>

                <div class="caption">
                    Welcome to ZYLO 🌎
                </div>

                <div class="tagline">
                    Create • Connect • Grow
                </div>

                <div class="hashtags">
                    #ZYLO #Create #Connect #Grow #ForYou
                </div>

                <div class="music-info">

                    <svg viewBox="0 0 24 24">

                        <path d="M9 18V6l10-2v12"></path>
                        <circle cx="6" cy="18" r="3"></circle>
                        <circle cx="16" cy="16" r="3"></circle>

                    </svg>

                    Original sound - ZYLO

                </div>

            </div>

        </section>



        <!-- ================= VIDEO 2 ================= -->
        <section class="video-page">

            <video
                class="video-player"
                src="./backend/uploads/video1.mp4"
                loop
                muted
                playsinline
                preload="metadata">
            </video>


            <!-- FULLSCREEN -->
            <button
                class="fullscreen-btn"
                aria-label="Fullscreen">

                <svg viewBox="0 0 24 24">

                    <path d="M8 3H3v5"></path>
                    <path d="M16 3h5v5"></path>

                    <path d="M3 16v5h5"></path>
                    <path d="M21 16v5h-5"></path>

                </svg>

            </button>


            <!-- RIGHT ACTIONS -->
            <div class="right-actions">

                <!-- PROFILE — Z + ONLY -->
                <button
                    class="profile-action"
                    aria-label="Profile">

                    <span class="profile-circle">
                        Z
                    </span>

                    <span class="follow-badge">
                        +
                    </span>

                </button>


                <!-- LIKE -->
                <button
                    class="action-btn like-btn"
                    aria-label="Like">

                    <svg viewBox="0 0 24 24">

                        <path d="M12 21S4 16 2.5 10.5C1.4 6.4 4.2 3 7.8 3c2 0 3.5 1.1 4.2 2.7C12.7 4.1 14.2 3 16.2 3c3.6 0 6.4 3.4 5.3 7.5C20 16 12 21 12 21Z"></path>

                    </svg>

                    <span class="action-count">
                        0
                    </span>

                </button>


                <!-- COMMENT -->
                <button
                    class="action-btn"
                    aria-label="Comments">

                    <svg viewBox="0 0 24 24">

                        <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H8l-4 3v-6.2A7.5 7.5 0 0 1 4.5 5.5 7.5 7.5 0 0 1 12 3h1a7 7 0 0 1 7 8.5Z"></path>

                    </svg>

                    <span class="action-count">
                        0
                    </span>

                </button>


                <!-- SAVE -->
                <button
                    class="action-btn save-btn"
                    aria-label="Save">

                    <svg viewBox="0 0 24 24">

                        <path d="M6 3h12v18l-6-4-6 4V3Z"></path>

                    </svg>

                    <span class="action-text">
                        Save
                    </span>

                </button>


                <!-- SHARE -->
                <button
                    class="action-btn share-btn"
                    aria-label="Share">

                    <svg viewBox="0 0 24 24">

                        <path d="M21 3 10 14"></path>
                        <path d="m21 3-7 18-4-7-7-4 18-7Z"></path>

                    </svg>

                    <span class="action-text">
                        Share
                    </span>

                </button>


                <!-- MUSIC -->
                <button
                    class="music-btn"
                    aria-label="Music">

                    <span class="music-disc">

                        <svg viewBox="0 0 24 24">

                            <path d="M9 18V6l10-2v12"></path>
                            <circle cx="6" cy="18" r="3"></circle>
                            <circle cx="16" cy="16" r="3"></circle>

                        </svg>

                    </span>

                </button>

            </div>


            <!-- VIDEO INFO -->
            <div class="video-info">

                <div class="username">
                    @zylo_creator
                    <span class="verified">✓</span>
                </div>

                <div class="caption">
                    Welcome to ZYLO 🌎
                </div>

                <div class="tagline">
                    Create • Connect • Grow
                </div>

                <div class="hashtags">
                    #ZYLO #Create #Connect #Grow #ForYou
                </div>

                <div class="music-info">

                    <svg viewBox="0 0 24 24">

                        <path d="M9 18V6l10-2v12"></path>
                        <circle cx="6" cy="18" r="3"></circle>
                        <circle cx="16" cy="16" r="3"></circle>

                    </svg>

                    Original sound - ZYLO

                </div>

            </div>

        </section>

    </main>



    <!-- ================= BOTTOM NAV ================= -->
    <nav class="bottom-nav">


        <!-- HOME -->
        <button
            class="nav-item active"
            data-nav="home">

            <svg viewBox="0 0 24 24">

                <path d="m3 10 9-7 9 7"></path>
                <path d="M5 9v11h14V9"></path>
                <path d="M9 20v-6h6v6"></path>

            </svg>

            <span>
                Home
            </span>

        </button>


        <!-- DISCOVER -->
        <button
            class="nav-item"
            data-nav="discover">

            <svg viewBox="0 0 24 24">

                <circle cx="10.8" cy="10.8" r="6.8"></circle>
                <path d="M16 16 21 21"></path>

            </svg>

            <span>
                Discover
            </span>

        </button>


        <!-- CREATE -->
        <button
            class="create-btn"
            id="createBtn"
            aria-label="Create">

            <span class="create-left"></span>

            <span class="create-center">

                <svg viewBox="0 0 24 24">

                    <path d="M12 5V19"></path>
                    <path d="M5 12H19"></path>

                </svg>

            </span>

            <span class="create-right"></span>

        </button>


        <!-- INBOX -->
        <button
            class="nav-item"
            data-nav="inbox">

            <svg viewBox="0 0 24 24">

                <path d="M4 5h16v14H4z"></path>
                <path d="m4 7 8 6 8-6"></path>

            </svg>

            <span>
                Inbox
            </span>

        </button>


        <!-- PROFILE -->
        <button
            class="nav-item"
            data-nav="profile">

            <svg viewBox="0 0 24 24">

                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4 21c.8-4.2 3.5-6 8-6s7.2 1.8 8 6"></path>

            </svg>

            <span>
                Profile
            </span>

        </button>

    </nav>



    <!-- ================= UPLOAD INPUT ================= -->

    <input
        type="file"
        id="videoInput"
        accept="video/*"
        hidden>


    <!-- ================= UPLOAD MODAL ================= -->

    <div
        id="uploadBox"
        class="upload-box">

        <div class="upload-content">


            <button
                id="closeUpload"
                class="upload-close"
                aria-label="Close">

                <svg viewBox="0 0 24 24">

                    <path d="M6 6L18 18"></path>
                    <path d="M18 6L6 18"></path>

                </svg>

            </button>


            <div class="upload-icon">

                <svg viewBox="0 0 24 24">

                    <path d="M12 3v12"></path>
                    <path d="M7 10l5 5 5-5"></path>
                    <path d="M5 21h14"></path>

                </svg>

            </div>


            <h2>
                Upload Video
            </h2>


            <p id="uploadStatus">
                আপনার ভিডিও নির্বাচন করুন
            </p>


            <button
                id="selectVideo"
                class="select-video-btn">

                Select Video

            </button>

        </div>

    </div>

</div>


<script src="./script.js"></script>

</body>
</html>

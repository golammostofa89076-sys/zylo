<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>ZYLO</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      position: fixed;
      inset: 0;
    }

    button {
      border: 0;
      outline: 0;
      background: none;
      color: #fff;
      cursor: pointer;
    }

    /* =========================
       MAIN APP
    ========================= */

    #app {
      position: fixed;
      inset: 0;
      background: #000;
      overflow: hidden;
    }

    /* =========================
       VIDEO FEED
    ========================= */

    #feed {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      background: #000;
    }

    #feed::-webkit-scrollbar {
      display: none;
    }

    .video-card {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      overflow: hidden;
      background: #000;
    }

    .video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    /* Dark gradient like TikTok */
    .video-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,.30) 0%,
          transparent 18%,
          transparent 60%,
          rgba(0,0,0,.15) 72%,
          rgba(0,0,0,.72) 100%
        );
      z-index: 2;
    }

    /* =========================
       TOP TABS
    ========================= */

    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 82px;

      display: flex;
      align-items: flex-end;
      justify-content: center;

      padding-bottom: 14px;

      z-index: 100;

      background: linear-gradient(
        to bottom,
        rgba(0,0,0,.55),
        transparent
      );
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 34px;
    }

    .tab {
      position: relative;
      color: rgba(255,255,255,.70);
      font-size: 18px;
      font-weight: 400;
      padding: 5px 0;
    }

    .tab.active {
      color: #fff;
      font-weight: 700;
    }

    .tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -9px;
      height: 4px;
      border-radius: 10px;
      background: #fff;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-button {
      position: absolute;
      right: 14px;
      bottom: 7px;

      width: 56px;
      height: 56px;

      border-radius: 50%;
      background: rgba(35,35,35,.88);

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 110;
    }

    .search-icon {
      position: relative;
      width: 25px;
      height: 25px;
      border: 4px solid #fff;
      border-radius: 50%;
    }

    .search-icon::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 4px;
      background: #fff;
      border-radius: 5px;
      right: -11px;
      bottom: -7px;
      transform: rotate(48deg);
      transform-origin: left center;
    }

    /* =========================
       RIGHT ACTION BAR
    ========================= */

    .video-actions {
      position: absolute;

      right: 12px;

      /*
        Lower position:
        Profile starts around middle/lower area
      */
      top: 52%;

      transform: translateY(-8%);

      width: 58px;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 14px;

      z-index: 30;
    }

    .action {
      width: 54px;
      min-height: 50px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      color: #fff;
    }

    .action-icon {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #fff;
    }

    .action-label {
      margin-top: 3px;

      color: #fff;
      font-size: 12px;
      line-height: 15px;

      text-align: center;
      font-weight: 400;

      text-shadow:
        0 1px 3px #000,
        0 1px 5px #000;
    }

    .count {
      margin-top: 3px;
      font-size: 12px;
      color: #fff;
      line-height: 15px;
    }

    /* =========================
       PROFILE
    ========================= */

    .profile-action {
      min-height: 91px;
    }

    .profile-avatar {
      position: relative;

      width: 58px;
      height: 58px;

      border-radius: 50%;

      border: 2px solid #fff;

      background:
        radial-gradient(
          circle at 50% 35%,
          #222 0%,
          #080808 70%
        );

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 38px;
      font-weight: 400;
    }

    .follow-plus {
      position: absolute;

      right: -5px;
      bottom: -4px;

      width: 24px;
      height: 24px;

      border-radius: 50%;

      background: #ff2b55;
      color: #fff;

      border: 2px solid #fff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 19px;
      font-weight: 700;

      line-height: 1;
    }

    /* =========================
       HEART
    ========================= */

    .heart-svg {
      width: 37px;
      height: 37px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
    }

    /* =========================
       COMMENT
    ========================= */

    .comment-svg {
      width: 38px;
      height: 38px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
    }

    /* =========================
       SAVE
    ========================= */

    .save-svg {
      width: 35px;
      height: 39px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
    }

    /* =========================
       SHARE
    ========================= */

    .share-svg {
      width: 38px;
      height: 38px;
      fill: #fff;
    }

    /* =========================
       MUSIC DISC
    ========================= */

    .music-disc {
      position: absolute;

      right: 13px;

      /*
        Directly above the bottom Profile area
      */
      bottom: 94px;

      width: 58px;
      height: 58px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          #161616 0 35%,
          #080808 36% 55%,
          #202020 56% 60%,
          #080808 61% 100%
        );

      border: 2px solid #242424;

      box-shadow:
        0 0 0 4px rgba(255,255,255,.05),
        inset 0 0 0 3px rgba(255,255,255,.06);

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 35;
    }

    .music-disc::before {
      content: "";
      position: absolute;
      inset: 6px;

      border-radius: 50%;

      border: 1px solid rgba(255,255,255,.14);
    }

    .music-note {
      position: relative;
      z-index: 2;

      font-size: 27px;
      color: #fff;
      line-height: 1;
    }

    /* =========================
       VIDEO INFO
    ========================= */

    .video-info {
      position: absolute;

      left: 18px;
      right: 82px;

      bottom: 130px;

      z-index: 25;

      color: #fff;
    }

    .username {
      display: flex;
      align-items: center;

      gap: 7px;

      font-size: 20px;
      font-weight: 700;

      margin-bottom: 12px;
    }

    .verified {
      width: 19px;
      height: 19px;

      border-radius: 50%;

      background: #20c5e8;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      font-size: 13px;
      font-weight: 900;

      color: #fff;
    }

    .caption {
      font-size: 17px;
      line-height: 23px;

      margin-bottom: 5px;
    }

    .tagline {
      font-size: 17px;
      line-height: 23px;

      margin-bottom: 7px;
    }

    .hashtags {
      font-size: 16px;
      line-height: 23px;

      color: #27c8ec;

      margin-bottom: 8px;
    }

    .sound-text {
      display: flex;
      align-items: center;
      gap: 7px;

      font-size: 15px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sound-small {
      font-size: 19px;
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      height: 82px;

      background: #000;

      border-top: 1px solid rgba(255,255,255,.12);

      display: grid;
      grid-template-columns: 1fr 1fr 1.25fr 1fr 1fr;

      align-items: center;

      z-index: 100;
    }

    .nav-item {
      height: 82px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 3px;

      color: #fff;
    }

    .nav-icon {
      width: 29px;
      height: 29px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #fff;
    }

    .nav-label {
      color: #fff;
      font-size: 12px;
      line-height: 15px;
    }

    /* Home SVG */
    .home-svg {
      width: 28px;
      height: 28px;

      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linejoin: round;
    }

    /* Discover SVG */
    .discover-svg {
      width: 27px;
      height: 27px;

      fill: none;
      stroke: #fff;
      stroke-width: 2;
    }

    /* Inbox SVG */
    .inbox-svg {
      width: 29px;
      height: 29px;

      fill: none;
      stroke: #fff;
      stroke-width: 2;
    }

    /* Profile SVG */
    .profile-svg {
      width: 29px;
      height: 29px;

      fill: none;
      stroke: #fff;
      stroke-width: 2;
    }

    /* =========================
       CREATE BUTTON
    ========================= */

    .create-wrap {
      position: relative;

      height: 82px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .create-button {
      position: relative;

      width: 68px;
      height: 45px;

      border-radius: 12px;

      background: #fff;

      color: #000;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 31px;
      font-weight: 400;

      z-index: 2;
    }

    .create-button::before {
      content: "";

      position: absolute;

      left: -6px;
      top: 0;

      width: 12px;
      height: 45px;

      border-radius: 12px 0 0 12px;

      background: #20e7e7;

      z-index: -1;
    }

    .create-button::after {
      content: "";

      position: absolute;

      right: -6px;
      top: 0;

      width: 12px;
      height: 45px;

      border-radius: 0 12px 12px 0;

      background: #ff205f;

      z-index: -1;
    }

    /* =========================
       CREATE SCREEN
    ========================= */

    #createScreen {
      position: fixed;
      inset: 0;

      background: #000;

      z-index: 500;

      display: none;

      flex-direction: column;
    }

    .create-header {
      height: 60px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 18px;

      border-bottom: 1px solid #222;
    }

    .create-title {
      font-size: 20px;
      font-weight: 700;
    }

    .close-create {
      font-size: 30px;
    }

    .create-body {
      flex: 1;

      overflow-y: auto;

      padding: 18px;
    }

    .upload-box {
      border: 1px dashed #555;

      border-radius: 14px;

      padding: 20px;

      text-align: center;

      margin-bottom: 18px;
    }

    .upload-title {
      font-size: 19px;
      font-weight: 700;

      margin-bottom: 8px;
    }

    .upload-subtitle {
      color: #aaa;
      font-size: 14px;

      margin-bottom: 15px;
    }

    .choose-video {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      padding: 11px 20px;

      border-radius: 9px;

      background: #fff;
      color: #000;

      font-weight: 700;
    }

    #videoInput {
      display: none;
    }

    #preview {
      width: 100%;

      max-height: 360px;

      object-fit: contain;

      border-radius: 12px;

      background: #111;

      display: none;

      margin-bottom: 15px;
    }

    .field {
      width: 100%;

      background: #151515;

      border: 1px solid #292929;

      border-radius: 10px;

      color: #fff;

      padding: 13px;

      font-size: 15px;

      margin-bottom: 12px;

      outline: none;
    }

    textarea.field {
      min-height: 95px;
      resize: none;
    }

    .setting-row {
      display: flex;

      align-items: center;
      justify-content: space-between;

      padding: 14px 0;

      border-bottom: 1px solid #222;

      font-size: 15px;
    }

    .setting-row select {
      background: #151515;
      color: #fff;
      border: 0;
      padding: 7px;
      border-radius: 7px;
    }

    .post-area {
      display: flex;
      gap: 10px;

      padding: 12px 18px 18px;
    }

    .draft-button,
    .post-button {
      flex: 1;

      height: 46px;

      border-radius: 10px;

      font-size: 16px;
      font-weight: 700;
    }

    .draft-button {
      background: #222;
    }

    .post-button {
      background: #fff;
      color: #000;
    }

    .post-button:disabled {
      opacity: .45;
    }

    #uploadStatus {
      text-align: center;

      color: #aaa;

      font-size: 13px;

      padding: 4px 0 8px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .top-bar {
        height: 78px;
        padding-bottom: 12px;
      }

      .tabs {
        gap: 29px;
      }

      .tab {
        font-size: 17px;
      }

      .search-button {
        right: 10px;
        bottom: 4px;

        width: 53px;
        height: 53px;
      }

      /* Smaller + lower right buttons */
      .video-actions {
        right: 9px;

        top: 53%;

        transform: translateY(-5%);

        width: 54px;

        gap: 10px;
      }

      .action {
        width: 50px;
        min-height: 47px;
      }

      .action-icon {
        width: 34px;
        height: 34px;
      }

      .action-label,
      .count {
        font-size: 11px;
        line-height: 14px;
      }

      .profile-action {
        min-height: 82px;
      }

      .profile-avatar {
        width: 53px;
        height: 53px;

        font-size: 34px;
      }

      .follow-plus {
        width: 23px;
        height: 23px;
        font-size: 17px;
      }

      .heart-svg {
        width: 34px;
        height: 34px;
      }

      .comment-svg {
        width: 35px;
        height: 35px;
      }

      .save-svg {
        width: 32px;
        height: 36px;
      }

      .share-svg {
        width: 34px;
        height: 34px;
      }

      /* Music directly above Profile */
      .music-disc {
        right: 9px;
        bottom: 91px;

        width: 53px;
        height: 53px;
      }

      .music-note {
        font-size: 24px;
      }

      .video-info {
        left: 14px;
        right: 73px;
        bottom: 99px;
      }

      .username {
        font-size: 18px;
        margin-bottom: 8px;
      }

      .verified {
        width: 18px;
        height: 18px;
        font-size: 12px;
      }

      .caption,
      .tagline {
        font-size: 15px;
        line-height: 21px;
      }

      .hashtags {
        font-size: 14px;
        line-height: 20px;
      }

      .sound-text {
        font-size: 14px;
      }

      .bottom-nav,
      .nav-item,
      .create-wrap {
        height: 76px;
      }

      .nav-label {
        font-size: 11px;
      }

      .nav-icon {
        width: 27px;
        height: 27px;
      }

      .create-button {
        width: 64px;
        height: 43px;
        font-size: 29px;
      }

      .create-button::before,
      .create-button::after {
        height: 43px;
      }
    }
  </style>
</head>

<body>

<div id="app">

  <!-- =========================
       FEED
  ========================== -->

  <main id="feed">

    <section class="video-card">

      <video
        class="video"
        src="uploads/video1.mp4"
        loop
        muted
        playsinline
        preload="metadata">
      </video>

      <!-- TOP -->
      <div class="top-bar">

        <div class="tabs">

          <button class="tab">
            LIVE
          </button>

          <button class="tab">
            Following
          </button>

          <button class="tab active">
            For You
          </button>

        </div>

        <button class="search-button" aria-label="Search">
          <span class="search-icon"></span>
        </button>

      </div>

      <!-- RIGHT ACTIONS -->
      <div class="video-actions">

        <!-- PROFILE -->
        <button class="action profile-action">

          <div class="profile-avatar">
            Z

            <span class="follow-plus">
              +
            </span>
          </div>

          <span class="action-label">
            Follow
          </span>

        </button>


        <!-- LIKE -->
        <button class="action like-button">

          <div class="action-icon">

            <svg
              class="heart-svg"
              viewBox="0 0 24 24">

              <path
                d="M20.8 8.6
                   C20.8 13.5 12 20 12 20
                   S3.2 13.5 3.2 8.6
                   C3.2 5.8 5.2 4 7.7 4
                   C9.5 4 11 5 12 6.4
                   C13 5 14.5 4 16.3 4
                   C18.8 4 20.8 5.8 20.8 8.6Z">
              </path>

            </svg>

          </div>

          <span class="count">
            0
          </span>

        </button>


        <!-- COMMENT -->
        <button class="action">

          <div class="action-icon">

            <svg
              class="comment-svg"
              viewBox="0 0 24 24">

              <path
                d="M4 5
                   H20
                   V16
                   H10
                   L6 20
                   V16
                   H4
                   Z">
              </path>

            </svg>

          </div>

          <span class="count">
            0
          </span>

        </button>


        <!-- SAVE -->
        <button class="action">

          <div class="action-icon">

            <svg
              class="save-svg"
              viewBox="0 0 24 28">

              <path
                d="M5 2
                   H19
                   V25
                   L12 21
                   L5 25
                   Z">
              </path>

            </svg>

          </div>

          <span class="action-label">
            Save
          </span>

        </button>


        <!-- SHARE -->
        <button class="action">

          <div class="action-icon">

            <svg
              class="share-svg"
              viewBox="0 0 24 24">

              <path
                d="M21 3
                   L3 10
                   L11 13
                   L14 21
                   Z">
              </path>

              <path
                d="M11 13
                   L21 3">
              </path>

            </svg>

          </div>

          <span class="action-label">
            Share
          </span>

        </button>

      </div>


      <!-- MUSIC -->
      <button class="music-disc" aria-label="Original sound">

        <span class="music-note">
          ♪
        </span>

      </button>


      <!-- VIDEO INFO -->
      <div class="video-info">

        <div class="username">

          <span>
            @zylo_creator
          </span>

          <span class="verified">
            ✓
          </span>

        </div>

        <div class="caption">
          Welcome to ZYLO 🌎
        </div>

        <div class="tagline">
          Create • Connect • Grow
        </div>

        <div class="hashtags">
          #ZYLO #Create #Connect #Grow #ForYou
        </div>

        <div class="sound-text">

          <span class="sound-small">
            ♪
          </span>

          <span>
            Original sound - ZYLO
          </span>

        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       BOTTOM NAV
  ========================== -->

  <nav class="bottom-nav">

    <!-- HOME -->
    <button class="nav-item">

      <span class="nav-icon">

        <svg
          class="home-svg"
          viewBox="0 0 24 24">

          <path
            d="M3 10
               L12 3
               L21 10
               V21
               H14
               V14
               H10
               V21
               H3
               Z">
          </path>

        </svg>

      </span>

      <span class="nav-label">
        Home
      </span>

    </button>


    <!-- DISCOVER -->
    <button class="nav-item">

      <span class="nav-icon">

        <svg
          class="discover-svg"
          viewBox="0 0 24 24">

          <circle
            cx="11"
            cy="11"
            r="7">
          </circle>

          <path
            d="M16 16
               L21 21">
          </path>

        </svg>

      </span>

      <span class="nav-label">
        Discover
      </span>

    </button>


    <!-- CREATE -->
    <div class="create-wrap">

      <button
        class="create-button"
        id="openCreate">

        +

      </button>

    </div>


    <!-- INBOX -->
    <button class="nav-item">

      <span class="nav-icon">

        <svg
          class="inbox-svg"
          viewBox="0 0 24 24">

          <path
            d="M3 5
               H21
               V18
               H3
               Z">
          </path>

          <path
            d="M3 14
               H8
               C8 16 10 17 12 17
               C14 17 16 16 16 14
               H21">
          </path>

        </svg>

      </span>

      <span class="nav-label">
        Inbox
      </span>

    </button>


    <!-- PROFILE -->
    <button class="nav-item">

      <span class="nav-icon">

        <svg
          class="profile-svg"
          viewBox="0 0 24 24">

          <circle
            cx="12"
            cy="8"
            r="4">
          </circle>

          <path
            d="M4 21
               C4 16.5 7.5 14 12 14
               C16.5 14 20 16.5 20 21">
          </path>

        </svg>

      </span>

      <span class="nav-label">
        Profile
      </span>

    </button>

  </nav>

</div>


<!-- =========================
     CREATE SCREEN
========================== -->

<section id="createScreen">

  <header class="create-header">

    <button
      class="close-create"
      id="closeCreate">
      ×
    </button>

    <div class="create-title">
      Create
    </div>

    <div style="width:30px;"></div>

  </header>


  <div class="create-body">

    <div class="upload-box">

      <div class="upload-title">
        Upload video
      </div>

      <div class="upload-subtitle">
        Share your video with the ZYLO community
      </div>

      <button
        class="choose-video"
        id="chooseVideo">

        Choose video

      </button>

      <input
        id="videoInput"
        type="file"
        accept="video/*">

    </div>


    <video
      id="preview"
      controls
      playsinline>
    </video>


    <textarea
      id="captionInput"
      class="field"
      placeholder="Write a caption..."></textarea>


    <input
      id="hashtagsInput"
      class="field"
      placeholder="Add hashtags #ZYLO #ForYou">


    <div class="setting-row">

      <span>
        ♪ Sound
      </span>

      <span>
        Original sound - ZYLO
      </span>

    </div>


    <div class="setting-row">

      <span>
        Who can view this video
      </span>

      <select id="privacy">

        <option>
          Everyone
        </option>

        <option>
          Friends
        </option>

        <option>
          Only me
        </option>

      </select>

    </div>


    <div class="setting-row">

      <span>
        Allow comments
      </span>

      <input
        id="commentsToggle"
        type="checkbox"
        checked>

    </div>


    <div class="setting-row">

      <span>
        Allow downloads
      </span>

      <input
        id="downloadsToggle"
        type="checkbox">

    </div>

  </div>


  <div id="uploadStatus"></div>


  <div class="post-area">

    <button class="draft-button">
      Draft
    </button>

    <button
      class="post-button"
      id="postButton"
      disabled>

      Post

    </button>

  </div>

</section>


<script>

  /* =========================
     ELEMENTS
  ========================== */

  const feed =
    document.getElementById("feed");

  const createScreen =
    document.getElementById("createScreen");

  const openCreate =
    document.getElementById("openCreate");

  const closeCreate =
    document.getElementById("closeCreate");

  const chooseVideo =
    document.getElementById("chooseVideo");

  const videoInput =
    document.getElementById("videoInput");

  const preview =
    document.getElementById("preview");

  const postButton =
    document.getElementById("postButton");

  const uploadStatus =
    document.getElementById("uploadStatus");

  const captionInput =
    document.getElementById("captionInput");

  const hashtagsInput =
    document.getElementById("hashtagsInput");


  let selectedFile = null;


  /* =========================
     OPEN CREATE
  ========================== */

  openCreate.addEventListener(
    "click",
    () => {

      createScreen.style.display = "flex";

      uploadStatus.textContent = "";

    }
  );


  /* =========================
     CLOSE CREATE
  ========================== */

  closeCreate.addEventListener(
    "click",
    () => {

      createScreen.style.display = "none";

    }
  );


  /* =========================
     CHOOSE VIDEO
  ========================== */

  chooseVideo.addEventListener(
    "click",
    () => {

      videoInput.click();

    }
  );


  /* =========================
     VIDEO SELECTED
  ========================== */

  videoInput.addEventListener(
    "change",
    () => {

      const file =
        videoInput.files[0];

      if (!file) {
        return;
      }

      selectedFile = file;

      const objectUrl =
        URL.createObjectURL(file);

      preview.src = objectUrl;

      preview.style.display = "block";

      postButton.disabled = false;

      uploadStatus.textContent =
        "ভিডিও প্রস্তুত — Post চাপুন";

    }
  );


  /* =========================
     POST VIDEO
  ========================== */

  postButton.addEventListener(
    "click",
    async () => {

      if (!selectedFile) {

        uploadStatus.textContent =
          "আগে একটি ভিডিও নির্বাচন করুন";

        return;

      }


      postButton.disabled = true;

      uploadStatus.textContent =
        "ভিডিও আপলোড হচ্ছে...";


      const formData =
        new FormData();

      formData.append(
        "video",
        selectedFile
      );


      try {

        const response =
          await fetch(
            "https://zylo-backend-ec5c.onrender.com/api/upload",
            {
              method: "POST",
              body: formData
            }
          );


        const data =
          await response.json();


        if (!response.ok ||
            !data.success) {

          throw new Error(
            data.message ||
            "Upload failed"
          );

        }


        /* =========================
           ADD UPLOADED VIDEO
        ========================== */

        const videoUrl =
          data.video.url;


        const caption =
          captionInput.value.trim()
          || "Welcome to ZYLO 🌎";


        const hashtags =
          hashtagsInput.value.trim()
          || "#ZYLO #Create #Connect #Grow #ForYou";


        const card =
          document.createElement("section");

        card.className =
          "video-card";


        card.innerHTML = `

          <video
            class="video"
            src="${escapeHTML(videoUrl)}"
            loop
            muted
            playsinline
            autoplay>
          </video>

          <div class="video-actions">

            <button class="action profile-action">

              <div class="profile-avatar">
                Z
                <span class="follow-plus">+</span>
              </div>

              <span class="action-label">
                Follow
              </span>

            </button>

            <button class="action">

              <div class="action-icon">

                <svg
                  class="heart-svg"
                  viewBox="0 0 24 24">

                  <path
                    d="M20.8 8.6
                       C20.8 13.5 12 20 12 20
                       S3.2 13.5 3.2 8.6
                       C3.2 5.8 5.2 4 7.7 4
                       C9.5 4 11 5 12 6.4
                       C13 5 14.5 4 16.3 4
                       C18.8 4 20.8 5.8 20.8 8.6Z">
                  </path>

                </svg>

              </div>

              <span class="count">
                0
              </span>

            </button>

            <button class="action">

              <div class="action-icon">

                <svg
                  class="comment-svg"
                  viewBox="0 0 24 24">

                  <path
                    d="M4 5
                       H20
                       V16
                       H10
                       L6 20
                       V16
                       H4
                       Z">
                  </path>

                </svg>

              </div>

              <span class="count">
                0
              </span>

            </button>

            <button class="action">

              <div class="action-icon">

                <svg
                  class="save-svg"
                  viewBox="0 0 24 28">

                  <path
                    d="M5 2
                       H19
                       V25
                       L12 21
                       L5 25
                       Z">
                  </path>

                </svg>

              </div>

              <span class="action-label">
                Save
              </span>

            </button>

            <button class="action">

              <div class="action-icon">

                <svg
                  class="share-svg"
                  viewBox="0 0 24 24">

                  <path
                    d="M21 3
                       L3 10
                       L11 13
                       L14 21
                       Z">
                  </path>

                </svg>

              </div>

              <span class="action-label">
                Share
              </span>

            </button>

          </div>

          <button class="music-disc">

            <span class="music-note">
              ♪
            </span>

          </button>

          <div class="video-info">

            <div class="username">

              <span>
                @zylo_creator
              </span>

              <span class="verified">
                ✓
              </span>

            </div>

            <div class="caption">
              ${escapeHTML(caption)}
            </div>

            <div class="tagline">
              Create • Connect • Grow
            </div>

            <div class="hashtags">
              ${escapeHTML(hashtags)}
            </div>

            <div class="sound-text">

              <span class="sound-small">
                ♪
              </span>

              <span>
                Original sound - ZYLO
              </span>

            </div>

          </div>

        `;


        feed.prepend(card);


        /* Save latest post locally */
        localStorage.setItem(
          "zyloLastVideo",
          videoUrl
        );

        localStorage.setItem(
          "zyloLastCaption",
          caption
        );


        /* Close create screen */
        createScreen.style.display =
          "none";


        /* Reset */
        videoInput.value = "";

        preview.src = "";

        preview.style.display =
          "none";

        selectedFile = null;

        postButton.disabled = true;

        uploadStatus.textContent = "";


        /* Play uploaded video */
        const newVideo =
          card.querySelector(".video");

        newVideo.play().catch(
          () => {}
        );


        observeVideos();


      } catch (error) {

        console.error(error);

        uploadStatus.textContent =
          "আপলোড করা যায়নি: " +
          error.message;

        postButton.disabled = false;

      }

    }
  );


  /* =========================
     ESCAPE HTML
  ========================== */

  function escapeHTML(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* =========================
     AUTO PLAY / PAUSE
  ========================== */

  function observeVideos() {

    const videos =
      document.querySelectorAll(".video");


    const observer =
      new IntersectionObserver(
        entries => {

          entries.forEach(
            entry => {

              const video =
                entry.target;


              if (entry.isIntersecting) {

                video.play().catch(
                  () => {}
                );

              } else {

                video.pause();

              }

            }
          );

        },
        {
          threshold: 0.65
        }
      );


    videos.forEach(
      video => observer.observe(video)
    );

  }


  observeVideos();


  /* =========================
     TAP VIDEO = PLAY / PAUSE
  ========================== */

  document.addEventListener(
    "click",
    event => {

      const video =
        event.target.closest(".video");

      if (!video) {
        return;
      }


      if (video.paused) {

        video.play().catch(
          () => {}
        );

      } else {

        video.pause();

      }

    }
  );


  /* =========================
     LIKE
  ========================== */

  document.addEventListener(
    "click",
    event => {

      const button =
        event.target.closest(".like-button");

      if (!button) {
        return;
      }

      button.classList.toggle("liked");

    }
  );

</script>

</body>
</html>

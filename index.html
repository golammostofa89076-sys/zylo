<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>ZYLO</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <!-- TOP BAR -->
  <header class="top-bar">

    <div class="logo">ZYLO</div>

    <div class="top-tabs">
      <button>Following</button>
      <button class="active">For You</button>
    </div>

    <button class="search-btn">⌕</button>

  </header>


  <!-- VIDEO FEED -->
  <main id="feed">

    <section class="video-item">

      <video
        class="video"
        src="https://raw.githubusercontent.com/golammostofa89076-sys/zylo/main/backend/uploads/video1.mp4"
        loop
        muted
        playsinline
        preload="auto">
      </video>


      <!-- RIGHT SIDE -->
      <div class="right-buttons">

        <button class="action-btn like-btn">
          <strong>♥</strong>
          <span>0</span>
        </button>

        <button class="action-btn">
          <strong>💬</strong>
          <span>0</span>
        </button>

        <button class="action-btn save-btn">
          <strong>🔖</strong>
          <span>Save</span>
        </button>

        <button class="action-btn share-btn">
          <strong>↗</strong>
          <span>Share</span>
        </button>

        <button class="action-btn music-btn">
          <strong>♫</strong>
          <span>Music</span>
        </button>

      </div>


      <!-- VIDEO INFORMATION -->
      <div class="video-info">

        <h3>@zylo_creator</h3>

        <p>Welcome to ZYLO 🌍</p>

        <p class="music-name">
          ♫ Original sound
        </p>

      </div>


      <!-- PLAY/PAUSE -->
      <div class="play-icon">▶</div>

    </section>

  </main>


  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">

    <button>
      <b>⌂</b>
      <span>Home</span>
    </button>

    <button>
      <b>⌕</b>
      <span>Discover</span>
    </button>

    <button class="upload-btn">
      +
    </button>

    <button>
      <b>💬</b>
      <span>Inbox</span>
    </button>

    <button>
      <b>●</b>
      <span>Profile</span>
    </button>

  </nav>

</div>


<script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>ZYLO — Create • Connect • Grow</title>

    <meta
        name="description"
        content="ZYLO — Create • Connect • Grow"
    >

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<div id="app">

    <!-- =====================================================
         TOP BAR
         ===================================================== -->

    <header class="top-bar">

        <div class="top-tabs">

            <button class="top-tab live-tab">
                LIVE
            </button>

            <button class="top-tab">
                Following
            </button>

            <button class="top-tab active">
                For You
            </button>

        </div>

        <button
            class="search-btn"
            aria-label="Search"
        >
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <circle
                    cx="10.8"
                    cy="10.8"
                    r="6.8"
                ></circle>

                <path d="M16 16L21 21"></path>
            </svg>
        </button>

    </header>


    <!-- =====================================================
         VIDEO FEED
         ===================================================== -->

    <main class="video-feed">


        <!-- =================================================
             VIDEO 1
             ================================================= -->

        <section
            class="video-page"
            data-video-id="video1"
        >

            <video
                src="./backend/uploads/video1.mp4"
                loop
                muted
                playsinline
                preload="metadata"
            ></video>

            <div class="video-overlay"></div>


            <!-- FULLSCREEN -->

            <button
                class="fullscreen-btn"
                aria-label="Fullscreen"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M8 3H3v5"></path>
                    <path d="M16 3h5v5"></path>
                    <path d="M8 21H3v-5"></path>
                    <path d="M21 16v5h-5"></path>
                </svg>
            </button>


            <!-- RIGHT SIDE ACTIONS -->

            <div class="right-actions">


                <!-- PROFILE -->

                <button
                    class="profile-action"
                    aria-label="Profile"
                >

                    <span class="profile-circle">
                        Z
                    </span>

                    <span class="follow-badge">
                        +
                    </span>

                </button>


                <!-- LIKE -->

                <button
                    class="action-btn like-btn"
                    aria-label="Like"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M20.8 8.8c0 5.2-8.8 11-8.8 11S3.2 14 3.2 8.8A5 5 0 0 1 12 5.4a5 5 0 0 1 8.8 3.4Z"></path>
                    </svg>

                    <span class="action-count">
                        0
                    </span>

                </button>


                <!-- COMMENT -->

                <button
                    class="action-btn"
                    aria-label="Comments"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H8l-4 2v-4.2A7.5 7.5 0 1 1 20 11.5Z"></path>
                    </svg>

                    <span class="action-count">
                        0
                    </span>

                </button>


                <!-- SAVE -->

                <button
                    class="action-btn save-btn"
                    aria-label="Save"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M6 4.5A2.5 2.5 0 0 1 8.5 2h7A2.5 2.5 0 0 1 18 4.5V22l-6-3.8L6 22V4.5Z"></path>
                    </svg>

                    <span class="action-label">
                        Save
                    </span>

                </button>


                <!-- SHARE -->

                <button
                    class="action-btn share-btn"
                    aria-label="Share"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M21 3 10.5 13.5"></path>
                        <path d="m21 3-6.7 18-3.8-7.5L3 9.7 21 3Z"></path>
                    </svg>

                    <span class="action-label">
                        Share
                    </span>

                </button>


                <!-- MUSIC -->

                <button
                    class="music-btn"
                    aria-label="Music"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <circle
                            cx="12"
                            cy="12"
                            r="8"
                        ></circle>

                        <circle
                            cx="12"
                            cy="12"
                            r="2"
                        ></circle>
                    </svg>

                    <span>
                        Music
                    </span>

                </button>

            </div>


            <!-- VIDEO INFORMATION -->

            <div class="video-info">

                <div class="username">
                    @zylo_creator
                </div>

                <div class="caption">
                    Welcome to ZYLO 🌎
                </div>

                <div class="tagline">
                    Create • Connect • Grow
                </div>

                <div class="hashtags">
                    #ZYLO #ShortVideo #Create
                </div>

                <div class="music-info">
                    Original sound • ZYLO Creator
                </div>

            </div>

        </section>



        <!-- =================================================
             VIDEO 2
             ================================================= -->

        <section
            class="video-page"
            data-video-id="video2"
        >

            <video
                src="./backend/uploads/video1.mp4"
                loop
                muted
                playsinline
                preload="metadata"
            ></video>

            <div class="video-overlay"></div>


            <!-- FULLSCREEN -->

            <button
                class="fullscreen-btn"
                aria-label="Fullscreen"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M8 3H3v5"></path>
                    <path d="M16 3h5v5"></path>
                    <path d="M8 21H3v-5"></path>
                    <path d="M21 16v5h-5"></path>
                </svg>
            </button>


            <!-- RIGHT SIDE ACTIONS -->

            <div class="right-actions">


                <!-- PROFILE -->

                <button
                    class="profile-action"
                    aria-label="Profile"
                >

                    <span class="profile-circle">
                        Z
                    </span>

                    <span class="follow-badge">
                        +
                    </span>

                </button>


                <!-- LIKE -->

                <button
                    class="action-btn like-btn"
                    aria-label="Like"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M20.8 8.8c0 5.2-8.8 11-8.8 11S3.2 14 3.2 8.8A5 5 0 0 1 12 5.4a5 5 0 0 1 8.8 3.4Z"></path>
                    </svg>

                    <span class="action-count">
                        0
                    </span>

                </button>


                <!-- COMMENT -->

                <button
                    class="action-btn"
                    aria-label="Comments"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H8l-4 2v-4.2A7.5 7.5 0 1 1 20 11.5Z"></path>
                    </svg>

                    <span class="action-count">
                        0
                    </span>

                </button>


                <!-- SAVE -->

                <button
                    class="action-btn save-btn"
                    aria-label="Save"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M6 4.5A2.5 2.5 0 0 1 8.5 2h7A2.5 2.5 0 0 1 18 4.5V22l-6-3.8L6 22V4.5Z"></path>
                    </svg>

                    <span class="action-label">
                        Save
                    </span>

                </button>


                <!-- SHARE -->

                <button
                    class="action-btn share-btn"
                    aria-label="Share"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M21 3 10.5 13.5"></path>
                        <path d="m21 3-6.7 18-3.8-7.5L3 9.7 21 3Z"></path>
                    </svg>

                    <span class="action-label">
                        Share
                    </span>

                </button>


                <!-- MUSIC -->

                <button
                    class="music-btn"
                    aria-label="Music"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <circle
                            cx="12"
                            cy="12"
                            r="8"
                        ></circle>

                        <circle
                            cx="12"
                            cy="12"
                            r="2"
                        ></circle>
                    </svg>

                    <span>
                        Music
                    </span>

                </button>

            </div>


            <!-- VIDEO INFORMATION -->

            <div class="video-info">

                <div class="username">
                    @zylo_creator
                </div>

                <div class="caption">
                    Welcome to ZYLO 🌎
                </div>

                <div class="tagline">
                    Create • Connect • Grow
                </div>

                <div class="hashtags">
                    #ZYLO #ShortVideo #Create
                </div>

                <div class="music-info">
                    Original sound • ZYLO Creator
                </div>

            </div>

        </section>

    </main>



    <!-- =====================================================
         BOTTOM NAVIGATION
         ===================================================== -->

    <nav class="bottom-nav">


        <!-- HOME -->

        <button
            class="nav-item active"
            data-nav="home"
            aria-label="Home"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="M3 10.5 12 3l9 7.5"></path>
                <path d="M5 9.5V21h14V9.5"></path>
            </svg>

            <span>
                Home
            </span>

        </button>


        <!-- DISCOVER -->

        <button
            class="nav-item"
            data-nav="discover"
            aria-label="Discover"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <circle
                    cx="12"
                    cy="12"
                    r="9"
                ></circle>

                <path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8 4.8-2.2Z"></path>
            </svg>

            <span>
                Discover
            </span>

        </button>


        <!-- CREATE -->

        <button
            id="createBtn"
            class="create-btn"
            aria-label="Create"
        >

            <span class="create-left"></span>

            <span class="create-center">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M12 5v14"></path>
                    <path d="M5 12h14"></path>
                </svg>

            </span>

            <span class="create-right"></span>

        </button>


        <!-- INBOX -->

        <button
            class="nav-item"
            data-nav="inbox"
            aria-label="Inbox"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="M4 5h16v14H4z"></path>
                <path d="M4 15h5l2 2h2l2-2h5"></path>
            </svg>

            <span>
                Inbox
            </span>

        </button>


        <!-- PROFILE -->

        <button
            class="nav-item"
            data-nav="profile"
            aria-label="Profile"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <circle
                    cx="12"
                    cy="8"
                    r="4"
                ></circle>

                <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path>
            </svg>

            <span>
                Profile
            </span>

        </button>

    </nav>



    <!-- =====================================================
         VIDEO UPLOAD INPUT
         ===================================================== -->

    <input
        id="videoInput"
        type="file"
        accept="video/*"
        hidden
    >



    <!-- =====================================================
         UPLOAD MODAL
         ===================================================== -->

    <div
        id="uploadBox"
        class="upload-box"
    >

        <div class="upload-content">

            <button
                id="closeUpload"
                class="close-upload"
                aria-label="Close"
            >
                ×
            </button>

            <div class="upload-icon">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M12 16V4"></path>
                    <path d="m7 9 5-5 5 5"></path>
                    <path d="M4 14v5h16v-5"></path>
                </svg>

            </div>

            <h2>
                Upload Video
            </h2>

            <p id="uploadStatus"></p>

            <button
                id="selectVideo"
                class="select-video"
            >
                Select Video
            </button>

        </div>

    </div>


</div>


<!-- =========================================================
     JAVASCRIPT
     IMPORTANT: JavaScript stays in script.js
     ========================================================= -->

<script src="./script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>ZYLO</title>

  <link rel="stylesheet" href="style.css" />

  <style>
    /* =========================
       ZYLO CREATE / UPLOAD
    ========================= */

    .create-page {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: #000;
      color: #fff;
      display: none;
      overflow-y: auto;
      padding-bottom: 30px;
    }

    .create-page.show {
      display: block;
    }

    .create-header {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border-bottom: 1px solid #222;
    }

    .create-header h1 {
      font-size: 24px;
      margin: 0;
    }

    .create-close {
      position: absolute;
      left: 16px;
      top: 12px;
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: #222;
      color: #fff;
      font-size: 30px;
      line-height: 46px;
    }

    /* Choose */

    .create-choice {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 28px 18px;
    }

    .choice-card {
      min-height: 190px;
      border: 1px solid #292929;
      border-radius: 22px;
      background: #151515;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
    }

    .choice-icon {
      font-size: 55px;
    }

    .choice-title {
      font-size: 21px;
      font-weight: 700;
    }

    .choice-subtitle {
      font-size: 15px;
      color: #aaa;
    }

    /* Editor */

    .upload-editor {
      display: none;
      padding: 18px;
    }

    .upload-editor.show {
      display: block;
    }

    .video-preview-box {
      width: 100%;
      max-width: 430px;
      height: 470px;
      margin: 0 auto 18px;
      border-radius: 20px;
      overflow: hidden;
      background: #111;
      position: relative;
    }

    .video-preview {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .preview-play {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 64px;
      height: 64px;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,.65);
      color: #fff;
      font-size: 30px;
    }

    /* Caption */

    .caption-box {
      background: #171717;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .caption-box textarea {
      width: 100%;
      min-height: 95px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font-size: 17px;
      line-height: 1.45;
      font-family: Arial, sans-serif;
    }

    .caption-box textarea::placeholder {
      color: #888;
    }

    .caption-count {
      text-align: right;
      color: #777;
      font-size: 12px;
    }

    /* Hashtags */

    .hashtag-box {
      background: #171717;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .hashtag-box input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font-size: 16px;
    }

    .hashtag-box input::placeholder {
      color: #888;
    }

    /* Sound */

    .sound-row {
      width: 100%;
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      margin-bottom: 14px;
      border: 0;
      border-radius: 14px;
      background: #171717;
      color: #fff;
      font-size: 16px;
      text-align: left;
    }

    .sound-icon {
      font-size: 24px;
    }

    .sound-arrow {
      margin-left: auto;
      font-size: 20px;
      color: #aaa;
    }

    /* Settings */

    .settings-box {
      background: #171717;
      border-radius: 16px;
      margin-bottom: 18px;
      overflow: hidden;
    }

    .setting-row {
      min-height: 58px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #292929;
    }

    .setting-row:last-child {
      border-bottom: 0;
    }

    .setting-title {
      font-size: 15px;
    }

    .setting-value {
      color: #aaa;
      font-size: 14px;
    }

    /* Toggle */

    .switch {
      position: relative;
      width: 48px;
      height: 28px;
    }

    .switch input {
      display: none;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #555;
      border-radius: 20px;
      transition: .2s;
    }

    .slider:before {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: .2s;
    }

    .switch input:checked + .slider {
      background: #fe2c55;
    }

    .switch input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* Post buttons */

    .editor-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .draft-btn,
    .post-btn {
      flex: 1;
      min-height: 54px;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      border: 0;
    }

    .draft-btn {
      background: #292929;
      color: #fff;
    }

    .post-btn {
      background: #fe2c55;
      color: #fff;
    }

    .post-btn:disabled {
      opacity: .55;
    }

    .upload-progress {
      display: none;
      margin-top: 14px;
      text-align: center;
      color: #aaa;
      font-size: 14px;
    }

    .upload-progress.show {
      display: block;
    }

    /* File input hidden */

    #galleryInput,
    #cameraInput {
      display: none;
    }

    /* Sound popup */

    .sound-panel {
      position: fixed;
      inset: 0;
      z-index: 800;
      display: none;
      align-items: flex-end;
      background: rgba(0,0,0,.65);
    }

    .sound-panel.show {
      display: flex;
    }

    .sound-sheet {
      width: 100%;
      max-height: 70vh;
      background: #181818;
      border-radius: 22px 22px 0 0;
      padding: 20px;
      overflow-y: auto;
    }

    .sound-sheet h2 {
      margin-bottom: 15px;
    }

    .sound-option {
      width: 100%;
      min-height: 54px;
      margin-bottom: 8px;
      border: 0;
      border-radius: 12px;
      background: #252525;
      color: #fff;
      text-align: left;
      padding: 0 16px;
      font-size: 15px;
    }

    .sound-cancel {
      width: 100%;
      height: 52px;
      margin-top: 8px;
      border: 0;
      border-radius: 12px;
      background: #333;
      color: #fff;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .create-header {
        height: 64px;
      }

      .create-header h1 {
        font-size: 22px;
      }

      .create-choice {
        gap: 12px;
        padding: 25px 12px;
      }

      .choice-card {
        min-height: 175px;
      }

      .choice-icon {
        font-size: 48px;
      }

      .choice-title {
        font-size: 19px;
      }

      .video-preview-box {
        height: 470px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HOME FEED
  ========================== -->

  <div class="top-bar">
    <div class="top-tabs">
      <button class="top-tab">LIVE</button>
      <button class="top-tab">Following</button>
      <button class="top-tab active">For You</button>

      <button
        class="top-tab"
        id="searchButton"
        style="
          position:absolute;
          right:14px;
          top:8px;
          font-size:34px;
          border:0;
        "
      >
        ⌕
      </button>
    </div>
  </div>

  <main class="video-feed" id="videoFeed">

    <!-- VIDEO 1 -->

    <section class="video-card">

      <video
        class="video"
        src="uploads/video1.mp4"
        loop
        muted
        playsinline
        preload="metadata"
      ></video>

      <div class="video-gradient"></div>

      <div class="video-info">

        <div class="username">
          @zylo_creator
        </div>

        <div class="caption">
          Welcome to ZYLO 🌎
        </div>

        <div class="caption">
          Create • Connect • Grow
        </div>

        <div class="music">
          ♪ Original sound - ZYLO
        </div>

      </div>

      <div class="right-actions">

        <button class="action-btn profile-action">
          <div class="avatar">Z</div>
          <span class="follow-plus">+</span>
        </button>

        <button class="action-btn like-btn">
          ♡
          <span class="count">0</span>
        </button>

        <button class="action-btn">
          💬
          <span class="count">0</span>
        </button>

        <button class="action-btn save-btn">
          ♧
          <span class="count">0</span>
        </button>

        <button class="action-btn">
          ➤
          <span class="count">Share</span>
        </button>

      </div>

    </section>

    <!-- VIDEO 2 -->

    <section class="video-card">

      <video
        class="video"
        src="uploads/video2.mp4"
        loop
        muted
        playsinline
        preload="metadata"
      ></video>

      <div class="video-gradient"></div>

      <div class="video-info">

        <div class="username">
          @zylo_creator
        </div>

        <div class="caption">
          Create • Connect • Grow 🌎
        </div>

        <div class="music">
          ♪ Original sound - ZYLO
        </div>

      </div>

      <div class="right-actions">

        <button class="action-btn profile-action">
          <div class="avatar">Z</div>
          <span class="follow-plus">+</span>
        </button>

        <button class="action-btn like-btn">
          ♡
          <span class="count">0</span>
        </button>

        <button class="action-btn">
          💬
          <span class="count">0</span>
        </button>

        <button class="action-btn save-btn">
          ♧
          <span class="count">0</span>
        </button>

        <button class="action-btn">
          ➤
          <span class="count">Share</span>
        </button>

      </div>

    </section>

  </main>

  <!-- =========================
       BOTTOM NAV
  ========================== -->

  <nav class="bottom-nav">

    <button class="nav-button active">
      <span style="font-size:26px;">⌂</span>
      <span>Home</span>
    </button>

    <button class="nav-button">
      <span style="font-size:27px;">⌕</span>
      <span>Search</span>
    </button>

    <button
      class="nav-button upload-button"
      id="createButton"
    >
      <span style="font-size:32px;">+</span>
    </button>

    <button class="nav-button">
      <span style="font-size:25px;">▱</span>
      <span>Inbox</span>
    </button>

    <button class="nav-button">
      <span style="font-size:25px;">♙</span>
      <span>Profile</span>
    </button>

  </nav>


  <!-- =========================
       CREATE PAGE
  ========================== -->

  <section
    class="create-page"
    id="createPage"
  >

    <header class="create-header">

      <button
        class="create-close"
        id="createClose"
      >
        ×
      </button>

      <h1>Create</h1>

    </header>


    <!-- STEP 1 -->

    <div
      class="create-choice"
      id="createChoice"
    >

      <button
        class="choice-card"
        id="cameraButton"
      >

        <div class="choice-icon">
          📹
        </div>

        <div class="choice-title">
          Camera
        </div>

        <div class="choice-subtitle">
          Record video
        </div>

      </button>


      <button
        class="choice-card"
        id="uploadButton"
      >

        <div class="choice-icon">
          🖼️
        </div>

        <div class="choice-title">
          Upload
        </div>

        <div class="choice-subtitle">
          From gallery
        </div>

      </button>

    </div>


    <!-- Hidden inputs -->

    <input
      id="galleryInput"
      type="file"
      accept="video/*"
    />

    <input
      id="cameraInput"
      type="file"
      accept="video/*"
      capture="environment"
    />


    <!-- STEP 2 -->

    <div
      class="upload-editor"
      id="uploadEditor"
    >

      <!-- Video -->

      <div class="video-preview-box">

        <video
          id="previewVideo"
          class="video-preview"
          playsinline
          controls
        ></video>

        <button
          class="preview-play"
          id="previewPlay"
        >
          ▶
        </button>

      </div>


      <!-- Caption -->

      <div class="caption-box">

        <textarea
          id="captionInput"
          maxlength="2200"
          placeholder="Write a caption..."
        ></textarea>

        <div class="caption-count">
          <span id="captionCount">0</span>/2200
        </div>

      </div>


      <!-- Hashtags -->

      <div class="hashtag-box">

        <input
          id="hashtagInput"
          type="text"
          placeholder="Add hashtags  #ZYLO #ForYou"
        />

      </div>


      <!-- Sound -->

      <button
        class="sound-row"
        id="soundButton"
      >

        <span class="sound-icon">
          🎵
        </span>

        <span id="soundName">
          Original sound - ZYLO
        </span>

        <span class="sound-arrow">
          ›
        </span>

      </button>


      <!-- Settings -->

      <div class="settings-box">

        <div class="setting-row">

          <div class="setting-title">
            Who can view this video
          </div>

          <select
            id="privacySelect"
            style="
              background:#171717;
              color:#aaa;
              border:0;
              outline:0;
              font-size:14px;
            "
          >

            <option value="public">
              Everyone
            </option>

            <option value="friends">
              Friends
            </option>

            <option value="private">
              Only me
            </option>

          </select>

        </div>


        <div class="setting-row">

          <div class="setting-title">
            Allow comments
          </div>

          <label class="switch">

            <input
              type="checkbox"
              id="commentsToggle"
              checked
            />

            <span class="slider"></span>

          </label>

        </div>


        <div class="setting-row">

          <div class="setting-title">
            Allow downloads
          </div>

          <label class="switch">

            <input
              type="checkbox"
              id="downloadsToggle"
            />

            <span class="slider"></span>

          </label>

        </div>

      </div>


      <!-- Buttons -->

      <div class="editor-actions">

        <button
          class="draft-btn"
          id="draftButton"
        >
          Draft
        </button>

        <button
          class="post-btn"
          id="postButton"
        >
          Post
        </button>

      </div>


      <div
        class="upload-progress"
        id="uploadProgress"
      >
        Uploading video...
      </div>

    </div>

  </section>


  <!-- =========================
       SOUND PANEL
  ========================== -->

  <div
    class="sound-panel"
    id="soundPanel"
  >

    <div class="sound-sheet">

      <h2>
        Select sound
      </h2>

      <button
        class="sound-option"
        data-sound="Original sound - ZYLO"
      >
        🎵 Original sound - ZYLO
      </button>

      <button
        class="sound-option"
        data-sound="Trending sound"
      >
        🔥 Trending sound
      </button>

      <button
        class="sound-option"
        data-sound="Popular sound"
      >
        ⭐ Popular sound
      </button>

      <button
        class="sound-option"
        data-sound="My original sound"
      >
        🎧 My original sound
      </button>

      <button
        class="sound-cancel"
        id="soundCancel"
      >
        Cancel
      </button>

    </div>

  </div>


  <script>

    /* =========================
       CREATE PAGE
    ========================== */

    const createButton =
      document.getElementById("createButton");

    const createPage =
      document.getElementById("createPage");

    const createClose =
      document.getElementById("createClose");

    const createChoice =
      document.getElementById("createChoice");

    const uploadEditor =
      document.getElementById("uploadEditor");


    createButton.addEventListener("click", () => {

      createPage.classList.add("show");

      createChoice.style.display = "grid";

      uploadEditor.classList.remove("show");

    });


    createClose.addEventListener("click", () => {

      createPage.classList.remove("show");

      resetUpload();

    });


    /* =========================
       FILE INPUT
    ========================== */

    const uploadButton =
      document.getElementById("uploadButton");

    const cameraButton =
      document.getElementById("cameraButton");

    const galleryInput =
      document.getElementById("galleryInput");

    const cameraInput =
      document.getElementById("cameraInput");

    const previewVideo =
      document.getElementById("previewVideo");


    uploadButton.addEventListener("click", () => {
      galleryInput.click();
    });


    cameraButton.addEventListener("click", () => {
      cameraInput.click();
    });


    galleryInput.addEventListener(
      "change",
      handleVideo
    );


    cameraInput.addEventListener(
      "change",
      handleVideo
    );


    let selectedVideo = null;


    function handleVideo(event) {

      const file =
        event.target.files[0];

      if (!file) return;


      if (!file.type.startsWith("video/")) {

        alert("Please select a video.");

        return;
      }


      if (file.size > 200 * 1024 * 1024) {

        alert(
          "Maximum video size is 200 MB."
        );

        return;
      }


      selectedVideo = file;


      const videoURL =
        URL.createObjectURL(file);


      previewVideo.src = videoURL;

      previewVideo.load();


      createChoice.style.display =
        "none";

      uploadEditor.classList.add(
        "show"
      );

    }


    /* =========================
       PREVIEW PLAY
    ========================== */

    const previewPlay =
      document.getElementById("previewPlay");


    previewPlay.addEventListener(
      "click",
      async () => {

        if (previewVideo.paused) {

          await previewVideo.play();

          previewPlay.textContent = "❚❚";

        } else {

          previewVideo.pause();

          previewPlay.textContent = "▶";

        }

      }
    );


    previewVideo.addEventListener(
      "play",
      () => {
        previewPlay.textContent = "❚❚";
      }
    );


    previewVideo.addEventListener(
      "pause",
      () => {
        previewPlay.textContent = "▶";
      }
    );


    /* =========================
       CAPTION COUNTER
    ========================== */

    const captionInput =
      document.getElementById(
        "captionInput"
      );

    const captionCount =
      document.getElementById(
        "captionCount"
      );


    captionInput.addEventListener(
      "input",
      () => {

        captionCount.textContent =
          captionInput.value.length;

      }
    );


    /* =========================
       SOUND
    ========================== */

    const soundButton =
      document.getElementById(
        "soundButton"
      );

    const soundPanel =
      document.getElementById(
        "soundPanel"
      );

    const soundCancel =
      document.getElementById(
        "soundCancel"
      );

    const soundName =
      document.getElementById(
        "soundName"
      );


    soundButton.addEventListener(
      "click",
      () => {

        soundPanel.classList.add(
          "show"
        );

      }
    );


    soundCancel.addEventListener(
      "click",
      () => {

        soundPanel.classList.remove(
          "show"
        );

      }
    );


    document
      .querySelectorAll(".sound-option")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            soundName.textContent =
              button.dataset.sound;

            soundPanel.classList.remove(
              "show"
            );

          }
        );

      });


    /* =========================
       POST
    ========================== */

    const postButton =
      document.getElementById(
        "postButton"
      );

    const uploadProgress =
      document.getElementById(
        "uploadProgress"
      );


    postButton.addEventListener(
      "click",
      async () => {

        if (!selectedVideo) {

          alert("Please select a video.");

          return;
        }


        const caption =
          captionInput.value.trim();

        const hashtags =
          document
            .getElementById(
              "hashtagInput"
            )
            .value.trim();

        const privacy =
          document
            .getElementById(
              "privacySelect"
            )
            .value;


        const comments =
          document
            .getElementById(
              "commentsToggle"
            )
            .checked;


        const downloads =
          document
            .getElementById(
              "downloadsToggle"
            )
            .checked;


        const formData =
          new FormData();


        formData.append(
          "video",
          selectedVideo
        );


        formData.append(
          "caption",
          caption
        );


        formData.append(
          "hashtags",
          hashtags
        );


        formData.append(
          "sound",
          soundName.textContent
        );


        formData.append(
          "privacy",
          privacy
        );


        formData.append(
          "comments",
          comments
        );


        formData.append(
          "downloads",
          downloads
        );


        postButton.disabled = true;

        uploadProgress.classList.add(
          "show"
        );

        uploadProgress.textContent =
          "ভিডিও আপলোড হচ্ছে...";


        try {

          const response =
            await fetch(
              "https://zylo-backend-ec5c.onrender.com/api/upload",
              {
                method: "POST",
                body: formData
              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.message ||
              "Upload failed"
            );

          }


          uploadProgress.textContent =
            "ভিডিও সফলভাবে পোস্ট হয়েছে ✓";


          /* Add uploaded video to feed */

          if (
            data.video &&
            data.video.url
          ) {

            addVideoToFeed(
              data.video.url,
              caption,
              soundName.textContent
            );

          }


          setTimeout(() => {

            createPage.classList.remove(
              "show"
            );

            resetUpload();

          }, 1000);


        } catch (error) {

          console.error(error);

          uploadProgress.textContent =
            "Upload failed: " +
            error.message;

          alert(
            "ভিডিও আপলোড হয়নি। আবার চেষ্টা করুন।"
          );

        } finally {

          postButton.disabled = false;

        }

      }
    );


    /* =========================
       ADD VIDEO TO FEED
    ========================== */

    function addVideoToFeed(
      videoURL,
      caption,
      sound
    ) {

      const card =
        document.createElement(
          "section"
        );


      card.className =
        "video-card";


      card.innerHTML = `

        <video
          class="video"
          src="${videoURL}"
          loop
          muted
          playsinline
          preload="metadata"
        ></video>

        <div class="video-gradient"></div>

        <div class="video-info">

          <div class="username">
            @zylo_creator
          </div>

          <div class="caption">
            ${escapeHTML(
              caption ||
              "Welcome to ZYLO 🌎"
            )}
          </div>

          <div class="music">
            ♪ ${escapeHTML(sound)}
          </div>

        </div>

        <div class="right-actions">

          <button class="action-btn profile-action">

            <div class="avatar">
              Z
            </div>

            <span class="follow-plus">
              +
            </span>

          </button>

          <button class="action-btn like-btn">

            ♡

            <span class="count">
              0
            </span>

          </button>

          <button class="action-btn">

            💬

            <span class="count">
              0
            </span>

          </button>

          <button class="action-btn save-btn">

            ♧

            <span class="count">
              0
            </span>

          </button>

          <button class="action-btn">

            ➤

            <span class="count">
              Share
            </span>

          </button>

        </div>

      `;


      videoFeed.prepend(card);


      setupVideoObserver();

    }


    function escapeHTML(text) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent = text;

      return div.innerHTML;

    }


    /* =========================
       DRAFT
    ========================== */

    const draftButton =
      document.getElementById(
        "draftButton"
      );


    draftButton.addEventListener(
      "click",
      () => {

        alert(
          "Draft system পরের ধাপে যুক্ত করা হবে।"
        );

      }
    );


    /* =========================
       RESET
    ========================== */

    function resetUpload() {

      selectedVideo = null;

      previewVideo.pause();

      previewVideo.removeAttribute(
        "src"
      );

      previewVideo.load();


      galleryInput.value = "";

      cameraInput.value = "";


      captionInput.value = "";

      captionCount.textContent = "0";


      document.getElementById(
        "hashtagInput"
      ).value = "";


      soundName.textContent =
        "Original sound - ZYLO";


      document.getElementById(
        "privacySelect"
      ).value = "public";


      document.getElementById(
        "commentsToggle"
      ).checked = true;


      document.getElementById(
        "downloadsToggle"
      ).checked = false;


      uploadProgress.classList.remove(
        "show"
      );


      createChoice.style.display =
        "grid";

      uploadEditor.classList.remove(
        "show"
      );

    }


    /* =========================
       VIDEO AUTOPLAY
    ========================== */

    function setupVideoObserver() {

      const videos =
        document.querySelectorAll(
          ".video"
        );


      const observer =
        new IntersectionObserver(
          entries => {

            entries.forEach(
              entry => {

                const video =
                  entry.target;


                if (
                  entry.isIntersecting &&
                  entry.intersectionRatio > 0.6
                ) {

                  videos.forEach(v => {

                    if (v !== video) {

                      v.pause();

                    }

                  });


                  video.play()
                    .catch(() => {});


                } else {

                  video.pause();

                }

              }
            );

          },
          {
            threshold: [0.6]
          }
        );


      videos.forEach(video => {

        observer.observe(video);

      });

    }


    setupVideoObserver();


    /* =========================
       LIKE
    ========================== */

    document.addEventListener(
      "click",
      event => {

        const button =
          event.target.closest(
            ".like-btn"
          );


        if (!button) return;


        button.classList.toggle(
          "active"
        );


        const count =
          button.querySelector(
            ".count"
          );


        if (
          button.classList.contains(
            "active"
          )
        ) {

          count.textContent = "1";

        } else {

          count.textContent = "0";

        }

      }
    );


    /* =========================
       SAVE
    ========================== */

    document.addEventListener(
      "click",
      event => {

        const button =
          event.target.closest(
            ".save-btn"
          );


        if (!button) return;


        button.classList.toggle(
          "active"
        );


        const count =
          button.querySelector(
            ".count"
          );


        count.textContent =
          button.classList.contains(
            "active"
          )
            ? "1"
            : "0";

      }
    );


    /* =========================
       VIDEO TAP PLAY / PAUSE
    ========================== */

    document.addEventListener(
      "click",
      event => {

        const video =
          event.target.closest(
            ".video-card .video"
          );


        if (!video) return;


        if (video.paused) {

          video.play()
            .catch(() => {});

        } else {

          video.pause();

        }

      }
    );

  </script>

</body>
</html>

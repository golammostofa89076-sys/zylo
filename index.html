<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>ZYLO</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================================================
   ZYLO — COMPLETE MOBILE VIDEO FEED
   Create • Connect • Grow
   ========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}

button,
input,
textarea,
select {
  font-family: inherit;
}

button {
  border: 0;
  outline: 0;
  background: none;
  color: #fff;
}

/* =========================================================
   APP
   ========================================================= */

#app {
  position: fixed;
  inset: 0;
  background: #000;
  overflow: hidden;
}

/* =========================================================
   FEED
   ========================================================= */

#feed {
  position: fixed;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;

  scroll-snap-type: y mandatory;
  -webkit-overflow-scrolling: touch;

  background: #000;
}

#feed::-webkit-scrollbar {
  display: none;
}

.video-card {
  position: relative;

  width: 100%;
  height: 100dvh;
  min-height: 100vh;

  scroll-snap-align: start;
  scroll-snap-stop: always;

  overflow: hidden;
  background: #000;
}

/* Video */

.video-card .video {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  background: #000;
}

/* Dark overlay */

.video-card::after {
  content: "";
  position: absolute;
  inset: 0;

  pointer-events: none;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.45),
      transparent 18%,
      transparent 65%,
      rgba(0,0,0,.5) 100%
    );

  z-index: 2;
}

/* =========================================================
   TOP BAR
   ========================================================= */

.top-bar {
  position: fixed;

  top: 0;
  left: 0;
  right: 0;

  height: 82px;

  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: center;

  pointer-events: none;
}

.tabs {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: 36px;

  height: 100%;
}

.tab {
  position: relative;

  padding: 12px 0;

  font-size: 18px;
  font-weight: 400;

  color: rgba(255,255,255,.72);

  cursor: pointer;
}

.tab.active {
  color: #fff;
  font-weight: 700;
}

.tab.active::after {
  content: "";

  position: absolute;

  left: 0;
  right: 0;

  bottom: 0;

  height: 5px;

  border-radius: 10px;

  background: #fff;
}

/* Search */

.search-button {
  position: absolute;

  top: 18px;
  right: 18px;

  width: 58px;
  height: 58px;

  border-radius: 50%;

  background: rgba(35,35,35,.92);

  display: flex;
  align-items: center;
  justify-content: center;

  z-index: 1100;

  pointer-events: auto;
}

.search-icon {
  width: 28px;
  height: 28px;

  border: 4px solid #fff;

  border-radius: 50%;

  position: relative;
}

.search-icon::after {
  content: "";

  position: absolute;

  width: 15px;
  height: 4px;

  background: #fff;

  border-radius: 5px;

  right: -11px;
  bottom: -7px;

  transform: rotate(48deg);
}

/* =========================================================
   RIGHT ACTIONS
   ========================================================= */

.video-actions {
  position: absolute !important;

  right: 13px !important;

  top: 51% !important;

  transform: translateY(-18%) !important;

  width: 64px !important;

  display: flex !important;

  flex-direction: column !important;

  align-items: center !important;

  justify-content: flex-start !important;

  gap: 18px !important;

  z-index: 500 !important;
}

/* All buttons */

.video-actions button {
  width: 58px !important;
  min-width: 58px !important;

  padding: 0 !important;
  margin: 0 !important;

  display: flex !important;

  flex-direction: column !important;

  align-items: center !important;
  justify-content: center !important;

  color: #fff !important;

  background: transparent !important;
}

/* =========================================================
   PROFILE
   ========================================================= */

.profile-action {
  position: relative;

  width: 58px !important;
  height: 58px !important;

  margin-bottom: -2px !important;
}

.avatar {
  width: 56px !important;
  height: 56px !important;

  border-radius: 50% !important;

  border: 2px solid #fff !important;

  background: #080808 !important;

  display: flex !important;
  align-items: center !important;
  justify-content: center !important;

  font-size: 37px !important;
  font-weight: 400 !important;
}

.follow-badge {
  position: absolute !important;

  right: -3px !important;
  bottom: -5px !important;

  width: 25px !important;
  height: 25px !important;

  border-radius: 50% !important;

  background: #ff205d !important;

  border: 2px solid #fff !important;

  display: flex !important;
  align-items: center !important;
  justify-content: center !important;

  font-size: 17px !important;
  font-weight: 700 !important;
}

.follow-label {
  margin-top: 5px;

  font-size: 13px;

  color: #fff;
}

/* =========================================================
   ACTION ICONS
   ========================================================= */

.action-icon {
  width: 40px;
  height: 40px;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #fff;
}

/* Heart */

.heart-icon {
  width: 32px;
  height: 32px;

  border: 3px solid #fff;

  border-top: 0;
  border-right: 0;

  transform: rotate(-45deg) scale(.72);

  border-radius: 7px 0 7px 0;
}

.heart-icon::before,
.heart-icon::after {
  content: "";

  position: absolute;

  width: 32px;
  height: 32px;

  border: 3px solid #fff;

  border-radius: 50%;
}

.heart-icon::before {
  top: -17px;
  left: -3px;

  border-bottom: 0;
}

.heart-icon::after {
  left: 17px;
  top: 0;

  border-left: 0;
}

/* Comment */

.comment-icon {
  width: 39px;
  height: 30px;

  border: 3px solid #fff;

  border-radius: 5px;

  position: relative;
}

.comment-icon::after {
  content: "";

  position: absolute;

  left: 5px;
  bottom: -9px;

  width: 12px;
  height: 12px;

  background: #000;

  border-left: 3px solid #fff;
  border-bottom: 3px solid #fff;

  transform: skewY(-35deg);
}

/* Save */

.save-icon {
  width: 31px;
  height: 38px;

  border: 3px solid #fff;

  border-radius: 2px;

  position: relative;
}

.save-icon::after {
  content: "";

  position: absolute;

  bottom: -2px;
  left: 4px;

  width: 17px;
  height: 17px;

  background: #000;

  border-left: 3px solid #fff;
  border-bottom: 3px solid #fff;

  transform: rotate(-45deg);
}

/* Share */

.share-icon {
  width: 0;
  height: 0;

  border-top: 15px solid transparent;
  border-bottom: 15px solid transparent;

  border-left: 40px solid #fff;

  transform: rotate(-22deg);

  position: relative;
}

.share-icon::after {
  content: "";

  position: absolute;

  left: -39px;
  top: -3px;

  width: 30px;
  height: 3px;

  background: #fff;

  transform: rotate(12deg);
}

/* Count / label */

.action-label {
  margin-top: 3px;

  font-size: 13px;
  line-height: 16px;

  color: #fff;

  text-align: center;
}

/* =========================================================
   MUSIC DISC
   ========================================================= */

.music-button {
  position: absolute !important;

  right: 12px !important;
  bottom: 92px !important;

  width: 58px !important;
  height: 58px !important;

  border-radius: 50% !important;

  background: #111 !important;

  border: 2px solid rgba(255,255,255,.15) !important;

  box-shadow:
    0 0 0 5px rgba(255,255,255,.05),
    0 0 0 9px rgba(255,255,255,.04) !important;

  z-index: 600 !important;

  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}

.music-note {
  font-size: 25px;

  color: #fff;

  line-height: 1;
}

/* =========================================================
   VIDEO INFORMATION
   ========================================================= */

.video-info {
  position: absolute;

  left: 25px;
  right: 85px;

  bottom: 102px;

  z-index: 400;

  color: #fff;
}

.username {
  display: flex;
  align-items: center;

  gap: 7px;

  font-size: 23px;
  font-weight: 700;

  margin-bottom: 17px;
}

.verified {
  width: 29px;
  height: 29px;

  border-radius: 50%;

  background: #20bce9;

  color: #fff;

  display: inline-flex;

  align-items: center;
  justify-content: center;

  font-size: 18px;
  font-weight: 700;
}

.caption {
  font-size: 19px;

  line-height: 1.45;

  margin-bottom: 4px;
}

.slogan {
  font-size: 19px;

  line-height: 1.45;

  margin-bottom: 10px;
}

.hashtags {
  font-size: 18px;

  line-height: 1.45;

  color: #28bde9;

  margin-bottom: 16px;
}

.sound-text {
  font-size: 17px;

  display: flex;
  align-items: center;

  gap: 9px;
}

.sound-small {
  font-size: 20px;
}

/* =========================================================
   BOTTOM NAVIGATION
   ========================================================= */

.bottom-nav {
  position: fixed !important;

  left: 0 !important;
  right: 0 !important;
  bottom: 0 !important;

  width: 100% !important;

  height: 78px !important;

  z-index: 2000 !important;

  display: grid !important;

  grid-template-columns:
    1fr
    1fr
    1.25fr
    1fr
    1fr !important;

  align-items: center !important;

  background: #000 !important;

  border-top: 1px solid rgba(255,255,255,.12) !important;

  padding: 0 4px !important;

  overflow: visible !important;
}

/* EACH NAV ITEM */

.nav-item {
  position: relative !important;

  width: 100% !important;
  height: 78px !important;

  display: flex !important;

  flex-direction: column !important;

  align-items: center !important;

  justify-content: center !important;

  gap: 4px !important;

  color: #fff !important;

  z-index: 10 !important;
}

/* Nav icons */

.nav-svg {
  width: 28px;
  height: 28px;

  stroke: #fff;

  fill: none;

  stroke-width: 2.3;

  stroke-linecap: round;
  stroke-linejoin: round;
}

.nav-label {
  font-size: 13px;

  color: #fff;

  line-height: 16px;

  white-space: nowrap;
}

/* =========================================================
   CENTER CREATE BUTTON
   ========================================================= */

.create-area {
  position: relative !important;

  width: 100% !important;
  height: 78px !important;

  display: flex !important;

  align-items: center !important;
  justify-content: center !important;

  z-index: 50 !important;
}

.create-button {
  position: relative !important;

  width: 78px !important;
  height: 50px !important;

  border-radius: 14px !important;

  background: #fff !important;

  color: #000 !important;

  display: flex !important;

  align-items: center !important;
  justify-content: center !important;

  font-size: 30px !important;
  font-weight: 400 !important;

  z-index: 100 !important;

  box-shadow:
    -7px 0 0 #20dce0,
    7px 0 0 #ff1764 !important;
}

.create-button span {
  color: #000 !important;
}

/* =========================================================
   CREATE MODAL
   ========================================================= */

.create-modal {
  position: fixed;

  inset: 0;

  z-index: 5000;

  background: #000;

  display: none;

  flex-direction: column;

  overflow-y: auto;
}

.create-modal.open {
  display: flex;
}

.create-header {
  height: 60px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 0 18px;

  border-bottom: 1px solid #222;
}

.create-title {
  font-size: 20px;
  font-weight: 700;
}

.close-create {
  font-size: 28px;
}

.create-content {
  padding: 18px;

  padding-bottom: 120px;
}

.preview-box {
  width: 100%;

  height: 360px;

  background: #111;

  border-radius: 12px;

  overflow: hidden;

  display: flex;

  align-items: center;

  justify-content: center;
}

.preview-box video {
  width: 100%;
  height: 100%;

  object-fit: contain;

  background: #000;
}

.choose-video {
  margin-top: 18px;

  width: 100%;

  height: 48px;

  border: 1px solid #444;

  border-radius: 10px;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 16px;
}

.caption-input {
  width: 100%;

  min-height: 100px;

  margin-top: 16px;

  padding: 14px;

  resize: none;

  background: #151515;

  color: #fff;

  border: 1px solid #333;

  border-radius: 10px;

  outline: none;

  font-size: 16px;
}

.setting-row {
  min-height: 55px;

  border-bottom: 1px solid #222;

  display: flex;

  align-items: center;

  justify-content: space-between;

  font-size: 15px;
}

.post-area {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  padding: 12px 18px;

  background: #000;

  border-top: 1px solid #222;
}

.post-button {
  width: 100%;

  height: 48px;

  border-radius: 8px;

  background: #fff;

  color: #000;

  font-size: 17px;

  font-weight: 700;
}

.post-button:disabled {
  opacity: .45;
}

.upload-status {
  text-align: center;

  font-size: 13px;

  margin-top: 8px;

  color: #aaa;
}

#videoInput {
  display: none;
}

/* =========================================================
   RESPONSIVE MOBILE
   ========================================================= */

@media (max-width: 600px) {

  .top-bar {
    height: 78px;
  }

  .tabs {
    gap: 32px;
  }

  .tab {
    font-size: 17px;
  }

  .search-button {
    right: 16px;
    top: 17px;

    width: 56px;
    height: 56px;
  }

  .video-actions {
    right: 10px !important;

    top: 51% !important;

    transform: translateY(-17%) !important;

    gap: 16px !important;

    width: 62px !important;
  }

  .video-actions button {
    width: 56px !important;
    min-width: 56px !important;
  }

  .avatar {
    width: 55px !important;
    height: 55px !important;

    font-size: 36px !important;
  }

  .follow-label {
    font-size: 12px;
  }

  .action-label {
    font-size: 12px;
  }

  .video-info {
    left: 25px;
    right: 88px;
    bottom: 96px;
  }

  .username {
    font-size: 21px;
  }

  .caption,
  .slogan {
    font-size: 18px;
  }

  .hashtags {
    font-size: 17px;
  }

  .sound-text {
    font-size: 16px;
  }

  .music-button {
    right: 10px !important;
    bottom: 90px !important;

    width: 56px !important;
    height: 56px !important;
  }

  .bottom-nav {
    height: 76px !important;

    grid-template-columns:
      1fr
      1fr
      1.25fr
      1fr
      1fr !important;
  }

  .nav-item {
    height: 76px !important;
  }

  .create-area {
    height: 76px !important;
  }

  .create-button {
    width: 74px !important;
    height: 48px !important;
  }
}

</style>
</head>

<body>

<div id="app">

  <!-- =====================================================
       FEED
       ===================================================== -->

  <main id="feed">

    <section class="video-card">

      <!-- VIDEO -->

      <video
        class="video"
        src="uploads/video1.mp4"
        loop
        muted
        playsinline
        preload="metadata"
      ></video>


      <!-- =================================================
           TOP
           ================================================= -->

      <header class="top-bar">

        <div class="tabs">

          <button class="tab">
            LIVE
          </button>

          <button class="tab">
            Following
          </button>

          <button class="tab active">
            For You
          </button>

        </div>

        <button class="search-button" aria-label="Search">

          <span class="search-icon"></span>

        </button>

      </header>


      <!-- =================================================
           RIGHT ACTIONS
           ================================================= -->

      <aside class="video-actions">

        <!-- Profile -->

        <button class="profile-action">

          <span class="avatar">
            Z
          </span>

          <span class="follow-badge">
            +
          </span>

          <span class="follow-label">
            Follow
          </span>

        </button>


        <!-- Like -->

        <button class="like-button">

          <span class="action-icon">

            <span class="heart-icon"></span>

          </span>

          <span class="action-label">
            0
          </span>

        </button>


        <!-- Comment -->

        <button>

          <span class="action-icon">

            <span class="comment-icon"></span>

          </span>

          <span class="action-label">
            0
          </span>

        </button>


        <!-- Save -->

        <button>

          <span class="action-icon">

            <span class="save-icon"></span>

          </span>

          <span class="action-label">
            Save
          </span>

        </button>


        <!-- Share -->

        <button>

          <span class="action-icon">

            <span class="share-icon"></span>

          </span>

          <span class="action-label">
            Share
          </span>

        </button>

      </aside>


      <!-- =================================================
           MUSIC
           ================================================= -->

      <button class="music-button">

        <span class="music-note">
          ♪
        </span>

      </button>


      <!-- =================================================
           VIDEO INFO
           ================================================= -->

      <div class="video-info">

        <div class="username">

          <span>
            @zylo_creator
          </span>

          <span class="verified">
            ✓
          </span>

        </div>

        <div class="caption">
          Welcome to ZYLO 🌎
        </div>

        <div class="slogan">
          Create • Connect • Grow
        </div>

        <div class="hashtags">
          #ZYLO #Create #Connect #Grow #ForYou
        </div>

        <div class="sound-text">

          <span class="sound-small">
            ♪
          </span>

          <span>
            Original sound - ZYLO
          </span>

        </div>

      </div>

    </section>

  </main>


  <!-- =====================================================
       BOTTOM NAVIGATION
       ===================================================== -->

  <nav class="bottom-nav">

    <!-- HOME -->

    <button class="nav-item">

      <svg
        class="nav-svg"
        viewBox="0 0 24 24"
      >
        <path d="M3 10.5L12 3l9 7.5"></path>
        <path d="M5 9.5V21h14V9.5"></path>
        <path d="M9 21v-7h6v7"></path>
      </svg>

      <span class="nav-label">
        Home
      </span>

    </button>


    <!-- DISCOVER -->

    <button class="nav-item">

      <svg
        class="nav-svg"
        viewBox="0 0 24 24"
      >
        <circle cx="10.8" cy="10.8" r="6.8"></circle>
        <path d="M16 16l5 5"></path>
      </svg>

      <span class="nav-label">
        Discover
      </span>

    </button>


    <!-- CREATE -->

    <div class="create-area">

      <button
        class="create-button"
        id="openCreate"
        aria-label="Create"
      >

        <span>
          +
        </span>

      </button>

    </div>


    <!-- INBOX -->

    <button class="nav-item">

      <svg
        class="nav-svg"
        viewBox="0 0 24 24"
      >
        <path d="M4 5h16v13H4z"></path>
        <path d="M4 14h5l1.5 2h3L15 14h5"></path>
      </svg>

      <span class="nav-label">
        Inbox
      </span>

    </button>


    <!-- PROFILE -->

    <button class="nav-item">

      <svg
        class="nav-svg"
        viewBox="0 0 24 24"
      >
        <circle cx="12" cy="7" r="4"></circle>
        <path d="M4 21c.8-4 3.5-6 8-6s7.2 2 8 6"></path>
      </svg>

      <span class="nav-label">
        Profile
      </span>

    </button>

  </nav>


  <!-- =====================================================
       CREATE / UPLOAD SCREEN
       ===================================================== -->

  <section
    class="create-modal"
    id="createModal"
  >

    <header class="create-header">

      <button
        class="close-create"
        id="closeCreate"
      >
        ×
      </button>

      <span class="create-title">
        Create
      </span>

      <span style="width:28px;"></span>

    </header>


    <div class="create-content">

      <div class="preview-box">

        <video
          id="previewVideo"
          controls
          playsinline
        ></video>

      </div>


      <button
        class="choose-video"
        id="chooseVideo"
      >
        Choose video
      </button>

      <input
        type="file"
        id="videoInput"
        accept="video/*"
      >


      <textarea
        id="captionInput"
        class="caption-input"
        maxlength="2200"
        placeholder="Describe your video..."
      ></textarea>


      <div class="setting-row">

        <span>
          Add hashtags
        </span>

        <span>
          #ZYLO
        </span>

      </div>


      <div class="setting-row">

        <span>
          Sound
        </span>

        <span>
          Original sound - ZYLO
        </span>

      </div>


      <div class="setting-row">

        <span>
          Who can view this video
        </span>

        <select
          id="privacySelect"
          style="
            background:#000;
            color:#fff;
            border:0;
            outline:0;
          "
        >
          <option>Everyone</option>
          <option>Friends</option>
          <option>Only me</option>
        </select>

      </div>


      <div class="setting-row">

        <span>
          Allow comments
        </span>

        <input
          type="checkbox"
          checked
        >

      </div>


      <div class="setting-row">

        <span>
          Allow downloads
        </span>

        <input
          type="checkbox"
        >

      </div>

    </div>


    <div class="post-area">

      <button
        class="post-button"
        id="postButton"
        disabled
      >
        Post
      </button>

      <div
        class="upload-status"
        id="uploadStatus"
      >
        Select a video to continue
      </div>

    </div>

  </section>

</div>


<script>

/* =========================================================
   ZYLO JAVASCRIPT
   ========================================================= */

const feed =
  document.getElementById("feed");

const videos =
  document.querySelectorAll(".video");


/* =========================================================
   VIDEO AUTO PLAY / PAUSE
   ========================================================= */

const videoObserver =
  new IntersectionObserver(
    (entries) => {

      entries.forEach((entry) => {

        const video =
          entry.target;

        if (entry.isIntersecting) {

          video.play().catch(() => {});

        } else {

          video.pause();

        }

      });

    },
    {
      threshold: 0.65
    }
  );


videos.forEach((video) => {

  videoObserver.observe(video);

});


/* =========================================================
   TAP VIDEO = PLAY / PAUSE
   ========================================================= */

document.addEventListener(
  "click",
  function(event) {

    const video =
      event.target.closest(".video");

    if (!video) {
      return;
    }

    if (video.paused) {

      video.play().catch(() => {});

    } else {

      video.pause();

    }

  }
);


/* =========================================================
   LIKE
   ========================================================= */

document.addEventListener(
  "click",
  function(event) {

    const button =
      event.target.closest(".like-button");

    if (!button) {
      return;
    }

    button.classList.toggle("liked");

  }
);


/* =========================================================
   CREATE SCREEN
   ========================================================= */

const createModal =
  document.getElementById("createModal");

const openCreate =
  document.getElementById("openCreate");

const closeCreate =
  document.getElementById("closeCreate");


openCreate.addEventListener(
  "click",
  function() {

    createModal.classList.add("open");

  }
);


closeCreate.addEventListener(
  "click",
  function() {

    createModal.classList.remove("open");

  }
);


/* =========================================================
   VIDEO SELECT
   ========================================================= */

const videoInput =
  document.getElementById("videoInput");

const chooseVideo =
  document.getElementById("chooseVideo");

const previewVideo =
  document.getElementById("previewVideo");

const postButton =
  document.getElementById("postButton");

const uploadStatus =
  document.getElementById("uploadStatus");


chooseVideo.addEventListener(
  "click",
  function() {

    videoInput.click();

  }
);


let selectedVideo = null;


videoInput.addEventListener(
  "change",
  function() {

    const file =
      this.files[0];

    if (!file) {
      return;
    }

    if (!file.type.startsWith("video/")) {

      uploadStatus.textContent =
        "Please select a video file";

      return;

    }

    selectedVideo = file;

    const videoURL =
      URL.createObjectURL(file);

    previewVideo.src =
      videoURL;

    previewVideo.load();

    postButton.disabled =
      false;

    uploadStatus.textContent =
      "Video ready — press Post";

  }
);


/* =========================================================
   UPLOAD TO ZYLO BACKEND
   ========================================================= */

postButton.addEventListener(
  "click",
  async function() {

    if (!selectedVideo) {

      uploadStatus.textContent =
        "Please select a video first";

      return;

    }

    postButton.disabled =
      true;

    uploadStatus.textContent =
      "ভিডিও আপলোড হচ্ছে...";


    const formData =
      new FormData();

    formData.append(
      "video",
      selectedVideo
    );


    const caption =
      document.getElementById(
        "captionInput"
      ).value;


    try {

      const response =
        await fetch(
          "https://zylo-backend-ec5c.onrender.com/api/upload",
          {
            method: "POST",
            body: formData
          }
        );


      const data =
        await response.json();


      if (!response.ok || !data.success) {

        throw new Error(
          data.message ||
          "Upload failed"
        );

      }


      /* Save uploaded video */

      localStorage.setItem(
        "zylo_last_video",
        JSON.stringify({
          url: data.video.url,
          caption: caption
        })
      );


      /* Create new feed card */

      addUploadedVideo(
        data.video.url,
        caption
      );


      uploadStatus.textContent =
        "ভিডিও সফলভাবে পোস্ট হয়েছে ✓";


      setTimeout(
        function() {

          createModal.classList.remove(
            "open"
          );

          postButton.disabled =
            false;

          selectedVideo =
            null;

          previewVideo.src =
            "";

          uploadStatus.textContent =
            "Select a video to continue";

        },
        900
      );


    } catch (error) {

      console.error(error);

      uploadStatus.textContent =
        "Upload failed: " +
        error.message;

      postButton.disabled =
        false;

    }

  }
);


/* =========================================================
   ADD UPLOADED VIDEO TO FEED
   ========================================================= */

function addUploadedVideo(
  videoURL,
  caption
) {

  const section =
    document.createElement(
      "section"
    );

  section.className =
    "video-card";


  section.innerHTML = `

    <video
      class="video"
      src="${escapeHTML(videoURL)}"
      loop
      muted
      playsinline
      preload="metadata"
    ></video>

    <div class="video-info">

      <div class="username">

        <span>
          @zylo_creator
        </span>

        <span class="verified">
          ✓
        </span>

      </div>

      <div class="caption">
        ${escapeHTML(
          caption ||
          "Welcome to ZYLO 🌎"
        )}
      </div>

      <div class="slogan">
        Create • Connect • Grow
      </div>

      <div class="hashtags">
        #ZYLO #Create #Connect #Grow #ForYou
      </div>

      <div class="sound-text">

        <span class="sound-small">
          ♪
        </span>

        <span>
          Original sound - ZYLO
        </span>

      </div>

    </div>

    <aside class="video-actions">

      <button class="profile-action">

        <span class="avatar">
          Z
        </span>

        <span class="follow-badge">
          +
        </span>

        <span class="follow-label">
          Follow
        </span>

      </button>

      <button class="like-button">

        <span class="action-icon">
          <span class="heart-icon"></span>
        </span>

        <span class="action-label">
          0
        </span>

      </button>

      <button>

        <span class="action-icon">
          <span class="comment-icon"></span>
        </span>

        <span class="action-label">

        </span>

      </button>

      <button>

        <span class="action-icon">
          <span class="save-icon"></span>
        </span>

        </span>

      </button>

      <button>

        <span class="action-icon">

  `;


  feed.prepend(section);


  const newVideo =

  videoObserver.observe(

  newVideo.addEventListener(
    "click",
    function() {

        newVideo.play().catch(
          () => {}
        );

      } else {

        newVideo.pause();

      }

    }
  );

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   RESTORE LAST UPLOADED VIDEO
   ========================================================= */

try {

  const saved =
    localStorage.getItem(
      "zylo_last_video"
    );


  if (saved) {

    const data =
      JSON.parse(saved);


    if (
      data &&
      data.url
    ) {

      addUploadedVideo(
        data.url,
        data.caption
      );

    }

  }

} catch (error) {

  console.log(
    "No saved video"
  );

}


/* =========================================================
   FOR YOU / FOLLOWING / LIVE
   ========================================================= */

document.querySelectorAll(
  ".tab"
).forEach(
  (tab) => {

    tab.addEventListener(
      "click",
      function() {

        document.querySelectorAll(
          ".tab"
        ).forEach(
          (item) => {

            item.classList.remove(
              "active"
            );

          }
        );


        this.classList.add(
          "active"
        );

      }
    );

  }
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no,
        viewport-fit=cover">

  <title>ZYLO</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <!-- TOP -->
  <header class="top-bar">

    <div class="logo">ZYLO</div>

    <div class="top-tabs">
      <button>Following</button>
      <button class="active">For You</button>
    </div>

    <button class="search-btn">⌕</button>

  </header>


  <!-- VIDEO -->
  <main id="feed">

    <section class="video-item">

      <!-- IMPORTANT:
           Raw GitHub URL ব্যবহার করা হয়নি -->
      <video
        class="video"
        src="/backend/uploads/video1.mp4"
        loop
        muted
        playsinline
        webkit-playsinline
        preload="auto">
      </video>


      <!-- RIGHT BUTTONS -->

      <div class="right-buttons">

        <button class="action-btn like-btn">
          <strong>♥</strong>
          <span>0</span>
        </button>

        <button class="action-btn comment-btn">
          <strong>💬</strong>
          <span>0</span>
        </button>

        <button class="action-btn save-btn">
          <strong>🔖</strong>
          <span>Save</span>
        </button>

        <button class="action-btn share-btn">
          <strong>↗</strong>
          <span>Share</span>
        </button>

        <button class="action-btn music-btn">
          <strong>♫</strong>
          <span>Music</span>
        </button>

      </div>


      <!-- VIDEO INFO -->

      <div class="video-info">

        <h3>@zylo_creator</h3>

        <p>Welcome to ZYLO 🌍</p>

        <p class="music-name">
          ♫ Original sound
        </p>

      </div>


      <!-- PLAY -->

      <div class="play-icon">▶</div>


      <!-- FULLSCREEN -->

      <button class="fullscreen-btn">⛶</button>

    </section>

  </main>


  <!-- BOTTOM NAV -->

  <nav class="bottom-nav">

    <button>
      <b>⌂</b>
      <span>Home</span>
    </button>

    <button>
      <b>⌕</b>
      <span>Discover</span>
    </button>

    <button class="upload-btn">+</button>

    <button>
      <b>💬</b>
      <span>Inbox</span>
    </button>

    <button>
      <b>●</b>
      <span>Profile</span>
    </button>

  </nav>

</div>


<script src="script.js"></script>

</body>
</html>

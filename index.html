<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>ZYLO</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ================= TOP BAR ================= -->

  <header class="top-bar">

    <button class="live-button" id="liveButton">
      LIVE
    </button>

    <div class="top-tabs">

      <button class="top-tab">
        Following
      </button>

      <button class="top-tab active">
        For You
      </button>

    </div>

    <!-- SEARCH -->

    <button
      class="top-search"
      id="topSearch"
      aria-label="Search"
    >

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >

        <circle
          cx="11"
          cy="11"
          r="7"
        ></circle>

        <line
          x1="16.5"
          y1="16.5"
          x2="21"
          y2="21"
        ></line>

      </svg>

    </button>

  </header>


  <!-- ================= VIDEO FEED ================= -->

  <main
    class="video-feed"
    id="videoFeed"
  >

    <!-- ================= VIDEO 1 ================= -->

    <section class="video-card">

      <video
        class="video"
        src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
        loop
        muted
        playsinline
        preload="auto"
      ></video>

      <div class="video-gradient"></div>


      <!-- RIGHT ACTIONS -->

      <div class="right-actions">

        <!-- PROFILE -->

        <button class="action-btn profile-action">

          <div class="avatar">
            Z
          </div>

          <span class="follow-plus">
            +
          </span>

        </button>


        <!-- LIKE -->

        <button class="action-btn like-btn">

          <svg viewBox="0 0 24 24">

            <path
              d="M20.8 8.7c0 5.5-8.8 10.2-8.8 10.2S3.2 14.2 3.2 8.7C3.2 5.7 5.4 4 8 4c1.5 0 2.9.7 4 2 1.1-1.3 2.5-2 4-2 2.6 0 4.8 1.7 4.8 4.7z"
            ></path>

          </svg>

          <span class="count">
            0
          </span>

        </button>


        <!-- COMMENT -->

        <button class="action-btn comment-btn">

          <svg viewBox="0 0 24 24">

            <path
              d="M20 11.5a7.5 7.5 0 0 1-8 7.5c-1.2 0-2.4-.3-3.4-.8L4 20l1.2-3.8A7.2 7.2 0 0 1 4 11.5 7.5 7.5 0 0 1 12 4a7.5 7.5 0 0 1 8 7.5z"
            ></path>

            <circle
              cx="9"
              cy="11.5"
              r=".7"
              fill="currentColor"
            ></circle>

            <circle
              cx="12"
              cy="11.5"
              r=".7"
              fill="currentColor"
            ></circle>

            <circle
              cx="15"
              cy="11.5"
              r=".7"
              fill="currentColor"
            ></circle>

          </svg>

          <span class="count">
            0
          </span>

        </button>


        <!-- SAVE -->

        <button class="action-btn save-btn">

          <svg viewBox="0 0 24 24">

            <path
              d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-3.5L6 21V4.5z"
            ></path>

          </svg>

          <span class="count">
            0
          </span>

        </button>


        <!-- SHARE -->

        <button class="action-btn share-btn">

          <svg viewBox="0 0 24 24">

            <path
              d="M20 4L10.5 13.5"
            ></path>

            <path
              d="M20 4l-6 16-3.5-6.5L4 10l16-6z"
            ></path>

          </svg>

          <span class="share-text">
            Share
          </span>

        </button>


        <!-- SOUND -->

        <button class="action-btn sound-btn">

          <svg viewBox="0 0 24 24">

            <path
              d="M4 10v4h4l5 4V6l-5 4H4z"
            ></path>

            <path
              d="M16 9.5a4 4 0 0 1 0 5"
            ></path>

          </svg>

        </button>

      </div>


      <!-- VIDEO INFO -->

      <div class="video-info">

        <div class="username">
          @zylo_creator
        </div>

        <div class="caption">
          Welcome to ZYLO 🌍
        </div>

        <div class="caption">
          Create • Connect • Grow
        </div>

        <div class="music">
          ♪ Original sound - ZYLO
        </div>

      </div>

    </section>


    <!-- ================= VIDEO 2 ================= -->

    <section class="video-card">

      <video
        class="video"
        src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
        loop
        muted
        playsinline
        preload="auto"
      ></video>

      <div class="video-gradient"></div>


      <!-- RIGHT ACTIONS -->

      <div class="right-actions">

        <button class="action-btn profile-action">

          <div class="avatar">
            Z
          </div>

          <span class="follow-plus">
            +
          </span>

        </button>


        <button class="action-btn like-btn">

          <svg viewBox="0 0 24 24">

            <path
              d="M20.8 8.7c0 5.5-8.8 10.2-8.8 10.2S3.2 14.2 3.2 8.7C3.2 5.7 5.4 4 8 4c1.5 0 2.9.7 4 2 1.1-1.3 2.5-2 4-2 2.6 0 4.8 1.7 4.8 4.7z"
            ></path>

          </svg>

          <span class="count">
            0
          </span>

        </button>


        <button class="action-btn comment-btn">

          <svg viewBox="0 0 24 24">

            <path
              d="M20 11.5a7.5 7.5 0 0 1-8 7.5c-1.2 0-2.4-.3-3.4-.8L4 20l1.2-3.8A7.2 7.2 0 0 1 4 11.5 7.5 7.5 0 0 1 12 4a7.5 7.5 0 0 1 8 7.5z"
            ></path>

            <circle
              cx="9"
              cy="11.5"
              r=".7"
              fill="currentColor"
            ></circle>

            <circle
              cx="12"
              cy="11.5"
              r=".7"
              fill="currentColor"
            ></circle>

            <circle
              cx="15"
              cy="11.5"
              r=".7"
              fill="currentColor"
            ></circle>

          </svg>

          <span class="count">
            0
          </span>

        </button>


        <button class="action-btn save-btn">

          <svg viewBox="0 0 24 24">

            <path
              d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-3.5L6 21V4.5z"
            ></path>

          </svg>

          <span class="count">
            0
          </span>

        </button>


        <button class="action-btn share-btn">

          <svg viewBox="0 0 24 24">

            <path
              d="M20 4L10.5 13.5"
            ></path>

            <path
              d="M20 4l-6 16-3.5-6.5L4 10l16-6z"
            ></path>

          </svg>

          <span class="share-text">
            Share
          </span>

        </button>


        <button class="action-btn sound-btn">

          <svg viewBox="0 0 24 24">

            <path
              d="M4 10v4h4l5 4V6l-5 4H4z"
            ></path>

            <path
              d="M16 9.5a4 4 0 0 1 0 5"
            ></path>

          </svg>

        </button>

      </div>


      <!-- VIDEO INFO -->

      <div class="video-info">

        <div class="username">
          @zylo_creator
        </div>

        <div class="caption">
          Welcome to ZYLO 🌍
        </div>

        <div class="caption">
          Create • Connect • Grow
        </div>

        <div class="music">
          ♪ Original sound - ZYLO
        </div>

      </div>

    </section>

  </main>


  <!-- ================= UPLOAD MODAL ================= -->

  <div
    class="upload-modal"
    id="uploadModal"
  >

    <div class="upload-box">

      <button
        class="close-upload"
        id="closeUpload"
      >
        ×
      </button>

      <h2>
        Upload Video
      </h2>

      <p>
        Select a video to upload to ZYLO.
      </p>

      <input
        type="file"
        id="videoInput"
        accept="video/*"
      >

      <button
        class="upload-submit"
        id="uploadSubmit"
      >
        Upload
      </button>

      <div id="uploadStatus"></div>

    </div>

  </div>


  <!-- ================= BOTTOM NAV ================= -->

  <nav class="bottom-nav">

    <!-- HOME -->

    <button class="nav-button active">

      <svg viewBox="0 0 24 24">

        <path
          d="M3 10.5L12 3l9 7.5"
        ></path>

        <path
          d="M5 9.5V21h14V9.5"
        ></path>

      </svg>

      <span>
        Home
      </span>

    </button>


    <!-- SEARCH -->

    <button
      class="nav-button"
      id="bottomSearch"
    >

      <svg viewBox="0 0 24 24">

        <circle
          cx="11"
          cy="11"
          r="6.5"
        ></circle>

        <line
          x1="16"
          y1="16"
          x2="21"
          y2="21"
        ></line>

      </svg>

      <span>
        Search
      </span>

    </button>


    <!-- UPLOAD -->

    <button
      class="nav-button upload-button"
      id="openUpload"
    >

      <svg viewBox="0 0 24 24">

        <line
          x1="12"
          y1="5"
          x2="12"
          y2="19"
        ></line>

        <line
          x1="5"
          y1="12"
          x2="19"
          y2="12"
        ></line>

      </svg>

    </button>


    <!-- INBOX -->

    <button class="nav-button">

      <svg viewBox="0 0 24 24">

        <path
          d="M4 5h16v13H4z"
        ></path>

        <path
          d="M4 15h5l2 2h2l2-2h5"
        ></path>

      </svg>

      <span>
        Inbox
      </span>

    </button>


    <!-- PROFILE -->

    <button class="nav-button">

      <svg viewBox="0 0 24 24">

        <circle
          cx="12"
          cy="8"
          r="3.5"
        ></circle>

        <path
          d="M5 21c0-4 3-6 7-6s7 2 7 6"
        ></path>

      </svg>

      <span>
        Profile
      </span>

    </button>

  </nav>


  <!-- ================= JAVASCRIPT ================= -->

  <script>

    const videoFeed =
      document.getElementById("videoFeed");

    const uploadModal =
      document.getElementById("uploadModal");

    const openUpload =
      document.getElementById("openUpload");

    const closeUpload =
      document.getElementById("closeUpload");

    const videoInput =
      document.getElementById("videoInput");

    const uploadSubmit =
      document.getElementById("uploadSubmit");

    const uploadStatus =
      document.getElementById("uploadStatus");

    const topSearch =
      document.getElementById("topSearch");

    const bottomSearch =
      document.getElementById("bottomSearch");


    /* ================= SEARCH ================= */

    function openSearch() {

      alert("ZYLO Search");

    }

    topSearch.addEventListener(
      "click",
      openSearch
    );

    bottomSearch.addEventListener(
      "click",
      openSearch
    );


    /* ================= UPLOAD MODAL ================= */

    openUpload.addEventListener(
      "click",
      function () {

        uploadModal.classList.add("show");

      }
    );


    closeUpload.addEventListener(
      "click",
      function () {

        uploadModal.classList.remove("show");

        uploadStatus.textContent = "";

        videoInput.value = "";

      }
    );


    uploadModal.addEventListener(
      "click",
      function (event) {

        if (
          event.target === uploadModal
        ) {

          uploadModal.classList.remove(
            "show"
          );

        }

      }
    );


    /* ================= VIDEO ================= */

    let videos =
      document.querySelectorAll(".video");


    const observer =
      new IntersectionObserver(
        function (entries) {

          entries.forEach(
            function (entry) {

              const video =
                entry.target;

              if (
                entry.isIntersecting
              ) {

                document
                  .querySelectorAll(".video")
                  .forEach(
                    function (other) {

                      if (
                        other !== video
                      ) {

                        other.pause();

                      }

                    }
                  );

                video
                  .play()
                  .catch(
                    function () {}
                  );

              } else {

                video.pause();

              }

            }
          );

        },
        {
          threshold: 0.65
        }
      );


    document
      .querySelectorAll(".video")
      .forEach(
        function (video) {

          observer.observe(video);

          video.addEventListener(
            "click",
            function () {

              if (
                video.paused
              ) {

                video.play();

              } else {

                video.pause();

              }

            }
          );

        }
      );


    /* ================= LIKE ================= */

    function setupLike(button) {

      button.addEventListener(
        "click",
        function () {

          button.classList.toggle(
            "active"
          );

          const count =
            button.querySelector(
              ".count"
            );

          count.textContent =
            button.classList.contains(
              "active"
            )
              ? "1"
              : "0";

        }
      );

    }


    document
      .querySelectorAll(".like-btn")
      .forEach(setupLike);


    /* ================= SAVE ================= */

    function setupSave(button) {

      button.addEventListener(
        "click",
        function () {

          button.classList.toggle(
            "active"
          );

          const count =
            button.querySelector(
              ".count"
            );

          count.textContent =
            button.classList.contains(
              "active"
            )
              ? "1"
              : "0";

        }
      );

    }


    document
      .querySelectorAll(".save-btn")
      .forEach(setupSave);


    /* ================= FOLLOW ================= */

    function setupFollow(button) {

      button.addEventListener(
        "click",
        function () {

          button.classList.toggle(
            "following"
          );

          const plus =
            button.querySelector(
              ".follow-plus"
            );

          plus.textContent =
            button.classList.contains(
              "following"
            )
              ? "✓"
              : "+";

        }
      );

    }


    document
      .querySelectorAll(".profile-action")
      .forEach(setupFollow);


    /* ================= SOUND ================= */

    function setupSound(button) {

      button.addEventListener(
        "click",
        function () {

          const card =
            button.closest(
              ".video-card"
            );

          const video =
            card.querySelector(
              ".video"
            );

          video.muted =
            !video.muted;

          button.classList.toggle(
            "active",
            !video.muted
          );

        }
      );

    }


    document
      .querySelectorAll(".sound-btn")
      .forEach(setupSound);


    /* ================= SHARE ================= */

    function setupShare(button) {

      button.addEventListener(
        "click",
        async function () {

          const url =
            window.location.href;

          if (
            navigator.share
          ) {

            try {

              await navigator.share({
                title: "ZYLO",
                text:
                  "Check this video on ZYLO",
                url: url
              });

            } catch (error) {}

          } else {

            try {

              await navigator.clipboard.writeText(
                url
              );

              alert(
                "Link copied!"
              );

            } catch (error) {

              alert(
                "Share link: " + url
              );

            }

          }

        }
      );

    }


    document
      .querySelectorAll(".share-btn")
      .forEach(setupShare);


    /* ================= UPLOAD ================= */

    uploadSubmit.addEventListener(
      "click",
      async function () {

        const file =
          videoInput.files[0];

        if (!file) {

          uploadStatus.textContent =
            "একটি ভিডিও নির্বাচন করুন।";

          return;

        }


        if (
          !file.type.startsWith(
            "video/"
          )
        ) {

          uploadStatus.textContent =
            "শুধু ভিডিও ফাইল আপলোড করা যাবে।";

          return;

        }


        if (
          file.size >
          200 * 1024 * 1024
        ) {

          uploadStatus.textContent =
            "ভিডিও 200 MB-এর কম হতে হবে।";

          return;

        }


        uploadSubmit.disabled =
          true;

        uploadStatus.textContent =
          "ভিডিও আপলোড হচ্ছে...";


        const formData =
          new FormData();

        formData.append(
          "video",
          file
        );


        try {

          const response =
            await fetch(
              "https://zylo-backend-ec5c.onrender.com/api/upload",
              {
                method: "POST",
                body: formData
              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.message ||
              "Upload failed"
            );

          }


          uploadStatus.textContent =
            "ভিডিও সফলভাবে আপলোড হয়েছে ✅";


          addVideoToFeed(
            data.video.url
          );


          setTimeout(
            function () {

              uploadModal.classList.remove(
                "show"
              );

              uploadStatus.textContent =
                "";

              videoInput.value =
                "";

            },
            1200
          );


        } catch (error) {

          console.error(error);

          uploadStatus.textContent =
            "Upload failed: " +
            error.message;

        }


        uploadSubmit.disabled =
          false;

      }
    );


    /* ================= ADD UPLOADED VIDEO ================= */

    function addVideoToFeed(
      videoUrl
    ) {

      const card =
        document.createElement(
          "section"
        );

      card.className =
        "video-card";


      card.innerHTML = `

        <video
          class="video"
          src="${videoUrl}"
          loop
          muted
          playsinline
          preload="auto"
        ></video>

        <div class="video-gradient"></div>

        <div class="right-actions">

          <button class="action-btn profile-action">

            <div class="avatar">
              Z
            </div>

            <span class="follow-plus">
              +
            </span>

          </button>


          <button class="action-btn like-btn">

            <svg viewBox="0 0 24 24">

              <path
                d="M20.8 8.7c0 5.5-8.8 10.2-8.8 10.2S3.2 14.2 3.2 8.7C3.2 5.7 5.4 4 8 4c1.5 0 2.9.7 4 2 1.1-1.3 2.5-2 4-2 2.6 0 4.8 1.7 4.8 4.7z"
              ></path>

            </svg>

            <span class="count">
              0
            </span>

          </button>


          <button class="action-btn comment-btn">

            <svg viewBox="0 0 24 24">

              <path
                d="M20 11.5a7.5 7.5 0 0 1-8 7.5c-1.2 0-2.4-.3-3.4-.8L4 20l1.2-3.8A7.2 7.2 0 0 1 4 11.5 7.5 7.5 0 0 1 12 4a7.5 7.5 0 0 1 8 7.5z"
              ></path>

            </svg>

            <span class="count">
              0
            </span>

          </button>


          <button class="action-btn save-btn">

            <svg viewBox="0 0 24 24">

              <path
                d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-3.5L6 21V4.5z"
              ></path>

            </svg>

            <span class="count">
              0
            </span>

          </button>


          <button class="action-btn share-btn">

            <svg viewBox="0 0 24 24">

              <path
                d="M20 4L10.5 13.5"
              ></path>

              <path
                d="M20 4l-6 16-3.5-6.5L4 10l16-6z"
              ></path>

            </svg>

            <span class="share-text">
              Share
            </span>

          </button>


          <button class="action-btn sound-btn">

            <svg viewBox="0 0 24 24">

              <path
                d="M4 10v4h4l5 4V6l-5 4H4z"
              ></path>

              <path
                d="M16 9.5a4 4 0 0 1 0 5"
              ></path>

            </svg>

          </button>

        </div>


        <div class="video-info">

          <div class="username">
            @zylo_creator
          </div>

          <div class="caption">
            New video on ZYLO 🌍
          </div>

          <div class="caption">
            Create • Connect • Grow
          </div>

          <div class="music">
            ♪ Original sound - ZYLO
          </div>

        </div>

      `;


      videoFeed.prepend(card);


      const newVideo =
        card.querySelector(
          ".video"
        );


      observer.observe(
        newVideo
      );


      newVideo.addEventListener(
        "click",
        function () {

          if (
            newVideo.paused
          ) {

            newVideo.play();

          } else {

            newVideo.pause();

          }

        }
      );


      setupLike(
        card.querySelector(
          ".like-btn"
        )
      );


      setupSave(
        card.querySelector(
          ".save-btn"
        )
      );


      setupFollow(
        card.querySelector(
          ".profile-action"
        )
      );


      setupSound(
        card.querySelector(
          ".sound-btn"
        )
      );


      setupShare(
        card.querySelector(
          ".share-btn"
        )
      );

    }

  </script>

</body>
</html>

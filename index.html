<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>ZYLO</title>

  <style>
    /* =========================================
       ZYLO FULL SCREEN VIDEO
       ========================================= */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overscroll-behavior: none;
    }

    button {
      border: 0;
      outline: 0;
      background: none;
      color: #fff;
      padding: 0;
    }

    /* =========================================
       FULL SCREEN APP
       ========================================= */

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      background: #000;
      overflow: hidden;
    }

    /* =========================================
       VIDEO FEED
       ========================================= */

    #feed {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100dvh;

      overflow-y: auto;
      overflow-x: hidden;

      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;

      background: #000;
    }

    #feed::-webkit-scrollbar {
      display: none;
    }

    /* =========================================
       VIDEO CARD
       ========================================= */

    .video-card {
      position: relative;

      width: 100%;
      height: 100dvh;
      min-height: 100dvh;

      background: #000;

      overflow: hidden;

      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    /* =========================================
       FULL SCREEN VIDEO
       ========================================= */

    .video {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      min-width: 100%;
      min-height: 100%;

      object-fit: cover;

      background: #000;

      display: block;
    }

    /* =========================================
       VIDEO DARK OVERLAYS
       ========================================= */

    .video-card::before {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 2;
      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,.55) 0%,
          transparent 18%,
          transparent 65%,
          rgba(0,0,0,.68) 100%
        );
    }

    /* =========================================
       TOP BAR
       ========================================= */

    .top-bar {
      position: absolute;

      top: 0;
      left: 0;
      right: 0;

      height: 75px;

      z-index: 20;

      display: flex;
      align-items: center;
      justify-content: center;

      padding-top: env(safe-area-inset-top);
    }

    .tabs {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 34px;

      height: 60px;
    }

    .tab {
      position: relative;

      color: rgba(255,255,255,.72);

      font-size: 18px;
      font-weight: 500;

      white-space: nowrap;
    }

    .tab.active {
      color: #fff;
      font-weight: 700;
    }

    .tab.active::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: -13px;

      width: 105px;
      height: 5px;

      transform: translateX(-50%);

      border-radius: 10px;

      background: #fff;
    }

    /* =========================================
       SEARCH
       ========================================= */

    .search-button {
      position: absolute;

      top: 16px;
      right: 14px;

      width: 58px;
      height: 58px;

      border-radius: 50%;

      background: rgba(30,30,30,.9);

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 30;
    }

    .search-icon {
      position: relative;

      width: 29px;
      height: 29px;

      border: 4px solid #fff;
      border-radius: 50%;
    }

    .search-icon::after {
      content: "";

      position: absolute;

      width: 15px;
      height: 4px;

      background: #fff;

      right: -12px;
      bottom: -7px;

      transform: rotate(48deg);

      border-radius: 5px;
    }

    /* =========================================
       RIGHT ACTIONS
       ========================================= */

    .video-actions {
      position: absolute;

      right: 12px;

      top: 53%;

      transform: translateY(-50%);

      width: 62px;

      z-index: 25;

      display: flex;
      flex-direction: column;

      align-items: center;

      gap: 19px;
    }

    .action-button {
      width: 54px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      color: #fff;
    }

    .action-icon {
      width: 40px;
      height: 40px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #fff;

      font-size: 35px;
      line-height: 1;
    }

    .action-label {
      margin-top: 4px;

      color: #fff;

      font-size: 13px;
      line-height: 15px;

      text-align: center;
    }

    /* =========================================
       PROFILE
       ========================================= */

    .profile-action {
      position: relative;
    }

    .avatar {
      width: 58px;
      height: 58px;

      border: 2px solid #fff;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 32px;
      font-weight: 400;

      background: #050505;
    }

    .follow-plus {
      position: absolute;

      right: -2px;
      bottom: 20px;

      width: 24px;
      height: 24px;

      border-radius: 50%;

      background: #ff1767;

      border: 2px solid #fff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 18px;
      font-weight: 700;
    }

    /* =========================================
       LIKE
       ========================================= */

    .heart-icon {
      font-size: 39px;
      font-family: Arial, sans-serif;
    }

    /* =========================================
       COMMENT
       ========================================= */

    .comment-icon {
      width: 36px;
      height: 30px;

      border: 4px solid #fff;

      border-radius: 7px;

      position: relative;
    }

    .comment-icon::after {
      content: "";

      position: absolute;

      left: 4px;
      bottom: -9px;

      width: 10px;
      height: 10px;

      border-left: 4px solid #fff;

      transform: skewY(-35deg);
    }

    /* =========================================
       SAVE
       ========================================= */

    .save-icon {
      width: 31px;
      height: 39px;

      border: 4px solid #fff;

      position: relative;
    }

    .save-icon::after {
      content: "";

      position: absolute;

      left: 3px;
      right: 3px;
      bottom: -2px;

      height: 15px;

      background: #000;

      border-left: 4px solid #fff;
      border-top: 4px solid #fff;

      transform: rotate(45deg) scale(.7);
    }

    /* =========================================
       SHARE
       ========================================= */

    .share-icon {
      width: 35px;
      height: 35px;

      position: relative;

      transform: rotate(-18deg);
    }

    .share-icon::before {
      content: "";

      position: absolute;

      width: 0;
      height: 0;

      border-top: 17px solid transparent;
      border-bottom: 17px solid transparent;
      border-left: 35px solid #fff;

      top: 0;
      left: 0;
    }

    .share-icon::after {
      content: "";

      position: absolute;

      width: 23px;
      height: 4px;

      background: #000;

      left: 4px;
      top: 16px;

      transform: rotate(-24deg);
    }

    /* =========================================
       MUSIC BUTTON
       ========================================= */

    .music-button {
      position: absolute;

      right: 13px;
      bottom: 96px;

      width: 56px;
      height: 56px;

      border-radius: 50%;

      background: #111;

      border: 2px solid rgba(255,255,255,.28);

      z-index: 28;

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow:
        0 0 0 5px rgba(255,255,255,.04),
        0 0 0 9px rgba(255,255,255,.03);
    }

    .music-note {
      font-size: 27px;
      color: #fff;
    }

    /* =========================================
       VIDEO INFORMATION
       ========================================= */

    .video-info {
      position: absolute;

      left: 24px;
      right: 92px;

      bottom: 118px;

      z-index: 15;

      color: #fff;
    }

    .username {
      display: flex;
      align-items: center;

      gap: 8px;

      font-size: 24px;
      font-weight: 700;

      margin-bottom: 18px;
    }

    .verified {
      width: 30px;
      height: 30px;

      border-radius: 50%;

      background: #20bfe8;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      font-size: 19px;
    }

    .caption {
      font-size: 20px;
      line-height: 1.45;

      margin-bottom: 5px;
    }

    .tagline {
      font-size: 20px;
      line-height: 1.45;

      margin-bottom: 8px;
    }

    .hashtags {
      color: #20bfe8;

      font-size: 18px;
      line-height: 1.5;

      margin-bottom: 14px;
    }

    .sound {
      display: flex;
      align-items: center;

      gap: 9px;

      font-size: 17px;

      white-space: nowrap;

      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sound-note {
      font-size: 21px;
    }

    /* =========================================
       BOTTOM NAVIGATION
       ========================================= */

    .bottom-nav {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      height: 78px;

      padding-bottom: env(safe-area-inset-bottom);

      background: rgba(0,0,0,.92);

      border-top: 1px solid rgba(255,255,255,.12);

      z-index: 40;

      display: grid;

      grid-template-columns:
        1fr
        1fr
        1.25fr
        1fr
        1fr;

      align-items: center;
    }

    .nav-button {
      height: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 4px;

      color: #fff;
    }

    .nav-icon {
      width: 30px;
      height: 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 29px;

      color: #fff;
    }

    .nav-label {
      font-size: 13px;
      color: #fff;
    }

    /* =========================================
       CREATE BUTTON
       ========================================= */

    .create-button {
      position: relative;

      width: 145px;
      height: 48px;

      justify-self: center;

      border-radius: 14px;

      background:
        linear-gradient(
          90deg,
          #20dce5 0%,
          #fff 17%,
          #fff 83%,
          #ff1767 100%
        );

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .create-inner {
      width: 115px;
      height: 44px;

      background: #fff;

      color: #000;

      border-radius: 11px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 32px;
      font-weight: 400;
    }

    /* =========================================
       HIDDEN UPLOAD
       ========================================= */

    #videoInput {
      display: none;
    }

    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 600px) {

      .tabs {
        gap: 28px;
      }

      .tab {
        font-size: 17px;
      }

      .search-button {
        width: 56px;
        height: 56px;

        top: 12px;
        right: 10px;
      }

      .video-actions {
        right: 9px;

        top: 53%;

        gap: 17px;
      }

      .action-icon {
        font-size: 33px;
      }

      .avatar {
        width: 55px;
        height: 55px;

        font-size: 30px;
      }

      .video-info {
        left: 24px;
        right: 88px;

        bottom: 116px;
      }

      .username {
        font-size: 23px;
      }

      .caption,
      .tagline {
        font-size: 19px;
      }

      .hashtags {
        font-size: 17px;
      }

      .music-button {
        right: 10px;
        bottom: 91px;

        width: 54px;
        height: 54px;
      }

      .bottom-nav {
        height: 76px;
      }

      .create-button {
        width: 142px;
      }

      .create-inner {
        width: 112px;
      }
    }

  </style>
</head>

<body>

<div id="app">

  <!-- =====================================
       FEED
       ===================================== -->

  <main id="feed">

    <!-- VIDEO 1 -->

    <section class="video-card">

      <video
        class="video"
        src=""
        loop
        muted
        playsinline
        preload="metadata">
      </video>

      <!-- TOP -->

      <div class="top-bar">

        <div class="tabs">

          <button class="tab">
            LIVE
          </button>

          <button class="tab">
            Following
          </button>

          <button class="tab active">
            For You
          </button>

        </div>

        <button class="search-button">
          <span class="search-icon"></span>
        </button>

      </div>


      <!-- RIGHT ACTIONS -->

      <div class="video-actions">

        <button class="action-button profile-action">

          <div class="avatar">
            Z
          </div>

          <div class="follow-plus">
            +
          </div>

          <span class="action-label">
            Follow
          </span>

        </button>


        <button class="action-button like-button">

          <div class="action-icon heart-icon">
            ♡
          </div>

          <span class="action-label">
            0
          </span>

        </button>


        <button class="action-button">

          <div class="action-icon comment-icon"></div>

          <span class="action-label">
            0
          </span>

        </button>


        <button class="action-button">

          <div class="action-icon save-icon"></div>

          <span class="action-label">
            Save
          </span>

        </button>


        <button class="action-button">

          <div class="action-icon share-icon"></div>

          <span class="action-label">
            Share
          </span>

        </button>

      </div>


      <!-- MUSIC -->

      <button class="music-button">

        <span class="music-note">
          ♪
        </span>

      </button>


      <!-- VIDEO INFO -->

      <div class="video-info">

        <div class="username">

          @zylo_creator

          <span class="verified">
            ✓
          </span>

        </div>


        <div class="caption">
          Welcome to ZYLO 🌎
        </div>


        <div class="tagline">
          Create • Connect • Grow
        </div>


        <div class="hashtags">
          #ZYLO #Create #Connect #Grow #ForYou
        </div>


        <div class="sound">

          <span class="sound-note">
            ♪
          </span>

          <span>
            Original sound - ZYLO
          </span>

        </div>

      </div>

    </section>

  </main>


  <!-- =====================================
       BOTTOM NAVIGATION
       ===================================== -->

  <nav class="bottom-nav">

    <button class="nav-button">

      <span class="nav-icon">
        ⌂
      </span>

      <span class="nav-label">
        Home
      </span>

    </button>


    <button class="nav-button">

      <span class="nav-icon">
        ⌕
      </span>

      <span class="nav-label">
        Discover
      </span>

    </button>


    <button
      class="create-button"
      id="createButton">

      <span class="create-inner">
        +
      </span>

    </button>


    <button class="nav-button">

      <span class="nav-icon">
        ▱
      </span>

      <span class="nav-label">
        Inbox
      </span>

    </button>


    <button class="nav-button">

      <span class="nav-icon">
        ♙
      </span>

      <span class="nav-label">
        Profile
      </span>

    </button>

  </nav>


  <!-- Hidden upload -->

  <input
    type="file"
    id="videoInput"
    accept="video/*">

</div>


<script>

  /* =========================================
     ZYLO VIDEO PLAY / PAUSE
     ========================================= */

  const feed =
    document.getElementById("feed");

  const videos =
    document.querySelectorAll(".video");


  /* Tap video = Play / Pause */

  document.addEventListener("click", function(event) {

    const video =
      event.target.closest(".video");

    if (!video) {
      return;
    }

    if (video.paused) {

      video.play().catch(() => {});

    } else {

      video.pause();

    }

  });


  /* =========================================
     AUTO PLAY WHEN VIDEO IS VISIBLE
     ========================================= */

  const observer =
    new IntersectionObserver(

      entries => {

        entries.forEach(entry => {

          const video =
            entry.target;

          if (entry.isIntersecting) {

            video.muted = true;

            video.play().catch(() => {});

          } else {

            video.pause();

          }

        });

      },

      {
        threshold: 0.75
      }

    );


  videos.forEach(video => {

    observer.observe(video);

  });


  /* =========================================
     LIKE
     ========================================= */

  document.addEventListener("click", function(event) {

    const button =
      event.target.closest(".like-button");

    if (!button) {
      return;
    }

    const icon =
      button.querySelector(".heart-icon");

    if (icon.textContent.trim() === "♡") {

      icon.textContent = "♥";

    } else {

      icon.textContent = "♡";

    }

  });


  /* =========================================
     CREATE / UPLOAD
     ========================================= */

  const createButton =
    document.getElementById("createButton");

  const videoInput =
    document.getElementById("videoInput");


  createButton.addEventListener(
    "click",
    function() {

      videoInput.click();

    }
  );


  /* =========================================
     VIDEO SELECTION
     ========================================= */

  videoInput.addEventListener(
    "change",
    function() {

      const file =
        videoInput.files[0];

      if (!file) {
        return;
      }

      const localURL =
        URL.createObjectURL(file);

      const firstVideo =
        document.querySelector(".video");

      firstVideo.src =
        localURL;

      firstVideo.load();

      firstVideo.play().catch(() => {});

    }
  );

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>ZYLO — Create • Connect • Grow</title>

    <meta
        name="description"
        content="ZYLO — Create • Connect • Grow"
    >

    <link rel="stylesheet" href="./style.css?v=1006">
</head>

<body>

<div id="app">

    <!-- =========================
         TOP BAR
         ========================= -->

    <header class="top-bar">

        <div class="top-tabs">

            <button
                class="top-tab live-tab"
                data-feed-tab="live"
                aria-label="LIVE"
                type="button"
            >
                LIVE
            </button>

            <button
                class="top-tab"
                data-feed-tab="following"
                aria-label="Following"
                type="button"
            >
                Following
            </button>

            <button
                class="top-tab active"
                data-feed-tab="for-you"
                aria-label="For You"
                type="button"
            >
                For You
            </button>

        </div>

        <button
            class="search-btn"
            aria-label="Search"
            type="button"
        >
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <circle
                    cx="10.8"
                    cy="10.8"
                    r="6.8"
                ></circle>

                <path d="M16 16L21 21"></path>
            </svg>
        </button>

    </header>


    <!-- =========================
         VIDEO FEED
         ========================= -->

    <main class="video-feed">

        <!-- =========================
             VIDEO 1
             ========================= -->

        <section
            class="video-page"
            data-video-id="video1"
            data-creator-uid="zylo_creator"
            data-creator-username="zylo_creator"
            data-title="Welcome to ZYLO"
        >

            <video
                id="video-video1"
                src="./backend/uploads/video1.mp4"
                autoplay
                muted
                playsinline
                webkit-playsinline
                preload="auto"
                disablepictureinpicture
                controlslist="nodownload noplaybackrate"
            ></video>

            <div class="video-overlay"></div>


            <!-- FULLSCREEN -->

            <button
                class="fullscreen-btn"
                aria-label="Fullscreen"
                type="button"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M8 3H3v5"></path>
                    <path d="M16 3h5v5"></path>
                    <path d="M8 21H3v-5"></path>
                    <path d="M21 16v5h-5"></path>
                </svg>
            </button>


            <!-- RIGHT ACTIONS -->

            <div class="right-actions">

                <button
                    class="profile-action"
                    aria-label="Profile"
                    type="button"
                >
                    <span class="profile-circle">
                        Z
                    </span>

                    <span class="follow-badge">
                        +
                    </span>
                </button>


                <button
                    class="action-btn like-btn"
                    aria-label="Like"
                    type="button"
                >
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M20.8 8.8c0 5.2-8.8 11-8.8 11S3.2 14 3.2 8.8A5 5 0 0 1 12 5.4a5 5 0 0 1 8.8 3.4Z"></path>
                    </svg>

                    <span class="action-count">
                        0
                    </span>
                </button>


                <button
                    class="action-btn comment-btn"
                    aria-label="Comments"
                    type="button"
                >
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H8l-4 2v-4.2A7.5 7.5 0 1 1 20 11.5Z"></path>
                    </svg>

                    <span class="action-count">
                        0
                    </span>
                </button>


                <button
                    class="action-btn save-btn"
                    aria-label="Save"
                    type="button"
                >
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M6 4.5A2.5 2.5 0 0 1 8.5 2h7A2.5 2.5 0 0 1 18 4.5V22l-6-3.8L6 22V4.5Z"></path>
                    </svg>

                    <span class="action-label">
                        Save
                    </span>
                </button>


                <button
                    class="action-btn share-btn"
                    aria-label="Share"
                    type="button"
                >
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M21 3 10.5 13.5"></path>
                        <path d="M21 3 14.3 21 10.5 13.5 3 9.7 21 3Z"></path>
                    </svg>

                    <span class="action-label">
                        Share
                    </span>
                </button>


                <button
                    class="music-btn"
                    aria-label="Music"
                    type="button"
                >
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <circle
                            cx="12"
                            cy="12"
                            r="8"
                        ></circle>

                        <circle
                            cx="12"
                            cy="12"
                            r="2"
                        ></circle>
                    </svg>

                    <span>
                        Music
                    </span>
                </button>

            </div>


            <!-- VIDEO INFO -->

            <div class="video-info">

                <div class="username">
                    @zylo_creator
                </div>

                <div class="caption">
                    Welcome to ZYLO 🌎
                </div>

                <div class="tagline">
                    Create • Connect • Grow
                </div>

                <div class="hashtags">
                    #ZYLO #ShortVideo #Create
                </div>

                <div class="music-info">
                    Original sound • ZYLO Creator
                </div>

            </div>

        </section>


        <!-- =========================
             VIDEO 2
             ========================= -->

        <section
            class="video-page"
            data-video-id="video2"
            data-creator-uid="zylo_creator"
            data-creator-username="zylo_creator"
            data-title="ZYLO Short Video"
        >

            <video
                id="video-video2"
                src="./backend/uploads/video1.mp4"
                autoplay
                muted
                playsinline
                webkit-playsinline
                preload="auto"
                disablepictureinpicture
                controlslist="nodownload noplaybackrate"
            ></video>

            <div class="video-overlay"></div>


            <!-- FULLSCREEN -->

            <button
                class="fullscreen-btn"
                aria-label="Fullscreen"
                type="button"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M8 3H3v5"></path>
                    <path d="M16 3h5v5"></path>
                    <path d="M8 21H3v-5"></path>
                    <path d="M21 16v5h-5"></path>
                </svg>
            </button>


            <!-- RIGHT ACTIONS -->

            <div class="right-actions">

                <button
                    class="profile-action"
                    aria-label="Profile"
                    type="button"
                >
                    <span class="profile-circle">
                        Z
                    </span>

                    <span class="follow-badge">
                        +
                    </span>
                </button>


                <button
                    class="action-btn like-btn"
                    aria-label="Like"
                    type="button"
                >
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M20.8 8.8c0 5.2-8.8 11-8.8 11S3.2 14 3.2 8.8A5 5 0 0 1 12 5.4a5 5 0 0 1 8.8 3.4Z"></path>
                    </svg>

                    <span class="action-count">
                        0
                    </span>
                </button>


                <button
                    class="action-btn comment-btn"
                    aria-label="Comments"
                    type="button"
                >
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H8l-4 2v-4.2A7.5 7.5 0 1 1 20 11.5Z"></path>
                    </svg>

                    <span class="action-count">
                        0
                    </span>
                </button>


                <button
                    class="action-btn save-btn"
                    aria-label="Save"
                    type="button"
                >
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M6 4.5A2.5 2.5 0 0 1 8.5 2h7A2.5 2.5 0 0 1 18 4.5V22l-6-3.8L6 22V4.5Z"></path>
                    </svg>

                    <span class="action-label">
                        Save
                    </span>
                </button>


                <button
                    class="action-btn share-btn"
                    aria-label="Share"
                    type="button"
                >
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M21 3 10.5 13.5"></path>
                        <path d="M21 3 14.3 21 10.5 13.5 3 9.7 21 3Z"></path>
                    </svg>

                    <span class="action-label">
                        Share
                    </span>
                </button>


                <button
                    class="music-btn"
                    aria-label="Music"
                    type="button"
                >
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <circle
                            cx="12"
                            cy="12"
                            r="8"
                        ></circle>

                        <circle
                            cx="12"
                            cy="12"
                            r="2"
                        ></circle>
                    </svg>

                    <span>
                        Music
                    </span>
                </button>

            </div>


            <!-- VIDEO INFO -->

            <div class="video-info">

                <div class="username">
                    @zylo_creator
                </div>

                <div class="caption">
                    Welcome to ZYLO 🌎
                </div>

                <div class="tagline">
                    Create • Connect • Grow
                </div>

                <div class="hashtags">
                    #ZYLO #ShortVideo #Create
                </div>

                <div class="music-info">
                    Original sound • ZYLO Creator
                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         BOTTOM NAV
         ========================= -->

    <nav class="bottom-nav">

        <button
            class="nav-item active"
            data-nav="home"
            aria-label="Home"
            type="button"
        >
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="M3 10.5 12 3l9 7.5"></path>
                <path d="M5 9.5V21h14V9.5"></path>
            </svg>

            <span>
                Home
            </span>
        </button>


        <button
            class="nav-item"
            data-nav="discover"
            aria-label="Discover"
            type="button"
        >
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <circle
                    cx="12"
                    cy="12"
                    r="9"
                ></circle>

                <path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8 4.8-2.2Z"></path>
            </svg>

            <span>
                Discover
            </span>
        </button>


        <button
            id="createBtn"
            class="create-btn"
            aria-label="Create"
            type="button"
        >

            <span class="create-left"></span>

            <span class="create-center">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M12 5v14"></path>
                    <path d="M5 12h14"></path>
                </svg>

            </span>

            <span class="create-right"></span>

        </button>


        <button
            class="nav-item"
            data-nav="inbox"
            aria-label="Inbox"
            type="button"
        >
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="M4 5h16v14H4z"></path>
                <path d="M4 15h5l2 2h2l2-2h5"></path>
            </svg>

            <span>
                Inbox
            </span>
        </button>


        <button
            class="nav-item"
            data-nav="profile"
            aria-label="Profile"
            type="button"
        >
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <circle
                    cx="12"
                    cy="8"
                    r="4"
                ></circle>

                <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path>
            </svg>

            <span>
                Profile
            </span>
        </button>

    </nav>


    <!-- =========================
         SINGLE FILE INPUT
         ========================= -->

    <input
        id="videoInput"
        type="file"
        accept="video/*"
        hidden
    >


    <!-- =========================
         UPLOAD MODAL
         ========================= -->

    <div
        id="uploadBox"
        class="upload-box"
        hidden
    >

        <div class="upload-modal">

            <button
                id="closeUpload"
                class="close-upload"
                type="button"
                aria-label="Close"
            >
                ×
            </button>


            <div class="upload-title">
                Create Video
            </div>


            <button
                id="selectVideo"
                class="upload-select"
                type="button"
            >
                
                Select Video
            </button>


            <div
                id="uploadPreview"
                class="upload-preview"
                hidden
            >

                <video
                    id="uploadPreviewVideo"
                    controls
                    playsinline
                ></video>

            </div>


            <div class="upload-actions">

                <button
                    id="uploadCancel"
                    type="button"
                >
                    Cancel
                </button>

                <button
                    id="uploadPost"
                    type="button"
                >
                    Post
                </button>

            </div>


            <div
                id="uploadStatus"
                class="upload-status"
                aria-live="polite"
            ></div>

        </div>

    </div>

</div>


<!-- =========================
     ZYLO FRONTEND SCRIPT
     ========================= -->

<script src="./script.js?v=1017"></script>

</body>
</html>

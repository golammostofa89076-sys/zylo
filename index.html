<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<title>ZYLO</title>

<style>

/* ==================================================
   ZYLO - FULL SCREEN SHORT VIDEO FEED
   ================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  position:fixed;
  inset:0;
}

/* ==================================================
   APP
   ================================================== */

#app{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  height:100dvh;
  background:#000;
  overflow:hidden;
}

/* ==================================================
   FEED
   ================================================== */

#feed{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  height:100dvh;

  overflow-y:auto;
  overflow-x:hidden;

  scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;

  background:#000;

  overscroll-behavior-y:contain;
}

#feed::-webkit-scrollbar{
  display:none;
}

/* ==================================================
   VIDEO CARD
   ================================================== */

.video-card{
  position:relative;

  width:100%;
  height:100vh;
  height:100dvh;

  min-height:100vh;
  min-height:100dvh;

  flex:none;

  background:#000;

  overflow:hidden;

  scroll-snap-align:start;
  scroll-snap-stop:always;
}

/* ==================================================
   VIDEO
   ================================================== */

.video-card video{
  position:absolute;

  inset:0;

  display:block;

  width:100%;
  height:100%;

  min-width:100%;
  min-height:100%;

  object-fit:cover;
  object-position:center center;

  background:#000;

  z-index:1;
}

/* ==================================================
   VIDEO DARK GRADIENT
   ================================================== */

.video-card::after{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  z-index:2;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.35) 0%,
      rgba(0,0,0,0) 22%,
      rgba(0,0,0,0) 60%,
      rgba(0,0,0,.78) 100%
    );
}

/* ==================================================
   VIDEO ERROR
   ================================================== */

.video-error{
  position:absolute;

  inset:0;

  z-index:4;

  display:none;

  align-items:center;
  justify-content:center;

  flex-direction:column;

  gap:10px;

  text-align:center;

  background:#050505;

  color:#fff;

  padding:30px;
}

.video-error strong{
  font-size:20px;
}

.video-error span{
  color:#aaa;
  font-size:14px;
}

/* ==================================================
   TOP BAR
   ================================================== */

.top-bar{
  position:absolute;

  top:0;
  left:0;
  right:0;

  height:85px;

  padding-top:env(safe-area-inset-top);

  display:flex;
  align-items:flex-end;
  justify-content:center;

  z-index:20;
}

.tabs{
  display:flex;

  align-items:center;
  justify-content:center;

  gap:30px;

  padding-bottom:12px;
}

.tab{
  position:relative;

  border:0;
  outline:0;

  background:none;

  color:rgba(255,255,255,.65);

  font-size:18px;
  font-weight:500;

  padding:7px 0;
}

.tab.active{
  color:#fff;
  font-weight:700;
}

.tab.active::after{
  content:"";

  position:absolute;

  left:0;
  right:0;

  bottom:-7px;

  height:3px;

  border-radius:10px;

  background:#fff;
}

/* ==================================================
   SEARCH
   ================================================== */

.search-button{
  position:absolute;

  top:calc(12px + env(safe-area-inset-top));
  right:12px;

  width:50px;
  height:50px;

  border:0;
  border-radius:50%;

  background:rgba(25,25,25,.85);

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:30;
}

.search-icon{
  position:relative;

  width:23px;
  height:23px;

  border:3px solid #fff;

  border-radius:50%;
}

.search-icon::after{
  content:"";

  position:absolute;

  width:11px;
  height:3px;

  right:-8px;
  bottom:-4px;

  background:#fff;

  border-radius:5px;

  transform:rotate(45deg);
}

/* ==================================================
   RIGHT ACTIONS
   ================================================== */

.video-actions{
  position:absolute;

  right:8px;

  top:50%;

  transform:translateY(-36%);

  width:64px;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:10px;

  z-index:15;
}

.action{
  width:58px;
  min-height:55px;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:3px;

  color:#fff;

  background:none;

  border:0;
  outline:0;
}

.action-label{
  color:#fff;

  font-size:12px;

  line-height:15px;

  text-shadow:
    0 1px 3px #000;

  white-space:nowrap;
}

/* ==================================================
   AVATAR
   ================================================== */

.profile-action{
  margin-bottom:4px;
}

.avatar{
  position:relative;

  width:56px;
  height:56px;

  border-radius:50%;

  border:2px solid #fff;

  background:#111;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:30px;
  font-weight:bold;

  box-shadow:
    0 2px 8px rgba(0,0,0,.5);
}

.plus{
  position:absolute;

  right:-7px;
  bottom:-5px;

  width:24px;
  height:24px;

  border-radius:50%;

  background:#ff1760;

  border:2px solid #fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:17px;
  font-weight:bold;
}

/* ==================================================
   LIKE
   ================================================== */

.action-icon{
  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:34px;

  color:#fff;

  text-shadow:
    0 1px 4px #000;
}

.heart-icon{
  font-size:39px;

  font-family:Arial,sans-serif;
}

.like-button.liked .heart-icon{
  color:#ff174f;
}

/* ==================================================
   COMMENT
   ================================================== */

.comment-icon{
  position:relative;

  width:34px;
  height:28px;

  border:3px solid #fff;

  border-radius:8px;
}

.comment-icon::after{
  content:"";

  position:absolute;

  left:3px;
  bottom:-8px;

  width:10px;
  height:10px;

  border-left:3px solid #fff;

  transform:skew(-25deg);
}

/* ==================================================
   SAVE
   ================================================== */

.bookmark-icon{
  position:relative;

  width:29px;
  height:37px;

  border:3px solid #fff;

  border-bottom:0;
}

.bookmark-icon::after{
  content:"";

  position:absolute;

  left:2px;
  right:2px;

  bottom:-6px;

  height:12px;

  background:#000;

  border-left:3px solid #fff;
  border-bottom:3px solid #fff;

  transform:rotate(-45deg);
}

/* ==================================================
   SHARE
   ================================================== */

.share-icon{
  position:relative;

  width:35px;
  height:32px;
}

.share-icon::before{
  content:"";

  position:absolute;

  left:3px;
  top:9px;

  width:25px;
  height:15px;

  border-top:3px solid #fff;

  transform:rotate(-20deg);
}

.share-icon::after{
  content:"";

  position:absolute;

  right:0;
  top:1px;

  width:0;
  height:0;

  border-top:13px solid transparent;
  border-bottom:13px solid transparent;
  border-left:22px solid #fff;

  transform:rotate(-20deg);
}

/* ==================================================
   MUSIC
   ================================================== */

.music-button{
  width:52px;
  height:52px;

  border-radius:50%;

  background:#111;

  border:2px solid rgba(255,255,255,.45);

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
    0 0 0 5px rgba(255,255,255,.04);

  color:#fff;
}

.music-note{
  font-size:27px;
}

/* ==================================================
   VIDEO INFO
   ================================================== */

.video-info{
  position:absolute;

  left:18px;
  right:90px;

  bottom:86px;

  z-index:10;

  text-shadow:
    0 1px 3px rgba(0,0,0,.9);
}

.username{
  display:flex;
  align-items:center;

  gap:7px;

  font-size:19px;
  font-weight:700;

  margin-bottom:9px;
}

.verified{
  width:23px;
  height:23px;

  border-radius:50%;

  background:#20c9e8;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:14px;
  font-weight:bold;
}

.caption{
  font-size:17px;

  line-height:1.35;

  margin-bottom:6px;
}

.tagline{
  font-size:16px;

  margin-bottom:6px;
}

.hashtags{
  color:#39d4f0;

  font-size:15px;

  line-height:1.4;

  margin-bottom:8px;
}

.sound{
  display:flex;
  align-items:center;

  gap:7px;

  font-size:14px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.sound-note{
  font-size:20px;
}

/* ==================================================
   BOTTOM NAVIGATION
   ================================================== */

.bottom-nav{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:72px;

  padding-bottom:env(safe-area-inset-bottom);

  background:rgba(0,0,0,.94);

  border-top:1px solid rgba(255,255,255,.12);

  display:flex;

  align-items:center;
  justify-content:space-around;

  z-index:50;
}

.nav-item{
  width:20%;
  height:100%;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:4px;

  color:#fff;

  background:none;

  border:0;
  outline:0;

  font-size:11px;
}

.nav-icon{
  width:28px;
  height:28px;

  display:flex;
  align-items:center;
  justify-content:center;
}

/* HOME */

.home-icon{
  position:relative;

  width:25px;
  height:22px;

  border:3px solid #fff;

  border-top:0;

  margin-top:5px;
}

.home-icon::before{
  content:"";

  position:absolute;

  width:17px;
  height:17px;

  border-left:3px solid #fff;
  border-top:3px solid #fff;

  transform:rotate(45deg);

  left:1px;
  top:-9px;
}

/* DISCOVER */

.nav-search{
  position:relative;

  width:24px;
  height:24px;

  border:3px solid #fff;

  border-radius:50%;
}

.nav-search::after{
  content:"";

  position:absolute;

  width:10px;
  height:3px;

  background:#fff;

  right:-8px;
  bottom:-4px;

  transform:rotate(45deg);

  border-radius:3px;
}

/* INBOX */

.inbox-icon{
  position:relative;

  width:28px;
  height:22px;

  border:3px solid #fff;

  border-radius:4px;
}

.inbox-icon::after{
  content:"";

  position:absolute;

  left:5px;
  right:5px;
  bottom:2px;

  height:7px;

  border-bottom:3px solid #fff;

  transform:skewY(-12deg);
}

/* PROFILE */

.profile-icon{
  position:relative;

  width:28px;
  height:29px;
}

.profile-icon::before{
  content:"";

  position:absolute;

  top:0;
  left:6px;

  width:12px;
  height:12px;

  border:3px solid #fff;

  border-radius:50%;
}

.profile-icon::after{
  content:"";

  position:absolute;

  bottom:0;
  left:0;

  width:25px;
  height:13px;

  border:3px solid #fff;

  border-bottom:0;

  border-radius:20px 20px 0 0;
}

/* ==================================================
   CREATE BUTTON
   ================================================== */

.create-wrap{
  width:20%;

  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;
}

.create-button{
  position:relative;

  width:70px;
  height:44px;

  border:0;
  border-radius:11px;

  background:#fff;

  color:#000;

  font-size:30px;
  font-weight:400;

  display:flex;
  align-items:center;
  justify-content:center;
}

.create-button::before{
  content:"";

  position:absolute;

  left:-6px;
  top:0;

  width:12px;
  height:44px;

  background:#20d9e5;

  border-radius:10px 0 0 10px;

  z-index:-1;
}

.create-button::after{
  content:"";

  position:absolute;

  right:-6px;
  top:0;

  width:12px;
  height:44px;

  background:#ff1760;

  border-radius:0 10px 10px 0;

  z-index:-1;
}

/* ==================================================
   CREATE SCREEN
   ================================================== */

#createScreen{
  position:fixed;

  inset:0;

  z-index:200;

  display:none;

  overflow-y:auto;

  background:#000;
}

#createScreen.open{
  display:block;
}

.create-header{
  height:60px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 18px;

  border-bottom:1px solid #222;

  font-size:20px;
  font-weight:bold;
}

.close-create{
  width:40px;
  height:40px;

  border:0;

  background:none;

  color:#fff;

  font-size:32px;
}

.create-content{
  padding:20px;
}

.upload-box{
  width:100%;
  height:240px;

  border:2px dashed #555;

  border-radius:15px;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:12px;

  margin-bottom:20px;
}

.upload-icon{
  font-size:50px;
}

.upload-text{
  font-size:18px;
}

.file-input{
  display:none;
}

.preview{
  width:100%;

  max-height:420px;

  border-radius:14px;

  object-fit:contain;

  background:#111;

  display:none;
}

.caption-input{
  width:100%;

  min-height:100px;

  margin-top:15px;

  padding:14px;

  resize:none;

  background:#111;

  color:#fff;

  border:1px solid #333;

  border-radius:12px;

  font-size:17px;
}

.post-button{
  width:100%;
  height:52px;

  margin-top:15px;

  border:0;
  border-radius:10px;

  background:#fff;

  color:#000;

  font-size:18px;
  font-weight:bold;
}

.post-button:disabled{
  opacity:.55;
}

.status{
  margin-top:15px;

  text-align:center;

  color:#aaa;

  font-size:15px;
}

/* ==================================================
   MOBILE
   ================================================== */

@media(max-width:600px){

  .tabs{
    gap:26px;
  }

  .tab{
    font-size:17px;
  }

  .video-actions{
    right:5px;
    transform:translateY(-35%);
    gap:8px;
  }

  .video-info{
    left:16px;
    right:82px;
    bottom:82px;
  }

  .username{
    font-size:18px;
  }

  .caption{
    font-size:16px;
  }

  .tagline{
    font-size:15px;
  }

  .hashtags{
    font-size:14px;
  }

  .sound{
    font-size:13px;
  }

  .bottom-nav{
    height:72px;
  }

  .create-button{
    width:68px;
    height:43px;
  }

  .create-button::before,
  .create-button::after{
    height:43px;
  }
}

</style>

</head>

<body>

<div id="app">

  <!-- ==================================================
       FEED
       ================================================== -->

  <main id="feed">

    <!-- ================= FIRST VIDEO ================= -->

    <section class="video-card">

      <video
        class="video"
        src="uploads/video1.mp4"
        loop
        muted
        playsinline
        webkit-playsinline
        preload="auto">
      </video>

      <div class="video-error">
        <strong>ভিডিও পাওয়া যায়নি</strong>
        <span>uploads/video1.mp4 ফাইলটি GitHub-এ আছে কিনা দেখুন।</span>
      </div>

      <!-- TOP -->

      <div class="top-bar">

        <div class="tabs">

          <button class="tab">
            LIVE
          </button>

          <button class="tab">
            Following
          </button>

          <button class="tab active">
            For You
          </button>

        </div>

        <button
          class="search-button"
          aria-label="Search">

          <span class="search-icon"></span>

        </button>

      </div>

      <!-- RIGHT ACTIONS -->

      <div class="video-actions">

        <button class="action profile-action">

          <div class="avatar">

            Z

            <span class="plus">+</span>

          </div>

          <span class="action-label">
            Follow
          </span>

        </button>

        <button class="action like-button">

          <span class="action-icon heart-icon">
            ♡
          </span>

          <span class="action-label like-count">
            0
          </span>

        </button>

        <button class="action comment-button">

          <span class="comment-icon"></span>

          <span class="action-label">
            0
          </span>

        </button>

        <button class="action save-button">

          <span class="bookmark-icon"></span>

          <span class="action-label">
            Save
          </span>

        </button>

        <button class="action share-button">

          <span class="share-icon"></span>

          <span class="action-label">
            Share
          </span>

        </button>

        <button class="music-button">

          <span class="music-note">
            ♪
          </span>

        </button>

      </div>

      <!-- INFO -->

      <div class="video-info">

        <div class="username">

          @zylo_creator

          <span class="verified">
            ✓
          </span>

        </div>

        <div class="caption">
          Welcome to ZYLO 🌎
        </div>

        <div class="tagline">
          Create • Connect • Grow
        </div>

        <div class="hashtags">
          #ZYLO #Create #Connect #Grow #ForYou
        </div>

        <div class="sound">

          <span class="sound-note">
            ♪
          </span>

          <span>
            Original sound - ZYLO
          </span>

        </div>

      </div>

    </section>

  </main>


  <!-- ==================================================
       BOTTOM NAVIGATION
       ================================================== -->

  <nav class="bottom-nav">

    <button class="nav-item">

      <span class="nav-icon">
        <span class="home-icon"></span>
      </span>

      <span>Home</span>

    </button>


    <button class="nav-item">

      <span class="nav-icon">
        <span class="nav-search"></span>
      </span>

      <span>Discover</span>

    </button>


    <div class="create-wrap">

      <button
        id="createButton"
        class="create-button">

        +

      </button>

    </div>


    <button class="nav-item">

      <span class="nav-icon">
        <span class="inbox-icon"></span>
      </span>

      <span>Inbox</span>

    </button>


    <button class="nav-item">

      <span class="nav-icon">
        <span class="profile-icon"></span>
      </span>

      <span>Profile</span>

    </button>

  </nav>

</div>


<!-- ==================================================
     CREATE / UPLOAD SCREEN
     ================================================== -->

<div id="createScreen">

  <div class="create-header">

    <button
      id="closeCreate"
      class="close-create">

      ×

    </button>

    <span>
      Create
    </span>

    <span style="width:40px;"></span>

  </div>


  <div class="create-content">

    <label
      class="upload-box"
      for="videoInput">

      <div class="upload-icon">
        ＋
      </div>

      <div class="upload-text">
        Choose a video
      </div>

    </label>


    <input
      id="videoInput"
      class="file-input"
      type="file"
      accept="video/*">


    <video
      id="previewVideo"
      class="preview"
      controls
      playsinline>
    </video>


    <textarea
      id="captionInput"
      class="caption-input"
      placeholder="Write a caption...">
    </textarea>


    <button
      id="postButton"
      class="post-button">

      Post

    </button>


    <div
      id="uploadStatus"
      class="status">
    </div>

  </div>

</div>


<script>

/* ==================================================
   ZYLO FRONTEND
   ================================================== */

const feed =
  document.getElementById("feed");

const createButton =
  document.getElementById("createButton");

const createScreen =
  document.getElementById("createScreen");

const closeCreate =
  document.getElementById("closeCreate");

const videoInput =
  document.getElementById("videoInput");

const previewVideo =
  document.getElementById("previewVideo");

const captionInput =
  document.getElementById("captionInput");

const postButton =
  document.getElementById("postButton");

const uploadStatus =
  document.getElementById("uploadStatus");


/* ==================================================
   CREATE SCREEN
   ================================================== */

createButton.addEventListener(
  "click",
  () => {

    createScreen.classList.add("open");

  }
);


closeCreate.addEventListener(
  "click",
  () => {

    createScreen.classList.remove("open");

  }
);


/* ==================================================
   VIDEO SELECT
   ================================================== */

let selectedVideo = null;

videoInput.addEventListener(
  "change",
  () => {

    const file =
      videoInput.files[0];

    if(!file){
      return;
    }

    selectedVideo = file;

    const url =
      URL.createObjectURL(file);

    previewVideo.src = url;

    previewVideo.style.display =
      "block";

    uploadStatus.textContent =
      "ভিডিও প্রস্তুত। Post চাপুন।";

  }
);


/* ==================================================
   HTML ESCAPE
   ================================================== */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* ==================================================
   SAVE FEED VIDEOS
   ================================================== */

function getSavedVideos(){

  try{

    const saved =
      localStorage.getItem(
        "zylo_feed_videos"
      );

    if(!saved){
      return [];
    }

    const parsed =
      JSON.parse(saved);

    return Array.isArray(parsed)
      ? parsed
      : [];

  }catch(error){

    return [];

  }

}


function saveFeedVideos(videos){

  try{

    localStorage.setItem(
      "zylo_feed_videos",
      JSON.stringify(videos)
    );

  }catch(error){

    console.log(
      "Could not save feed"
    );

  }

}

/* ==================================================
   VIDEO ERROR
   ================================================== */

function setupVideo(card){

  const video =
    card.querySelector("video");

  const errorBox =
    card.querySelector(".video-error");

  if(!video){
    return;
  }


  video.addEventListener(
    "error",
    () => {

      if(errorBox){

        errorBox.style.display =
          "flex";

      }

    }
  );


  video.addEventListener(
    "loadeddata",
    () => {

      if(errorBox){

        errorBox.style.display =
          "none";

      }

    }
  );


  /* TAP VIDEO = PLAY / PAUSE */

  video.addEventListener(
    "click",
    () => {

      if(video.paused){

        video.play().catch(()=>{});

      }else{

        video.pause();

      }

    }
  );

}


/* ==================================================
   INTERSECTION OBSERVER
   ================================================== */

const observer =
  new IntersectionObserver(
    entries => {

      entries.forEach(
        entry => {

          const card =
            entry.target;

          const video =
            card.querySelector(
              "video"
            );

          if(!video){
            return;
          }


          if(entry.isIntersecting){

            /* Pause every other video */

            document
              .querySelectorAll(
                "#feed video"
              )
              .forEach(
                otherVideo => {

                  if(
                    otherVideo !== video
                  ){

                    otherVideo.pause();

                  }

                }
              );


            /* Play current */

            video
              .play()
              .catch(()=>{});


          }else{

            video.pause();

          }

        }
      );

    },
    {
      threshold:0.70
    }
  );


/* ==================================================
   INITIAL VIDEO SETUP
   ================================================== */

document
  .querySelectorAll(
    ".video-card"
  )
  .forEach(
    card => {

      setupVideo(card);

      observer.observe(card);

    }
  );


/* ==================================================
   LIKE
   ================================================== */

document.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        ".like-button"
      );

    if(!button){
      return;
    }


    const count =
      button.querySelector(
        ".like-count"
      );

    let number =
      Number(
        count.textContent
      ) || 0;


    const liked =
      button.classList.contains(
        "liked"
      );


    if(liked){

      number--;

      button.classList.remove(
        "liked"
      );

      button.querySelector(
        ".heart-icon"
      ).textContent = "♡";

    }else{

      number++;

      button.classList.add(
        "liked"
      );

      button.querySelector(
        ".heart-icon"
      ).textContent = "♥";

    }


    count.textContent =
      Math.max(
        0,
        number
      );

  }
);


/* ==================================================
   SAVE BUTTON
   ================================================== */

document.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        ".save-button"
      );

    if(!button){
      return;
    }


    const label =
      button.querySelector(
        ".action-label"
      );


    if(
      button.dataset.saved ===
      "true"
    ){

      button.dataset.saved =
        "false";

      label.textContent =
        "Save";

    }else{

      button.dataset.saved =
        "true";

      label.textContent =
        "Saved";

    }

  }
);


/* ==================================================
   SHARE BUTTON
   ================================================== */

document.addEventListener(
  "click",
  async event => {

    const button =
      event.target.closest(
        ".share-button"
      );

    if(!button){
      return;
    }


    try{

      if(
        navigator.share
      ){

        await navigator.share({
          title:"ZYLO",
          text:"Check out this video on ZYLO 🌎",
          url:window.location.href
        });

      }else{

        await navigator.clipboard.writeText(
          window.location.href
        );

        const label =
          button.querySelector(
            ".action-label"
          );

        label.textContent =
          "Copied";

        setTimeout(
          () => {

            label.textContent =
              "Share";

          },
          1500
        );

      }

    }catch(error){

      console.log(
        "Share cancelled"
      );

    }

  }
);


/* ==================================================
   MUSIC BUTTON
   ================================================== */

document.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        ".music-button"
      );

    if(!button){
      return;
    }


    const card =
      button.closest(
        ".video-card"
      );

    if(!card){
      return;
    }


    const video =
      card.querySelector(
        "video"
      );

    if(!video){
      return;
    }


    video.muted =
      !video.muted;


    button.querySelector(
      ".music-note"
    ).textContent =
      video.muted
        ? "♪"
        : "🔊";

  }
);


/* ==================================================
   POST / UPLOAD
   ================================================== */

postButton.addEventListener(
  "click",
  async () => {

    if(!selectedVideo){

      uploadStatus.textContent =
        "আগে একটি ভিডিও নির্বাচন করুন।";

      return;

    }


    postButton.disabled =
      true;

    postButton.textContent =
      "Uploading...";

    uploadStatus.textContent =
      "ভিডিও আপলোড হচ্ছে...";


    try{

      const formData =
        new FormData();


      formData.append(
        "video",
        selectedVideo
      );


      const response =
        await fetch(
          "https://zylo-backend-ec5c.onrender.com/api/upload",
          {
            method:"POST",
            body:formData
          }
        );


      const data =
        await response.json();


      if(
        !response.ok ||
        !data.success
      ){

        throw new Error(
          data.message ||
          "Upload failed"
        );

      }


      const uploadedVideo =
        data.video;


      if(
        !uploadedVideo ||
        !uploadedVideo.url
      ){

        throw new Error(
          "Backend did not return video URL"
        );

      }


      /* SAVE */

      const videos =
        getSavedVideos();


      videos.unshift({
        url:uploadedVideo.url,
        caption:captionInput.value,
        username:"@zylo_creator"
      });


      saveFeedVideos(
        videos.slice(0,20)
      );


      /* ADD TO FEED */

      const card =
        addVideoToFeed(
          uploadedVideo.url,
          captionInput.value,
          "@zylo_creator",
          true
        );


      uploadStatus.textContent =
        "ভিডিও সফলভাবে আপলোড হয়েছে ✓";


      postButton.textContent =
        "Posted ✓";


      /* Scroll to uploaded video */

      if(card){

        setTimeout(
          () => {

            card.scrollIntoView({
              behavior:"smooth"
            });

          },
          200
        );

      }


      /* RESET */

      setTimeout(
        () => {

          createScreen.classList.remove(
            "open"
          );

          postButton.disabled =
            false;

          postButton.textContent =
            "Post";

          uploadStatus.textContent =
            "";

          captionInput.value =
            "";

          videoInput.value =
            "";

          previewVideo.src =
            "";

          previewVideo.style.display =
            "none";

          selectedVideo =
            null;

        },
        1200
      );


    }catch(error){

      console.error(error);

      uploadStatus.textContent =
        "আপলোড ব্যর্থ হয়েছে: " +
        error.message;


      postButton.disabled =
        false;

      postButton.textContent =
        "Post";

    }

  }
);


/* ==================================================
   RESTORE SAVED FEED
   ================================================== */

function restoreSavedVideos(){

  const videos =
    getSavedVideos();


  /*
    Reverse loop so newest
    video stays at the top.
  */

  for(
    let i=videos.length-1;
    i>=0;
    i--
  ){

    const item =
      videos[i];


    if(
      item &&
      item.url
    ){

      addVideoToFeed(
        item.url,
        item.caption || "",
        item.username ||
        "@zylo_creator",
        false
      );

    }

  }

}


restoreSavedVideos();

            */

        );

/* ==================================================
   VISIBILITY CHANGE
   ================================================== */

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.hidden
    ){

      document
        .querySelectorAll(
          "#feed video"
        )
        .forEach(
          video => video.pause()
        );

    }else{

      const visibleCard =
        document.querySelector(
          ".video-card"
        );


      if(visibleCard){

        const video =
          visibleCard.querySelector(
            "video"
          );

        if(video){

          video
            .play()
            .catch(()=>{});

        }

      }

    }

  }
);

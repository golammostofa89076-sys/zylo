<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>ZYLO</title>

<style>
/* =====================================================
   ZYLO — FULL TIKTOK STYLE UI
   ===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  border:0;
  outline:0;
  background:none;
  color:#fff;
}

#app{
  width:100%;
  height:100dvh;
  background:#000;
  position:relative;
  overflow:hidden;
}

/* =====================================================
   FEED
   ===================================================== */

#feed{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;
  scroll-snap-type:y mandatory;
  scrollbar-width:none;
}

#feed::-webkit-scrollbar{
  display:none;
}

.video-card{
  position:relative;
  width:100%;
  height:100dvh;
  min-height:100dvh;
  scroll-snap-align:start;
  overflow:hidden;
  background:#000;
}

/* Video */

.video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

/* Dark gradient */

.video-card::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.35) 0%,
      transparent 18%,
      transparent 58%,
      rgba(0,0,0,.08) 72%,
      rgba(0,0,0,.72) 100%
    );
}

/* =====================================================
   TOP BAR
   ===================================================== */

.top-bar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:74px;
  z-index:1000;

  display:flex;
  align-items:center;
  justify-content:center;

  pointer-events:none;
}

.tabs{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:38px;
  height:100%;
}

.tab{
  position:relative;
  color:rgba(255,255,255,.75);
  font-size:19px;
  font-weight:500;
  padding:12px 0;
  pointer-events:auto;
}

.tab.active{
  color:#fff;
  font-weight:700;
}

.tab.active::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:92%;
  height:4px;
  border-radius:4px;
  background:#fff;
}

/* Search */

.search-button{
  position:absolute;
  right:14px;
  top:16px;

  width:48px;
  height:48px;

  border-radius:50%;
  background:rgba(30,30,30,.92);

  display:flex;
  align-items:center;
  justify-content:center;

  pointer-events:auto;
}

.search-button svg{
  width:29px;
  height:29px;
  stroke:#fff;
  stroke-width:2.8;
  fill:none;
}

/* =====================================================
   RIGHT ACTIONS
   ===================================================== */

.video-actions{
  position:absolute;

  right:12px;

  /* IMPORTANT:
     keeps buttons lower and above bottom navigation */
  bottom:158px;

  width:62px;

  z-index:500;

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
}

/* Each action */

.action{
  width:58px;
  min-height:54px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  color:#fff;
  cursor:pointer;
}

/* SVG */

.action svg{
  width:34px;
  height:34px;

  stroke:#fff;
  fill:none;

  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.action span{
  margin-top:4px;

  color:#fff;

  font-size:13px;
  line-height:16px;

  text-align:center;

  text-shadow:0 1px 3px #000;
}

/* Profile */

.profile-action{
  min-height:74px;
}

.avatar{
  position:relative;

  width:56px;
  height:56px;

  border-radius:50%;

  border:2px solid #fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:27px;
  font-weight:400;

  background:#000;
}

.follow-plus{
  position:absolute;

  right:-5px;
  bottom:-5px;

  width:24px;
  height:24px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#ff2456;

  border:2px solid #fff;

  font-size:17px;
  font-weight:bold;
}

.profile-action .follow-text{
  margin-top:6px;
}

/* Like */

.like-button.liked svg{
  fill:#ff2d55;
  stroke:#ff2d55;
}

/* Save */

.save-button.saved svg{
  fill:#fff;
}

/* =====================================================
   MUSIC BUTTON
   ===================================================== */

.music-button{
  position:absolute;

  right:14px;

  /* NEVER place it inside the bottom nav */
  bottom:88px;

  width:54px;
  height:54px;

  border-radius:50%;

  z-index:550;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#111;

  border:2px solid rgba(255,255,255,.25);

  box-shadow:
    0 0 0 4px rgba(255,255,255,.06),
    0 0 0 7px rgba(255,255,255,.035);
}

.music-button svg{
  width:25px;
  height:25px;

  stroke:#fff;
  fill:none;

  stroke-width:2.2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* =====================================================
   VIDEO INFORMATION
   ===================================================== */

.video-info{
  position:absolute;

  left:24px;
  right:88px;

  bottom:124px;

  z-index:400;
}

.username{
  display:flex;
  align-items:center;

  font-size:22px;
  font-weight:700;

  margin-bottom:18px;
}

.verified{
  width:25px;
  height:25px;

  margin-left:8px;

  border-radius:50%;

  background:#22bde8;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:16px;
  font-weight:bold;
}

.caption{
  font-size:20px;
  line-height:1.35;
  margin-bottom:8px;
}

.tagline{
  font-size:20px;
  line-height:1.35;
  margin-bottom:10px;
}

.hashtags{
  color:#25c9f4;

  font-size:18px;
  line-height:1.45;

  margin-bottom:12px;
}

.sound-text{
  display:flex;
  align-items:center;

  font-size:17px;
  line-height:1.3;
}

.sound-text svg{
  width:18px;
  height:18px;

  margin-right:8px;

  stroke:#fff;
  fill:none;
}

/* =====================================================
   BOTTOM NAVIGATION
   ===================================================== */

.bottom-nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  height:76px;

  z-index:2000;

  display:grid;

  grid-template-columns:
    1fr
    1fr
    1.2fr
    1fr
    1fr;

  align-items:center;

  background:#000;

  border-top:1px solid rgba(255,255,255,.12);

  padding:
    4px 6px
    env(safe-area-inset-bottom);
}

/* Nav item */

.nav-item{
  height:70px;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  color:#fff;

  cursor:pointer;
}

.nav-item svg{
  width:29px;
  height:29px;

  stroke:#fff;
  fill:none;

  stroke-width:2.4;
  stroke-linecap:round;
  stroke-linejoin:round;

  margin-bottom:4px;
}

.nav-item span{
  font-size:14px;
  line-height:17px;
}

/* Create */

.create-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
}

.create-button{
  position:relative;

  width:70px;
  height:52px;

  border-radius:13px;

  background:#fff;

  color:#000;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:31px;
  font-weight:400;

  box-shadow:
    -6px 0 0 #19d7df,
    6px 0 0 #ff2456;

  cursor:pointer;
}

.create-button::before{
  content:"";
  position:absolute;
  inset:0;

  border-radius:13px;

  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.05);
}

/* =====================================================
   CREATE MODAL
   ===================================================== */

#createModal{
  position:fixed;

  inset:0;

  z-index:5000;

  display:none;

  background:#000;
}

#createModal.show{
  display:flex;
  flex-direction:column;
}

.create-header{
  height:64px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 18px;

  border-bottom:1px solid #222;
}

.create-header h2{
  margin:0;

  font-size:20px;
}

.close-create{
  font-size:28px;
  cursor:pointer;
}

.create-body{
  flex:1;

  overflow-y:auto;

  padding:18px;
}

.upload-box{
  width:100%;

  min-height:210px;

  border:1px dashed #555;
  border-radius:14px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;

  margin-bottom:18px;
}

.upload-box svg{
  width:48px;
  height:48px;

  stroke:#fff;
  fill:none;

  stroke-width:2;

  margin-bottom:12px;
}

.upload-box h3{
  margin:0 0 7px;
}

.upload-box p{
  margin:0;

  color:#aaa;
  font-size:14px;
}

.upload-actions{
  display:flex;
  gap:10px;

  width:100%;

  margin-bottom:18px;
}

.upload-actions button{
  flex:1;

  height:46px;

  border-radius:10px;

  background:#222;

  cursor:pointer;
}

.upload-actions button.primary{
  background:#fff;
  color:#000;
}

/* URL input */

.url-input{
  width:100%;

  height:46px;

  border-radius:9px;

  border:1px solid #444;

  background:#111;

  color:#fff;

  padding:0 13px;

  outline:none;

  margin-bottom:14px;
}

.preview{
  display:none;

  width:100%;

  max-height:360px;

  object-fit:contain;

  border-radius:12px;

  background:#111;

  margin-bottom:15px;
}

.preview.show{
  display:block;
}

.caption-input{
  width:100%;

  min-height:90px;

  resize:none;

  border:1px solid #333;

  border-radius:10px;

  background:#111;

  color:#fff;

  padding:12px;

  outline:none;

  margin-bottom:12px;
}

.privacy{
  width:100%;

  height:46px;

  background:#111;

  color:#fff;

  border:1px solid #333;

  border-radius:10px;

  padding:0 10px;

  margin-bottom:12px;
}

.post-button{
  width:100%;

  height:50px;

  border-radius:10px;

  background:#fff;

  color:#000;

  font-weight:bold;

  cursor:pointer;
}

.post-button:disabled{
  opacity:.45;
}

.upload-status{
  text-align:center;

  margin-top:12px;

  color:#aaa;

  font-size:14px;
}

/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:600px){

  .top-bar{
    height:70px;
  }

  .tabs{
    gap:29px;
  }

  .tab{
    font-size:18px;
  }

  .search-button{
    right:10px;
    top:12px;

    width:48px;
    height:48px;
  }

  .search-button svg{
    width:28px;
    height:28px;
  }

  /* RIGHT BUTTONS */

  .video-actions{
    right:8px;
    bottom:160px;

    width:58px;

    gap:13px;
  }

  .action{
    width:56px;
    min-height:49px;
  }

  .action svg{
    width:31px;
    height:31px;
  }

  .action span{
    font-size:12px;
    margin-top:3px;
  }

  .profile-action{
    min-height:69px;
  }

  .avatar{
    width:54px;
    height:54px;

    font-size:25px;
  }

  .follow-plus{
    width:23px;
    height:23px;
  }

  /* MUSIC */

  .music-button{
    right:10px;
    bottom:86px;

    width:52px;
    height:52px;
  }

  .music-button svg{
    width:23px;
    height:23px;
  }

  /* INFO */

  .video-info{
    left:24px;
    right:82px;
    bottom:105px;
  }

  .username{
    font-size:20px;
    margin-bottom:13px;
  }

  .verified{
    width:24px;
    height:24px;
  }

  .caption,
  .tagline{
    font-size:19px;
  }

  .hashtags{
    font-size:17px;
  }

  .sound-text{
    font-size:16px;
  }

  /* NAV */

  .bottom-nav{
    height:76px;
  }

  .nav-item{
    height:70px;
  }

  .nav-item svg{
    width:28px;
    height:28px;
  }

  .nav-item span{
    font-size:13px;
  }

  .create-button{
    width:68px;
    height:51px;
    font-size:30px;
  }
}

/* Very small screens */

@media(max-height:650px){

  .video-actions{
    bottom:145px;
    gap:8px;
  }

  .music-button{
    bottom:84px;
  }

  .video-info{
    bottom:98px;
  }
}
</style>
</head>

<body>

<div id="app">

<!-- ===================================================
     FEED
     =================================================== -->

<main id="feed">

  <section class="video-card">

    <video
      class="video"
      src="uploads/video1.mp4"
      loop
      muted
      playsinline
      preload="metadata">
    </video>

    <!-- TOP -->

    <div class="top-bar">

      <div class="tabs">

        <button class="tab">
          LIVE
        </button>

        <button class="tab">
          Following
        </button>

        <button class="tab active">
          For You
        </button>

      </div>

      <button
        class="search-button"
        aria-label="Search">

        <svg viewBox="0 0 24 24">
          <circle cx="10.8" cy="10.8" r="6.8"></circle>
          <path d="M16 16l5 5"></path>
        </svg>

      </button>

    </div>


    <!-- =================================================
         RIGHT ACTIONS
         ================================================= -->

    <div class="video-actions">

      <!-- PROFILE -->

      <button class="action profile-action">

        <div class="avatar">

          Z

          <span class="follow-plus">
            +
          </span>

        </div>

        <span class="follow-text">
          Follow
        </span>

      </button>


      <!-- LIKE -->

      <button class="action like-button">

        <svg viewBox="0 0 24 24">
          <path
            d="M20.8 8.7
               c0 5.5-8.8 10.3-8.8 10.3
               S3.2 14.2 3.2 8.7
               C3.2 6 5.1 4 7.6 4
               c1.5 0 2.9.8 3.6 2
               .8-1.2 2.1-2 3.6-2
               2.5 0 4.4 2 4.4 4.7z">
          </path>
        </svg>

        <span>
          0
        </span>

      </button>


      <!-- COMMENT -->

      <button class="action">

        <svg viewBox="0 0 24 24">
          <path
            d="M20 11.5
               a7.5 7.5 0 0 1-7.5 7.5
               H7l-4 3v-10
               A7.5 7.5 0 0 1 10.5 4H12.5
               A7.5 7.5 0 0 1 20 11.5z">
          </path>
        </svg>

        <span>
          0
        </span>

      </button>


      <!-- SAVE -->

      <button class="action save-button">

        <svg viewBox="0 0 24 24">
          <path
            d="M6 4
               a2 2 0 0 1 2-2
               h8
               a2 2 0 0 1 2 2
               v18
               l-6-4-6 4z">
          </path>
        </svg>

        <span>
          Save
        </span>

      </button>


      <!-- SHARE -->

      <button class="action">

        <svg viewBox="0 0 24 24">
          <path
            d="M22 2
               L11 13">
          </path>

          <path
            d="M22 2
               L15 22
               L11 13
               L2 9
               Z">
          </path>
        </svg>

        <span>
          Share
        </span>

      </button>

    </div>


    <!-- =================================================
         MUSIC
         ================================================= -->

    <button
      class="music-button"
      aria-label="Original sound">

      <svg viewBox="0 0 24 24">

        <path d="M9 18V5"></path>

        <path d="M9 5l10-2v12"></path>

        <circle cx="6" cy="18" r="3"></circle>

        <circle cx="16" cy="15" r="3"></circle>

      </svg>

    </button>


    <!-- =================================================
         VIDEO INFO
         ================================================= -->

    <div class="video-info">

      <div class="username">

        @zylo_creator

        <span class="verified">
          ✓
        </span>

      </div>

      <div class="caption">
        Welcome to ZYLO 🌎
      </div>

      <div class="tagline">
        Create • Connect • Grow
      </div>

      <div class="hashtags">
        #ZYLO #Create #Connect #Grow #ForYou
      </div>

      <div class="sound-text">

        <svg viewBox="0 0 24 24">

          <path d="M9 18V5"></path>

          <path d="M9 5l9-2v11"></path>

          <circle cx="6" cy="18" r="3"></circle>

          <circle cx="15" cy="15" r="3"></circle>

        </svg>

        Original sound - ZYLO

      </div>

    </div>

  </section>

</main>


<!-- ===================================================
     BOTTOM NAV
     =================================================== -->

<nav class="bottom-nav">

  <!-- HOME -->

  <button class="nav-item">

    <svg viewBox="0 0 24 24">

      <path
        d="M3 10.5
           L12 3
           L21 10.5
           V21
           H14
           V15
           H10
           V21
           H3
           Z">
      </path>

    </svg>

    <span>
      Home
    </span>

  </button>


  <!-- DISCOVER -->

  <button class="nav-item">

    <svg viewBox="0 0 24 24">

      <circle
        cx="10.5"
        cy="10.5"
        r="6.5">
      </circle>

      <path d="M16 16l5 5"></path>

    </svg>

    <span>
      Discover
    </span>

  </button>


  <!-- CREATE -->

  <div class="create-wrap">

    <button
      class="create-button"
      id="openCreate">

      +

    </button>

  </div>


  <!-- INBOX -->

  <button class="nav-item">

    <svg viewBox="0 0 24 24">

      <path
        d="M3 5
           h18
           v14
           H3
           Z">
      </path>

      <path
        d="M3 15
           h5
           l2 3
           h4
           l2-3
           h5">
      </path>

    </svg>

    <span>
      Inbox
    </span>

  </button>


  <!-- PROFILE -->

  <button class="nav-item">

    <svg viewBox="0 0 24 24">

      <circle
        cx="12"
        cy="7"
        r="4">
      </circle>

      <path
        d="M4 21
           c0-4.5 3.5-7 8-7
           s8 2.5 8 7">
      </path>

    </svg>

    <span>
      Profile
    </span>

  </button>

</nav>


<!-- ===================================================
     CREATE / UPLOAD MODAL
     =================================================== -->

<section id="createModal">

  <header class="create-header">

    <button
      class="close-create"
      id="closeCreate">
      ×
    </button>

    <h2>
      Create
    </h2>

    <div style="width:28px;"></div>

  </header>


  <div class="create-body">

    <div class="upload-box">

      <svg viewBox="0 0 24 24">

        <rect
          x="3"
          y="4"
          width="18"
          height="16"
          rx="2">
        </rect>

        <path d="M8 12l3-3 5 5 2-2 3 3"></path>

      </svg>

      <h3>
        Add a video
      </h3>

      <p>
        Upload a video from your phone
      </p>

    </div>


    <div class="upload-actions">

      <button
        class="primary"
        id="chooseVideo">
        Choose Video
      </button>

      <button id="clearVideo">
        Clear
      </button>

    </div>


    <!-- VIDEO URL -->

    <input
      id="videoUrl"
      class="url-input"
      type="url"
      placeholder="Or paste video URL here">


    <!-- PREVIEW -->

    <video
      id="preview"
      class="preview"
      controls
      playsinline>
    </video>


    <!-- CAPTION -->

    <textarea
      id="captionInput"
      class="caption-input"
      placeholder="Write a caption..."></textarea>


    <!-- PRIVACY -->

    <select
      id="privacy"
      class="privacy">

      <option>
        Everyone
      </option>

      <option>
        Friends
      </option>

      <option>
        Only me
      </option>

    </select>


    <!-- POST -->

    <button
      id="postButton"
      class="post-button"
      disabled>

      Post

    </button>


    <div
      id="uploadStatus"
      class="upload-status">
    </div>

  </div>

</section>


<!-- HIDDEN FILE INPUT -->

<input
  id="videoInput"
  type="file"
  accept="video/*"
  hidden>


</div>


<script>
/* =====================================================
   ZYLO — JAVASCRIPT
   ===================================================== */

const BACKEND_URL =
  "https://zylo-backend-ec5c.onrender.com";


const UPLOAD_URL =
  BACKEND_URL + "/api/upload";


/* =====================================================
   ELEMENTS
   ===================================================== */

const feed =
  document.getElementById("feed");

const createModal =
  document.getElementById("createModal");

const openCreate =
  document.getElementById("openCreate");

const closeCreate =
  document.getElementById("closeCreate");

const chooseVideo =
  document.getElementById("chooseVideo");

const clearVideo =
  document.getElementById("clearVideo");

const videoInput =
  document.getElementById("videoInput");

const preview =
  document.getElementById("preview");

const videoUrl =
  document.getElementById("videoUrl");

const captionInput =
  document.getElementById("captionInput");

const postButton =
  document.getElementById("postButton");

const uploadStatus =
  document.getElementById("uploadStatus");


let selectedFile = null;


/* =====================================================
   OPEN CREATE
   ===================================================== */

openCreate.addEventListener("click", () => {

  createModal.classList.add("show");

});


/* =====================================================
   CLOSE CREATE
   ===================================================== */

closeCreate.addEventListener("click", () => {

  createModal.classList.remove("show");

});


/* =====================================================
   CHOOSE VIDEO
   ===================================================== */

chooseVideo.addEventListener("click", () => {

  videoInput.click();

});


/* =====================================================
   FILE SELECT
   ===================================================== */

videoInput.addEventListener("change", () => {

  const file =
    videoInput.files[0];

  if (!file) {
    return;
  }

  selectedFile = file;

  const objectUrl =
    URL.createObjectURL(file);

  preview.src = objectUrl;

  preview.classList.add("show");

  postButton.disabled = false;

  uploadStatus.textContent =
    "ভিডিও প্রস্তুত। এখন Post চাপুন।";

});


/* =====================================================
   VIDEO URL
   ===================================================== */

videoUrl.addEventListener("input", () => {

  const url =
    videoUrl.value.trim();

  if (!url) {

    if (!selectedFile) {
      preview.classList.remove("show");
      postButton.disabled = true;
    }

    return;
  }

  selectedFile = null;

  preview.src = url;

  preview.classList.add("show");

  postButton.disabled = false;

  uploadStatus.textContent =
    "Video URL প্রস্তুত। এখন Post চাপুন।";

});


/* =====================================================
   CLEAR
   ===================================================== */

clearVideo.addEventListener("click", () => {

  selectedFile = null;

  videoInput.value = "";

  videoUrl.value = "";

  preview.removeAttribute("src");

  preview.load();

  preview.classList.remove("show");

  postButton.disabled = true;

  uploadStatus.textContent = "";

});


/* =====================================================
   POST
   ===================================================== */

postButton.addEventListener("click", async () => {

  if (postButton.disabled) {
    return;
  }


  postButton.disabled = true;

  uploadStatus.textContent =
    "ভিডিও আপলোড হচ্ছে...";


  try {

    let finalVideoUrl = "";


    /* -----------------------------------------------
       FILE UPLOAD
       ----------------------------------------------- */

    if (selectedFile) {

      const formData =
        new FormData();

      formData.append(
        "video",
        selectedFile
      );


      const response =
        await fetch(
          UPLOAD_URL,
          {
            method:"POST",
            body:formData
          }
        );


      const data =
        await response.json();


      if (!response.ok || !data.success) {

        throw new Error(
          data.message ||
          "Upload failed"
        );

      }


      finalVideoUrl =
        data.video.url;

    }


    /* -----------------------------------------------
       VIDEO URL
       ----------------------------------------------- */

    else if (videoUrl.value.trim()) {

      finalVideoUrl =
        videoUrl.value.trim();

    }


    else {

      throw new Error(
        "ভিডিও নির্বাচন করুন"
      );

    }


    /* -----------------------------------------------
       CREATE FEED
       ----------------------------------------------- */

    addVideoToFeed(
      finalVideoUrl,
      captionInput.value.trim()
    );


    /* -----------------------------------------------
       SAVE LAST VIDEO
       ----------------------------------------------- */

    localStorage.setItem(
      "zyloLastVideo",
      JSON.stringify({
        url:finalVideoUrl,
        caption:captionInput.value.trim()
      })
    );


    uploadStatus.textContent =
      "ভিডিও সফলভাবে Post হয়েছে ✓";


    setTimeout(() => {

      createModal.classList.remove("show");

      resetCreate();

    },800);


  } catch(error) {

    console.error(error);

    uploadStatus.textContent =
      "সমস্যা হয়েছে: " +
      error.message;

    postButton.disabled = false;

  }

});


/* =====================================================
   ADD VIDEO TO FEED
   ===================================================== */

/* =====================================================
   RESET CREATE
   ===================================================== */

function resetCreate(){

  selectedFile = null;

  videoInput.value = "";

  videoUrl.value = "";

  preview.removeAttribute("src");

  preview.load();

  preview.classList.remove("show");

  captionInput.value = "";

  postButton.disabled = true;

  uploadStatus.textContent = "";

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   VIDEO AUTOPLAY / PAUSE
   ===================================================== */

const observer =
  new IntersectionObserver(
    entries => {

      entries.forEach(entry => {

        const video =
          entry.target.querySelector(".video");

        if (!video) {
          return;
        }


        if (entry.isIntersecting) {

          video.play().catch(() => {});

        } else {

          video.pause();

        }

      });

    },
    {
      threshold:0.65
    }
  );


function setupVideo(card){

  observer.observe(card);


  const video =
    card.querySelector(".video");

  if (!video) {
    return;
  }


  video.addEventListener(
    "click",
    () => {

      if (video.paused) {

        video.play().catch(() => {});

      } else {

        video.pause();

      }

    }
  );


  const like =
    card.querySelector(".like-button");

  if (like) {

    like.addEventListener(
      "click",
      () => {

        like.classList.toggle("liked");

      }
    );

  }


  const save =
    card.querySelector(".save-button");

  if (save) {

    save.addEventListener(
      "click",
      () => {

        save.classList.toggle("saved");

      }
    );

  }

}


/* =====================================================
   INITIAL VIDEO
   ===================================================== */

document
  .querySelectorAll(".video-card")
  .forEach(card => {

    setupVideo(card);

  });


/* =====================================================
   LOAD LAST UPLOADED VIDEO
   ===================================================== */

try {

  const saved =
    localStorage.getItem(
      "zyloLastVideo"
    );


  if (saved) {

    const data =
      JSON.parse(saved);


    if (data.url) {

      addVideoToFeed(
        data.url,
        data.caption || ""
      );

    }

  }

} catch(error){

  console.log(
    "No saved video"
  );

}

</script>

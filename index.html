<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>ZYLO</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- ================= TOP BAR ================= -->

    <header class="top-bar">

        <button class="live-btn">
            <span class="live-dot"></span>
            LIVE
        </button>

        <div class="feed-tabs">
            <button>Following</button>
            <button class="active">For You</button>
        </div>

        <button class="search-btn">

            <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="M16.5 16.5L21 21"></path>
            </svg>

        </button>

    </header>


    <!-- ================= VIDEO FEED ================= -->

    <main class="video-feed">

        <!-- VIDEO 1 -->

        <section class="video-page">

            <video
                class="video"
                playsinline
                webkit-playsinline
                muted
                loop
                autoplay
                preload="auto"
                src="./backend/uploads/video1.mp4">
            </video>


            <!-- VIDEO GRADIENT -->

            <div class="video-gradient"></div>


            <!-- ================= RIGHT ACTIONS ================= -->

            <div class="right-actions">


                <!-- PROFILE -->

                <button class="profile-action">

                    <img
                        src="https://i.pravatar.cc/100?img=12"
                        alt="Profile">

                    <span class="follow-plus">+</span>

                </button>


                <!-- LIKE -->

                <button class="action-btn like-btn">

                    <svg
                        class="action-svg"
                        viewBox="0 0 48 48">

                        <path
                            d="M24 41S6 30.5 6 17.5
                            C6 10.8 10.9 6 17 6
                            C20.7 6 23.2 8.1 24 10.8
                            C24.8 8.1 27.3 6 31 6
                            C37.1 6 42 10.8 42 17.5
                            C42 30.5 24 41 24 41Z">
                        </path>

                    </svg>

                    <span class="action-count">79.6K</span>

                </button>


                <!-- COMMENT -->

                <button class="action-btn">

                    <svg
                        class="action-svg"
                        viewBox="0 0 48 48">

                        <path
                            d="M24 5
                            C13.5 5 5 12.5 5 21.8
                            C5 27 7.8 31.5 12.2 34.5
                            L10 42
                            L18.3 37.8
                            C20.1 38.3 22 38.6 24 38.6
                            C34.5 38.6 43 31.1 43 21.8
                            C43 12.5 34.5 5 24 5Z">
                        </path>

                        <circle cx="16" cy="22" r="2"></circle>
                        <circle cx="24" cy="22" r="2"></circle>
                        <circle cx="32" cy="22" r="2"></circle>

                    </svg>

                    <span class="action-count">3,904</span>

                </button>


                <!-- SAVE -->

                <button class="action-btn save-btn">

                    <svg
                        class="action-svg save-svg"
                        viewBox="0 0 48 48">

                        <path
                            d="M11 5
                            C9.3 5 8 6.3 8 8
                            V43
                            L24 34
                            L40 43
                            V8
                            C40 6.3 38.7 5 37 5
                            Z">
                        </path>

                    </svg>

                    <span class="action-count">8,105</span>

                </button>


                <!-- SHARE -->

                <button class="action-btn share-btn">

                    <svg
                        class="action-svg share-svg"
                        viewBox="0 0 48 48">

                        <path
                            d="M29 8
                            L42 21
                            L29 34"
                            fill="none">
                        </path>

                        <path
                            d="M42 21
                            H21
                            C12 21 7 27 7 37"
                            fill="none">
                        </path>

                    </svg>

                    <span class="action-count">1,806</span>

                </button>


                <!-- MUSIC -->

                <button class="music-btn">

                    <span class="music-disc">

                        <svg viewBox="0 0 48 48">

                            <path
                                d="M28 8
                                V29
                                C28 35 23 39 17 39
                                C12 39 9 36 9 32
                                C9 27.5 13.5 24 19 24
                                C21 24 23 24.5 24 25.5
                                V13
                                L37 9">
                            </path>

                        </svg>

                    </span>

                </button>

            </div>


            <!-- ================= VIDEO INFO ================= -->

            <div class="video-info">

                <div class="username">
                    @zylo_creator
                </div>

                <div class="caption">
                    Welcome to ZYLO 🌎 Create • Connect • Grow
                </div>

                <div class="music-name">

                    <svg viewBox="0 0 24 24">
                        <path d="M9 18V5l10-2v13"></path>
                        <circle cx="6" cy="18" r="3"></circle>
                        <circle cx="16" cy="16" r="3"></circle>
                    </svg>

                    Original sound · ZYLO

                </div>

            </div>


            <!-- FULLSCREEN -->

            <button class="fullscreen-btn">

                <svg viewBox="0 0 24 24">

                    <path d="M8 3H3v5"></path>
                    <path d="M16 3h5v5"></path>
                    <path d="M3 16v5h5"></path>
                    <path d="M21 16v5h-5"></path>

                </svg>

            </button>

        </section>


        <!-- VIDEO 2 -->

        <section class="video-page">

            <video
                class="video"
                playsinline
                webkit-playsinline
                muted
                loop
                preload="auto"
                src="./backend/uploads/video1.mp4">
            </video>

            <div class="video-gradient"></div>

            <div class="right-actions">

                <button class="profile-action">

                    <img
                        src="https://i.pravatar.cc/100?img=32"
                        alt="Profile">

                    <span class="follow-plus">+</span>

                </button>

                <button class="action-btn like-btn">

                    <svg class="action-svg" viewBox="0 0 48 48">

                        <path
                            d="M24 41S6 30.5 6 17.5
                            C6 10.8 10.9 6 17 6
                            C20.7 6 23.2 8.1 24 10.8
                            C24.8 8.1 27.3 6 31 6
                            C37.1 6 42 10.8 42 17.5
                            C42 30.5 24 41 24 41Z">
                        </path>

                    </svg>

                    <span class="action-count">12.4K</span>

                </button>

                <button class="action-btn">

                    <svg class="action-svg" viewBox="0 0 48 48">

                        <path
                            d="M24 5
                            C13.5 5 5 12.5 5 21.8
                            C5 27 7.8 31.5 12.2 34.5
                            L10 42
                            L18.3 37.8
                            C20.1 38.3 22 38.6 24 38.6
                            C34.5 38.6 43 31.1 43 21.8
                            C43 12.5 34.5 5 24 5Z">
                        </path>

                        <circle cx="16" cy="22" r="2"></circle>
                        <circle cx="24" cy="22" r="2"></circle>
                        <circle cx="32" cy="22" r="2"></circle>

                    </svg>

                    <span class="action-count">642</span>

                </button>

                <button class="action-btn save-btn">

                    <svg class="action-svg save-svg" viewBox="0 0 48 48">

                        <path
                            d="M11 5
                            C9.3 5 8 6.3 8 8
                            V43
                            L24 34
                            L40 43
                            V8
                            C40 6.3 38.7 5 37 5
                            Z">
                        </path>

                    </svg>

                    <span class="action-count">2,104</span>

                </button>

                <button class="action-btn share-btn">

                    <svg class="action-svg share-svg" viewBox="0 0 48 48">

                        <path d="M29 8L42 21L29 34" fill="none"></path>

                        <path
                            d="M42 21H21C12 21 7 27 7 37"
                            fill="none">
                        </path>

                    </svg>

                    <span class="action-count">531</span>

                </button>

                <button class="music-btn">

                    <span class="music-disc">

                        <svg viewBox="0 0 48 48">

                            <path
                                d="M28 8V29
                                C28 35 23 39 17 39
                                C12 39 9 36 9 32
                                C9 27.5 13.5 24 19 24
                                C21 24 23 24.5 24 25.5
                                V13L37 9">
                            </path>

                        </svg>

                    </span>

                </button>

            </div>

        </section>

    </main>


    <!-- ================= BOTTOM NAV ================= -->

    <nav class="bottom-nav">


        <!-- HOME -->

        <button class="nav-item active">

            <svg viewBox="0 0 24 24">

                <path
                    d="M3 10.5L12 3l9 7.5V21
                    H15v-6H9v6H3Z">
                </path>

            </svg>

            <span>Home</span>

        </button>


        <!-- DISCOVER -->

        <button class="nav-item">

            <svg viewBox="0 0 24 24">

                <circle cx="12" cy="12" r="9"></circle>

                <path d="M15.5 8.5L13 13l-4.5 2.5L11 11Z"></path>

            </svg>

            <span>Discover</span>

        </button>


        <!-- CREATE -->

        <button class="create-btn">

            <span class="create-left"></span>

            <span class="create-center">

                <svg viewBox="0 0 24 24">

                    <path d="M12 5V19"></path>
                    <path d="M5 12H19"></path>

                </svg>

            </span>

            <span class="create-right"></span>

        </button>


        <!-- INBOX -->

        <button class="nav-item">

            <svg viewBox="0 0 24 24">

                <path
                    d="M4 5h16v12H7l-3 3Z">
                </path>

                <path d="M8 10h8"></path>
                <path d="M8 14h5"></path>

            </svg>

            <span>Inbox</span>

        </button>


        <!-- PROFILE -->

        <button class="nav-item">

            <svg viewBox="0 0 24 24">

                <circle cx="12" cy="8" r="4"></circle>

                <path
                    d="M4 21
                    C4 16.5 7.5 14 12 14
                    C16.5 14 20 16.5 20 21">
                </path>

            </svg>

            <span>Profile</span>

        </button>

    </nav>

</div>


<script src="script.js"></script>

</body>
</html>
